<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paletes · Central de Conferência</title>
<style>
:root{
  --azul:#0B4F9E; --azul2:#1d2b6b; --lar:#f58220; --fundo:#eef1f7; --card:#fff; --tx:#1b2033; --mut:#68708a;
  --line:#d9deea; --ok:#15803d; --okbg:#e7f6ec; --warn:#b45309; --warnbg:#fff4e0; --err:#b91c1c; --errbg:#fdeaea;
  --obs:#0e7490; --obsbg:#e0f4f8; --inf:#6d28d9; --infbg:#f1eafe; --pend:#b45309; --pendbg:#fff1dc; --calc:#475569; --calcbg:#eef1f5;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fundo);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--azul);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:20;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.marca{display:flex;align-items:baseline;gap:6px;font-weight:800;letter-spacing:.5px}
.marca .gt{color:#fff}.marca .pl{color:var(--lar)}
header h1{font-size:16px;margin:0;font-weight:600;opacity:.95}
.nuvem{margin-left:auto;font-size:12px;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.15)}
.nuvem.ok{background:#1f8a4c}.nuvem.off{background:#c2410c}
.quem{font-size:12px;opacity:.9;cursor:pointer;text-decoration:underline dotted}
nav{display:flex;gap:4px;padding:8px 16px 0;max-width:1180px;margin:0 auto}
nav button{border:0;background:transparent;padding:9px 14px;border-radius:10px 10px 0 0;font-weight:600;color:var(--mut);cursor:pointer}
nav button.on{background:var(--card);color:var(--azul)}
main{max-width:1180px;margin:0 auto;padding:0 16px 60px}
.painel{background:var(--card);border-radius:0 12px 12px 12px;padding:16px}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;background:var(--azul);color:#fff;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.lar{background:var(--lar)}.btn.v{background:var(--ok)}.btn.d{background:var(--err)}
.btn.c{background:#e8ebf3;color:var(--tx)}.btn.mini{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.linha{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grade{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--mut)}
label.f input,label.f select,label.f textarea,.campo input,.campo select{border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:#fff;font-weight:500;color:var(--tx);width:100%}
textarea{min-height:64px;resize:vertical}
input:disabled,select:disabled{background:#f3f4f7;color:#777}
.card{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}
.card h3{margin:0 0 4px;font-size:15px;color:var(--azul)}
.card .sub{font-size:12.5px;color:var(--mut);margin:0 0 10px}
.badge{display:inline-block;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:20px;letter-spacing:.3px;white-space:nowrap}
.st-RASCUNHO{background:#eceff5;color:#475569}
.st-PRELIMINAR{background:var(--warnbg);color:var(--warn)}
.st-PRONTO{background:#e3e8fb;color:var(--azul)}
.st-PLANTA{background:#dbeafe;color:#1d4ed8}
.st-LIBERADO{background:var(--okbg);color:var(--ok)}
.lista{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));margin-top:14px}
.pc{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;cursor:pointer;display:flex;flex-direction:column}
.pc:hover{border-color:var(--azul)}
.pc .th{height:130px;background:#dde2ee center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:40px;color:#9aa3bd}
.pc .ct{padding:10px 12px;display:flex;flex-direction:column;gap:5px}
.pc .cod{font-size:12px;font-weight:800;color:var(--lar)}
.pc .nm{font-weight:700}
.pc .mt{font-size:12.5px;color:var(--mut)}
.vazio{padding:40px 10px;text-align:center;color:var(--mut)}
/* editor */
.ed-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ed-top .tt{font-size:18px;font-weight:800}
.ed-top .cod{color:var(--lar);font-weight:800}
.assist{border:2px solid var(--azul);border-radius:14px;padding:12px 14px;background:linear-gradient(180deg,#f5f7ff,#fff);margin-bottom:14px}
.assist .cab{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.assist .cab b{color:var(--azul)}
.barra{height:8px;border-radius:8px;background:#e3e7f2;overflow:hidden;flex:1;min-width:120px}
.barra i{display:block;height:100%;background:var(--lar);border-radius:8px}
.prox{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--azul);color:#fff;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.prox .btn{background:#fff;color:var(--azul)}
.assist details{margin-top:8px;font-size:13.5px}
.assist summary{cursor:pointer;font-weight:700;padding:4px 0}
.assist ul{margin:4px 0 4px;padding-left:20px}
.assist li{margin:3px 0}
.assist li a{color:var(--azul);font-weight:700;cursor:pointer;text-decoration:underline}
.leg{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;margin-top:8px}
.passos{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.passos button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer;color:var(--mut)}
.passos button.on{background:var(--azul);color:#fff;border-color:var(--azul)}
.passos button .ck{color:var(--ok)}
.passos button.on .ck{color:#9ef0b8}
.aviso{border-radius:10px;padding:10px 12px;font-size:13.5px;margin:8px 0}
.aviso.a{background:var(--warnbg);color:#7a3d06;border:1px solid #f6d29b}
.aviso.e{background:var(--errbg);color:#7f1d1d;border:1px solid #f3b9b9}
.aviso.i{background:#eef2ff;color:#1e2a6e;border:1px solid #cdd6fb}
.aviso.ok{background:var(--okbg);color:#14532d;border:1px solid #b6e3c4}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:140px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px;font-weight:800;cursor:pointer;text-align:center}
.seg button.on{border-color:var(--azul);background:#eef1fd;color:var(--azul)}
.seg button small{display:block;font-weight:500;color:var(--mut);font-size:12px;margin-top:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:20px;padding:6px 11px;font-size:13px;cursor:pointer;background:#fff;user-select:none}
.chip.on{background:var(--azul);color:#fff;border-color:var(--azul)}
/* fotos */
.fotos{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));margin-top:12px}
.ft{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.ft img{width:100%;height:190px;object-fit:cover;display:block;cursor:zoom-in;background:#ddd}
.ft .fb{padding:10px;display:flex;flex-direction:column;gap:8px}
.ft .vis{display:flex;flex-wrap:wrap;gap:5px}
.ft .vis .chip{font-size:12px;padding:5px 9px}
.ft .vis .chip.carga.on{background:var(--lar);border-color:var(--lar)}
.ft .vis .chip.trena.on{background:var(--ok);border-color:var(--ok)}
.ft .nf{font-size:12px;font-weight:800;color:var(--lar)}
.pedidas{display:flex;flex-direction:column;gap:6px}
.pedida{display:flex;gap:8px;align-items:center;font-size:13.5px;background:var(--warnbg);border:1px dashed #f0b45a;border-radius:10px;padding:8px 10px}
/* medidas */
.comp{margin-bottom:12px}
.comp .ctit{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.comp .vist{font-size:12px;color:var(--mut)}
.row{display:grid;grid-template-columns:minmax(150px,1.2fr) minmax(120px,1fr) minmax(230px,1.6fr);gap:10px;align-items:center;padding:8px 0;border-top:1px dashed #e6e9f1}
.row:first-of-type{border-top:0}
.row .rl{font-size:13.5px;font-weight:600}
.row .rl small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.campo{display:flex;align-items:center;gap:6px}
.campo .un{font-size:12px;color:var(--mut)}
.org{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.o{border:1px solid transparent;border-radius:20px;padding:4px 9px;font-size:12px;font-weight:700;background:#f2f3f7;color:#8a90a5;cursor:pointer;white-space:nowrap}
.o.obs.on{background:var(--obsbg);color:var(--obs);border-color:#7cc8d6}
.o.inf.on{background:var(--infbg);color:var(--inf);border-color:#c5b0f5}
.o.pend.on{background:var(--pendbg);color:var(--pend);border-color:#f3c27f}
.o.calc{background:var(--calcbg);color:var(--calc);cursor:default}
.o.dis{opacity:.4;cursor:not-allowed}
.o.pend{cursor:default}
.org select{font-size:12px;padding:3px 6px;border-radius:8px;border:1px solid var(--line);max-width:150px}
.tg{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;border-radius:12px}
.tg.PAD{background:#eef1f5;color:#475569}
.tg.OBS{background:var(--obsbg);color:var(--obs)}.tg.INF{background:var(--infbg);color:var(--inf)}
.tg.PEND{background:var(--pendbg);color:var(--pend)}.tg.CALC{background:var(--calcbg);color:var(--calc)}
.mlinha{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.mf{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--mut);flex:1 1 120px;min-width:110px}
.mf.grande{flex:2 1 220px}
.mf input,.mf select,.q select,.outro input,.outro select{border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff;font-weight:600;color:var(--tx);width:100%;font-size:15px}
.vz{border-color:#f3b55f!important;background:#fffaf2!important}
.q{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:14px;font-weight:600}
.q .mf{max-width:220px}
.unsel{border:1px solid var(--line);border-radius:9px;padding:9px 6px;min-width:118px;background:#eef1fd;font-weight:800;color:var(--azul);flex:none;width:auto!important;cursor:pointer}
.un-sel{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:700;color:var(--mut)}
.un-sel .chip{padding:4px 12px;font-weight:800}
.outro{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
.outro input{width:86px;flex:1 1 70px}.outro select{width:auto;flex:1 1 130px}
.comp .ctit h3{margin:0}
.mais{margin-bottom:12px}
.entendi{margin-top:8px;font-size:13px;color:var(--ok);display:flex;gap:6px;flex-wrap:wrap;align-items:center}.entendi .chip{background:var(--okbg);color:var(--ok);border-color:#b6e3c4;font-weight:700;cursor:default}
.faltam{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}.faltam .chip{background:var(--pendbg);border-color:#f3c27f;color:#7a3d06;font-weight:700}.mais summary{cursor:pointer;font-size:14px;list-style-position:inside}
.ref{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px;background:#fbfcfe}
@media (max-width:760px){.row{grid-template-columns:1fr 1fr}.row .org{grid-column:1/-1}}
/* tabelas */
table.t{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0 14px}
table.t th{background:#eef1f8;color:var(--azul2);text-align:left;padding:7px 8px;font-size:12px;border-bottom:2px solid #cfd6ea}
table.t td{padding:6px 8px;border-bottom:1px solid #eceff5;vertical-align:top}
table.t td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.t tfoot td{font-weight:800;background:#f7f8fb}
.folha{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px;overflow:auto}
.folha svg{width:100%;height:auto;display:block;min-width:720px}
h2.sec{font-size:16px;color:var(--azul);margin:18px 0 6px;border-bottom:2px solid var(--lar);padding-bottom:4px}
.lib{display:flex;flex-direction:column;gap:10px}
.lib label.ck{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:#fff}
.lib label.ck input{width:20px;height:20px;margin-top:2px;flex:none}
.lib label.ck b{display:block}
.lib label.ck span{font-size:13px;color:var(--mut)}
.lib label.ck.on{border-color:var(--ok);background:#f4fbf6}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1b2033;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90vw}
#toast.on{opacity:1}
.painelPeca{position:fixed;right:16px;top:70px;width:380px;max-width:calc(100vw - 32px);max-height:calc(100vh - 90px);overflow:auto;z-index:85;background:#fff;border:2px solid var(--lar);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.25);padding:14px}
.painelPeca .mf{min-width:0}
@media (max-width:640px){.painelPeca{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:60vh}}
@media print{.painelPeca{display:none!important}}
.lb{position:fixed;inset:0;background:rgba(10,14,30,.88);z-index:90;display:flex;align-items:center;justify-content:center;padding:20px}
.lb img{max-width:100%;max-height:100%;border-radius:8px}
.modal{position:fixed;inset:0;background:rgba(10,14,30,.55);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .cx{background:#fff;border-radius:14px;padding:18px;max-width:420px;width:100%}
.print-only{display:none}
@media (max-width:640px){
  header{padding:8px 12px;gap:6px 10px}
  .marca{font-size:12px}
  header h1{font-size:14px;flex:1}
  header a{font-size:12px!important;padding:5px 8px!important}
  .nuvem{margin-left:0;font-size:11px;padding:3px 8px}
  nav{padding:6px 8px 0;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
  nav button{white-space:nowrap;padding:8px 11px;font-size:14px}
  main{padding:0 8px 50px}
  .painel{padding:12px}
  .ed-top .tt{font-size:16px}
  .assist{padding:10px}
  .passos{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .passos button{white-space:nowrap;flex:none}
  .seg button{min-width:0}
  .btn{padding:10px 12px}
  table.t{display:block;overflow-x:auto;white-space:nowrap}
}
@page{size:A4 landscape;margin:8mm}
@media print{
  header,nav,.assist,.passos,.ed-top,.noprint,#toast{display:none!important}
  html,body{background:#fff}
  main{padding:0;max-width:none}
  .painel{padding:0;border-radius:0}
  .folha{border:0;padding:0;overflow:visible}
  .folha svg{min-width:0;width:277mm;height:190mm}
  .quebra{break-before:page}
  .print-only{display:block}
  table.t{font-size:10.5px}
  h2.sec{break-after:avoid}
  tr{break-inside:avoid}
}
</style>
</head>
<body>
<header>
  <div class="marca"><span class="gt">GRUPO TENDAS</span><span class="pl">PLENART</span></div>
  <a href="index.html" onclick="if(window.parent!==window&&window.parent.fecharPaletes){window.parent.fecharPaletes();return false}" style="color:#fff;text-decoration:none;font-size:13px;font-weight:700;background:rgba(255,255,255,.15);padding:6px 10px;border-radius:8px">← Central · Demanda do Pátio</a>
  <h1>🧱 Projeto de Paletes <small style="font-size:11px;opacity:.7;font-weight:500">v15</small></h1>
  <span class="quem" id="quem" onclick="pedirQuem(true)"></span>
  <span class="nuvem" id="nuvem">conectando…</span>
</header>
<nav id="nav"></nav>
<main><div class="painel" id="app"></div></main>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* =================== SUPABASE — o MESMO da Central de Conferência ===================
   Usa o banco gravado no app.js da Central; se o aparelho tiver outro banco configurado
   pela tela de configuração da Central, usa esse. */
const NUVEM = (function(){
  let url='https://cllylcuhpmwnyebmlelf.supabase.co',
      key='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsbHlsY3VocG13bnllYm1sZWxmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3OTA0MTMsImV4cCI6MjEwMzM2NjQxM30.fNnvg23PqzSCgwHzcMw5XdHwYAA6PF3kdffDA9yW4-E';
  if(!url||!key){ try{ const c=JSON.parse(localStorage.getItem('central_conferencia_config')||'null'); if(c&&c.url&&c.chave){ url=c.url; key=c.chave; } }catch(e){} }
  return { url, key };
})();
/* sessão da Central: quem entrou como coordenador assina sozinho */
function sessaoCentral(){ try{ return JSON.parse(localStorage.getItem('central_conferencia_sessao')||'null'); }catch(e){ return null; } }
const TAB = 'paletes_projetos';
const BUCKET = 'paletes';
const LS = 'paletes_projetos_v1', LSCFG = 'paletes_cfg_v1', LSQUEM = 'paletes_quem';
let sb = null;

/* =================== ESTADO =================== */
let P = {};                 // id -> palete
let CFG = cfgPadrao();
let aba = 'lista', cur = null, passo = 'ident', busca = '', filtro = '';

function cfgPadrao(){ return { barraAco:6000, barraMadeira:3000, kerf:3, densMadeira:0.6, atualizado:0 }; }

/* =================== DICIONÁRIOS =================== */
const TIPOS = {
  TUBO: { nome:'Tubo retangular/quadrado (metalon)', curto:'Metalon', aco:true,  rot:['lado de cima (largura)','lado em pé (altura)','espessura da parede'] },
  CANT: { nome:'Cantoneira (L)',                    curto:'Cantoneira', aco:true, rot:['aba deitada','aba em pé','espessura da chapa'] },
  U:    { nome:'Perfil U',                          curto:'Perfil U', aco:true,  rot:['aba (largura vista de cima)','alma (altura)','espessura da chapa'] },
  MAD:  { nome:'Madeira',                           curto:'Madeira', aco:false, rot:['largura (vista de cima)','espessura / altura','—'] }
};
const COMP = {
  geral: { nome:'Medidas gerais',   ic:'📐', dica:'medidas externas da ESTRUTURA do palete (nunca do material que está em cima)' },
  long:  { nome:'Longarinas',       ic:'═',  dica:'vigas principais que correm no sentido do comprimento' },
  trav:  { nome:'Travessas',        ic:'║',  dica:'peças no sentido da largura, ligando as longarinas (ou tábuas por cima)' },
  pes:   { nome:'Pés / blocos',     ic:'▮',  dica:'apoios que formam a abertura para o garfo' },
  base:  { nome:'Base inferior',    ic:'▁',  dica:'barras no chão, por baixo dos pés' },
  tampo: { nome:'Tampo / piso',     ic:'▭',  dica:'chapa, tábuas ou tela por cima da estrutura' },
  ref:   { nome:'Reforços',         ic:'◣',  dica:'diagonais, mãos-francesas, cantos, olhais — só o que existir de verdade' },
  rc:    { nome:'Reforço nos cantos', ic:'◤', dica:'' },
  olhal: { nome:'Olhais',           ic:'⊙',  dica:'' },
  sap:   { nome:'Sapatas',          ic:'▬',  dica:'' }
};
const VIS = [ ['long','Longarinas'],['trav','Travessas'],['pes','Pés'],['base','Base inferior'],['tampo','Tampo'],['ref','Reforços'],['carga','📦 Material armazenado'],['trena','📏 Trena / referência de medida'] ];
const VISTAS = { FRENTE:'Frente', LATERAL:'Lateral', SUPERIOR:'De cima', INFERIOR:'Por baixo / inclinada', DETALHE:'Detalhe', GERAL:'Geral' };
const DICA_FOTO = {
  long:'abaixado, na altura do palete, mostrando a longarina inteira de ponta a ponta',
  trav:'pelo vão do garfo ou de cima com o palete vazio, mostrando as travessas do meio',
  pes:'agachado na frente da abertura do garfo, mostrando os pés',
  base:'por baixo ou com o palete inclinado, para ver se existe base no chão',
  tampo:'de cima, mostrando a borda do tampo e a espessura',
  ref:'de perto em cada reforço (diagonal, canto, mão-francesa)'
};

function grupoPerfil(c){ return [
  { k:c+'_tipo', comp:c, rot:'Tipo de perfil', tipo:'sel', opts:Object.keys(TIPOS).map(v=>[v,TIPOS[v].nome]) },
  { k:c+'_b', comp:c, perf:0, tipo:'num', un:'mm' },
  { k:c+'_h', comp:c, perf:1, tipo:'num', un:'mm' },
  { k:c+'_t', comp:c, perf:2, tipo:'num', un:'mm' }
]; }
const FIELDS = [
  { k:'C', comp:'geral', rot:'Comprimento total', ajuda:'maior lado do palete', tipo:'num', un:'mm' },

/* =================== UNIDADE (mm / cm / m) ===================
   Tudo é guardado em mm por dentro; a unidade só muda o que se digita e se vê. */
const FAT={mm:1,cm:10,m:1000};
function unP(p){ return (p&&FAT[p.un])?p.un:'mm'; }
/* cada campo tem a sua unidade (ex.: comprimento em m, altura em cm) */
function unK(p,key){ return (p&&p.uns&&FAT[p.uns[key]])?p.uns[key]:unP(p); }
function paraTela(p,vmm,key){ if(vmm===''||vmm==null) return ''; const n=Number(vmm); if(isNaN(n)) return ''; return String(Math.round(n/FAT[unK(p,key)]*10000)/10000); }
function paraMM(p,v,key){ if(v===''||v==null) return ''; const n=Number(String(v).replace(',','.')); if(isNaN(n)) return ''; return String(Math.round(n*FAT[unK(p,key)]*100)/100); }
function selUn(p,key,dis){ const u=unK(p,key); return `<select class="unsel" title="unidade" ${dis} onchange="setUnK('${key}',this.value)">${[['mm','milímetros'],['cm','centímetros'],['m','metros']].map(([x,t])=>`<option value="${x}" ${x===u?'selected':''}>${t}</option>`).join('')}</select>`; }
/* mostra a medida na unidade que a pessoa escolheu (e em mm entre parênteses) */
function fmtUn(p,k,vmm){ if(vmm==null||vmm==='') return ''; const u=unK(p,k); const t=paraTela(p,vmm,k).replace('.',','); return u==='mm' ? mm(+vmm)+' mm' : t+' '+({cm:'cm',m:'m'}[u])+' ('+mm(+vmm)+' mm)'; }
function setUnK(key,u){ const p=P[cur]; p.uns=p.uns||{}; p.uns[key]=u; try{localStorage.setItem('paletes_un',u);}catch(e){} salvar(p,true); const y=window.scrollY; render(); window.scrollTo(0,y); }
function convMM(p){ if(['C','L','H'].every(k=>vNum(p,k)==null) || ['C','L','H'].every(k=>unK(p,k)==='mm')) return '';
  const nome={mm:'mm',cm:'cm',m:'m'};
  const tela=['C','L','H'].map(k=>vNum(p,k)==null?'—':paraTela(p,vRaw(p,k),k).replace('.',',')+' '+nome[unK(p,k)]).join(' × ');
  return '📏 '+tela+(['C','L','H'].every(k=>unK(p,k)==='mm')?'':'  =  '+['C','L','H'].map(k=>vNum(p,k)==null?'—':mm(vNum(p,k))).join(' × ')+' mm'); }
function chipsUn(p,dis){
  return `<span class="un-sel">Unidade: ${['mm','cm','m'].map(u=>`<span class="chip ${unP(p)===u?'on':''}" onclick="${dis?'':`setUn('${u}')`}">${u}</span>`).join('')}</span>`;
}
function setUn(u){ const p=P[cur]; p.un=u; try{localStorage.setItem('paletes_un',u);}catch(e){} salvar(p,true); const y=window.scrollY; render(); window.scrollTo(0,y); toast('Medidas em '+u+' — o sistema converte sozinho'); }

/* =================== PERSISTÊNCIA =================== */
function carregarLocal(){
  try{ P=JSON.parse(localStorage.getItem(LS)||'{}')||{}; }catch(e){ P={}; }
  try{ const c=JSON.parse(localStorage.getItem(LSCFG)||'null'); if(c) CFG=Object.assign(cfgPadrao(),c); }catch(e){}
  // lixeira: some depois de 30 dias
  const lim=Date.now()-30*864e5;
  Object.values(P).forEach(p=>{ if(p.excluido && p.excluido<lim){ delete P[p.id]; apagarNuvem(p.id); } });
}
function guardarLocal(){
  try{ localStorage.setItem(LS, JSON.stringify(P)); }catch(e){
    // aparelho cheio (fotos guardadas sem nuvem): guarda sem as fotos em base64
    try{ const leve={}; for(const id in P){ leve[id]=Object.assign({},P[id],{fotos:(P[id].fotos||[]).map(f=>f.url&&f.url.startsWith('data:')?Object.assign({},f,{url:''}):f)}); } localStorage.setItem(LS, JSON.stringify(leve)); }catch(e2){}
  }
  try{ localStorage.setItem(LSCFG, JSON.stringify(CFG)); }catch(e){}
}
function salvar(p, silencioso){
  p.atualizado=Date.now(); p.por=quem()||p.por||'';
  P[p.id]=p; guardarLocal(); enviar(p);
  if(!silencioso) toast('💾 Salvo');
}
async function enviar(p){
  if(!sb) return;
  try{ const {error}=await sb.from(TAB).upsert({ id:p.id, dados:p, atualizado_em:new Date().toISOString() }); if(error) throw error; setNuvem('ok'); }
  catch(e){ setNuvem('off', e.message); }
}
async function apagarNuvem(id){ if(!sb) return; try{ await sb.from(TAB).delete().eq('id',id); }catch(e){} }
function salvarCfg(){ CFG.atualizado=Date.now(); guardarLocal(); if(sb) sb.from(TAB).upsert({id:'__config', dados:CFG, atualizado_em:new Date().toISOString()}).then(()=>{}); toast('💾 Configuração salva'); }
function setNuvem(st, msg){
  const e=$('nuvem'); if(!e) return;
  e.className='nuvem '+(st==='ok'?'ok':st==='off'?'off':'');
  e.textContent = st==='ok' ? '☁ sincronizado' : st==='off' ? '⚠ só neste aparelho' : 'conectando…';
  e.title = msg||'';
}
async function iniciarNuvem(){
  try{
    if(!window.supabase) throw new Error('biblioteca do Supabase não carregou');
    sb = window.supabase.createClient(NUVEM.url, NUVEM.key);
    const { data, error } = await sb.from(TAB).select('id,dados');
    if(error) throw error;
    const remotos={};
    (data||[]).forEach(r=>{
      if(r.id==='__config'){ if((r.dados.atualizado||0)>(CFG.atualizado||0)) CFG=Object.assign(cfgPadrao(),r.dados); return; }
      remotos[r.id]=r.dados;
      const l=P[r.id]; if(!l || (r.dados.atualizado||0)>(l.atualizado||0)) P[r.id]=r.dados;
    });
    for(const id in P){ const r=remotos[id]; if(!r || (P[id].atualizado||0)>(r.atualizado||0)) enviar(P[id]); }
    guardarLocal(); setNuvem('ok');
    sb.channel('paletes-rt').on('postgres_changes',{event:'*',schema:'public',table:TAB},pl=>{
      if(pl.eventType==='DELETE'){ const id=pl.old&&pl.old.id; if(id&&P[id]){ delete P[id]; guardarLocal(); if(aba==='lista'||aba==='lixeira') render(); } return; }
      const r=pl.new; if(!r||!r.dados) return;
      if(r.id==='__config'){ if((r.dados.atualizado||0)>(CFG.atualizado||0)){ CFG=Object.assign(cfgPadrao(),r.dados); guardarLocal(); } return; }
      const l=P[r.id]; if(l && (l.atualizado||0)>=(r.dados.atualizado||0)) return;
      P[r.id]=r.dados; guardarLocal();
      if(aba==='editor' && cur===r.id){
        const foco=document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
        toast('🔄 Atualizado por '+(r.dados.por||'outro aparelho'));
        if(!foco) render(); else renderAssist();
      } else if(aba!=='editor') render();
    }).subscribe();
    render();
  }catch(e){ console.warn(e); sb=null; setNuvem('off', e.message||String(e)); }
}

/* =================== MODELO DE DADOS =================== */
function novoPalete(){
  const nums=Object.values(P).map(p=>parseInt(String(p.codigo||'').replace(/\D/g,''))||0);
  const n=(nums.length?Math.max(...nums):0)+1;
  let un='mm'; try{ un=localStorage.getItem('paletes_un')||'mm'; }catch(e){}
  return { id:uid(), codigo:'PL-'+String(n).padStart(4,'0'), nome:'', uso:'', materiais:[], qtdFab:1, un,
    estado:'', carga:{ desc:'', comp:'', larg:'', alt:'', peso:'', mostrar:false }, obs:'',
    fotos:[], m:{ base_tem:{v:'NAO',o:'PAD'}, tampo_tipo:{v:'NENHUM',o:'PAD'}, ref_tem:{v:'NAO',o:'PAD'} }, refs:[], planta:null, lib:{ dim:false, cap:false, est:false, seg:false, capacidade:'', empilha:'', resp:'', obs:'', ok:false, em:0 },
    criado:Date.now(), atualizado:Date.now(), por:quem() };
}
const vRaw = (p,k) => (p.m && p.m[k]) ? p.m[k].v : '';
function vNum(p,k){ const v=vRaw(p,k); if(v===''||v==null) return null; const n=Number(String(v).replace(',','.')); return isNaN(n)?null:n; }
function tipoDe(p,c){ return vRaw(p,c+'_tipo')||''; }
function rotulo(p,f){
  if(f.perf==null) return f.rot;
  const c=f.comp, tp=tipoDe(p,c);
  if(c==='pes') return ['Seção: lado no sentido do comprimento','Seção: lado no sentido da largura','Espessura da parede/chapa'][f.perf];
  if(!tp) return ['Seção: largura (vista de cima)','Seção: altura','Espessura'][f.perf];
  return 'Seção: '+TIPOS[tp].rot[f.perf];
}
/* ===== o que está escrito na observação e muda o desenho ===== */
function semAcento(t){ return String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function regras(p){
  const t=semAcento(p&&p.notas);
  const R={
    placa: /\bpes?\b[^.\n]{0,30}\b(direto|diretamente|soldad\w*|fixad\w*|pres\w*)\b[^.\n]{0,25}\b(placa|chapa|tampo)\b/.test(t) || /\b(placa|chapa)\b[^.\n]{0,15}\bcom\b[^.\n]{0,6}\bpes\b/.test(t) || /\bsem longarinas?\b/.test(t),
    semTravMeio: /\bsem travessas?\b[^.\n]{0,6}\b(no|do|de|ao)\s+meio\b/.test(t) || /\btravessas?\b[^.\n]{0,12}\b(so|somente|apenas)\b[^.\n]{0,6}\b(nas|das)\s+pontas\b/.test(t) || /\b(so|somente|apenas)\b[^.\n]{0,6}\btravessas?\b[^.\n]{0,6}\b(nas|das)\s+pontas\b/.test(t),
    cantos: /\b(reforcos?|cantoneiras?|diagona(l|is)|maos?[- ]francesas?)\b[^.\n]{0,25}\bcantos?\b/.test(t) || /\bcantos?\b[^.\n]{0,15}\breforcad\w*/.test(t),
    olhal: /\b(olhal|olhais|alcas?|icar|icamento)\b/.test(t),
    sapata: /\bsapatas?\b/.test(t)
  };
  const m=t.match(/(\d+)\s*(olhal|olhais|alcas?)\b/); R.olhalN = m?+m[1]:null;
  return R;
}
const REGRA_TXT={placa:'pés direto na placa (sem longarina e sem travessa)', semTravMeio:'sem travessa no meio (só as 2 das pontas)', cantos:'reforço nos 4 cantos', olhal:'olhais para içar', sapata:'sapata embaixo de cada pé'};
function ativo(p,f){
  const RG=regras(p);
  if(RG.placa && ((f.comp==='long'&&f.k!=='long_n') || f.comp==='trav' || f.comp==='base')) return false;
  if(RG.semTravMeio && f.k==='trav_n') return false;
  if(p.pesInteiro && f.k==='pes_n') return false;
  if(f.comp==='rc') return RG.cantos && (f.perf!==2 || tipoDe(p,'rc')!=='MAD');
  if(f.comp==='olhal') return RG.olhal;
  if(f.comp==='sap') return RG.sapata;
  if(f.comp==='base' && f.k!=='base_tem') return vRaw(p,'base_tem')==='SIM';
  if(f.k==='tampo_t') return ['CHAPA','MADEIRA'].includes(vRaw(p,'tampo_tipo'));
  if(f.perf===2) return tipoDe(p,f.comp)!=='MAD';
  return true;
}
function vazioCampo(p,f){ const v=vRaw(p,f.k); return v===''||v==null; }

/* fotos que mostram um componente (e, para medida em mm, com trena/referência) */
function fotosQueMostram(p, comp, precisaTrena){
  return (p.fotos||[]).filter(ft=>{
    const v=ft.vis||[];
    const okc = comp==='geral' ? ['long','trav','pes','base','tampo'].some(c=>v.includes(c)) : v.includes(comp);
    return okc && (!precisaTrena || v.includes('trena'));
  });
}
function origemEfetiva(p,f){
  if(vazioCampo(p,f)) return 'PEND';
  const o=p.m[f.k].o||'INF';
  if(o==='OBS'){
    const permit=fotosQueMostram(p,f.comp,f.tipo==='num');
    if(!permit.length) return 'INF';            // foto sumiu ou foi desmarcada: vale como informado
    if(p.m[f.k].f && !permit.some(x=>x.id===p.m[f.k].f)) return 'INF';
  }
  return o;
}
function refsPend(p){
  const faltas=[];
  (p.refs||[]).forEach((r,i)=>{
    const miss=[]; if(!r.desc) miss.push('descrição'); if(!r.tipo) miss.push('perfil');
    if(!(+r.b>0)) miss.push('seção'); if(!(+r.h>0)) miss.push('seção'); if(r.tipo!=='MAD' && !(+r.t>0)) miss.push('espessura');
    if(!(+r.comp>0)) miss.push('comprimento'); if(!(+r.qtd>0)) miss.push('quantidade');
    if(miss.length) faltas.push('Reforço R'+(i+1)+': '+[...new Set(miss)].join(', '));
  });
  return faltas;
}

/* =================== ANÁLISE (o "assistente") =================== */
function analisar(p){
  const ativos=FIELDS.filter(f=>ativo(p,f));
  const plR=regras(p).placa;
  const pend=ativos.filter(f=>vazioCampo(p,f) || (plR && f.k==='tampo_tipo' && !['CHAPA','MADEIRA'].includes(vRaw(p,f.k))));
  const refFaltas = vRaw(p,'ref_tem')==='SIM' ? ((p.refs||[]).length ? refsPend(p) : ['Reforços: cadastre cada reforço (ou marque "não tem")']) : [];
  const total=ativos.length + (vRaw(p,'ref_tem')==='SIM'?Math.max(1,(p.refs||[]).length):0);
  const feitos=total - pend.length - refFaltas.length;
  const erros=[], avisos=[], fotosPed=[];
  const g=k=>vNum(p,k);
  const C=g('C'), L=g('L'), H=g('H');
  // consistência
  if((C!=null&&C<200)||(L!=null&&L<200)||(H!=null&&H<40)) avisos.push('Alguma medida do tamanho ficou muito pequena ('+['C','L','H'].map(k=>g(k)==null?'—':mm(g(k))).join(' × ')+' mm). Confira se escolheu a unidade certa (mm, cm ou m).');
  if(C!=null && L!=null && C<L) avisos.push('O comprimento está menor que a largura — confira se não inverteu (comprimento é o lado maior).');
  ['long_n','trav_n','pes_n'].forEach(k=>{ const v=g(k); if(v!=null && v<2) erros.push(FMAP[k].rot+': precisa ser no mínimo 2.'); if(v!=null && v!==Math.round(v)) erros.push(FMAP[k].rot+': tem que ser número inteiro.'); });
  ['long','trav','pes','base'].forEach(c=>{
    if(c==='base' && vRaw(p,'base_tem')!=='SIM') return;
    const b=g(c+'_b'), h=g(c+'_h'), t=g(c+'_t'), tp=tipoDe(p,c);
    if(tp && tp!=='MAD' && t!=null && b!=null && h!=null && (2*t>=Math.min(b,h))) erros.push(COMP[c].nome+': espessura grande demais para a seção '+b+'×'+h+'.');
  });
  const pe=alturaPe(p);
  if(p.pesInteiro && pe!=null && g('pes_h')!=null && Math.abs(g('pes_h')-pe)>1) avisos.push('Pé em peça inteira: o perfil tem '+mm(g('pes_h'))+' mm de altura, mas a altura calculada do pé é '+mm(pe)+' mm. Ajuste a altura total do palete ou o perfil.');
  if(pe!=null && pe<=0) erros.push('A altura dos pés calculada deu '+mm(pe)+' mm — a soma das peças passa da altura total. Confira altura total e seções.');
  else if(pe!=null && pe<70) avisos.push('Abertura para o garfo só com '+mm(pe)+' mm de altura — garfo de empilhadeira/paleteira costuma precisar de 90 a 100 mm. Confira.');
  const RG=regras(p);
  if(RG.placa && L!=null && g('long_n')!=null && g('pes_h')!=null && g('long_n')*g('pes_h')>L) erros.push('As fileiras de pés não cabem na largura.');
  const nl=RG.placa?null:g('long_n'), bl=g('long_b');
  if(L!=null && nl!=null && bl!=null && nl*bl>=L) erros.push('As longarinas ('+nl+' × '+bl+' mm) não cabem na largura de '+L+' mm.');
  if(!RG.placa && vRaw(p,'trav_mont')==='ENTRE' && g('trav_h')!=null && g('long_h')!=null && g('trav_h')>g('long_h')) avisos.push('A travessa (entre longarinas) é mais alta que a longarina — ela vai sobrar para cima ou para baixo. Confira.');
  const nt=RG.placa?null:(RG.semTravMeio?2:g('trav_n')), bt=g('trav_b');
  if(C!=null && nt!=null && bt!=null && nt*bt>C) erros.push('As travessas não cabem no comprimento.');
  const np=g('pes_n'), bp=g('pes_b');
  if(C!=null && np!=null && bp!=null && np*bp>C) erros.push('Os pés não cabem no comprimento.');
  // regra: medida do material ≠ medida do palete
  if(p.estado==='CARREGADO'){
    const cc=+p.carga.comp, cl=+p.carga.larg;
    const perto=(a,b)=>a>0&&b>0&&Math.abs(a-b)<=5;
    if(perto(C,cc)||perto(C,cl)||perto(L,cl)||perto(L,cc)) avisos.push('Uma medida do palete está igual à do material armazenado. Confira se foi medida a ESTRUTURA do palete, não a carga.');
    if(C!=null && L!=null && cc>0 && cl>0 && (Math.max(cc,cl)>C+5 || Math.min(cc,cl)>L+5)) avisos.push('A carga informada é maior que o palete (fica em balanço). Avalie na conferência de estabilidade.');
  }
  // fotos pedidas
  const temVista=v=>(p.fotos||[]).some(f=>f.vista===v);
  if(!temVista('FRENTE')) fotosPed.push({v:'FRENTE', txt:'Foto da FRENTE — de frente para a abertura do garfo, palete inteiro no quadro.'});
  if(!temVista('LATERAL')) fotosPed.push({v:'LATERAL', txt:'Foto da LATERAL — do lado comprido, palete inteiro no quadro.'});
  if(!temVista('SUPERIOR')) fotosPed.push({v:'SUPERIOR', txt: p.estado==='CARREGADO' ? 'Foto DE CIMA — com carga ela mostra só o material; se der, tire com o palete vazio ou mostrando as bordas da estrutura.' : 'Foto DE CIMA — mostrando a estrutura toda.'});
  const compsPend=[...new Set(pend.map(f=>f.comp))];
  if(vRaw(p,'ref_tem')==='SIM' && refFaltas.length) compsPend.push('ref');
  compsPend.forEach(c=>{
    if(c==='geral') return;
    if(c==='tampo' && vRaw(p,'tampo_tipo')==='') return;   // pergunta de um toque — não precisa de foto
    if(c==='ref' && vRaw(p,'ref_tem')!=='SIM') return;
    if(c==='base' && vRaw(p,'base_tem')==='' ) { if(!fotosQueMostram(p,'base',false).length && !temVista('INFERIOR')) fotosPed.push({v:'INFERIOR', txt:'Foto POR BAIXO / INCLINADA — para saber se existe base inferior.'}); return; }
    if(!fotosQueMostram(p,c,false).length) fotosPed.push({v:'DETALHE', txt:'Detalhe de '+COMP[c].nome.toUpperCase()+' — '+DICA_FOTO[c]+'.'});
  });
  const semMarca=(p.fotos||[]).filter(f=>!(f.vis||[]).length);
  refFaltas.push(...parsFaltas(p));
  const pronto = pend.length===0 && refFaltas.length===0 && erros.length===0 && !!p.estado;
  const hashAtual = hashMedidas(p);
  const plantaOk = !!(p.planta && p.planta.hash===hashAtual);
  let st='RASCUNHO';
  if(plantaOk && pronto) st='LIBERADO';
  else if(pronto) st='PRONTO';
  else if((p.fotos||[]).length || Object.values(p.m||{}).some(x=>x.o!=='PAD')) st='PRELIMINAR';
  return { pend, refFaltas, erros, avisos, fotosPed, semMarca, pronto, pct: total?Math.round(feitos/total*100):0, st, hashAtual, plantaOk };
}
const ST_NOME = { RASCUNHO:'RASCUNHO', PRELIMINAR:'FICHA PRELIMINAR', PRONTO:'PRONTO P/ PLANTA', PLANTA:'PLANTA GERADA', LIBERADO:'LIBERADO P/ FABRICAÇÃO' };

function proximoPasso(p,A){
  if(!p.nome) return ['Dê um nome ao palete e diga se ele está vazio ou carregado','ident'];
  if(!p.estado) return ['Diga se o palete da foto está VAZIO ou CARREGADO','ident'];
  if(A.pend.length||A.refFaltas.length){ const n=contaFaltas(A,null); return [passo==='medidas'?'Preencha os campos em laranja — falta'+(n>1?'m ':' ')+n+' informaç'+(n>1?'ões':'ão'):'Faltam '+n+' informações do palete','medidas']; }
  if(A.erros.length) return ['Corrija '+A.erros.length+' problema(s) nas medidas','medidas'];
  if(!A.plantaOk) return ['Confira a planta e libere para fabricação','planta'];
  return ['✔ Liberado para fabricação — imprima a planta para a bancada','planta'];
}

/* =================== GEOMETRIA =================== */
function alturaPe(p){
  const RG=regras(p); const H=vNum(p,'H'); if(H==null) return null;
  let sap=0; if(RG.sapata){ sap=vNum(p,'sap_t'); if(sap==null) return null; }
  const tp=vRaw(p,'tampo_tipo'); if(tp==='') return null;
  const tt= ['CHAPA','MADEIRA'].includes(tp) ? vNum(p,'tampo_t') : 0; if(tt==null) return null;
  if(RG.placa){ if(!['CHAPA','MADEIRA'].includes(tp)) return null; return H - tt - sap; }
  const hl=vNum(p,'long_h'); if(hl==null) return null;
  const sobre=vRaw(p,'trav_mont')==='SOBRE'; const ht=vNum(p,'trav_h');
  if(sobre && ht==null) return null;
  const base=vRaw(p,'base_tem'); if(base==='') return null;
  const hb= base==='SIM' ? vNum(p,'base_h') : 0; if(hb==null) return null;
  return H - hl - (sobre?ht:0) - hb - tt - sap;
}
function perfilDe(p,c){ return { tipo:tipoDe(p,c), b:vNum(p,c+'_b'), h:vNum(p,c+'_h'), t:tipoDe(p,c)==='MAD'?0:vNum(p,c+'_t') }; }
function nomePerfil(pf){ if(!pf.tipo) return '—'; const T=TIPOS[pf.tipo]; return T.curto+' '+mm(pf.b)+'×'+mm(pf.h)+(pf.tipo==='MAD'?'':'×'+mm(pf.t))+' mm'; }
function kgm(pf){
  const {tipo,b,h,t}=pf;
  if(tipo==='TUBO') return (2*t*(b+h)-4*t*t)*7.85/1000;
  if(tipo==='CANT') return t*(b+h-t)*7.85/1000;
  if(tipo==='U')    return t*(h+2*b-2*t)*7.85/1000;
  if(tipo==='MAD')  return b*h*(+CFG.densMadeira||0.6)/1000;
  return 0;
}
function moduloW(pf){ // módulo resistente (mm³) em torno do eixo de flexão (carga vertical)
  const {tipo,b,h,t}=pf;
  if(tipo==='TUBO'){ const I=(b*h**3-(b-2*t)*(h-2*t)**3)/12; return I/(h/2); }
  if(tipo==='U'){ const I=(b*h**3-(b-t)*(h-2*t)**3)/12; return I/(h/2); }
  if(tipo==='MAD') return b*h*h/6;
  return null; // cantoneira: não calcula (perfil assimétrico)
}
function modelo(p){
  const g=k=>vNum(p,k); const RG=regras(p);
  const M={ C:g('C'), L:g('L'), H:g('H'), placa:RG.placa, rg:RG,
    long:Object.assign(perfilDe(p,'long'),{n:g('long_n')}),
    trav:Object.assign(perfilDe(p,'trav'),{n: RG.semTravMeio?2:g('trav_n'), sobre:vRaw(p,'trav_mont')==='SOBRE'}),
    pes:Object.assign(perfilDe(p,'pes'),{n:g('pes_n')}),
    base: !RG.placa && vRaw(p,'base_tem')==='SIM' ? perfilDe(p,'base') : null,
    tampo:{ tipo:vRaw(p,'tampo_tipo'), t: ['CHAPA','MADEIRA'].includes(vRaw(p,'tampo_tipo'))?g('tampo_t'):0 } };
  M.hb = M.base ? M.base.h : 0;
  M.sapT = RG.sapata ? g('sap_t') : 0; M.sap = RG.sapata ? g('sap_lado') : 0;
  M.zPe0 = M.hb + M.sapT;
  M.hp = alturaPe(p);
  M.pesInteiro=!!p.pesInteiro; M.pesPerfil=Object.assign({},M.pes);
  if(M.pesInteiro) M.pes=Object.assign({},M.pes,{ b:M.C, h:M.pesPerfil.b, n:1 });   // uma peça corrida por fileira
  const nl=M.long.n;               // no modo placa: fileiras de pés
  M.pesX=[...Array(M.pes.n).keys()].map(k=> M.pes.n===1?0: k*(M.C-M.pes.b)/(M.pes.n-1));
  if(M.placa){
    M.rowsY=[...Array(nl).keys()].map(i=> nl===1?(M.L-M.pes.h)/2: i*(M.L-M.pes.h)/(nl-1));
    M.zTampo = M.zPe0+M.hp;
  } else {
    const bl=M.long.b;
    M.longY=[...Array(nl).keys()].map(i=> nl===1?0: i*(M.L-bl)/(nl-1));
    M.rowsY=M.longY.map(y=>y+(bl-M.pes.h)/2);
    M.travX=[...Array(M.trav.n).keys()].map(j=> j*(M.C-M.trav.b)/(M.trav.n-1));
    M.zLong=M.zPe0+M.hp; M.zTopo=M.zLong+M.long.h; M.zTrav= M.trav.sobre ? M.zTopo : M.zTopo-M.trav.h;
    M.zTampo = M.trav.sobre ? M.zTopo+M.trav.h : M.zTopo;
    M.vaoTrav = M.trav.sobre ? M.L : (M.L - nl*bl)/(nl-1);
  }
  M.nPes = nl*M.pes.n;
  // peças cortadas de barra
  const q=Math.max(1, parseInt(p.qtdFab)||1);
  const pecas=[];
  if(!M.placa){
    pecas.push({ id:'P1', nome:'Longarina', perfil:M.long, qtd:nl, corte:M.C, obs:'corte reto 90°' });
    pecas.push({ id:'P2', nome: M.trav.sobre?'Travessa (por cima das longarinas)':'Travessa (entre longarinas)', perfil:M.trav, qtd: M.trav.sobre? M.trav.n : M.trav.n*(nl-1), corte:M.vaoTrav, obs: (RG.semTravMeio?'só nas pontas · ':'')+(M.trav.sobre?'corte reto 90°':'vão livre entre longarinas') });
  }
  if(M.pesInteiro) pecas.push({ id:'P3', nome: 'Pé — peça inteira (de ponta a ponta)'+(M.placa?' soldada na placa':''), perfil:M.pesPerfil, qtd: nl, corte:M.C, obs:'1 peça corrida por fileira' });
  else pecas.push({ id:'P3', nome: M.placa?'Pé (soldado direto na placa)':'Pé', perfil:M.pes, qtd: M.nPes, corte:M.hp, obs:'altura calculada' });
  if(M.base) pecas.push({ id:'P4', nome:'Base inferior', perfil:M.base, qtd:nl, corte:M.C, obs:'corte reto 90°' });
  if(RG.cantos){ M.rc=Object.assign(perfilDe(p,'rc'),{comp:g('rc_comp')}); pecas.push({ id:'P7', nome: M.placa?'Reforço de canto (mão-francesa pé × placa)':'Reforço de canto (diagonal)', perfil:M.rc, qtd:4, corte:M.rc.comp, obs:'pontas a 45°' }); }
  (p.refs||[]).forEach((r,i)=> pecas.push({ id:'R'+(i+1), nome:'Reforço — '+(r.desc||''), perfil:{tipo:r.tipo,b:+r.b,h:+r.h,t:r.tipo==='MAD'?0:+r.t}, qtd:+r.qtd, corte:+r.comp, obs:'informado ('+(r.o==='OBS'?'observado na foto':'usuário')+')' }));
  pecas.forEach(pc=>{ pc.kgm=kgm(pc.perfil); pc.kgUn=pc.kgm*pc.corte/1000; pc.qtdTot=pc.qtd*q; });
  M.pecas=pecas; M.q=q;
  // chapas e itens comprados
  M.chapas=[]; M.itens=[];
  if(['CHAPA','MADEIRA','TELA'].includes(M.tampo.tipo)){
    const area=M.C*M.L/1e6;
    const kg = M.tampo.tipo==='CHAPA' ? M.C*M.L*M.tampo.t*7.85e-6 : M.tampo.tipo==='MADEIRA' ? M.C*M.L*M.tampo.t*(+CFG.densMadeira||0.6)*1e-6 : null;
    const nm = M.placa ? (M.tampo.tipo==='CHAPA'?'Placa — chapa de aço':'Placa — chapa de madeira') : (M.tampo.tipo==='CHAPA'?'Tampo — chapa de aço':M.tampo.tipo==='MADEIRA'?'Tampo — chapa de madeira':'Tampo — tela/grade');
    M.chapas.push({ id: M.placa?'P1':'P5', nome:nm, qtd:1, area, kg, dim: mm(M.C)+' × '+mm(M.L)+(M.tampo.t?' × '+mm(M.tampo.t):'')+' mm', obs:'peça inteira ou emendada' });
  }
  if(RG.sapata){ const kg=M.sap*M.sap*M.sapT*7.85e-6; M.chapas.push({ id:'P6', nome:'Sapata — chapa de aço', qtd:M.nPes, area:M.sap*M.sap/1e6, kg, dim: mm(M.sap)+' × '+mm(M.sap)+' × '+mm(M.sapT)+' mm', obs:'1 embaixo de cada pé' }); }
  const disp=ligacoesDisp(p).map(x=>x[0]); const nomeLig=Object.fromEntries(ligacoesDisp(p));
  M.pars=(p.pars||[]).filter(l=>disp.includes(l.lig)).map(l=>{ const pts=pontosLig(M,p,l); return Object.assign({},l,{ nome:nomeLig[l.lig], pts, total: pts.length*(+l.n||0) }); });
  { const grp={}; M.pars.forEach(l=>{ const k=String(l.med||'').trim(); if(!k) return; (grp[k]=grp[k]||{qtd:0,onde:[]}); grp[k].qtd+=l.total; grp[k].onde.push(l.nome+' ('+l.n+' por ponto'+(ligLinear(p,l.lig)?' a cada '+mm(+l.esp)+' mm':'')+')'); });
    Object.entries(grp).forEach(([k,v],i)=>M.itens.push({ id:'PF'+(i+1), nome:'Parafuso '+k, qtd:v.qtd, obs:v.onde.join(' · ') })); }
  if(RG.olhal){ M.olhalN=g('olhal_n'); M.itens.push({ id:'P8', nome:'Olhal de içamento', qtd:M.olhalN, obs:'comprar conforme a carga · soldar nos cantos' }); }
  // barras
  const grupos={};
  pecas.forEach(pc=>{ const key=nomePerfil(pc.perfil); (grupos[key]=grupos[key]||{perfil:pc.perfil, cortes:[]}); for(let i=0;i<pc.qtdTot;i++) grupos[key].cortes.push({len:pc.corte, ref:pc.id}); });
  M.barras=Object.entries(grupos).map(([key,gp])=>{
    const barra = TIPOS[gp.perfil.tipo] && TIPOS[gp.perfil.tipo].aco ? (+CFG.barraAco||6000) : (+CFG.barraMadeira||3000);
    const plano=planoBarras(gp.cortes, barra, +CFG.kerf||0);
    const usado=gp.cortes.reduce((s,c)=>s+c.len,0);
    const nBar=plano.reduce((s,b)=>s+(b.grande?Math.ceil(b.usado/barra):1),0);
    return { key, perfil:gp.perfil, barra, plano, nBar, usado, aprov: usado/(nBar*barra), kg: nBar*barra/1000*kgm(gp.perfil), grande: plano.some(b=>b.grande) };
  });
  M.pesoUn = pecas.reduce((s,pc)=>s+pc.kgUn*pc.qtd,0) + M.chapas.reduce((s,c)=>s+(c.kg||0)*c.qtd,0);
  return M;
}
function planoBarras(cortes, barra, kerf){
  const ord=[...cortes].sort((a,b)=>b.len-a.len), bars=[];
  for(const c of ord){
    if(c.len>barra){ bars.push({cortes:[c], usado:c.len, grande:true}); continue; }
    let b=bars.find(b=>!b.grande && b.usado+(b.cortes.length?kerf:0)+c.len<=barra+1e-6);
    if(!b){ b={cortes:[],usado:0}; bars.push(b); }
    b.usado+=(b.cortes.length?kerf:0)+c.len; b.cortes.push(c);
  }
  return bars;
}
function verificacao(M, Qkg){
  if(!(Qkg>0)) return null;
  if(M.pesInteiro) return { semCalc:true, motivo:'Pé em peça inteira: a longarina fica apoiada de ponta a ponta, então a conta de vão não se aplica.' };
  if(M.placa) return { semCalc:true, motivo:'Palete de placa com pés: o sistema não faz a conta indicativa (depende da espessura da placa e das soldas).' };
  const vao=(M.C-M.pes.b)/(M.pes.n-1);
  const W=moduloW(M.long);
  const adm = TIPOS[M.long.tipo].aco ? 165 : 10; // MPa — aço ASTM A36 (250/1,5) · madeira (valor conservador)
  if(!W) return { semCalc:true, vao };
  const w = Qkg*9.81/(M.long.n*M.C);  // N/mm por longarina (carga distribuída)
  const Mf = w*vao*vao/8;             // N·mm — vão bi-apoiado entre pés (a favor da segurança)
  const sig = Mf/W;
  return { vao, sig, adm, ok: sig<=adm, fs: adm/sig };
}
/* ===== PARAFUSOS: onde vão, quantos por ponto, e os pontos calculados no desenho ===== */
function ligacoesDisp(p){
  const RG=regras(p); const L=[];
  const tamp=['CHAPA','MADEIRA'].includes(vRaw(p,'tampo_tipo'));
  if(RG.placa) L.push(['pe_placa','Placa nos pés']);
  else {
    L.push(['pe_long','Pés nas longarinas']);
    L.push(['trav_long','Travessas nas longarinas']);
    if(tamp) L.push(['tampo_estr','Tampo na estrutura']);
    if(vRaw(p,'base_tem')==='SIM') L.push(['base_pe','Base nos pés']);
  }
  return L;
}
function ligLinear(p,lig){ return lig==='tampo_estr' || ((lig==='pe_placa'||lig==='pe_long'||lig==='base_pe') && !!p.pesInteiro); }
function espacar(a,b,esp){ const ini=a, fim=b; if(!(esp>0)||fim<=ini) return [ (a+b)/2 ]; const n=Math.max(2,Math.floor((fim-ini)/esp)+1); return [...Array(n).keys()].map(i=>ini+i*(fim-ini)/(n-1)); }
function pontosLig(M,p,l){
  const pts=[]; const esp=+l.esp; const mg=30;
  const centrosPes=()=>{ M.rowsY.forEach(y=>M.pesX.forEach(x=>pts.push([x+M.pes.b/2,y+M.pes.h/2]))); };
  if(l.lig==='pe_placa'||l.lig==='pe_long'||l.lig==='base_pe'){
    if(M.pesInteiro) M.rowsY.forEach(y=>espacar(mg,M.C-mg,esp).forEach(x=>pts.push([x,y+M.pes.h/2])));
    else centrosPes();
  } else if(l.lig==='trav_long' && !M.placa){
    M.travX.forEach(x=>{ const xc=x+M.trav.b/2;
      if(M.trav.sobre) M.longY.forEach(y=>pts.push([xc,y+M.long.b/2]));
      else for(let i=0;i<M.longY.length-1;i++){ pts.push([xc,M.longY[i]+M.long.b/2]); pts.push([xc,M.longY[i+1]+M.long.b/2]); } });
  } else if(l.lig==='tampo_estr' && !M.placa){
    if(M.trav.sobre) M.travX.forEach(x=>espacar(mg,M.L-mg,esp).forEach(y=>pts.push([x+M.trav.b/2,y])));
    else M.longY.forEach(y=>espacar(mg,M.C-mg,esp).forEach(x=>pts.push([x,y+M.long.b/2])));
  }
  return pts;
}
function parsFaltas(p){
  const disp=ligacoesDisp(p).map(x=>x[0]); const f=[];
  (p.pars||[]).forEach((l,i)=>{ const m=[];
    if(!disp.includes(l.lig)) m.push('onde vai');
    if(!String(l.med||'').trim()) m.push('medida');
    if(!(+l.n>0)) m.push('quantos por ponto');
    if(ligLinear(p,l.lig) && !(+l.esp>0)) m.push('espaçamento');
    if(m.length) f.push('Parafuso '+(i+1)+': '+m.join(', '));
  });
  return f;
}
function hashMedidas(p){
  const s=JSON.stringify([regras(p), !!p.pesInteiro, (p.pars||[]).map(l=>[l.lig,l.med,l.n,l.esp]), FIELDS.filter(f=>ativo(p,f)).map(f=>[f.k,vRaw(p,f.k)]), (p.refs||[]).map(r=>[r.desc,r.tipo,r.b,r.h,r.t,r.comp,r.qtd]), p.qtdFab, p.carga&&p.carga.mostrar?[p.carga.comp,p.carga.larg,p.carga.alt]:0]);
  let h=0; for(let i=0;i<s.length;i++){ h=((h<<5)-h+s.charCodeAt(i))|0; } return String(h);
}

function listaFiltrada(){
  return Object.values(P).filter(p=>!p.excluido).sort((a,b)=>(b.atualizado||0)-(a.atualizado||0)).filter(p=>{
    if(filtro && analisar(p).st!==filtro) return false;
    if(busca){ const s=(p.codigo+' '+p.nome+' '+p.uso).toLowerCase(); if(!s.includes(busca.toLowerCase())) return false; }
    return true;
  });
}
function telaLista(){

  return vis.map(p=>{
    const A=analisar(p); const f=(p.fotos||[]).find(x=>x.url);
    const falta=A.pend.length+A.refFaltas.length;
    return `<div class="pc" onclick="abrir('${p.id}')">
      <div class="th" style="${f?`background-image:url('${esc(f.url)}')`:''}">${f?'':'🧱'}</div>
      <div class="ct"><div class="linha" style="justify-content:space-between"><span class="cod">${esc(p.codigo)}</span><span class="badge st-${A.st}">${ST_NOME[A.st]}</span></div>

async function addFotos(inp, vista){
  const arqs=[...(inp.files||[])]; if(!arqs.length) return;

  }

function comprimir(file, max=1400, q=.72){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{ const img=new Image(); img.onload=()=>{ const k=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',q)); }; img.onerror=()=>rej(new Error('arquivo não é imagem')); img.src=fr.result; };
    fr.onerror=()=>rej(fr.error); fr.readAsDataURL(file);
  });
}
async function subirFoto(pid,fid,dataUrl){
  if(!sb) return dataUrl;
  try{
    const blob=await (await fetch(dataUrl)).blob(); const path=pid+'/'+fid+'.jpg';
    const { error }=await sb.storage.from(BUCKET).upload(path, blob, { contentType:'image/jpeg', upsert:true });
    if(error) throw error;
    return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
  }catch(e){ console.warn(e); toast('⚠ Foto guardada só neste aparelho (nuvem de fotos indisponível)'); return dataUrl; }
}

function tirarFoto(fid){

  render();
}

/* resumo em linguagem simples: uma linha por pergunta (perfil = 1 linha, não 4 campos) */
function nomePerfilP(p,c){ const i=perfilAtual(p,c); if(i!==''&&i!=='OUTRO') return PERFIS[+i][4]; const pf=perfilDe(p,c); return pf.tipo&&pf.b!=null&&pf.h!=null?nomePerfil(pf):''; }
function origemDe(p,ks){
  const fs=ks.map(k=>FMAP[k]).filter(f=>f&&ativo(p,f));
  if(!fs.length) return 'INF';
  if(fs.some(f=>vazioCampo(p,f))) return 'PEND';
  const os=fs.map(f=>origemEfetiva(p,f));
  return os.every(o=>o==='OBS')?'OBS':os.includes('PAD')?'PAD':'INF';
}
function resumoDados(p){
  const R=[]; const v=k=>vRaw(p,k); const n=k=>vNum(p,k); const RG=regras(p);
  const add=(rot,val,ks,o)=>R.push({rot,val,o:o||origemDe(p,ks),k:ks[0]||'notas'});
  add('Comprimento', fmtUn(p,'C',n('C')),['C']);
  add('Largura', fmtUn(p,'L',n('L')),['L']);
  add('Altura', fmtUn(p,'H',n('H')),['H']);
  const pk=c=>['_tipo','_b','_h','_t'].map(x=>c+x);
  const tamp=()=>{ add(RG.placa?'Placa':'Tampo', {NENHUM:'não',CHAPA:'chapa de aço',MADEIRA:'madeira',TELA:'tela'}[v('tampo_tipo')]||'', ['tampo_tipo','tampo_t']);
    if(['CHAPA','MADEIRA'].includes(v('tampo_tipo'))&&n('tampo_t')!=null) R[R.length-1].val+=' · '+mm(n('tampo_t'))+' mm';
    if(RG.placa && !['CHAPA','MADEIRA'].includes(v('tampo_tipo'))) R[R.length-1].o='PEND'; };
  if(RG.placa){
    add('Estrutura','pés soldados direto na placa (pela observação)',[],'INF');
    tamp();
    add('Perfil dos pés',nomePerfilP(p,'pes'),pk('pes'));
    add('Fileiras de pés', v('long_n')?v('long_n')+' un':'',['long_n']);
    if(p.pesInteiro) add('Pés','peça inteira de ponta a ponta (1 por fileira)',[],'INF'); else add('Pés em cada fileira', v('pes_n')?v('pes_n')+' un':'',['pes_n']);
  } else {
    if(!p.sep && (perfisIguais(p) || perfilAtual(p,'long')==='')) add('Perfil da estrutura', nomePerfilP(p,'long'), [...pk('long'),...pk('trav'),...pk('pes')]);
    else { add('Perfil das longarinas',nomePerfilP(p,'long'),pk('long')); add('Perfil das travessas',nomePerfilP(p,'trav'),pk('trav')); add('Perfil dos pés',nomePerfilP(p,'pes'),pk('pes')); }
    add('Longarinas', v('long_n')?v('long_n')+' un':'',['long_n']);
    if(RG.semTravMeio) add('Travessas','2 · só nas pontas (pela observação) · '+(v('trav_mont')==='SOBRE'?'por cima':'entre as longarinas'),['trav_mont']);
    else add('Travessas', v('trav_n')?v('trav_n')+' un · '+(v('trav_mont')==='SOBRE'?'por cima':'entre as longarinas'):'',['trav_n','trav_mont']);
    if(p.pesInteiro) add('Pés','peça inteira de ponta a ponta (1 por longarina)',[],'INF'); else add('Pés em cada longarina', v('pes_n')?v('pes_n')+' un':'',['pes_n']);
  }
  const pe=alturaPe(p); if(pe!=null) R.push({rot:'Altura do pé',val:mm(pe)+' mm (calculada pela altura total)',o:'CALC',k:'H'});
  if(!RG.placa){
    add('Base no chão', v('base_tem')==='SIM'?'sim'+(nomePerfilP(p,'base')?' · '+nomePerfilP(p,'base'):''):v('base_tem')==='NAO'?'não':'',v('base_tem')==='SIM'?['base_tem',...pk('base')]:['base_tem']);
    tamp();
  }
  if(RG.cantos) add('Reforço nos cantos', nomePerfilP(p,'rc')&&n('rc_comp')!=null ? '4 × '+nomePerfilP(p,'rc')+' · '+mm(n('rc_comp'))+' mm' : '', [...pk('rc'),'rc_comp']);
  if(RG.olhal) add('Olhais para içar', v('olhal_n')?v('olhal_n')+' un':'', ['olhal_n']);
  if(RG.sapata) add('Sapata em cada pé', n('sap_lado')!=null&&n('sap_t')!=null ? mm(n('sap_lado'))+' × '+mm(n('sap_lado'))+' × '+mm(n('sap_t'))+' mm' : '', ['sap_lado','sap_t']);
  { const pf=parsFaltas(p); const n=(p.pars||[]).length;
    R.push({rot:'Parafusos', val: n? (p.pars||[]).map(l=>(String(l.med||'?'))+' — '+((Object.fromEntries(ligacoesDisp(p))[l.lig])||'?')).join(' · ') : 'não', o: pf.length?'PEND':'INF', k:'par'}); }
  add(RG.placa?'Outros reforços':'Reforços', v('ref_tem')==='SIM'?(p.refs||[]).length+' cadastrado(s)':v('ref_tem')==='NAO'?'não':'',['ref_tem']);
  if(v('ref_tem')==='SIM' && refsPend(p).length) R[R.length-1].o='PEND';
  return R;
}

    ${falta.length?`<div class="faltam">${falta.map(r=>`<span class="chip" onclick="irCampo('${r.k}')">⏳ ${esc(r.rot)}</span>`).join('')}</div>`:''}
    ${A.erros.length?`<div class="aviso e">✖ ${A.erros.map(esc).join('<br>✖ ')}</div>`:''}
    <div class="linha noprint" style="margin:12px 0"><button class="btn" onclick="irPasso('${p.estado?'medidas':'ident'}')">✏ Preencher agora</button><button class="btn c mini" onclick="window.print()">🖨 Imprimir ficha</button></div>
    ${tem.length?`<h2 class="sec">O que já tem</h2>${`<table class="t"><tr><th>Informação</th><th>Valor</th><th>Origem</th><th class="noprint"></th></tr>${tem.map(r=>`<tr><td>${esc(r.rot)}</td><td>${esc(r.val)}</td><td><span class="tg ${r.o}">${ORIG_TXT[r.o]}</span></td><td class="noprint n"><button class="btn mini c" onclick="editarCampo('${r.k}')">✏ Editar</button></td></tr>`).join('')}</table>`}`:''}
    ${p.estado==='CARREGADO'&&p.carga&&(p.carga.comp||p.carga.larg)?`<p style="font-size:13px;color:var(--mut)">📦 Carga (só referência, não é medida do palete): ${esc(p.carga.desc||'')} ${p.carga.comp?mm(+p.carga.comp):'?'} × ${p.carga.larg?mm(+p.carga.larg):'?'} × ${p.carga.alt?mm(+p.carga.alt):'?'} mm</p>`:''}`;
}
function confirmarPlanta(){
  const p=P[cur]; const A=analisar(p); if(!A.pronto) return;
  const nome=quem()||'—';
  if(!confirm('LIBERAR PARA FABRICAÇÃO\n\nAo liberar, '+nome+' confirma que conferiu:\n• as dimensões (comprimento, largura, altura, perfis e espessuras)\n• a capacidade de carga\n• a estabilidade\n• a segurança (soldas, rebarbas, abertura do garfo)\n\nLiberar agora?')) return;
  const rev = p.planta ? (p.planta.hash===A.hashAtual ? p.planta.rev : p.planta.rev+1) : 0;
  p.planta={ rev, hash:A.hashAtual, em:Date.now(), por:nome };
  p.lib=Object.assign(p.lib||{}, { ok:true, dim:true, cap:true, est:true, seg:true, resp:nome, em:Date.now() });
  salvar(p); render(); toast('🔓 Liberado para fabricação — planta Rev. '+rev);
}

  M.chapas.forEach(c=>lin.push(`<tr><td><b>${c.id}</b></td><td>${esc(c.nome)}</td><td>${esc(c.dim)}</td><td class="n">${c.qtd}</td><td class="n">${c.qtd*M.q}</td><td class="n">${nf(c.area,c.area<0.1?3:2)} m²</td><td class="n">${c.kg!=null?nf(c.kg,2):'—'}</td><td class="n">${c.kg!=null?nf(c.kg*c.qtd*M.q,1):'—'}</td><td style="font-size:12px;color:var(--mut)">${esc(c.obs)}</td></tr>`));
  M.itens.forEach(c=>lin.push(`<tr><td><b>${c.id}</b></td><td>${esc(c.nome)}</td><td>—</td><td class="n">${c.qtd}</td><td class="n">${c.qtd*M.q}</td><td class="n">—</td><td class="n">—</td><td class="n">—</td><td style="font-size:12px;color:var(--mut)">${esc(c.obs)}</td></tr>`));
  return `<table class="t"><tr><th>Peça</th><th>Descrição</th><th>Perfil</th><th>Qtd/palete</th><th>Qtd total</th><th>Corte (mm)</th><th>kg/un</th><th>kg total</th><th>Obs.</th></tr>${lin.join('')}
    <tfoot><tr><td colspan="7">Peso estimado da estrutura: ${nf(M.pesoUn,1)} kg por palete</td><td class="n">${nf(M.pesoUn*M.q,1)}</td><td></td></tr></tfoot></table>
    <div style="font-size:12px;color:var(--mut)">Comprimentos de corte para união topo a topo com solda (aço) ou fixação por cima (madeira). Confirme o tipo de união na conferência.</div>`;
}
function tabelaBarras(M){
  const lin=M.barras.map(b=>{
    const grupos={};
    b.plano.forEach(x=>{ const k=x.grande?'GRANDE:'+x.cortes[0].len:x.cortes.map(c=>mm(c.len)).join(' + '); (grupos[k]=grupos[k]||{n:0,b:x}).n++; });
    const plano=Object.entries(grupos).map(([k,g])=> g.b.grande ? `<div style="color:var(--err)">⚠ ${g.n}× peça de ${mm(g.b.cortes[0].len)} mm — maior que a barra (precisa emenda ou barra especial)</div>` : `<div>${g.n}× barra: ${k} <span style="color:var(--mut)">(sobra ${mm(b.barra-g.b.usado)})</span></div>`).join('');
    return `<tr><td>${esc(b.key)}</td><td class="n">${mm(b.barra)}</td><td class="n"><b>${b.nBar}</b></td><td class="n">${nf(b.usado/1000,2)} m</td><td class="n">${nf(b.aprov*100,0)}%</td><td class="n">${nf(b.kg,1)}</td><td style="font-size:12px">${plano}</td></tr>`;
  });
  return `<table class="t"><tr><th>Perfil</th><th>Barra (mm)</th><th>Nº barras</th><th>Metros usados</th><th>Aproveit.</th><th>kg comprados</th><th>Plano de corte</th></tr>${lin.join('')}</table>
    <div style="font-size:12px;color:var(--mut)">Perda por corte considerada: ${CFG.kerf} mm por corte. Barras: aço ${mm(CFG.barraAco)} mm, madeira ${mm(CFG.barraMadeira)} mm (muda em ⚙ Configuração).</div>`;
}

}

/* ---------- desenho técnico (SVG em mm de papel, A4 paisagem) ---------- */
function desenharPlanta(p,M){
  const W=277, HH=190, s0=[];
  const cg=p.carga||{}; const mostrarCarga=p.estado==='CARREGADO' && cg.mostrar && +cg.comp>0 && +cg.larg>0;
  const cAltReal= mostrarCarga && +cg.alt>0 ? +cg.alt : 0;
  const cAlt = Math.min(cAltReal, Math.max(M.H*1.5, 0.3*M.C));   // carga alta é desenhada interrompida — o foco é a estrutura
  const cTxt = mostrarCarga ? 'CARGA '+mm(+cg.comp)+' × '+mm(+cg.larg)+(cAltReal?' × '+mm(cAltReal):'')+' (referência'+(cAltReal>cAlt?' · altura interrompida':'')+')' : '';
  const Hv = M.H + cAlt;
  const sRaw=Math.min(190/(M.C+M.L), 95/(Hv+M.L));
  const ESC=[1,2,2.5,5,10,15,20,25,30,40,50,75,100,150,200,250];
  const den=ESC.find(d=>1/d<=sRaw)||250; const s=1/den;
  const fx=Math.max(24,(W-((M.C+M.L)*s+30))/2), fyTop=16+cAlt*s, fyBase=fyTop+M.H*s;        // vista frontal: base em fyBase
  const sx=fx, syTop=fyBase+20;                            // vista superior (abaixo — 1º diedro)
  const lx=fx+M.C*s+30;                                    // vista lateral esquerda (à direita)
  const X=x=>fx+x*s, Zf=z=>fyBase-z*s;
  const LX=y=>lx+(M.L-y)*s, LXw=(y,w)=>lx+(M.L-y-w)*s;    // lateral: frente do palete à direita
  const SY=(y,w)=>syTop+(M.L-y-w)*s;                        // superior: frente embaixo
  const o=[];
  const R=(x,y,w,h,cls,pk)=>`<rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${Math.max(w,0.05).toFixed(2)}" height="${Math.max(h,0.05).toFixed(2)}" class="${cls}"${pk?` data-p="${pk}"`:''}/>`;
  const T=(x,y,t,a='middle',cls='tx')=>`<text x="${x.toFixed(2)}" y="${y.toFixed(2)}" text-anchor="${a}" class="${cls}">${esc(t)}</text>`;
  const cotaH=(x1,x2,y,yRef,txt,pk)=>{ const d=y<yRef?-1:1; return `<g class="cota"><line x1="${x1}" y1="${yRef+d*0.8}" x2="${x1}" y2="${y+d*1.2}"/><line x1="${x2}" y1="${yRef+d*0.8}" x2="${x2}" y2="${y+d*1.2}"/><line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}"/><line x1="${x1-0.8}" y1="${y+0.8}" x2="${x1+0.8}" y2="${y-0.8}" class="tk"/><line x1="${x2-0.8}" y1="${y+0.8}" x2="${x2+0.8}" y2="${y-0.8}" class="tk"/></g>${pk?`<text x="${((x1+x2)/2).toFixed(2)}" y="${(y-0.9).toFixed(2)}" text-anchor="middle" class="tc cl" data-p="${pk}">${esc(txt)}</text>`:T((x1+x2)/2, y-0.9, txt,'middle','tc')}`; };
  const cotaV=(y1,y2,x,xRef,txt,pk)=>{ const d=x<xRef?-1:1; return `<g class="cota"><line x1="${xRef+d*0.8}" y1="${y1}" x2="${x+d*1.2}" y2="${y1}"/><line x1="${xRef+d*0.8}" y1="${y2}" x2="${x+d*1.2}" y2="${y2}"/><line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}"/><line x1="${x-0.8}" y1="${y1+0.8}" x2="${x+0.8}" y2="${y1-0.8}" class="tk"/><line x1="${x-0.8}" y1="${y2+0.8}" x2="${x+0.8}" y2="${y2-0.8}" class="tk"/></g><text x="${x-0.9}" y="${(y1+y2)/2}" text-anchor="middle" class="tc${pk?' cl':''}"${pk?` data-p="${pk}"`:''} transform="rotate(-90 ${x-0.9} ${(y1+y2)/2})">${esc(txt)}</text>`; };
  const bal=(x,y,lx2,ly2,t)=>`<line x1="${x}" y1="${y}" x2="${lx2}" y2="${ly2}" class="ld"/><circle cx="${lx2}" cy="${ly2}" r="2.6" class="bl"/>${T(lx2,ly2+0.9,t,'middle','tb')}`;
  const tubo=(x,y,w,h,pf,pk)=>{ let r=R(x,y,w,h,'pc',pk); if(pf.tipo==='TUBO'&&pf.t*s>=0.25 && w>2*pf.t*s && h>2*pf.t*s) r+=R(x+pf.t*s,y+pf.t*s,w-2*pf.t*s,h-2*pf.t*s,'oco'); return r; };

  const temLong=!M.placa, zPT=M.zPe0+M.hp;
  const sapF=(xc,yTop,Xf)=>R(Xf(xc-M.sap/2),yTop,M.sap*s,M.sapT*s,'sp','sap');
  /* ===== VISTA FRONTAL (comprimento × altura) ===== */
  if(M.base) o.push(R(X(0),Zf(M.hb),M.C*s,M.hb*s,'pc','base'));
  if(M.sapT>0) M.pesX.forEach(x=>o.push(sapF(x+M.pes.b/2,Zf(M.hb+M.sapT),X)));
  M.pesX.forEach(x=>o.push(R(X(x),Zf(zPT),M.pes.b*s,M.hp*s,'pc','pes')));
  if(temLong){
    o.push(R(X(0),Zf(M.zTopo),M.C*s,M.long.h*s,'pc','long'));
    if(M.trav.sobre) M.travX.forEach(x=>o.push(tubo(X(x),Zf(M.zTrav+M.trav.h),M.trav.b*s,M.trav.h*s,M.trav,'trav')));
    else M.travX.forEach(x=>o.push(R(X(x),Zf(M.zTrav+M.trav.h),M.trav.b*s,M.trav.h*s,'oculto','trav')));
  }
  if(M.tampo.t>0) o.push(R(X(0),Zf(M.zTampo+M.tampo.t),M.C*s,M.tampo.t*s,M.placa?'pc':'tp','tampo'));
  if(M.placa && M.rc && M.rc.comp>0){ const a=M.rc.comp/Math.SQRT2; [[M.pesX[0]+M.pes.b,1],[M.pesX[M.pesX.length-1],-1]].forEach(([x0,d])=>o.push(`<line x1="${X(x0)}" y1="${Zf(zPT-a)}" x2="${X(x0+d*a)}" y2="${Zf(zPT)}" class="rcl" data-p="rc" style="stroke-width:${Math.max(.3,M.rc.b*s)}"/>`)); }
  if(M.rg.olhal){ const ins=Math.min(60,M.C*0.08); [ins,M.C-ins].forEach(x=>o.push(`<circle cx="${X(x)}" cy="${Zf(M.H)-1.4}" r="1.3" class="ol" data-p="olhal"/>`)); }
  if(mostrarCarga){ const cc=+cg.comp; const x0=(M.C-cc)/2; const zt=M.H; o.push(R(X(x0),Zf(zt+cAlt),cc*s,cAlt*s,'cg')); o.push(T(X(M.C/2),Zf(zt+cAlt/2)+1,cTxt,'middle','tcg')); if(cAltReal>cAlt){ const yy=Zf(zt+cAlt); o.push(`<path d="M${X(x0)-1} ${yy} l${cc*s*0.45} 0 l1.2 -1.6 l1.2 3.2 l1.2 -1.6 L${X(x0+cc)+1} ${yy}" fill="none" stroke="#f58220" stroke-width=".3"/>`); } }
  o.push(cotaH(X(0),X(M.C),fyBase+6,fyBase,mm(M.C),'C'));
  o.push(cotaV(Zf(M.H),Zf(0),fx-6,fx,mm(M.H),'H'));
  const yVao = M.hp*s>=4 ? Zf(M.zPe0+M.hp/2)+1.2 : Zf(0)+3.2;
  if(M.pes.n>=2){ const g0=M.pesX[0]+M.pes.b, g1=M.pesX[1]; o.push(cotaH(X(g0),X(g1),yVao,yVao,mm(g1-g0)+' livre')); }
  o.push(cotaV(Zf(zPT),Zf(M.zPe0),X(M.C)+6,X(M.C),mm(M.hp),'H'));
  o.push(T(X(M.C/2), fyTop-cAlt*s-3.2, 'VISTA FRONTAL','middle','tv'));

  /* ===== VISTA LATERAL ESQUERDA (largura × altura) ===== */
  M.rowsY.forEach((y,i)=>{
    const cy=y+M.pes.h/2;
    if(M.base) o.push(R(LXw(cy-M.base.b/2,M.base.b),Zf(M.hb),M.base.b*s,M.hb*s,'pc','base'));
    if(M.sapT>0) o.push(R(LXw(cy-M.sap/2,M.sap),Zf(M.hb+M.sapT),M.sap*s,M.sapT*s,'sp','sap'));
    o.push(R(LXw(y,M.pes.h),Zf(zPT),M.pes.h*s,M.hp*s,'pc','pes'));
    if(temLong) o.push(tubo(LXw(M.longY[i],M.long.b),Zf(M.zTopo),M.long.b*s,M.long.h*s,M.long,'long'));
  });
  if(temLong){
    if(M.trav.sobre) o.push(R(LX(M.L),Zf(M.zTrav+M.trav.h),M.L*s,M.trav.h*s,'pc','trav'));
    else for(let i=0;i<M.longY.length-1;i++){ const y0=M.longY[i]+M.long.b, y1=M.longY[i+1]; o.push(R(LXw(y0,y1-y0),Zf(M.zTrav+M.trav.h),(y1-y0)*s,M.trav.h*s,'pc','trav')); }
  }
  if(M.tampo.t>0) o.push(R(LX(M.L),Zf(M.zTampo+M.tampo.t),M.L*s,M.tampo.t*s,M.placa?'pc':'tp','tampo'));
  if(mostrarCarga){ const cl=+cg.larg; const y0=(M.L-cl)/2; o.push(R(LXw(y0,cl),Zf(M.H+cAlt),cl*s,cAlt*s,'cg')); }
  o.push(cotaH(LX(M.L),LX(0),fyBase+6,fyBase,mm(M.L),'L'));
  if(M.rowsY.length>=2){ const a=M.rowsY[0]+M.pes.h, b=M.rowsY[1]; if(b>a) o.push(cotaH(LXw(a,b-a),LX(a),yVao,yVao,mm(b-a)+' livre')); }
  o.push(T(LX(M.L/2), fyTop-cAlt*s-3.2, 'VISTA LATERAL ESQUERDA','middle','tv'));

  /* ===== VISTA SUPERIOR (comprimento × largura) ===== */
  if(M.placa) o.push(R(X(0),SY(0,M.L),M.C*s,M.L*s,'tpl','tampo'));
  M.rowsY.forEach(y=>M.pesX.forEach(x=>o.push(R(X(x),SY(y,M.pes.h),M.pes.b*s,M.pes.h*s,'oculto','pes'))));
  if(temLong){
    if(M.trav.sobre){
      M.longY.forEach(y=>o.push(R(X(0),SY(y,M.long.b),M.C*s,M.long.b*s,'oculto','long')));
      M.travX.forEach(x=>o.push(R(X(x),SY(0,M.L),M.trav.b*s,M.L*s,'pc','trav')));
    } else {
      M.longY.forEach(y=>o.push(R(X(0),SY(y,M.long.b),M.C*s,M.long.b*s,'pc','long')));
      for(let i=0;i<M.longY.length-1;i++){ const y0=M.longY[i]+M.long.b, y1=M.longY[i+1]; M.travX.forEach(x=>o.push(R(X(x),SY(y0,y1-y0),M.trav.b*s,(y1-y0)*s,'pc','trav'))); }
    }
    if(M.tampo.t>0||M.tampo.tipo==='TELA') o.push(R(X(0),SY(0,M.L),M.C*s,M.L*s,'tpo','tampo'));
    if(M.rc && M.rc.comp>0){ const a=M.rc.comp/Math.SQRT2, x0=M.trav.sobre?0:M.trav.b, y0=M.long.b;
      [[x0,y0,1,1],[M.C-x0,y0,-1,1],[x0,M.L-y0,1,-1],[M.C-x0,M.L-y0,-1,-1]].forEach(([xc,yc,dx,dy])=>o.push(`<line x1="${X(xc+dx*a)}" y1="${SY(yc,0)}" x2="${X(xc)}" y2="${SY(yc+dy*a,0)}" class="rcl" data-p="rc" style="stroke-width:${Math.max(.3,M.rc.b*s)}"/>`)); }
  }
  (M.pars||[]).forEach(l=>l.pts.forEach(([x,y])=>{ const cx=X(x), cy=SY(y,0); o.push(`<g class="pf" data-p="par"><circle cx="${cx.toFixed(2)}" cy="${cy.toFixed(2)}" r="0.9" data-p="par"/><line x1="${(cx-0.6).toFixed(2)}" y1="${cy.toFixed(2)}" x2="${(cx+0.6).toFixed(2)}" y2="${cy.toFixed(2)}" data-p="par"/><line x1="${cx.toFixed(2)}" y1="${(cy-0.6).toFixed(2)}" x2="${cx.toFixed(2)}" y2="${(cy+0.6).toFixed(2)}" data-p="par"/></g>`); }));
  if(M.rg.olhal){ const ins=Math.min(60,M.C*0.08), insY=Math.min(60,M.L*0.08); [[ins,insY],[M.C-ins,insY],[ins,M.L-insY],[M.C-ins,M.L-insY]].forEach(([x,y])=>o.push(`<circle cx="${X(x)}" cy="${SY(y,0)}" r="1.3" class="ol" data-p="olhal"/>`)); }
  if(mostrarCarga){ const cc=+cg.comp, cl=+cg.larg; o.push(R(X((M.C-cc)/2),SY((M.L-cl)/2,cl),cc*s,cl*s,'cg')); }
  o.push(cotaH(X(0),X(M.C),syTop+M.L*s+6,syTop+M.L*s,mm(M.C),'C'));
  o.push(cotaV(syTop,syTop+M.L*s,fx-6,fx,mm(M.L),'L'));
  if(temLong && M.trav.n>=2){ const e=M.travX[1]-M.travX[0]; o.push(cotaH(X(M.travX[0]+M.trav.b/2),X(M.travX[1]+M.trav.b/2),syTop-3,syTop,mm(e)+' e/e')); }
  if(!temLong && M.pes.n>=2){ const e=M.pesX[1]-M.pesX[0]; o.push(cotaH(X(M.pesX[0]+M.pes.b/2),X(M.pesX[1]+M.pes.b/2),syTop-3,syTop,mm(e)+' e/e')); }
  if(M.rowsY.length>=2){ const y0=M.rowsY[M.rowsY.length-2], y1=M.rowsY[M.rowsY.length-1]; o.push(cotaV(SY(y1+M.pes.h/2,0),SY(y0+M.pes.h/2,0),X(M.C)+6,X(M.C),mm(y1-y0)+' e/e')); }
  o.push(T(X(M.C/2), syTop+M.L*s+12.5, M.placa?'VISTA SUPERIOR (pés por baixo da placa — tracejado)':'VISTA SUPERIOR'+(M.tampo.t>0||M.tampo.tipo==='TELA'?' (tampo omitido — contorno tracejado)':''),'middle','tv'));
  // balões de identificação — coluna à direita de cada vista
  const colB=X(M.C)+16, passoB=6.2; const balF=[];
  if(M.chapas.length && M.tampo.t>0) balF.push([M.placa?'P1':'P5', X(M.C*0.9), Zf(M.zTampo+M.tampo.t/2)]);
  if(temLong) balF.push(['P1', X(M.C*0.93), Zf(M.zLong+M.long.h/2)]);
  balF.push(['P3', X(M.pesX[M.pesX.length-1]+M.pes.b/2), Zf(M.zPe0+M.hp/2)]);
  if(M.base) balF.push(['P4', X(M.C*0.96), Zf(M.hb/2)]);
  if(M.sapT>0) balF.push(['P6', X(M.pesX[M.pesX.length-1]+M.pes.b/2), Zf(M.hb+M.sapT/2)]);
  const yB0=Math.min(Zf(M.H)-2, fyBase+14-passoB*(balF.length-1));
  balF.forEach(([t,x,y],i)=>o.push(bal(x,y,colB,yB0+i*passoB,t)));
  if(temLong){ const j=Math.max(0,M.travX.length-2), xt=X(M.travX[j]+M.trav.b/2);
    const yt = M.trav.sobre || M.longY.length<2 ? SY(M.L/2,0) : SY((M.longY[0]+M.long.b+M.longY[1])/2,0);
    o.push(bal(xt,yt,colB,yt-4,'P2')); }
  if(M.rc && M.rc.comp>0 && temLong){ const a=M.rc.comp/Math.SQRT2/2; o.push(bal(X(M.C-(M.trav.sobre?0:M.trav.b)-a),SY(M.L-M.long.b-a,0),colB,SY(M.L-M.long.b-a,0)+4,'P7')); }

  /* ===== carimbo ===== */
  const lib=p.lib||{}; const previa=!(p.planta && p.planta.hash===hashMedidas(p)); const liberado=!previa;
  const cy=160, ch=26;
  const marca = liberado ? '' : `<text x="${W/2}" y="${HH/2-4}" text-anchor="middle" class="wm" transform="rotate(-18 ${W/2} ${HH/2})">NÃO LIBERADO PARA FABRICAÇÃO</text>`;
  const carimbo=`<rect x="6" y="${cy}" width="${W-12}" height="${ch}" class="cb"/>
    <line x1="64" y1="${cy}" x2="64" y2="${cy+ch}" class="cbl"/><line x1="160" y1="${cy}" x2="160" y2="${cy+ch}" class="cbl"/><line x1="210" y1="${cy}" x2="210" y2="${cy+ch}" class="cbl"/>
    <line x1="64" y1="${cy+13}" x2="${W-6}" y2="${cy+13}" class="cbl"/>
    <text x="9" y="${cy+9}" class="lgA">GRUPO TENDAS</text><text x="9" y="${cy+16.5}" class="lgB">PLENART</text><text x="9" y="${cy+22.5}" class="pq">Central de Conferência · pátio</text>
    <text x="66" y="${cy+4.3}" class="pq">PALETE</text><text x="66" y="${cy+10.5}" class="cv">${esc((p.nome||'').slice(0,46))}</text>
    <text x="66" y="${cy+17.3}" class="pq">CÓDIGO · QTD</text><text x="66" y="${cy+23.5}" class="cv">${esc(p.codigo)} · ${M.q} un</text>
    <text x="112" y="${cy+17.3}" class="pq">PESO ESTIMADO</text><text x="112" y="${cy+23.5}" class="cv">${nf(M.pesoUn,1)} kg/un</text>
    <text x="162" y="${cy+4.3}" class="pq">ESCALA · UNIDADE</text><text x="162" y="${cy+10.5}" class="cv">1:${String(den).replace('.',',')} · mm</text>
    <text x="162" y="${cy+17.3}" class="pq">REV. · DATA</text><text x="162" y="${cy+23.5}" class="cv">${previa?(p.planta?p.planta.rev+1:0)+' (prévia)':p.planta.rev} · ${dataBR(previa?Date.now():p.planta.em)}</text>
    <text x="212" y="${cy+4.3}" class="pq">SITUAÇÃO</text><text x="212" y="${cy+10.5}" class="cv" style="fill:${liberado?'#15803d':'#b91c1c'}">${liberado?'LIBERADO P/ FABRICAÇÃO':previa?'PRÉVIA — CONFERIR':'NÃO LIBERADO'}</text>
    <text x="212" y="${cy+17.3}" class="pq">${liberado?'LIBERADO POR':'DESENHADO POR'}</text><text x="212" y="${cy+23.5}" class="cv">${esc(((liberado?p.planta.por:quem())||'—').slice(0,28))}</text>
    <text x="8" y="${cy-2}" class="pq">Projeção 1º diedro (ABNT). Medidas em mm. Peças P1…P5 e reforços: ver lista de materiais. Linhas tracejadas: peças escondidas${mostrarCarga?' · laranja: carga (referência)':''}.</text>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${HH}" id="svgPlanta">
    <style>
      .pc{fill:#dfe5f5;stroke:#1d2b6b;stroke-width:.3}
      .oco{fill:#fff;stroke:#1d2b6b;stroke-width:.18}
      .oculto{fill:none;stroke:#555;stroke-width:.22;stroke-dasharray:1.2 .8}
      .tp{fill:#f3e6d3;stroke:#7a4b12;stroke-width:.25}
      .tpo{fill:none;stroke:#7a4b12;stroke-width:.22;stroke-dasharray:2.5 1}
      .cg{fill:rgba(245,130,32,.08);stroke:#f58220;stroke-width:.3;stroke-dasharray:2 1}
      .cota line{stroke:#333;stroke-width:.15}
      .cota .tk{stroke-width:.3}
      .tx,.tc,.tv,.tb,.pq,.cv,.tcg,.lgA,.lgB,.wm{font-family:Arial,Helvetica,sans-serif}
      .tc{font-size:2.3px;fill:#111}
      .tv{font-size:2.9px;font-weight:700;fill:#2b3990;letter-spacing:.2px}
      .tcg{font-size:2.2px;fill:#c2410c;font-weight:700}
      .ld{stroke:#2b3990;stroke-width:.2}
      .bl{fill:#fff;stroke:#2b3990;stroke-width:.3}
      .tb{font-size:2.5px;font-weight:700;fill:#2b3990}
      .cb{fill:#fff;stroke:#1d2b6b;stroke-width:.45}
      .cbl{stroke:#1d2b6b;stroke-width:.2}
      .pq{font-size:1.9px;fill:#666}
      .cv{font-size:3px;font-weight:700;fill:#111}
      .lgA{font-size:4.3px;font-weight:800;fill:#2b3990}
      .lgB{font-size:5.4px;font-weight:800;fill:#f58220}
      .tpl{fill:#e9edf7;stroke:#1d2b6b;stroke-width:.35}
      [data-p]{cursor:pointer}
      rect[data-p]:hover,circle[data-p]:hover{fill:#ffd9b3;stroke:#f58220}
      line[data-p]:hover{stroke:#f58220}
      .cl{fill:#1d4ed8;text-decoration:underline}
      rect.sel,circle.sel{fill:#ffc58f!important;stroke:#f58220!important;stroke-width:.5!important}
      line.sel{stroke:#f58220!important} text.sel{fill:#f58220!important;font-weight:700}
      @media print{ rect[data-p]:hover,circle[data-p]:hover{fill:inherit} .cl{fill:#111;text-decoration:none} }
      .sp{fill:#cfd6ea;stroke:#1d2b6b;stroke-width:.25}
      .rcl{stroke:#1d2b6b;stroke-linecap:butt}
      .ol{fill:#fff;stroke:#c2410c;stroke-width:.35}
      .pf circle{fill:#fff;stroke:#111;stroke-width:.22} .pf line{stroke:#111;stroke-width:.18}
      .pf circle.sel{fill:#ffc58f!important;stroke:#f58220!important}
      .nb{fill:#fffaf2;stroke:#f58220;stroke-width:.3}
      .nt{font-size:2.4px;font-weight:800;fill:#c2410c;font-family:Arial,Helvetica,sans-serif}
      .nx{font-size:2.5px;fill:#111;font-family:Arial,Helvetica,sans-serif}
      .wm{font-size:12px;font-weight:800;fill:rgba(185,28,28,.10)}
    </style>
    <rect x="0" y="0" width="${W}" height="${HH}" fill="#fff"/>
    <rect x="3" y="3" width="${W-6}" height="${HH-6}" fill="none" stroke="#1d2b6b" stroke-width=".5"/>
    ${marca}${o.join('')}${carimbo}</svg>`;
}
function baixarSVG(){
  const svg=$('svgPlanta'); if(!svg) return; const p=P[cur];
  const blob=new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n'+svg.outerHTML],{type:'image/svg+xml'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=(p.codigo+'_'+(p.nome||'palete')).replace(/[^\w\-]+/g,'_')+'_rev'+(p.planta?p.planta.rev:0)+'.svg'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

/* ---------- passo 5: liberação ---------- */
function passoLib(p,A){
  if(!A.pronto) return `<div class="aviso a">A liberação só abre depois que todas as medidas estiverem completas e a planta for gerada. Hoje: <b>${ST_NOME[A.st]}</b>.</div><button class="btn" onclick="irPasso('${proximoPasso(p,A)[1]}')">Ir para o próximo passo</button>`;
  if(!A.plantaOk) return `<div class="aviso a">Gere a planta técnica primeiro (passo 4).</div><button class="btn" onclick="irPasso('planta')">Ir para a planta</button>`;
  const l=p.lib; const M=modelo(p); const ver=verificacao(M,+l.capacidade);
  const cg=p.carga||{}; const relH = cg.alt>0 ? (+cg.alt)/Math.min(M.C,M.L) : null;
  if(l.ok) return `<div class="aviso ok" style="font-size:15px">✔ <b>LIBERADO PARA FABRICAÇÃO</b> por <b>${esc(l.resp)}</b> em ${dataBR(l.em)}<br>Capacidade nominal: ${nf(+l.capacidade)} kg${l.empilha?' · empilhamento máx.: '+esc(l.empilha):''}${l.obs?'<br>'+esc(l.obs):''}</div>
    <div class="linha"><button class="btn" onclick="irPasso('planta')">🖨 Ver / imprimir planta</button><button class="btn d" onclick="reabrir()">🔓 Reabrir (cancela a liberação)</button></div>`;
  const ck=(k,tit,txt)=>`<label class="ck ${l[k]?'on':''}"><input type="checkbox" ${l[k]?'checked':''} onchange="setLib('${k}',this.checked,true)"><div><b>${tit}</b><span>${txt}</span></div></label>`;
  return `<div class="aviso i">A fabricação só é liberada depois das <b>4 conferências</b>. Quem libera assina com o nome e responde pelo que marcou.</div>
    <div class="lib">
      ${ck('dim','1. Dimensões conferidas','Comprimento, largura, altura, seções e espessuras conferidos com trena na peça real ou no protótipo, batendo com a planta Rev. '+p.planta.rev+'.')}
      <div class="card"><h3>Capacidade de carga</h3><div class="grade g3">
        <label class="f">Capacidade nominal do palete (kg) *<input type="number" value="${esc(l.capacidade)}" onchange="setLib('capacidade',this.value,true)" placeholder="${cg.peso?'carga informada: '+esc(cg.peso)+' kg':''}"></label>
        <label class="f">Empilhamento máximo (paletes carregados um sobre o outro)<input value="${esc(l.empilha)}" onchange="setLib('empilha',this.value)" placeholder="Ex.: 3 ou não empilha"></label></div>
        ${ver?htmlVerif(ver,M,+l.capacidade):'<div style="font-size:12.5px;color:var(--mut);margin-top:6px">Informe a capacidade para ver a conta indicativa da longarina.</div>'}
        ${cg.peso && +l.capacidade>0 && +cg.peso>+l.capacidade?`<div class="aviso e">A carga informada (${esc(cg.peso)} kg) é maior que a capacidade nominal.</div>`:''}
      </div>
      ${ck('cap','2. Capacidade de carga conferida','A capacidade nominal acima foi verificada (conta de responsável técnico, teste com carga ou histórico de palete igual em uso).')}
      ${ck('est','3. Estabilidade conferida','Pés apoiam no plano, palete não balança, carga não passa da borda e não tomba no transporte/empilhadeira.'+(relH?` Relação altura da carga ÷ menor lado = ${nf(relH,2)}${relH>2?' ⚠ alta':''}.`:''))}
      ${ck('seg','4. Segurança conferida','Soldas/fixações completas, sem rebarba ou canto vivo, abertura do garfo compatível com a empilhadeira/paleteira (altura '+mm(M.hp)+' mm), capacidade identificada no palete.')}
      <div class="grade g2">
        <label class="f">Responsável pela liberação *<input value="${esc(l.resp||quem())}" onchange="setLib('resp',this.value,true)"></label>
        <label class="f">Observação da liberação<input value="${esc(l.obs)}" onchange="setLib('obs',this.value)"></label>
      </div>
      ${(()=>{ const faltam=[]; if(!l.dim)faltam.push('dimensões'); if(!(+l.capacidade>0))faltam.push('capacidade nominal'); if(!l.cap)faltam.push('capacidade conferida'); if(!l.est)faltam.push('estabilidade'); if(!l.seg)faltam.push('segurança'); if(!(l.resp||quem()))faltam.push('responsável'); if(ver&&!ver.semCalc&&!ver.ok) faltam.push('a conta indicativa deu acima do admissível — revise o perfil ou a capacidade');
        return `${faltam.length?`<div class="aviso a">Falta: ${faltam.join(' · ')}</div>`:''}<button class="btn v" style="font-size:16px;padding:14px" ${faltam.length?'disabled':''} onclick="liberar()">🔓 LIBERAR PARA FABRICAÇÃO</button>`; })()}
    </div>`;
}
function setLib(k,v,re){ const p=P[cur]; p.lib=p.lib||{}; p.lib[k]=v; salvar(p,true); if(re){ const y=window.scrollY; render(); window.scrollTo(0,y); } }
function liberar(){
  const p=P[cur]; const l=p.lib; if(!l.resp) l.resp=quem();
  if(!(l.dim&&l.cap&&l.est&&l.seg&&+l.capacidade>0&&l.resp)) return;
  if(!confirm('Confirmar a liberação de '+p.codigo+' para fabricação, em nome de '+l.resp+'?')) return;
  l.ok=true; l.em=Date.now(); salvar(p); render(); toast('🔓 Liberado para fabricação');
}
function reabrir(){ if(!confirm('Reabrir cancela a liberação. Depois de editar, é preciso conferir e liberar de novo (nova revisão). Continuar?')) return; const p=P[cur]; Object.assign(p.lib,{ok:false,dim:false,cap:false,est:false,seg:false,em:0}); p.planta.hash='reaberto'; salvar(p); passo='medidas'; render(); }

/* =================== INÍCIO =================== */
carregarLocal();
pedirQuem(false);
render();
iniciarNuvem();
</script>
