<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Conferência do Produtor · Grupo Tendas Plenart</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --azul:#0B4DA2; --azul-clr:#E8F0FB; --laranja:#F07C00; --verde:#1B8A4B;
    --vermelho:#C0392B; --txt:#16212E; --txt-2:#44545F; --txt-3:#7C8B96;
    --linha:#E2E8EE; --fundo:#F4F7FA; --branco:#fff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--fundo);color:var(--txt);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .topo{background:var(--azul);color:#fff;padding:18px 16px}
  .topo h1{margin:0;font-size:18px;letter-spacing:.3px}
  .topo p{margin:4px 0 0;font-size:13px;opacity:.9}
  .caixa{max-width:720px;margin:0 auto;padding:16px}
  .cartao{background:var(--branco);border:1px solid var(--linha);border-radius:14px;
    margin-bottom:14px;overflow:hidden}
  .cartao__topo{padding:12px 14px;border-bottom:1px solid var(--linha);
    display:flex;justify-content:space-between;align-items:center;gap:10px}
  .cartao__topo h3{margin:0;font-size:15px;color:var(--azul)}
  .cartao__corpo{padding:12px 14px}
  .peq{font-size:13px} .mut{color:var(--txt-3)}
  .abas{display:flex;gap:8px;margin-bottom:14px}
  .aba{flex:1;background:var(--branco);border:1px solid var(--linha);border-radius:12px;
    padding:12px 8px;font-size:14px;font-weight:700;color:var(--txt-2);cursor:pointer}
  .aba.on{border-color:var(--azul);color:var(--azul);background:var(--azul-clr)}
  .item{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--linha)}
  .item:last-child{border-bottom:0}
  .item__n{flex:1;min-width:0}
  .item__n b{display:block;font-size:14px;font-weight:600}
  .entrada{border:1px solid var(--linha);border-radius:10px;padding:10px 12px;font-size:16px;
    width:100%;background:var(--branco);color:var(--txt);min-height:46px}
  .qtd{width:86px;text-align:center;flex:none}
  .btn{border:1px solid var(--linha);background:var(--branco);color:var(--azul);
    border-radius:12px;padding:14px 16px;font-size:15px;font-weight:800;cursor:pointer;width:100%}
  .btn--verde{background:var(--verde);border-color:var(--verde);color:#fff}
  .btn--laranja{background:var(--laranja);border-color:var(--laranja);color:#fff}
  .aviso{display:flex;gap:10px;background:var(--azul-clr);border-radius:12px;padding:12px 14px;
    font-size:13px;color:var(--txt-2);margin-bottom:14px}
  .ok{background:#E7F6EC;color:#14632F}
  .erro{background:#FDECEA;color:#8E2A20}
  .rodape{text-align:center;padding:18px;color:var(--txt-3);font-size:12px}
  .carregando{text-align:center;padding:60px 20px;color:var(--txt-3)}
  .selo{display:inline-block;background:var(--verde);color:#fff;border-radius:999px;
    padding:3px 10px;font-size:12px;font-weight:800}
  /* ---- avaria ---- */
  .item{flex-wrap:wrap}
  .item__acoes{display:flex;gap:8px;align-items:center;flex:none}
  .btn-av{border:1px solid var(--linha);background:var(--branco);color:var(--txt-2);border-radius:10px;
    padding:0 10px;min-height:46px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
  .btn-av.on{background:#FDECEA;border-color:var(--vermelho);color:var(--vermelho)}
  .av{flex-basis:100%;background:#FFF6F5;border:1px solid #F3C9C4;border-radius:12px;padding:10px 12px;margin-top:2px}
  .av__linha{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .av__linha .entrada{min-height:42px;padding:8px 10px}
  .av__rot{font-size:13px;color:var(--vermelho);font-weight:700}
  .fotos{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .foto{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;border:1px solid var(--linha);flex:none}
  .foto img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}
  .foto__x{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;
    background:rgba(0,0,0,.65);color:#fff;font-size:13px;line-height:22px;padding:0;cursor:pointer}
  .btn-foto{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:64px;padding:0 14px;
    border:2px dashed var(--vermelho);border-radius:10px;color:var(--vermelho);font-size:13px;font-weight:800;
    cursor:pointer;background:var(--branco)}
  .btn-foto input{display:none}
  .falta-foto{font-size:12px;color:var(--vermelho);font-weight:700;margin-top:6px}
  .tag{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:800;margin-left:6px;vertical-align:middle}
  .tag--av{background:#FDECEA;color:var(--vermelho)}
  .tag--extra{background:#FFF1E0;color:#A85600}
  [hidden]{display:none!important}
  .q30bloco{border:1px solid var(--linha);border-radius:10px;overflow:hidden;margin-bottom:10px}
  .q30bloco:last-child{margin-bottom:0}
  .q30bloco header{background:var(--azul);color:#fff;font-weight:800;font-size:14px;padding:7px 12px}
  .q30bloco .it{display:flex;justify-content:space-between;gap:10px;padding:6px 12px;border-bottom:1px solid var(--linha);font-size:14px}
  .q30bloco .it:last-of-type{border-bottom:0}
  .q30bloco .it b{font-variant-numeric:tabular-nums}
  .q30bloco footer{display:flex;justify-content:space-between;gap:10px;padding:7px 12px;background:#FFF4E5;color:#A85600;font-weight:800;font-size:13px}
  .tag--terc{background:#EDE7F6;color:#5B3A99}
  .cartao--terc{border:2px solid #B9A5DD}
  .cartao--terc .cartao__topo{background:#F4F0FA}
  .cartao--terc h3{color:#5B3A99}
  .chk-terc{display:flex;gap:8px;align-items:center;margin:0 0 8px;font-size:14px;font-weight:700;color:#5B3A99;cursor:pointer}
  .chk-terc input{width:20px;height:20px}
  /* ---- acrescentar sobra ---- */
  .add{border:2px dashed var(--laranja);border-radius:12px;padding:12px;margin-top:14px;background:#FFFAF4}
  .add h4{margin:0 0 8px;font-size:14px;color:#A85600}
  .add__linha{display:flex;gap:8px}
  .add__linha .entrada{min-height:46px}
  .btn-rm{border:0;background:none;color:var(--txt-3);font-size:12px;text-decoration:underline;padding:0;cursor:pointer}
  /* ---- janelas ---- */
  .modal{position:fixed;inset:0;background:rgba(10,20,35,.55);display:none;align-items:flex-end;justify-content:center;z-index:50;padding:0}
  .modal.on{display:flex}
  .modal__caixa{background:var(--branco);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:20px 16px calc(18px + env(safe-area-inset-bottom));
    max-height:92vh;overflow:auto}
  @media(min-width:600px){.modal{align-items:center}.modal__caixa{border-radius:18px}}
  .modal__caixa h3{margin:0 0 4px;color:var(--azul);font-size:18px}
  .estrelas{display:flex;justify-content:center;gap:6px;margin:16px 0 4px}
  .estrela{border:0;background:none;font-size:42px;line-height:1;cursor:pointer;color:#D5DCE3;padding:2px}
  .estrela.on{color:#F5A300}
  .nota-txt{text-align:center;font-weight:800;min-height:22px;color:var(--txt-2)}
  .foto-grande{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:60;padding:14px}
  .foto-grande.on{display:flex}
  .foto-grande img{max-width:100%;max-height:100%;border-radius:8px}
  button:focus-visible,.entrada:focus-visible,.btn-foto:focus-within{outline:3px solid var(--laranja);outline-offset:2px}
</style>
</head>
<body>

<div class="topo">
  <h1>CONFERÊNCIA DO PRODUTOR</h1>
  <p id="sub">Grupo Tendas Plenart</p>
</div>

<div class="caixa" id="tela">
  <div class="carregando">Abrindo o evento...</div>
</div>

<div class="rodape">Grupo Tendas Plenart · conferência digital · versão 22/09 E</div>

<!-- janela: avaliação do carregamento -->
<div class="modal" id="modal-av" role="dialog" aria-modal="true" aria-labelledby="av-tit">
  <div class="modal__caixa">
    <h3 id="av-tit">⭐ Avalie o carregamento</h3>
    <p class="peq mut" style="margin:0">Como este caminhão chegou? Organização, amarração, material limpo e fácil de descarregar.</p>
    <div class="estrelas" id="estrelas">
      <button class="estrela" data-n="1" aria-label="1 estrela">★</button>
      <button class="estrela" data-n="2" aria-label="2 estrelas">★</button>
      <button class="estrela" data-n="3" aria-label="3 estrelas">★</button>
      <button class="estrela" data-n="4" aria-label="4 estrelas">★</button>
      <button class="estrela" data-n="5" aria-label="5 estrelas">★</button>
    </div>
    <div class="nota-txt" id="nota-txt">Toque nas estrelas</div>
    <label style="display:block;margin-top:12px"><span class="peq mut" id="av-com-rot">Comentário sobre o carregamento (opcional)</span>
      <textarea class="entrada" id="av-com" rows="3" style="resize:vertical;margin-top:4px" placeholder="Ex.: material bem amarrado, veio tudo separado por família"></textarea></label>
    <button class="btn btn--verde" id="av-enviar" style="margin-top:14px">✓ ENVIAR CONFERÊNCIA</button>
    <button class="btn" id="av-cancelar" style="margin-top:8px">Voltar para a conferência</button>
  </div>
</div>

<!-- foto em tela cheia -->
<div class="foto-grande" id="foto-grande"><img alt="Foto da avaria"></div>


<script>
/* ============================================================
   Página EXTERNA do produtor.
   Abre por link com token: produtor.html#TOKEN
   Faz duas coisas: 📥 CHEGADA (o que desceu do caminhão) e
   📦 SOBRA (o que ficou no fim do evento para recolher).
   ============================================================ */
var SUPABASE_URL  = "https://cllylcuhpmwnyebmlelf.supabase.co";
var SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsbHlsY3VocG13bnllYm1sZWxmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3OTA0MTMsImV4cCI6MjEwMzM2NjQxM30.fNnvg23PqzSCgwHzcMw5XdHwYAA6PF3kdffDA9yW4-E";

/* A barra da Vercel (quem está logado na Vercel vê ela no computador) tenta clonar
   os cabeçalhos das chamadas e quebra o envio. Este fetch passa os cabeçalhos
   como objeto simples — o mesmo conserto que a Central já usa. */
function fetchLimpo(recurso, opcoes) {
  opcoes = opcoes || {};
  try {
    if (opcoes.headers && typeof Headers !== 'undefined' && opcoes.headers instanceof Headers) {
      var simples = {};
      opcoes.headers.forEach(function (v, k) { simples[k] = v; });
      var copia = {};
      Object.keys(opcoes).forEach(function (k) { copia[k] = opcoes[k]; });
      copia.headers = simples;
      opcoes = copia;
    }
  } catch (e) { }
  return fetch(recurso, opcoes);
}
var cli = supabase.createClient(SUPABASE_URL, SUPABASE_ANON, { global: { fetch: fetchLimpo } });

/* explica o erro de verdade em vez de sempre culpar a internet */
function motivoErro(e) {
  var m = (e && (e.message || e.msg || e.details)) || String(e || '');
  if (/DataCloneError|could not be cloned|postMessage/i.test(m))
    return 'Uma extensão ou a barra da Vercel do navegador bloqueou o envio. Teste numa janela anônima (Ctrl+Shift+N).';
  if (/Failed to fetch|NetworkError|Load failed/i.test(m))
    return 'Sem conexão com o servidor. Verifique a internet e tente de novo.';
  if (/does not exist|Could not find the table|schema cache/i.test(m))
    return 'A tabela da conferência do produtor não existe no banco. Avise o Grupo Tendas Plenart.\n(' + m + ')';
  if (/row-level security|violates|permission denied/i.test(m))
    return 'O banco bloqueou o envio (permissão). Avise o Grupo Tendas Plenart.\n(' + m + ')';
  if (/too large|payload|413/i.test(m))
    return 'As fotos ficaram pesadas demais para enviar de uma vez. Apague uma ou duas fotos e tente de novo.';
  return 'Não consegui enviar.\nMotivo: ' + m;
}
var tela = document.getElementById('tela');
var token = (location.hash || '').replace('#', '').trim();

var evento = null, itensBase = [], aba = 'chegada', jaFeitas = { chegada: {}, sobra: null };
var cargas = [], cargaSel = null, caminhoes = [], sobraBase = [];
var produtosEv = [], planoPorCg = {};
var areasQ30 = [], areasAbertas = false;

function nomeCam(cg) {
  var c = caminhoes.filter(function (x) { return x.id === cg.caminhao_id; })[0];
  if (!c) return 'caminhão a definir';
  var t = (c.tipo || 'Caminhão') + (c.placa ? ' — ' + c.placa : '');
  var cav = cg.cavalo_id ? caminhoes.filter(function (x) { return x.id === cg.cavalo_id; })[0] : null;
  if (cav) t += ' + cavalo ' + cav.placa;
  return t;
}

function esc(t) {
  return String(t === null || t === undefined ? '' : t)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function num(v) { var n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? 0 : n; }
function fmt(n) { return new Intl.NumberFormat('pt-BR').format(num(n)); }
function fmtData(d) {
  if (!d) return '—';
  var p = String(d).slice(0, 10).split('-');
  return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : d;
}
function erroTela(titulo, texto) {
  tela.innerHTML = '<div class="cartao"><div class="cartao__corpo" style="text-align:center;padding:36px 16px">' +
    '<p style="font-size:38px;margin:0 0 8px">🔒</p><h3 style="margin:0 0 6px">' + esc(titulo) + '</h3>' +
    '<p class="peq mut">' + esc(texto) + '</p></div></div>';
}

if (!token) {
  erroTela('Link incompleto', 'Peça ao Grupo Tendas Plenart o link completo da conferência deste evento.');
} else {
  carregar();
}

var rascPorCg = {};          /* guarda o que o produtor já digitou em cada caminhão */
var notaAv = 0;

function carregar() {
  cli.from('eventos').select('*').eq('token_produtor', token).limit(1)
    .then(function (r) {
      if (r.error) throw r.error;
      evento = (r.data || [])[0];
      if (!evento) {
        return erroTela('Link inválido ou expirado',
          'Esta conferência não está mais disponível. Fale com o Grupo Tendas Plenart.');
      }
      document.getElementById('sub').textContent = evento.nome;
      return Promise.all([
        cli.from('produtos').select('id,nome,unidade,quantidade_prevista,terceirizado').eq('evento_id', evento.id),
        cli.from('carregamentos').select('*').eq('evento_id', evento.id).order('numero'),
        cli.from('conferencias_produtor').select('*').eq('evento_id', evento.id),
        cli.from('caminhoes').select('id,tipo,modelo,placa'),
        cli.from('q30_areas').select('dados').eq('evento_id', evento.id)
          .then(function (r) { return r.error ? [] : (r.data || []); })
          .catch(function () { return []; })
      ]).then(function (rr) {
        produtosEv = (rr[0].data || []);
        caminhoes = (rr[3].data || []);
        areasQ30 = ((rr[4] || [])[0] || {}).dados || [];
        (rr[2].data || []).forEach(function (c) {
          if (c.tipo === 'sobra') jaFeitas.sobra = c;
          else jaFeitas.chegada[c.carregamento_id] = c;
        });
        /* só os carregamentos de SAÍDA (o que vai para o evento) */
        cargas = (rr[1].data || []).filter(function (c) { return (c.sentido || 'saida') === 'saida'; });
        var cgIds = cargas.map(function (c) { return c.id; });
        if (!cgIds.length) { planoPorCg = {}; tercPorCg = {}; sobraBase = montar(produtosEv, {}, false, {}); return desenhar(); }
        return Promise.all([
          cli.from('itens_carregamento').select('carregamento_id,produto_id,quantidade').in('carregamento_id', cgIds),
          carregarTerceirizado()
        ]).then(function (rx) {
            var r3 = rx[0];
            planoPorCg = {};
            var totalEv = {};
            (r3.data || []).forEach(function (pl) {
              var b = planoPorCg[pl.carregamento_id] || (planoPorCg[pl.carregamento_id] = {});
              b[pl.produto_id] = (b[pl.produto_id] || 0) + num(pl.quantidade);
              totalEv[pl.produto_id] = (totalEv[pl.produto_id] || 0) + num(pl.quantidade);
            });
            sobraBase = montar(produtosEv, totalEv, true, tercEv);
            desenhar();
          });
      });
    })
    .catch(function (e) {
      console.error(e);
      erroTela('Não consegui abrir', 'Verifique a internet e tente de novo. Se continuar, avise o Grupo Tendas Plenart.');
    });
}

/* 🔗 terceirizado: o que o conferente marcou como material de fornecedor na SAÍDA
   de cada caminhão. tercPorCg[carregamento][produto] e tercEv[produto] (total). */
var tercPorCg = {}, tercEv = {};
function carregarTerceirizado() {
  tercPorCg = {}; tercEv = {};
  return cli.from('conferencias').select('id,carregamento_id,tipo,finalizada_em').eq('evento_id', evento.id)
    .then(function (r) {
      if (r.error) throw r.error;
      var saidas = (r.data || []).filter(function (c) { return c.tipo === 'saida'; });
      if (!saidas.length) return;
      var cgDe = {};
      saidas.forEach(function (c) { cgDe[c.id] = c.carregamento_id; });
      return cli.from('itens_conferencia').select('conferencia_id,produto_id,quantidade,qtd_terceirizada')
        .in('conferencia_id', Object.keys(cgDe))
        .then(function (r2) {
          if (r2.error) throw r2.error;
          var terc100 = {};
          produtosEv.forEach(function (p) { if (p.terceirizado) terc100[p.id] = true; });
          (r2.data || []).forEach(function (i) {
            var t = num(i.qtd_terceirizada);
            if (terc100[i.produto_id]) t = Math.max(t, num(i.quantidade));
            var cg = cgDe[i.conferencia_id];
            var b = tercPorCg[cg] || (tercPorCg[cg] = {});
            b[i.produto_id] = (b[i.produto_id] || 0) + t;
            tercEv[i.produto_id] = (tercEv[i.produto_id] || 0) + t;
          });
        });
    })
    .catch(function (e) { console.error('terceirizado', e); });   /* sem isso a página abre normal */
}

/* soma por nome: o produtor vê a lista limpa, sem item repetido.
   Separa NOSSO material do TERCEIRIZADO (vão em quadros diferentes). */
function montar(produtos, prev, estrito, terc) {
  terc = terc || {};
  var mapa = {};
  function soma(p, qtd, ehTerc) {
    if (qtd <= 0) return;
    var ch = String(p.nome || '').trim().toUpperCase() + (ehTerc ? '|T' : '');
    var b = mapa[ch] || (mapa[ch] = { nome: p.nome, unidade: p.unidade || 'UN', previsto: 0, terceirizado: ehTerc });
    b.previsto += qtd;
  }
  produtos.forEach(function (p) {
    if (estrito && prev[p.id] === undefined && !terc[p.id]) return;   /* não é deste caminhão */
    var plano = prev[p.id] !== undefined ? prev[p.id] : num(p.quantidade_prevista);
    var t = terc[p.id] !== undefined ? terc[p.id] : (p.terceirizado ? plano : 0);
    var nosso = p.terceirizado ? 0 : Math.max(0, plano - t);
    soma(p, nosso, false);
    soma(p, t, true);
  });
  return Object.keys(mapa).map(function (k) { return mapa[k]; })
    .sort(function (a, b) { return a.nome.localeCompare(b.nome, 'pt-BR'); })
    .map(novoRasc);
}

function qtdNosso() { return itensBase.filter(function (b) { return !b.terceirizado; }).length; }
function qtdTerc() { return itensBase.filter(function (b) { return b.terceirizado; }).length; }

function novoRasc(b) {
  b.qtd = ''; b.avOn = false; b.avQtd = ''; b.avDesc = ''; b.avFotos = [];
  return b;
}

/* ---------- desenho das telas ---------- */
function desenhar() {
  var h = '<div class="abas">' +
      '<button class="aba' + (aba === 'chegada' ? ' on' : '') + '" data-aba="chegada">🚚 Chegada</button>' +
      '<button class="aba' + (aba === 'sobra' ? ' on' : '') + '" data-aba="sobra">📦 Sobra' +
        (jaFeitas.sobra ? ' ✓' : '') + '</button>' +
    '</div>' +
    '<div class="cartao"><div class="cartao__corpo">' +
      '<b>' + esc(evento.nome) + '</b>' +
      '<p class="peq mut" style="margin:4px 0 0">' +
        (evento.cliente ? esc(evento.cliente) + ' · ' : '') +
        (evento.local ? esc(evento.local) + ' · ' : '') + fmtData(evento.data) + '</p>' +
    '</div></div>';

      (cg.observacoes ? '<p class="peq" style="margin:8px 0 0">📝 ' + esc(cg.observacoes) + '</p>' : '') +

  if (feita) {
    var nota = notaDe(feita);
    h += '<div class="aviso ok"><span>✅</span><div><b>Este caminhão já foi conferido.</b><br>' +
      'Recebido em ' + fmtData(feita.finalizada_em) +
      (feita.responsavel ? ' por ' + esc(feita.responsavel) : '') +
      '. Para corrigir, fale com o Grupo Tendas Plenart.</div></div>' +
      (nota ? '<div class="cartao"><div class="cartao__corpo"><b>⭐ Avaliação do carregamento</b>' +

        '</div></div>' : '') +

        '<span class="selo">enviada</span></div><div class="cartao__corpo">' +
      (feita.itens || []).map(function (i2) { return htmlItemFeito(i2, true); }).join('') +
      (feita.observacao ? '<p class="peq" style="margin-top:10px">📝 ' + esc(feita.observacao) + '</p>' : '') +

    tela.innerHTML = h;

      'Peça avariada ou danificada: toque em <b>⚠️ Avaria</b> — a foto é obrigatória.' +

      '<span class="peq mut" id="cont-itens">' + qtdNosso() + ' itens</span></div>' +
    '<div class="cartao__corpo"><div id="lista"></div></div></div>' +

    '<div class="cartao"><div class="cartao__corpo" style="padding-top:2px">' +

      'Depois de enviar, este caminhão trava — correções são feitas pelo Grupo Tendas Plenart.</p>';

  tela.innerHTML = h;
  desenharLista();
  ligarTudo();
}

  });

    (aba === 'sobra' ? 'Nenhum item na lista. Acrescente abaixo o que está voltando.' : 'Nenhum item do nosso material neste caminhão.') + '</p>';

function notaDe(c) { return c && c.avaliacao ? num(c.avaliacao.nota) : 0; }
function estrelasTxt(n) { var s = ''; for (var k = 1; k <= 5; k++) s += k <= n ? '★' : '☆'; return s; }

/* ---------- eventos ---------- */
function ligarTudo() {
  ligarAbas();
  document.querySelectorAll('.js-carga').forEach(function (c) {
    c.addEventListener('click', function () { cargaSel = c.dataset.id; desenhar(); window.scrollTo(0, 0); });
  });
  var volt = document.getElementById('voltar-cargas');
  if (volt) volt.addEventListener('click', function () { cargaSel = null; desenhar(); window.scrollTo(0, 0); });
  var q30t = document.getElementById('q30-topo');
  if (q30t) q30t.addEventListener('click', function () { areasAbertas = !areasAbertas; desenhar(); });
  var env = document.getElementById('enviar');
  if (env) env.addEventListener('click', enviar);
  var addOk = document.getElementById('add-ok');
  if (addOk) addOk.addEventListener('click', acrescentarSobra);
  var addNome = document.getElementById('add-nome');
  if (addNome) addNome.addEventListener('change', function () {
    var p = acharProduto(addNome.value);
    if (p) document.getElementById('add-un').value = p.unidade || 'UN';
    if (p && p.terceirizado) document.getElementById('add-terc').checked = true;
  });
  if (aba === 'sobra' && !jaFeitas.sobra) desenharLista();

  /* fotos em tela cheia (lista editável e já enviada) */
  tela.onclick = function (e) {
    var t = e.target;
    if (t.classList.contains('js-ver')) return verFoto(t.src);
    var i = t.dataset ? t.dataset.i : undefined;
    if (t.classList.contains('js-avtog')) {
      itensBase[i].avOn = !itensBase[i].avOn;
      return desenharLista();
    }
    if (t.classList.contains('js-rmfoto')) {
      itensBase[i].avFotos.splice(num(t.dataset.k), 1);
      return desenharLista();
    }
    if (t.classList.contains('js-rmextra')) {
      itensBase.splice(num(i), 1);
      return desenharLista();
    }
  };
  tela.oninput = function (e) {
    var t = e.target, i = t.dataset ? t.dataset.i : undefined;
    if (i === undefined || !itensBase[i]) return;
    if (t.classList.contains('js-q')) itensBase[i].qtd = t.value;
    if (t.classList.contains('js-avq')) itensBase[i].avQtd = t.value;
    if (t.classList.contains('js-avd')) itensBase[i].avDesc = t.value;
  };
  tela.onchange = function (e) {
    var t = e.target;
    if (!t.classList.contains('js-foto') || !t.files || !t.files.length) return;
    var b = itensBase[t.dataset.i];
    var arqs = Array.prototype.slice.call(t.files);
    var lab = t.parentNode; lab.firstChild.textContent = '⏳ ';
    Promise.all(arqs.map(comprimir)).then(function (fotos) {
      fotos.forEach(function (f) { b.avFotos.push(f); });
      desenharLista();
    }).catch(function (err) {
      console.error(err);
      alert('Não consegui ler a foto. Tente tirar de novo.');
      desenharLista();
    });
  };
}

function ligarAbas() {
  document.querySelectorAll('.aba').forEach(function (b) {
    b.addEventListener('click', function () { aba = b.dataset.aba; cargaSel = null; desenhar(); });
  });
}

function acharProduto(nome) {
  var ch = String(nome || '').trim().toUpperCase();
  return produtosEv.filter(function (p) { return String(p.nome || '').trim().toUpperCase() === ch; })[0];
}

function acrescentarSobra() {
  var nome = (document.getElementById('add-nome').value || '').trim();
  var q = num(document.getElementById('add-qtd').value);
  var un = (document.getElementById('add-un').value || '').trim().toUpperCase() || 'UN';
  if (nome.length < 2) return alert('Escreva o nome do produto.');
  if (q <= 0) return alert('Informe a quantidade que está voltando.');
  var ehTerc = document.getElementById('add-terc').checked;
  var ch = nome.toUpperCase();
  var jaTem = -1;
  itensBase.forEach(function (b, k) {
    if (String(b.nome).trim().toUpperCase() === ch && !!b.terceirizado === ehTerc) jaTem = k;
  });
  if (jaTem >= 0) {
    itensBase[jaTem].qtd = String(num(itensBase[jaTem].qtd) + q);
  } else {
    var p = acharProduto(nome);
    itensBase.push(novoRasc({ nome: p ? p.nome : nome.toUpperCase(), unidade: p ? (p.unidade || un) : un, previsto: 0, extra: true, terceirizado: ehTerc }));
    itensBase[itensBase.length - 1].qtd = String(q);
  }
  document.getElementById('add-nome').value = '';
  document.getElementById('add-qtd').value = '';
  document.getElementById('add-un').value = '';
  document.getElementById('add-terc').checked = false;
  if (ehTerc) {
    var bl = document.getElementById('bloco-terc');
    setTimeout(function () { if (bl && bl.scrollIntoView) bl.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 50);
  }
  desenharLista();
}

/* reduz a foto do celular para não pesar (máx. 1280px, JPEG) */
function comprimir(arq) {
  return new Promise(function (ok, falha) {
    var fr = new FileReader();
    fr.onerror = falha;
    fr.onload = function () {
      var img = new Image();
      img.onerror = falha;
      img.onload = function () {
        var max = 1280, w = img.width, h = img.height;
        if (Math.max(w, h) > max) { var k = max / Math.max(w, h); w = Math.round(w * k); h = Math.round(h * k); }
        var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        ok(cv.toDataURL('image/jpeg', 0.7));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(arq);
  });
}

function verFoto(src) {
  var fg = document.getElementById('foto-grande');
  fg.querySelector('img').src = src;
  fg.classList.add('on');
}
document.getElementById('foto-grande').addEventListener('click', function () { this.classList.remove('on'); });

/* ---------- envio ---------- */
function montarEnvio() {
  var resp = (document.getElementById('resp').value || '').trim();
  if (resp.length < 3) { alert('Escreva o nome de quem está conferindo.'); return null; }

  var itens = [], algum = 0, erro = null, avTot = 0;
  itensBase.forEach(function (b) {
    if (erro) return;
    var q = num(b.qtd);
    var it = { nome: b.nome, unidade: b.unidade, previsto: b.previsto, qtd: q };
    if (b.extra) it.extra = true;
    if (b.terceirizado) it.terceirizado = true;
    if (b.avOn) {
      var aq = num(b.avQtd);
      if (aq <= 0) { erro = b.nome + ': informe quantas peças estão avariadas (ou desmarque a avaria).'; return; }
      if (q > 0 && aq > q) { erro = b.nome + ': avariadas (' + fmt(aq) + ') não pode ser maior que a quantidade (' + fmt(q) + ').'; return; }
      if (q <= 0) { erro = b.nome + ': informe a quantidade total do item, incluindo as avariadas.'; return; }
      if (!b.avFotos.length) { erro = b.nome + ': a FOTO da avaria é obrigatória.'; return; }
      it.avaria = { qtd: aq, descricao: (b.avDesc || '').trim() || null, fotos: b.avFotos.slice() };
      avTot += aq;
    }
    itens.push(it);
    algum += q;
  });
  if (erro) { alert(erro); return null; }

  return {
    reg: {
      evento_id: evento.id,
      carregamento_id: aba === 'chegada' ? cargaSel : null,
      tipo: aba,
      responsavel: resp,
      itens: itens,
      observacao: (document.getElementById('obs').value || '').trim() || null,
      qtd_avarias: avTot,
      status: 'Finalizado'
    },
    algum: algum
  };
}

var envioPendente = null;

function enviar() {
  var m = montarEnvio();
  if (!m) return;
  if (aba === 'chegada' && m.algum === 0 &&
      !confirm('Nenhuma quantidade foi informada. Finalizar mesmo assim?')) return;
  if (aba === 'chegada') {
    envioPendente = m.reg;
    abrirAvaliacao();
    return;
  }
  var bt = document.getElementById('enviar');
  gravar(m.reg, bt);
}

function abrirAvaliacao() {
  notaAv = 0;
  document.getElementById('av-com').value = '';
  pintarEstrelas();
  document.getElementById('modal-av').classList.add('on');
}
function fecharAvaliacao() { document.getElementById('modal-av').classList.remove('on'); }

var NOTAS = ['', 'Péssimo', 'Ruim', 'Regular', 'Bom', 'Ótimo'];
function pintarEstrelas() {
  document.querySelectorAll('.estrela').forEach(function (s) {
    s.classList.toggle('on', num(s.dataset.n) <= notaAv);
  });
  document.getElementById('nota-txt').textContent = notaAv ? NOTAS[notaAv] : 'Toque nas estrelas';
  document.getElementById('av-com-rot').textContent = notaAv && notaAv <= 2
    ? 'O que estava ruim no carregamento? *' : 'Comentário sobre o carregamento (opcional)';
}
document.querySelectorAll('.estrela').forEach(function (s) {
  s.addEventListener('click', function () { notaAv = num(s.dataset.n); pintarEstrelas(); });
});
document.getElementById('av-cancelar').addEventListener('click', fecharAvaliacao);
document.getElementById('av-enviar').addEventListener('click', function () {
  if (!envioPendente) return fecharAvaliacao();
  if (!notaAv) return alert('Dê uma nota de 1 a 5 estrelas para o carregamento.');
  var com = (document.getElementById('av-com').value || '').trim();
  if (notaAv <= 2 && com.length < 3) return alert('Conte o que estava ruim no carregamento.');
  envioPendente.avaliacao = { nota: notaAv, comentario: com || null, por: envioPendente.responsavel, em: new Date().toISOString() };
  gravar(envioPendente, this);
});

function gravar(reg, bt) {
  var rotulo = bt.textContent;
  bt.disabled = true; bt.textContent = 'Enviando...';
  reg.finalizada_em = new Date().toISOString();

  function inserir(dados) { return cli.from('conferencias_produtor').insert(dados).select(); }

  inserir(reg)
    .then(function (r) {
      /* coluna qtd_avarias ainda não criada no banco: envia sem ela (o aviso do painel fica sem esse registro) */
      if (r.error && /qtd_avarias/i.test(r.error.message || '')) {
        var semAv = {}; Object.keys(reg).forEach(function (k) { if (k !== 'qtd_avarias') semAv[k] = reg[k]; });
        return inserir(semAv).then(function (rx) {
          if (rx.error) throw rx.error;
          return (rx.data || [])[0] || semAv;
        });
      }
      /* se a coluna "avaliacao" ainda não existir no banco, grava a nota dentro da observação */
      if (r.error && reg.avaliacao && /avaliacao/i.test(r.error.message || '')) {
        var copia = {}; Object.keys(reg).forEach(function (k) { if (k !== 'avaliacao') copia[k] = reg[k]; });
        var a = reg.avaliacao;
        copia.observacao = '⭐ AVALIAÇÃO DO CARREGAMENTO: ' + a.nota + '/5' + (a.comentario ? ' — ' + a.comentario : '') +
          (reg.observacao ? '\n' + reg.observacao : '');
        return inserir(copia).then(function (r2) {
          if (r2.error) throw r2.error;
          var n = (r2.data || [])[0] || copia; n.avaliacao = a; return n;
        });
      }
      if (r.error) throw r.error;
      return (r.data || [])[0] || reg;
    })
    .then(function (novo) {
      bt.disabled = false; bt.textContent = rotulo;
      fecharAvaliacao();
      envioPendente = null;
      if (reg.tipo === 'chegada') { jaFeitas.chegada[reg.carregamento_id] = novo; delete rascPorCg[reg.carregamento_id]; }
      else jaFeitas.sobra = novo;
      desenhar();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    })
    .catch(function (e) {
      console.error(e);
      bt.disabled = false; bt.textContent = rotulo;
      alert(motivoErro(e));
    });
}
</script>
