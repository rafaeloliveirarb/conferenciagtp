<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Conferência do Produtor · Grupo Tendas Plenart</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --azul:#0B4DA2; --azul-clr:#E8F0FB; --laranja:#F07C00; --verde:#1B8A4B;
    --vermelho:#C0392B; --txt:#16212E; --txt-2:#44545F; --txt-3:#7C8B96;
    --linha:#E2E8EE; --fundo:#F4F7FA; --branco:#fff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--fundo);color:var(--txt);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .topo{background:var(--azul);color:#fff;padding:18px 16px}
  .topo h1{margin:0;font-size:18px;letter-spacing:.3px}
  .topo p{margin:4px 0 0;font-size:13px;opacity:.9}
  .caixa{max-width:720px;margin:0 auto;padding:16px}
  .cartao{background:var(--branco);border:1px solid var(--linha);border-radius:14px;
    margin-bottom:14px;overflow:hidden}
  .cartao__topo{padding:12px 14px;border-bottom:1px solid var(--linha);
    display:flex;justify-content:space-between;align-items:center;gap:10px}
  .cartao__topo h3{margin:0;font-size:15px;color:var(--azul)}
  .cartao__corpo{padding:12px 14px}
  .peq{font-size:13px} .mut{color:var(--txt-3)}
  .abas{display:flex;gap:8px;margin-bottom:14px}
  .aba{flex:1;background:var(--branco);border:1px solid var(--linha);border-radius:12px;
    padding:12px 8px;font-size:14px;font-weight:700;color:var(--txt-2);cursor:pointer}
  .aba.on{border-color:var(--azul);color:var(--azul);background:var(--azul-clr)}
  .item{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--linha)}
  .item:last-child{border-bottom:0}
  .item__n{flex:1;min-width:0}
  .item__n b{display:block;font-size:14px;font-weight:600}
  .entrada{border:1px solid var(--linha);border-radius:10px;padding:10px 12px;font-size:16px;
    width:100%;background:var(--branco);color:var(--txt);min-height:46px}
  .qtd{width:86px;text-align:center;flex:none}
  .btn{border:1px solid var(--linha);background:var(--branco);color:var(--azul);
    border-radius:12px;padding:14px 16px;font-size:15px;font-weight:800;cursor:pointer;width:100%}
  .btn--verde{background:var(--verde);border-color:var(--verde);color:#fff}
  .btn--laranja{background:var(--laranja);border-color:var(--laranja);color:#fff}
  .aviso{display:flex;gap:10px;background:var(--azul-clr);border-radius:12px;padding:12px 14px;
    font-size:13px;color:var(--txt-2);margin-bottom:14px}
  .ok{background:#E7F6EC;color:#14632F}
  .erro{background:#FDECEA;color:#8E2A20}
  .rodape{text-align:center;padding:18px;color:var(--txt-3);font-size:12px}
  .carregando{text-align:center;padding:60px 20px;color:var(--txt-3)}
  .selo{display:inline-block;background:var(--verde);color:#fff;border-radius:999px;
    padding:3px 10px;font-size:12px;font-weight:800}
</style>
</head>
<body>

<div class="topo">
  <h1>CONFERÊNCIA DO PRODUTOR</h1>
  <p id="sub">Grupo Tendas Plenart</p>
</div>

<div class="caixa" id="tela">
  <div class="carregando">Abrindo o evento...</div>
</div>

<div class="rodape">Grupo Tendas Plenart · conferência digital</div>

<script>
/* ============================================================
   Página EXTERNA do produtor.
   Abre por link com token: produtor.html#TOKEN
   Faz duas coisas: 📥 CHEGADA (o que desceu do caminhão) e
   📦 SOBRA (o que ficou no fim do evento para recolher).
   ============================================================ */
var SUPABASE_URL  = "https://cllylcuhpmwnyebmlelf.supabase.co";
var SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsbHlsY3VocG13bnllYm1sZWxmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3OTA0MTMsImV4cCI6MjEwMzM2NjQxM30.fNnvg23PqzSCgwHzcMw5XdHwYAA6PF3kdffDA9yW4-E";

var cli = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
var tela = document.getElementById('tela');
var token = (location.hash || '').replace('#', '').trim();

var evento = null, itensBase = [], aba = 'chegada', jaFeitas = { chegada: {}, sobra: null };
var cargas = [], cargaSel = null, caminhoes = [], sobraBase = [];
var produtosEv = [], planoPorCg = {};

function nomeCam(cg) {
  var c = caminhoes.filter(function (x) { return x.id === cg.caminhao_id; })[0];
  if (!c) return 'caminhão a definir';
  var t = (c.tipo || 'Caminhão') + (c.placa ? ' — ' + c.placa : '');
  var cav = cg.cavalo_id ? caminhoes.filter(function (x) { return x.id === cg.cavalo_id; })[0] : null;
  if (cav) t += ' + cavalo ' + cav.placa;
  return t;
}

function esc(t) {
  return String(t === null || t === undefined ? '' : t)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function num(v) { var n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? 0 : n; }
function fmt(n) { return new Intl.NumberFormat('pt-BR').format(num(n)); }
function fmtData(d) {
  if (!d) return '—';
  var p = String(d).slice(0, 10).split('-');
  return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : d;
}
function erroTela(titulo, texto) {
  tela.innerHTML = '<div class="cartao"><div class="cartao__corpo" style="text-align:center;padding:36px 16px">' +
    '<p style="font-size:38px;margin:0 0 8px">🔒</p><h3 style="margin:0 0 6px">' + esc(titulo) + '</h3>' +
    '<p class="peq mut">' + esc(texto) + '</p></div></div>';
}

if (!token) {
  erroTela('Link incompleto', 'Peça ao Grupo Tendas Plenart o link completo da conferência deste evento.');
} else {
  carregar();
}

function carregar() {
  cli.from('eventos').select('*').eq('token_produtor', token).limit(1)
    .then(function (r) {
      if (r.error) throw r.error;
      evento = (r.data || [])[0];
      if (!evento) {
        return erroTela('Link inválido ou expirado',
          'Esta conferência não está mais disponível. Fale com o Grupo Tendas Plenart.');
      }
      document.getElementById('sub').textContent = evento.nome;
      return Promise.all([
        cli.from('produtos').select('id,nome,unidade,quantidade_prevista').eq('evento_id', evento.id),
        cli.from('carregamentos').select('*').eq('evento_id', evento.id).order('numero'),
        cli.from('conferencias_produtor').select('*').eq('evento_id', evento.id),
        cli.from('caminhoes').select('id,tipo,modelo,placa')
      ]).then(function (rr) {
        produtosEv = (rr[0].data || []);
        caminhoes = (rr[3].data || []);
        (rr[2].data || []).forEach(function (c) {
          if (c.tipo === 'sobra') jaFeitas.sobra = c;
          else jaFeitas.chegada[c.carregamento_id] = c;
        });
        /* só os carregamentos de SAÍDA (o que vai para o evento) */
        cargas = (rr[1].data || []).filter(function (c) { return (c.sentido || 'saida') === 'saida'; });
        var cgIds = cargas.map(function (c) { return c.id; });
        if (!cgIds.length) { planoPorCg = {}; sobraBase = montar(produtosEv, {}); return desenhar(); }
        return cli.from('itens_carregamento').select('carregamento_id,produto_id,quantidade').in('carregamento_id', cgIds)
          .then(function (r3) {
            planoPorCg = {};
            var totalEv = {};
            (r3.data || []).forEach(function (pl) {
              var b = planoPorCg[pl.carregamento_id] || (planoPorCg[pl.carregamento_id] = {});
              b[pl.produto_id] = (b[pl.produto_id] || 0) + num(pl.quantidade);
              totalEv[pl.produto_id] = (totalEv[pl.produto_id] || 0) + num(pl.quantidade);
            });
            sobraBase = montar(produtosEv, totalEv, true);
            desenhar();
          });
      });
    })
    .catch(function (e) {
      console.error(e);
      erroTela('Não consegui abrir', 'Verifique a internet e tente de novo. Se continuar, avise o Grupo Tendas Plenart.');
    });
}

/* soma por nome: o produtor vê a lista limpa, sem item repetido */
function montar(produtos, prev, estrito) {
  var mapa = {};
  produtos.forEach(function (p) {
    if (estrito && prev[p.id] === undefined) return;   /* não é deste caminhão */
    var ch = String(p.nome || '').trim().toUpperCase();
    var b = mapa[ch] || (mapa[ch] = { nome: p.nome, unidade: p.unidade || 'UN', previsto: 0 });
    b.previsto += prev[p.id] !== undefined ? prev[p.id] : num(p.quantidade_prevista);
  });
  return Object.keys(mapa).map(function (k) { return mapa[k]; })
    .filter(function (b) { return b.previsto > 0; })
    .sort(function (a, b) { return a.nome.localeCompare(b.nome, 'pt-BR'); });
}

function desenhar() {
  var h = '<div class="abas">' +
      '<button class="aba' + (aba === 'chegada' ? ' on' : '') + '" data-aba="chegada">🚚 Chegada</button>' +
      '<button class="aba' + (aba === 'sobra' ? ' on' : '') + '" data-aba="sobra">📦 Sobra' +
        (jaFeitas.sobra ? ' ✓' : '') + '</button>' +
    '</div>' +
    '<div class="cartao"><div class="cartao__corpo">' +
      '<b>' + esc(evento.nome) + '</b>' +
      '<p class="peq mut" style="margin:4px 0 0">' +
        (evento.cliente ? esc(evento.cliente) + ' · ' : '') +
        (evento.local ? esc(evento.local) + ' · ' : '') + fmtData(evento.data) + '</p>' +
    '</div></div>';

  if (aba === 'sobra') { tela.innerHTML = h + telaSobra(); return ligarTudo(); }

  /* 1) nenhum caminhão escolhido: lista os caminhões do evento */
  if (!cargaSel) {
    h += '<div class="aviso"><span>ℹ️</span><div><b>Confira caminhão por caminhão.</b> ' +
      'Toque no caminhão que acabou de chegar e confira só o que veio nele. ' +
      'Chegando outro depois, você confere ele também.</div></div>';
    if (!cargas.length) {
      h += '<div class="cartao"><div class="cartao__corpo" style="text-align:center;padding:30px 12px">' +
        '<p class="mut">Nenhum carregamento lançado ainda. Tente mais tarde.</p></div></div>';
    } else {
      h += cargas.map(function (cg) {
        var feita = jaFeitas.chegada[cg.id];
        var plano = planoPorCg[cg.id] || {};
        var qtdItens = Object.keys(plano).length;
        return '<div class="cartao js-carga" data-id="' + cg.id + '" style="cursor:pointer">' +
          '<div class="cartao__corpo" style="display:flex;gap:12px;align-items:center">' +
            '<span style="font-size:26px">' + (feita ? '✅' : '🚚') + '</span>' +
            '<span style="flex:1;min-width:0">' +
              '<b>Carregamento ' + cg.numero + (cg.nome ? ' · ' + esc(cg.nome) : '') + '</b>' +
              '<span class="peq mut" style="display:block">' + esc(nomeCam(cg)) + '</span>' +
              '<span class="peq" style="display:block;color:' + (feita ? 'var(--verde)' : 'var(--laranja)') + ';font-weight:700">' +
                (feita ? 'conferido por ' + esc(feita.responsavel || '—') : qtdItens + ' itens para conferir') +
              '</span>' +
            '</span><span class="mut">›</span>' +
          '</div></div>';
      }).join('');
    }
    tela.innerHTML = h;
    return ligarTudo();
  }

  /* 2) caminhão escolhido */
  var cg = cargas.filter(function (c) { return c.id === cargaSel; })[0];
  var feita = jaFeitas.chegada[cargaSel];
  itensBase = montar(produtosEv, planoPorCg[cargaSel] || {}, true);

  h += '<button class="btn" id="voltar-cargas" style="margin-bottom:12px">‹ VER OS OUTROS CAMINHÕES</button>' +
    '<div class="cartao"><div class="cartao__corpo">' +
      '<b>Carregamento ' + cg.numero + (cg.nome ? ' · ' + esc(cg.nome) : '') + '</b>' +
      '<p class="peq mut" style="margin:2px 0 0">' + esc(nomeCam(cg)) + '</p>' +
      (cg.observacoes ? '<p class="peq" style="margin:8px 0 0">📝 ' + esc(cg.observacoes) + '</p>' : '') +
    '</div></div>';

  if (feita) {
    h += '<div class="aviso ok"><span>✅</span><div><b>Este caminhão já foi conferido.</b><br>' +
      'Recebido em ' + fmtData(feita.finalizada_em) +
      (feita.responsavel ? ' por ' + esc(feita.responsavel) : '') +
      '. Para corrigir, fale com o Grupo Tendas Plenart.</div></div>' +
      '<div class="cartao"><div class="cartao__topo"><h3>📥 O que você confirmou</h3>' +
        '<span class="selo">enviada</span></div><div class="cartao__corpo">' +
      (feita.itens || []).map(function (i2) {
        return '<div class="item"><span class="item__n"><b>' + esc(i2.nome) + '</b>' +
          '<span class="peq mut">enviado ' + fmt(i2.previsto) + '</span></span>' +
          '<b style="' + (num(i2.qtd) !== num(i2.previsto) ? 'color:var(--laranja)' : '') + '">' +
            fmt(i2.qtd) + ' ' + esc(i2.unidade || 'UN') + '</b></div>';
      }).join('') +
      (feita.observacao ? '<p class="peq" style="margin-top:10px">📝 ' + esc(feita.observacao) + '</p>' : '') +
      '</div></div>';
    tela.innerHTML = h;
    return ligarTudo();
  }

  h += '<div class="aviso"><span>ℹ️</span><div><b>Confira o que desceu deste caminhão.</b> ' +
      'Ajuste a quantidade se vier diferente. O que não chegou, deixe zerado.</div></div>' +
    '<div class="cartao"><div class="cartao__topo"><h3>📥 Chegou neste caminhão</h3>' +
      '<span class="peq mut">' + itensBase.length + ' itens</span></div>' +
    '<div class="cartao__corpo">' +
      '<button class="btn" id="tudo-ok" style="margin-bottom:12px">✓ CHEGOU TUDO CERTO</button>' +
      itensBase.map(function (b, i2) {
        return '<div class="item">' +
          '<span class="item__n"><b>' + esc(b.nome) + '</b>' +
            '<span class="peq mut">enviado: ' + fmt(b.previsto) + ' ' + esc(b.unidade) + '</span></span>' +
          '<input class="entrada qtd js-q" data-i="' + i2 + '" type="number" inputmode="numeric" min="0" placeholder="0">' +
        '</div>';
      }).join('') +
      campoObsNome('Ex.: 2 placas riscadas; faltou 1 caixa de cavilha') +
    '</div></div>' +
    '<button class="btn btn--verde" id="enviar">✓ ENVIAR CONFERÊNCIA DESTE CAMINHÃO</button>' +
    '<p class="peq mut" style="text-align:center;margin-top:10px">Depois de enviar, este caminhão trava. ' +
      'Correções são feitas pelo Grupo Tendas Plenart.</p>';

  tela.innerHTML = h;
  ligarTudo();
}

function campoObsNome(ph) {
  return '<label style="display:block;margin-top:14px"><span class="peq mut">📝 Observações (opcional)</span>' +
      '<textarea class="entrada" id="obs" rows="3" style="resize:vertical;margin-top:4px" placeholder="' + ph + '"></textarea></label>' +
    '<label style="display:block;margin-top:12px"><span class="peq mut">Seu nome (quem está conferindo) *</span>' +
      '<input class="entrada" id="resp" style="margin-top:4px" placeholder="Nome de quem confere"></label>';
}

function telaSobra() {
  var feita = jaFeitas.sobra;
  if (feita) {
    return '<div class="aviso ok"><span>✅</span><div><b>Sobra enviada.</b><br>' +
      'Em ' + fmtData(feita.finalizada_em) + (feita.responsavel ? ' por ' + esc(feita.responsavel) : '') + '.</div></div>' +
      '<div class="cartao"><div class="cartao__topo"><h3>📦 A sobra que você declarou</h3>' +
        '<span class="selo">enviada</span></div><div class="cartao__corpo">' +
      ((feita.itens || []).filter(function (i) { return num(i.qtd) > 0; }).map(function (i) {
        return '<div class="item"><span class="item__n"><b>' + esc(i.nome) + '</b></span>' +
          '<b>' + fmt(i.qtd) + ' ' + esc(i.unidade || 'UN') + '</b></div>';
      }).join('') || '<p class="peq mut">Nenhuma sobra declarada.</p>') +
      (feita.observacao ? '<p class="peq" style="margin-top:10px">📝 ' + esc(feita.observacao) + '</p>' : '') +
      '</div></div>';
  }
  itensBase = sobraBase;
  if (!itensBase.length) {
    return '<div class="cartao"><div class="cartao__corpo" style="text-align:center;padding:30px 12px">' +
      '<p class="mut">A lista de material ainda não foi lançada.</p></div></div>';
  }
  return '<div class="aviso"><span>ℹ️</span><div><b>Sobra do evento.</b> No fim do evento, informe o que ficou ' +
      'sobrando para o Grupo Tendas Plenart recolher — é o total do evento, não precisa separar por caminhão. ' +
      'Item todo usado ou já devolvido, deixe zerado.</div></div>' +
    '<div class="cartao"><div class="cartao__topo"><h3>📦 Ficou sobrando</h3>' +
      '<span class="peq mut">' + itensBase.length + ' itens</span></div><div class="cartao__corpo">' +
      itensBase.map(function (b, i) {
        return '<div class="item"><span class="item__n"><b>' + esc(b.nome) + '</b>' +
          '<span class="peq mut">' + esc(b.unidade) + '</span></span>' +
          '<input class="entrada qtd js-q" data-i="' + i + '" type="number" inputmode="numeric" min="0" placeholder="0">' +
        '</div>';
      }).join('') +
      campoObsNome('Ex.: material empilhado no portão 3') +
    '</div></div>' +
    '<button class="btn btn--laranja" id="enviar">📦 ENVIAR A SOBRA</button>';
}

function ligarTudo() {
  ligarAbas();
  document.querySelectorAll('.js-carga').forEach(function (c) {
    c.addEventListener('click', function () { cargaSel = c.dataset.id; desenhar(); window.scrollTo(0, 0); });
  });
  var volt = document.getElementById('voltar-cargas');
  if (volt) volt.addEventListener('click', function () { cargaSel = null; desenhar(); window.scrollTo(0, 0); });
  var btnTudo = document.getElementById('tudo-ok');
  if (btnTudo) btnTudo.addEventListener('click', function () {
    document.querySelectorAll('.js-q').forEach(function (c) { c.value = itensBase[c.dataset.i].previsto; });
  });
  var env = document.getElementById('enviar');
  if (env) env.addEventListener('click', enviar);
}

function ligarAbas() {
  document.querySelectorAll('.aba').forEach(function (b) {
    b.addEventListener('click', function () { aba = b.dataset.aba; cargaSel = null; desenhar(); });
  });
}

function enviar() {
  var resp = (document.getElementById('resp').value || '').trim();
  if (resp.length < 3) return alert('Escreva o nome de quem está conferindo.');

  var itens = [], algum = 0;
  document.querySelectorAll('.js-q').forEach(function (c) {
    var b = itensBase[c.dataset.i];
    var q = num(c.value);
    itens.push({ nome: b.nome, unidade: b.unidade, previsto: b.previsto, qtd: q });
    algum += q;
  });
  if (aba === 'chegada' && algum === 0 &&
      !confirm('Nenhuma quantidade foi informada. Enviar mesmo assim?')) return;

  var bt = document.getElementById('enviar');
  var rotulo = bt.textContent;
  bt.disabled = true; bt.textContent = 'Enviando...';

  var reg = {
    evento_id: evento.id,
    carregamento_id: aba === 'chegada' ? cargaSel : null,
    tipo: aba,
    responsavel: resp,
    itens: itens,
    observacao: (document.getElementById('obs').value || '').trim() || null,
    status: 'Finalizado',
    finalizada_em: new Date().toISOString()
  };

  cli.from('conferencias_produtor').insert(reg).select()
    .then(function (r) {
      if (r.error) throw r.error;
      var novo = (r.data || [])[0] || reg;
      if (aba === 'chegada') jaFeitas.chegada[cargaSel] = novo;
      else jaFeitas.sobra = novo;
      desenhar();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    })
    .catch(function (e) {
      console.error(e);
      bt.disabled = false; bt.textContent = rotulo;
      alert('Não consegui enviar. Verifique a internet e tente de novo.');
    });
}
</script>
</body>
</html>
