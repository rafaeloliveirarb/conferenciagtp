<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B4F9E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icone-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Conferência GTP">
<title>Central de Conferência — Gestão de Mercadorias para Eventos</title>

<!-- Bibliotecas externas (precisam de internet na primeira vez) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<link rel="stylesheet" href="app.css?v=ad623283e6">
</head>
<body>

<!-- ============ TELA INICIAL ============ -->
<section id="tela-inicio" class="inicio">
  <div class="inicio__marca" aria-hidden="true">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
    </svg>
  </div>
  <h1>CENTRAL DE CONFERÊNCIA</h1>
  <p class="inicio__sub">Gestão de Mercadorias para Eventos</p>

  <button class="btn btn--gg btn--bloco" id="btn-coordenador">COORDENADOR</button>
  <button class="btn btn--gg btn--bloco btn--laranja" id="btn-conferente">CONFERENTE</button>
  <button class="btn btn--gg btn--bloco btn--verde" id="btn-encarregado">ENCARREGADO</button>
  <button class="btn btn--bloco btn--branco" id="btn-instalar" hidden style="margin-top:6px">📲 INSTALAR O APP NESTE APARELHO</button>

  <p class="inicio__rodape" id="rodape-versao">Versão 1.0</p>
</section>

<!-- ============ APLICATIVO ============ -->
<div id="app" hidden>
  <header class="topo">
    <button class="topo__voltar" id="topo-voltar" hidden aria-label="Voltar">&#8592;</button>
    <div class="topo__txt">
      <h1 id="topo-titulo">Painel</h1>
      <p id="topo-sub"></p>
    </div>
    <span id="ao-vivo" hidden title="Atualiza sozinho quando alguém mexe em outro aparelho" style="font-size:11px;font-weight:800;color:#fff;background:rgba(255,255,255,.18);border-radius:999px;padding:3px 9px;margin-right:8px;white-space:nowrap">🟢 AO VIVO</span>
    <button class="topo__sair" id="topo-sair">Sair</button>
  </header>
  <main class="tela" id="tela"></main>
  <div class="offline" id="aviso-offline" hidden>📴 Sem internet — pode continuar contando: a contagem fica guardada neste aparelho. Salve quando a conexão voltar.</div>
</div>

<div id="modais"></div>
<div id="avisos" class="avisos" aria-live="polite"></div>
<div id="impressao" class="impressao" hidden></div>

<!-- ============================================================
     ⚙️  CONFIGURAÇÃO — COLE AQUI OS DADOS DO SEU SUPABASE
     ============================================================
     Troque apenas o que está entre as aspas.
     Não apague as aspas nem o ponto e vírgula do final.
     ============================================================ -->
<script src="app.js?v=2f2a472a3a"></script>


</body>
</html>
