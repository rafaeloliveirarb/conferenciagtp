/* Pede a senha do coordenador e devolve Promise<boolean>.
   Usada para desbloquear conferências finalizadas. */
function pedirSenhaCoordenador(titulo, texto) {
  return new Promise(function (resolve) {
    var m = U.modal({
      titulo: titulo || 'Senha do coordenador',
      html: (texto ? '<p class="mut peq" style="margin-bottom:12px">' + texto + '</p>' : '') +
        '<label class="campo"><span class="campo__rot">Digite a senha</span>' +
        '<input class="entrada" id="senha-desbloq" type="password" inputmode="numeric" ' +
        'placeholder="••••••" style="text-align:center;font-size:24px;letter-spacing:6px"></label>' +
        '<p id="senha-desbloq-erro" class="aviso aviso--vermelho" hidden></p>',
      pe: '<button class="btn btn--branco" data-x>Cancelar</button>' +
          '<button class="btn btn--laranja" data-ok>CONFIRMAR</button>',
      travado: true
    });
    var campo = U.$('#senha-desbloq', m);
    campo.focus();

    function tentar() {
      if (campo.value.trim() !== SENHA_COORDENADOR) {
        var erro = U.$('#senha-desbloq-erro', m);
        erro.textContent = 'Senha incorreta. Tente de novo.';
        erro.hidden = false;
        campo.value = '';
        campo.focus();
        return;
      }
      m.fechar();
      resolve(true);
    }
    m.querySelector('[data-x]').addEventListener('click', function () { m.fechar(); resolve(false); });
    m.querySelector('[data-ok]').addEventListener('click', tentar);
    campo.addEventListener('keydown', function (e) { if (e.key === 'Enter') tentar(); });
  });
}

function classeDif(dif) {
  if (dif === null || dif === undefined) return '';
  if (dif === 0) return 'dif-ok';
  return dif < 0 ? 'dif-menos' : 'dif-mais';
}

function textoDif(dif) {
  if (dif === null || dif === undefined) return '—';
  if (dif === 0) return 'OK';
  return (dif > 0 ? '+' : '') + U.fmt(dif);
}

/* ============================================================
   js/coordenador.js
   ============================================================ */
function TelaPainel() {
  App.topo('PAINEL DO COORDENADOR', Sessao.atual ? Sessao.atual.nome : '');
  var tela = U.$('#tela');
  tela.innerHTML = U.carregando('Buscando dados no Supabase...');

  App.carregarBase().then(function () {
    var emAndamento = App.conferencias.filter(function (c) { return c.status === 'Em andamento' || c.status === 'Salvo'; }).length;
    var finalizadas = App.conferencias.filter(function (c) { return c.status === 'Finalizado' || c.status === 'Com divergência'; }).length;
    var divergencias = App.conferencias.filter(function (c) { return c.status === 'Com divergência'; }).length;

    var h = '' +
      '<div class="indicadores">' +
        '<div class="ind"><p class="ind__num">' + App.eventos.length + '</p><p class="ind__rot">Eventos</p></div>' +
        '<div class="ind ind--laranja"><p class="ind__num">' + emAndamento + '</p><p class="ind__rot">Conferências em andamento</p></div>' +
        '<div class="ind ind--verde"><p class="ind__num">' + finalizadas + '</p><p class="ind__rot">Conferências finalizadas</p></div>' +
        '<div class="ind ind--vermelho"><p class="ind__num">' + divergencias + '</p><p class="ind__rot">Divergências</p></div>' +
      '</div>' +

      '<div class="btn-linha" style="margin-bottom:22px">' +
        '<button class="btn btn--branco" id="btn-atualizar">🔄 ATUALIZAR DADOS</button>' +
        '<button class="btn btn--branco" id="btn-frota">🚛 FROTA</button>' +
        '<button class="btn btn--branco" id="btn-estoque">📦 ESTOQUE</button>' +
        '<button class="btn btn--branco" id="btn-terceiros">🔗 TERCEIROS</button>' +
        '<button class="btn btn--branco" id="btn-ferramentas">🧰 FERRAMENTAS</button>' +
        '<button class="btn btn--laranja" id="btn-novo-evento">+ ANEXAR CHECKLIST</button>' +
      '</div>' +

      '';

    var terminados = App.eventos.filter(function (ev) {
      return ev.status === 'Finalizado' || ev.status === 'Com divergência';
    });
    var ativos = App.eventos.filter(function (ev) {
      return ev.status !== 'Finalizado' && ev.status !== 'Com divergência';
    });

    h += '<div id="alerta-terceiros"></div>' +
    '<div class="abas">' +
      '<button class="aba is-ativa" data-aba="ativos">Eventos<span class="n">' + ativos.length + '</span></button>' +
      '<button class="aba" data-aba="terminados">Eventos finalizados<span class="n">' + terminados.length + '</span></button>' +
    '</div>' +
    '<div id="lista-eventos"></div>';

    tela.innerHTML = h;

    /* Lembretes do material terceirizado: devoluções em 5/3/1 dia e
       chegadas sem prazo. Carrega por fora para não atrasar o painel. */
    Promise.all([Banco.listarFornecedores(), Banco.listarMovTerceiros()]).then(function (rt) {
      var fornecedoresT = rt[0], movsT = rt[1];
      var saldosT = Terceiros.saldos(movsT);
      var avisosT = Terceiros.vencimentos(movsT, saldosT);
      var pendT = Terceiros.semPrazo(movsT, saldosT);
      if (!avisosT.length && !pendT.length) return;
      var caixa = U.$('#alerta-terceiros', tela);
      if (!caixa) return;
      var nomeF = function (id) {
        var f = fornecedoresT.filter(function (x) { return x.id === id; })[0];
        return f ? f.nome : 'Fornecedor';
      };
      var hh = '';
      if (avisosT.length) {
        hh += '<div class="aviso aviso--amarelo"><span class="aviso__ico">⏰</span><div>' +
          '<b>Devoluções de material terceirizado:</b>' +
          avisosT.slice(0, 5).map(function (a) {
            var quando = a.dias < 0 ? '<b style="color:var(--vermelho)">VENCEU há ' + Math.abs(a.dias) + ' dia' + (Math.abs(a.dias) > 1 ? 's' : '') + '</b>'
              : a.dias === 0 ? '<b style="color:var(--vermelho)">vence HOJE</b>'
              : '<b>faltam ' + a.dias + ' dia' + (a.dias > 1 ? 's' : '') + '</b>';
            return '<br>• ' + U.esc(a.material) + ' (' + U.esc(nomeF(a.fornecedor_id)) + ') — ' + quando;
          }).join('') +
          '<br><button class="btn btn--peq" id="ir-terceiros-alerta" style="margin-top:8px">🔗 ABRIR TERCEIROS</button>' +
        '</div></div>';
      }
      if (pendT.length) {
        hh += '<div class="aviso aviso--azul"><span class="aviso__ico">📅</span><div>' +
          '<b>' + pendT.length + ' chegada' + (pendT.length > 1 ? 's' : '') + ' de terceiros sem data de devolução.</b>' +
          'Abra 🔗 TERCEIROS e defina o prazo.</div></div>';
      }
      caixa.innerHTML = hh;
      var irT = U.$('#ir-terceiros-alerta', caixa);
      if (irT) irT.addEventListener('click', function () { App.abrir(TelaTerceiros); });
    }).catch(function () { /* tabelas ainda não criadas: painel segue normal */ });

    function diasParado(ev, confs) {
      if (ev.status === 'Finalizado' || ev.status === 'Com divergência') return 0;
      if (!confs.length) return 0;   /* ainda nem começou a conferir */
      var ultima = confs.reduce(function (mx, c) {
        var d = c.updated_at || c.created_at;
        return d > mx ? d : mx;
      }, '');
      if (!ultima) return 0;
      return Math.floor((Date.now() - new Date(ultima).getTime()) / 86400000);
    }

    function cartaoEvento(ev) {
      var confs = App.conferencias.filter(function (c) { return c.evento_id === ev.id; });
      var parado = diasParado(ev, confs);
      return '<div class="evento">' +
        '<div class="evento__topo">' +
          '<p class="evento__nome">' + U.esc(ev.nome) + '</p>' + selo(ev.status) +
        '</div>' +
        (parado >= 3
          ? '<div class="aviso aviso--amarelo" style="margin:10px 0 4px"><span class="aviso__ico">⏳</span><div>' +
            '<b>Sem movimento há ' + parado + ' dias.</b>' +
            'Vale conferir se falta registrar algum retorno ou encerrar o evento.</div></div>'
          : '') +
        '<dl class="evento__dl">' +
          '<dt>Cliente</dt><dd>' + U.esc(ev.cliente || '—') + '</dd>' +
          '<dt>Local</dt><dd>' + U.esc(ev.local || '—') + '</dd>' +
          '<dt>Data</dt><dd>' + U.fmtData(ev.data) + '</dd>' +
          '<dt>Conferente</dt><dd>' + (ev.conferente_id
            ? U.esc(App.nomeUsuario(ev.conferente_id))
            : '<span style="color:var(--laranja)">Em aberto — qualquer conferente pode assumir</span>') + '</dd>' +
          '<dt>Checklist</dt><dd>' + (App.temChecklist(ev.id)
            ? U.fmt(App.qtdChecklist(ev.id)) + ' produtos'
            : '<span style="color:var(--laranja);font-weight:700">ainda não anexado</span>') + '</dd>' +
          '<dt>Conferências</dt><dd>' + (confs.length ? confs.map(function (c) {
            return U.esc(Calculo.TIPOS[c.tipo] ? Calculo.TIPOS[c.tipo].curto : c.tipo) + ' (' + U.esc(c.status) + ')';
          }).join(' · ') : 'nenhuma ainda') + '</dd>' +
        '</dl>' +
        '<button class="btn btn--bloco js-abrir" data-id="' + ev.id + '">ABRIR</button>' +
      '</div>';
    }

    function desenharLista(aba) {
      var caixa = U.$('#lista-eventos', tela);
      var lista = aba === 'terminados' ? terminados : ativos;
      if (!lista.length) {
        caixa.innerHTML = aba === 'terminados'
          ? '<div class="vazio"><p class="vazio__ico">🏁</p><h3>Nenhum evento finalizado</h3>' +
            '<p>Quando o coordenador encerrar um evento (🏁 ENCERRAR EVENTO), ele aparece aqui com todos os relatórios.</p></div>'
          : '<div class="vazio"><p class="vazio__ico">📋</p><h3>Nenhum evento em andamento</h3>' +
            '<p>Toque em <b>+ ANEXAR CHECKLIST</b>: o evento é criado junto com a lista de produtos.</p></div>';
      } else {
        caixa.innerHTML = lista.map(cartaoEvento).join('');
      }
      U.$$('.js-abrir', caixa).forEach(function (b) {
        b.addEventListener('click', function () { App.abrir(TelaEvento, b.dataset.id); });
      });
    }

    desenharLista('ativos');

    U.$$('.aba', tela).forEach(function (b) {
      b.addEventListener('click', function () {
        U.$$('.aba', tela).forEach(function (x) { x.classList.remove('is-ativa'); });
        b.classList.add('is-ativa');
        desenharLista(b.dataset.aba);
      });
    });

    U.$('#btn-atualizar').addEventListener('click', function () {
      U.aviso('Buscando os dados mais recentes...', 'info', 1500);
      App.recarregar();
    });
    U.$('#btn-novo-evento').addEventListener('click', function () { App.abrir(TelaNovoEvento); });
    U.$('#btn-frota').addEventListener('click', function () { App.abrir(TelaFrota); });
    U.$('#btn-estoque').addEventListener('click', function () { App.abrir(TelaEstoque); });
    U.$('#btn-terceiros').addEventListener('click', function () { App.abrir(TelaTerceiros); });
    U.$('#btn-ferramentas').addEventListener('click', function () { App.abrir(TelaFerramentas); });
  }).catch(function (e) {
    tela.innerHTML = '<div class="aviso aviso--vermelho"><span class="aviso__ico">⚠</span><div>' +
      '<b>Não foi possível carregar os dados.</b>' + U.esc(e.message) + '</div></div>' +
      '<button class="btn btn--bloco" onclick="App.recarregar()">Tentar de novo</button>';
  });
}

/* ============================================================
   Estoque: cadastro central de peças. O saldo anda sozinho:
   saída finalizada desconta, retorno finalizado devolve.
   ============================================================ */
var SENHA_ESTOQUE_INICIAL = '123456';

function TelaEstoque() {
  App.topo('ESTOQUE', 'Peças do galpão');
  var tela = U.$('#tela');
  tela.innerHTML = U.carregando('Somando o estoque...');

  if (!Sessao.ehCoordenador()) {
    tela.innerHTML = '<div class="aviso aviso--amarelo"><span class="aviso__ico">🔒</span><div>' +
      '<b>Só o coordenador mexe no estoque.</b></div></div>' +
      '<button class="btn btn--branco btn--bloco" onclick="App.voltar()">Voltar</button>';
    return;
  }

  /* ---- senha própria do estoque ----
     Primeiro acesso: a senha inicial é 123456 e o app OBRIGA a trocar.
     Depois: pede a senha uma vez por sessão (até sair ou recarregar). */
  if (!window._estoqueLiberado) {
    Banco.lerConfig('senha_estoque')
      .catch(function () { return null; })   /* tabela ainda não criada: trata como inicial */
      .then(function (senha) {
        senha = senha || SENHA_ESTOQUE_INICIAL;
        if (senha === SENHA_ESTOQUE_INICIAL) trocarSenhaEstoque(true);
        else pedirSenhaEstoque(senha);
      });
    return;
  }
  entrarNoEstoque();

  function pedirSenhaEstoque(senhaCerta) {
    var m = U.modal({
      titulo: '🔒 Senha do estoque',
      html: '<p class="mut peq" style="margin-bottom:12px">O cadastro do estoque é protegido. Digite a senha para entrar.</p>' +
        '<input class="entrada" id="es-senha" type="password" inputmode="numeric" placeholder="Senha do estoque" autocomplete="off">' +
        '<p id="es-senha-erro" class="aviso aviso--vermelho" style="margin-top:10px" hidden>Senha incorreta. Tente de novo.</p>',
      pe: '<button class="btn btn--branco" data-x>Voltar</button>' +
          '<button class="btn btn--verde" data-ok>ENTRAR</button>',
      travado: true
    });
    var campo = m.querySelector('#es-senha');
    campo.focus();
    function tentar() {
      if (campo.value === senhaCerta) {
        window._estoqueLiberado = true;
        m.fechar();
        entrarNoEstoque();
      } else {
        m.querySelector('#es-senha-erro').hidden = false;
        campo.value = ''; campo.focus();
      }
    }
    m.querySelector('[data-x]').addEventListener('click', function () { m.fechar(); App.voltar(); });
    m.querySelector('[data-ok]').addEventListener('click', tentar);
    campo.addEventListener('keydown', function (e) { if (e.key === 'Enter') tentar(); });
  }

  function trocarSenhaEstoque(primeiroAcesso) {
    var m = U.modal({
      titulo: primeiroAcesso ? '🔑 Primeiro acesso ao estoque' : '🔑 Trocar a senha do estoque',
      html: (primeiroAcesso
          ? '<p class="mut peq" style="margin-bottom:12px">A senha inicial do estoque é <b>123456</b>. ' +
            'Por segurança, crie agora a sua senha — ela vale para todos os coordenadores.</p>'
          : '<p class="mut peq" style="margin-bottom:12px">Defina a nova senha do estoque.</p>') +
        '<label class="campo"><span class="campo__rot">Nova senha (mínimo 4 dígitos)</span>' +
          '<input class="entrada" id="ns-1" type="password" inputmode="numeric" autocomplete="new-password"></label>' +
        '<label class="campo"><span class="campo__rot">Repita a nova senha</span>' +
          '<input class="entrada" id="ns-2" type="password" inputmode="numeric" autocomplete="new-password"></label>' +
        '<p id="ns-erro" class="aviso aviso--vermelho" hidden></p>',
      pe: '<button class="btn btn--branco" data-x>' + (primeiroAcesso ? 'Voltar' : 'Cancelar') + '</button>' +
          '<button class="btn btn--verde" data-ok>SALVAR NOVA SENHA</button>',
      travado: true
    });
    function erro(t) { var e = m.querySelector('#ns-erro'); e.textContent = t; e.hidden = false; }
    m.querySelector('[data-x]').addEventListener('click', function () {
      m.fechar();
      if (primeiroAcesso) App.voltar(); else entrarNoEstoque();
    });
    m.querySelector('[data-ok]').addEventListener('click', function () {
      var s1 = m.querySelector('#ns-1').value;
      var s2 = m.querySelector('#ns-2').value;
      if (s1.length < 4) return erro('A senha precisa de pelo menos 4 dígitos.');
      if (s1 === SENHA_ESTOQUE_INICIAL) return erro('Escolha uma senha diferente da inicial (123456).');
      if (s1 !== s2) return erro('As duas senhas não bateram. Digite igual nas duas caixas.');
      var b = m.querySelector('[data-ok]');
      b.disabled = true; b.textContent = 'Salvando...';
      Banco.salvarConfig('senha_estoque', s1)
        .then(function () {
          window._estoqueLiberado = true;
          m.fechar();
          U.aviso('🔑 Senha do estoque ' + (primeiroAcesso ? 'criada' : 'trocada') + ' com sucesso.', 'ok', 5000);
          entrarNoEstoque();
        })
        .catch(function (e2) {
          b.disabled = false; b.textContent = 'SALVAR NOVA SENHA';
          erro('Não deu para salvar: ' + e2.message + (primeiroAcesso ? ' (rode o SQL novo no Supabase)' : ''));
        });
    });
  }

  function entrarNoEstoque() {
  tela.innerHTML = U.carregando('Somando o estoque...');
  TelaEstoque._trocarSenha = function () { trocarSenhaEstoque(false); };
  Promise.all([Banco.listarEstoque(), Banco.listarMovimentos(), App.carregarBase()])
    .then(function (r) {
      var cadastro = r[0], movimentos = r[1];
      var saldos = Estoque.saldos(cadastro, movimentos);
      var emObra = {};   /* saiu e ainda não voltou, por item */
      movimentos.forEach(function (m) {
        if (!(m.estoque_id in emObra)) emObra[m.estoque_id] = 0;
        if (m.tipo === 'saida') emObra[m.estoque_id] += Math.abs(Number(m.quantidade) || 0);
        if (m.tipo === 'retorno') emObra[m.estoque_id] -= Math.abs(Number(m.quantidade) || 0);
      });

      function nomeEvento(id) {
        var ev = App.eventos.filter(function (e) { return e.id === id; })[0];
        return ev ? ev.nome : 'Evento apagado';
      }

      var familias = [];
      cadastro.forEach(function (i) {
        Estoque.familiasDe(i).forEach(function (f) {
          if (familias.indexOf(f) < 0) familias.push(f);
        });
      });
      familias.sort();
      var datalistFam = '<datalist id="lista-familias">' +
        familias.map(function (f) { return '<option value="' + U.esc(f) + '">'; }).join('') + '</datalist>';

      var h = '<div class="cartao"><div class="cartao__topo"><h3>➕ Cadastrar peça</h3></div>' +
        '<div class="cartao__corpo">' +
          '<label class="campo"><span class="campo__rot">Nome da peça</span>' +
            '<input id="es-nome" class="entrada" placeholder="Ex.: Travessa 1,00 m"></label>' +
          '<label class="campo"><span class="campo__rot">Famílias do material <span class="peq mut">(pode várias, separadas por vírgula)</span></span>' +
            '<input id="es-familia" class="entrada" list="lista-familias" placeholder="Ex.: Piso Pantográfico, Palco"></label>' +
          datalistFam +
          '<div class="btn-linha">' +
            '<label class="campo" style="flex:1"><span class="campo__rot">Unidade</span>' +
              '<input id="es-unidade" class="entrada" value="UN"></label>' +
            '<label class="campo" style="flex:1"><span class="campo__rot">Quantidade inicial</span>' +
              '<input id="es-qtd" class="entrada" type="number" inputmode="numeric" placeholder="0"></label>' +
          '</div>' +
          '<button class="btn btn--laranja btn--bloco" id="btn-add-estoque">CADASTRAR</button>' +
          '<div class="btn-linha" style="margin-top:10px">' +
            '<button class="btn btn--branco btn--bloco" id="btn-importar-estoque">📎 IMPORTAR ARQUIVOS (PDF, Excel, CSV — pode escolher vários)</button>' +
          '</div>' +
          '<input type="file" id="es-arquivo" accept=".pdf,.xlsx,.xls,.xml,.txt,.csv" multiple hidden>' +
          '<p class="mut peq" style="margin-top:10px">As peças dos checklists entram sozinhas aqui na primeira ' +
            'saída finalizada (com saldo devendo, em vermelho, até você lançar a quantidade real).</p>' +
        '</div></div>';

      h += '<div class="busca-prod"><input type="search" id="busca-estoque" ' +
        'placeholder="🔍 Buscar peça pelo nome..." autocomplete="off"></div>';

      var temAlgumaFamilia = cadastro.some(function (i) { return Estoque.familiasDe(i).length > 0; });
      if (cadastro.length && !temAlgumaFamilia) {
        h += '<div class="aviso aviso--azul"><span class="aviso__ico">📂</span><div>' +
          '<b>Nenhuma peça tem família ainda.</b>' +
          'Toque no botão <b>Família</b> de cada peça (ex.: Piso Pantográfico, Tenda, Elétrica) — ' +
          'a lista aqui e a conferência dos conferentes passam a vir separadas por família na hora.</div></div>';
      }

      h += '<h2 class="secao__tit">Peças <span class="n">' + cadastro.length + '</span></h2>';
      if (!cadastro.length) {
        h += '<div class="vazio"><p class="vazio__ico">📦</p><h3>Estoque vazio</h3>' +
          '<p>Cadastre as peças acima ou importe um arquivo.</p></div>';
      } else {
        /* separa por família: material com várias famílias aparece em cada uma */
        var grupos = {};
        cadastro.forEach(function (i) {
          var fams = Estoque.familiasDe(i);
          if (!fams.length) fams = ['Sem família'];
          fams.forEach(function (fam) {
            (grupos[fam] = grupos[fam] || []).push(i);
          });
        });
        var nomesFam2 = Object.keys(grupos).sort(function (a, b) {
          if (a === 'Sem família') return 1;
          if (b === 'Sem família') return -1;
          return a.localeCompare(b);
        });
        var listaEstoque = [];
        nomesFam2.forEach(function (fam) {
          if (nomesFam2.length > 1 || fam !== 'Sem família') {
            listaEstoque.push({ __cabecalho: fam, __qtd: grupos[fam].length });
          }
          grupos[fam].forEach(function (i) { listaEstoque.push(i); });
        });

        h += listaEstoque.map(function (i) {
          if (i.__cabecalho) {
            return '<h2 class="secao__tit" style="margin-top:18px;font-size:16px">📂 ' + U.esc(i.__cabecalho) +
              ' <span class="n">' + i.__qtd + '</span></h2>';
          }
          return linhaPeca(i);
        }).join('');
      }
      function linhaPeca(i) {
          var saldo = saldos[i.id] || 0;
          var fora = Math.max(0, emObra[i.id] || 0);
          return '<div class="carga" data-nome="' + U.esc(i.nome.toLowerCase()) + '">' +
            '<div class="carga__cam"><span>📦</span>' +
              '<span><b>' + U.esc(i.nome) + '</b>' +
                Estoque.familiasDe(i).map(function (f) {
                  return ' <span class="terc-tag" style="background:#EAF2FD;border-color:#BFD6F5;color:var(--azul)">📂 ' + U.esc(f) + '</span>';
                }).join('') +
                '<span class="peq mut" style="display:block">' +
                  'Saldo no galpão: <b style="color:' + (saldo < 0 ? 'var(--vermelho)' : 'var(--verde)') + '">' +
                  U.fmt(saldo) + ' ' + U.esc(i.unidade || 'UN') + '</b>' +
                  (saldo < 0 ? ' (devendo — lance a quantidade real)' : '') +
                  (fora > 0 ? ' · Em evento: <b style="color:var(--laranja)">' + U.fmt(fora) + '</b>' : '') +
                '</span></span>' +
              '<span style="margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">' +
                '<button class="btn btn--branco btn--peq js-es-mov" data-id="' + i.id + '">Movimentos</button>' +
                '<button class="btn btn--branco btn--peq js-es-ajuste" data-id="' + i.id + '">Ajustar</button>' +
                '<button class="btn btn--branco btn--peq js-es-familia" data-id="' + i.id + '">Família</button>' +
                '<button class="btn btn--branco btn--peq js-es-excluir" data-id="' + i.id + '" style="color:var(--vermelho);border-color:var(--vermelho)">Excluir</button>' +
              '</span>' +
            '</div>' +
          '</div>';
      }

      h += '<div class="btn-linha" style="margin-top:14px">' +
        '<button class="btn btn--branco" onclick="TelaEstoque._trocarSenha()">🔑 Trocar senha do estoque</button>' +
        '<button class="btn btn--branco" onclick="App.voltar()">Voltar</button></div>' +
        '<button class="btn btn--branco btn--bloco" id="btn-zerar-estoque" ' +
          'style="margin-top:22px;color:var(--vermelho);border-color:var(--vermelho)">🧹 ZERAR ESTOQUE (apagar tudo)</button>';
      tela.innerHTML = h;

      U.$('#btn-zerar-estoque').addEventListener('click', function () {
        var m = U.modal({
          titulo: '🧹 Zerar o estoque',
          html: '<p style="margin-bottom:10px">Isto apaga <b>TODAS as ' + cadastro.length + ' peças</b> e ' +
              '<b>todos os ' + movimentos.length + ' movimentos</b> do estoque do galpão. ' +
              'Os eventos, as conferências e o material terceirizado não são tocados. <b>Não dá para desfazer.</b></p>' +
            '<p class="mut peq" style="margin-bottom:8px">Para confirmar, escreva <b>ZERAR</b> na caixa:</p>' +
            '<input class="entrada" id="zera-confirma" autocomplete="off" placeholder="ZERAR" style="text-transform:uppercase">',
          pe: '<button class="btn btn--branco" data-x>Cancelar</button>' +
              '<button class="btn" data-ok style="background:var(--vermelho)">APAGAR TUDO</button>',
          travado: true
        });
        m.querySelector('[data-x]').addEventListener('click', m.fechar);
        m.querySelector('[data-ok]').addEventListener('click', function () {
          if (m.querySelector('#zera-confirma').value.trim().toUpperCase() !== 'ZERAR') {
            return U.aviso('Escreva ZERAR para confirmar.', 'erro');
          }
          var b = m.querySelector('[data-ok]');
          b.disabled = true; b.textContent = 'Apagando...';
          Banco.zerarEstoque().then(function () {
            m.fechar();
            U.aviso('🧹 Estoque zerado: peças e movimentos apagados.', 'ok', 6000);
            App.recarregar();
          }).catch(function (e) {
            b.disabled = false; b.textContent = 'APAGAR TUDO';
            App.falhou(e);
          });
        });
      });

      var busca = U.$('#busca-estoque', tela);
      if (busca) busca.addEventListener('input', function () {
        var t = busca.value.trim().toLowerCase();
        U.$$('.carga[data-nome]', tela).forEach(function (cx) {
          cx.style.display = !t || (cx.dataset.nome || '').indexOf(t) >= 0 ? '' : 'none';
        });
      });

      var campoArq = U.$('#es-arquivo', tela);
      U.$('#btn-importar-estoque').addEventListener('click', function () { campoArq.click(); });
      campoArq.addEventListener('change', function () {
        var arquivos = campoArq.files;
        if (!arquivos || !arquivos.length) return;
        var nomeArqs = Array.prototype.map.call(arquivos, function (a) { return a.name; }).join(', ');
        var arq = { name: arquivos.length > 1 ? arquivos.length + ' arquivos' : arquivos[0].name };
        U.aviso('Lendo ' + arq.name + '...', 'info', 2500);

        Checklist.lerVarios(arquivos).then(function (r) {
          campoArq.value = '';
          if (r.falhas.length) U.aviso('⚠ ' + r.falhas.join(' · '), 'erro', 8000);
          var lidos = (r.produtos || []).filter(function (p) { return p.nome && Number(p.quantidade_prevista) > 0; });
          if (!lidos.length) return U.aviso('Não encontrei itens com quantidade nos arquivos.', 'erro', 6000);

          var m = U.modal({
            titulo: '📎 ' + lidos.length + ' peças encontradas',
            html: '<p class="mut peq" style="margin-bottom:8px">Marque o que entra e ajuste a quantidade se precisar. ' +
                'Peça <span class="peq" style="color:var(--laranja);font-weight:700">nova</span> desmarcada <b>não é cadastrada</b>.</p>' +
              '<div style="max-height:42vh;overflow:auto;border:1px solid var(--linha);border-radius:10px;padding:8px 12px;margin-bottom:12px">' +
                lidos.map(function (p, i) {
                  var existe = cadastro.some(function (x) { return Estoque.chave(x.nome) === Estoque.chave(p.nome); });
                  return '<div style="display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--linha);padding:7px 0">' +
                    '<input type="checkbox" class="js-imp-ok" data-i="' + i + '" checked style="width:20px;height:20px;flex:none;cursor:pointer">' +
                    '<span style="flex:1">' + U.esc(p.nome) +
                      (existe ? '' : ' <span class="peq" style="color:var(--laranja);font-weight:700">nova</span>') + '</span>' +
                    '<input type="number" class="entrada js-imp-qtd" data-i="' + i + '" inputmode="numeric" min="0" ' +
                      'value="' + U.esc(String(p.quantidade_prevista)) + '" ' +
                      'style="width:88px;min-height:44px;padding:8px;text-align:center;flex:none">' +
                    '<span class="peq mut" style="flex:none;width:32px">' + U.esc(p.unidade || 'UN') + '</span>' +
                  '</div>';
                }).join('') +
              '</div>' +
              '<p class="mut peq" style="margin-bottom:6px"><b>SOMAR AO SALDO</b>: as quantidades marcadas entram por cima do que já tem (chegou mercadoria).</p>' +
              '<p class="mut peq"><b>VIRAR O SALDO ATUAL</b>: o saldo de cada peça marcada fica exatamente o número da caixa (contagem geral do galpão).</p>',
            pe: '<button class="btn btn--branco" data-x>Cancelar</button>' +
                '<button class="btn btn--branco" data-somar>SOMAR AO SALDO</button>' +
                '<button class="btn btn--verde" data-definir>VIRAR O SALDO ATUAL</button>',
            travado: true
          });
          m.querySelector('[data-x]').addEventListener('click', m.fechar);

          function importar(modo) {
            /* só o que está marcado, com a quantidade da caixinha */
            var escolhidos = [];
            m.querySelectorAll('.js-imp-ok').forEach(function (cx) {
              if (!cx.checked) return;
              var i = Number(cx.dataset.i);
              var campo = m.querySelector('.js-imp-qtd[data-i="' + i + '"]');
              escolhidos.push({ p: lidos[i], qtd: U.num(campo ? campo.value : lidos[i].quantidade_prevista) });
            });
            if (!escolhidos.length) return U.aviso('Marque pelo menos uma peça.', 'erro', 4000);

            var b1 = m.querySelector('[data-somar]'), b2 = m.querySelector('[data-definir]');
            b1.disabled = b2.disabled = true;
            b2.textContent = 'Importando...';

            /* cria no cadastro só as NOVAS que ficaram marcadas */
            var porChave = {};
            cadastro.forEach(function (i) { porChave[Estoque.chave(i.nome)] = i; });
            var novas = escolhidos.filter(function (e) { return !porChave[Estoque.chave(e.p.nome)]; });

            Promise.all(novas.map(function (e) {
              return Banco.criarEstoque({
                nome: e.p.nome.trim().replace(/\s+/g, ' '),
                unidade: e.p.unidade || 'UN', ativo: true
              }).then(function (novo) { if (novo) porChave[Estoque.chave(novo.nome)] = novo; })
                .catch(function () { });
            })).then(function () {
              return Banco.listarEstoque();
            }).then(function (att) {
              att.forEach(function (i) { porChave[Estoque.chave(i.nome)] = i; });
              var movimentos = [];
              escolhidos.forEach(function (e) {
                var alvo = porChave[Estoque.chave(e.p.nome)];
                if (!alvo) return;
                var qtd = e.qtd;
                if (modo === 'somar') {
                  if (qtd > 0) movimentos.push({
                    estoque_id: alvo.id, tipo: 'entrada', quantidade: qtd,
                    usuario_id: Sessao.atual.id, observacao: 'Importado: ' + arq.name
                  });
                } else {
                  var saldoAtual = saldos[alvo.id] || 0;
                  var acerto = qtd - saldoAtual;
                  if (acerto !== 0) movimentos.push({
                    estoque_id: alvo.id, tipo: 'ajuste', quantidade: acerto,
                    usuario_id: Sessao.atual.id,
                    observacao: 'Contagem geral (importado: ' + arq.name + ')'
                  });
                }
              });
              return Banco.criarMovimentos(movimentos);
            }).then(function () {
              m.fechar();
              U.aviso('✓ ' + escolhidos.length + ' peça' + (escolhidos.length > 1 ? 's' : '') + ' importada' +
                (escolhidos.length > 1 ? 's' : '') + (novas.length ? ' (' + novas.length + ' cadastradas agora)' : '') + '.', 'ok', 6000);
              App.recarregar();
            }).catch(function (e) {
              b1.disabled = b2.disabled = false;
              b2.textContent = 'VIRAR O SALDO ATUAL';
              App.falhou(e);
            });
          }
          m.querySelector('[data-somar]').addEventListener('click', function () { importar('somar'); });
          m.querySelector('[data-definir]').addEventListener('click', function () { importar('definir'); });
        }).catch(function (e) { U.aviso(e.message, 'erro', 7000); });
      });

      U.$('#btn-add-estoque').addEventListener('click', function () {
        var nome = U.$('#es-nome').value.trim().replace(/\s+/g, ' ');
        var familiasNovas = U.$('#es-familia').value.split(',')
          .map(function (f) { return f.trim().replace(/\s+/g, ' '); })
          .filter(function (f) { return f.length > 0; });
        var unidade = U.$('#es-unidade').value.trim() || 'UN';
        var qtd = U.num(U.$('#es-qtd').value);
        if (!nome) return U.aviso('Dê um nome para a peça.', 'erro');
        var repetida = cadastro.some(function (i) { return Estoque.chave(i.nome) === Estoque.chave(nome); });
        if (repetida) return U.aviso('Já existe uma peça com esse nome. Use o AJUSTAR dela.', 'erro', 5000);
        var botao = this;
        botao.disabled = true; botao.textContent = 'Cadastrando...';
        Banco.criarEstoque({ nome: nome, unidade: unidade, familias: familiasNovas, familia: familiasNovas[0] || null, ativo: true }).then(function (novo) {
          if (qtd > 0) {
            return Banco.criarMovimentos([{
              estoque_id: novo.id, tipo: 'entrada', quantidade: qtd, usuario_id: Sessao.atual.id,
              observacao: 'Quantidade inicial'
            }]);
          }
        }).then(function () {
          U.aviso('✓ ' + nome + ' cadastrada.', 'ok');
          App.recarregar();
        }).catch(function (e) { botao.disabled = false; botao.textContent = 'CADASTRAR'; App.falhou(e); });
      });

      U.$$('.js-es-ajuste', tela).forEach(function (b) {
        b.addEventListener('click', function () {
          var item = cadastro.filter(function (i) { return i.id === b.dataset.id; })[0];
          var saldo = saldos[item.id] || 0;
          var m = U.modal({
            titulo: '🛠️ Ajustar ' + item.nome,
            html: '<p class="mut peq" style="margin-bottom:10px">Saldo hoje: <b>' + U.fmt(saldo) + ' ' + U.esc(item.unidade || 'UN') + '</b>. ' +
              'Informe o ajuste: número positivo soma (compra, achou peça), negativo desconta (perda, quebra).</p>' +
              '<label class="campo"><span class="campo__rot">Ajuste (+ ou −)</span>' +
                '<input id="aj-qtd" class="entrada" type="number" inputmode="numeric" placeholder="Ex.: 50 ou -3"></label>' +
              '<label class="campo"><span class="campo__rot">Motivo (obrigatório)</span>' +
                '<input id="aj-motivo" class="entrada" placeholder="Ex.: compra de 50, quebra na desmontagem"></label>',
            pe: '<button class="btn btn--branco" data-x>Cancelar</button>' +
                '<button class="btn btn--verde" data-ok>LANÇAR AJUSTE</button>'
          });
          m.querySelector('[data-x]').addEventListener('click', m.fechar);
          m.querySelector('[data-ok]').addEventListener('click', function () {
            var q = U.num(m.querySelector('#aj-qtd').value);
            var motivo = m.querySelector('#aj-motivo').value.trim();
            if (!q) return U.aviso('Informe a quantidade do ajuste.', 'erro');
            if (!motivo) return U.aviso('Escreva o motivo do ajuste.', 'erro');
            Banco.criarMovimentos([{
              estoque_id: item.id, tipo: 'ajuste', quantidade: q,
              usuario_id: Sessao.atual.id, observacao: motivo
            }]).then(function () {
              m.fechar();
              U.aviso('✓ Ajuste lançado: ' + (q > 0 ? '+' : '') + U.fmt(q) + '.', 'ok');
              App.recarregar();
            }).catch(App.falhou);
          });
        });
      });

      U.$$('.js-es-familia', tela).forEach(function (b) {
        b.addEventListener('click', function () {
          var item = cadastro.filter(function (i) { return i.id === b.dataset.id; })[0];
          if (!item) return;
          var minhas = Estoque.familiasDe(item);
          var m = U.modal({
            titulo: '📂 Famílias — ' + item.nome,
            html: '<p class="mut peq" style="margin-bottom:12px">Marque todas as famílias deste material ' +
                '(pode mais de uma — ele aparece em cada uma na conferência).</p>' +
              (familias.length
                ? '<div style="max-height:35vh;overflow:auto;border:1px solid var(--linha);border-radius:10px;padding:8px 12px;margin-bottom:12px">' +
                  familias.map(function (f, fi) {
                    return '<label style="display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--linha);padding:8px 0;cursor:pointer">' +
                      '<input type="checkbox" class="js-fam-cx" value="' + U.esc(f) + '"' +
                        (minhas.indexOf(f) >= 0 ? ' checked' : '') + ' style="width:20px;height:20px">' +
                      '📂 ' + U.esc(f) + '</label>';
                  }).join('') + '</div>'
                : '') +
              '<label class="campo"><span class="campo__rot">Nova(s) família(s) <span class="peq mut">(separe por vírgula)</span></span>' +
                '<input class="entrada" id="fam-novas" placeholder="Ex.: Palco, Elétrica"></label>',
            pe: '<button class="btn btn--branco" data-x>Cancelar</button>' +
                '<button class="btn btn--verde" data-ok>SALVAR</button>'
          });
          m.querySelector('[data-x]').addEventListener('click', m.fechar);
          m.querySelector('[data-ok]').addEventListener('click', function () {
            var lista = [];
            m.querySelectorAll('.js-fam-cx').forEach(function (cx) {
              if (cx.checked && lista.indexOf(cx.value) < 0) lista.push(cx.value);
            });
            m.querySelector('#fam-novas').value.split(',').forEach(function (f) {
              f = f.trim().replace(/\s+/g, ' ');
              if (f && lista.indexOf(f) < 0) lista.push(f);
            });
            Banco.atualizarEstoque(item.id, { familias: lista, familia: lista[0] || null })
              .then(function () {
                m.fechar();
                U.aviso(lista.length
                  ? '📂 ' + item.nome + ': ' + lista.join(', ') + '.'
                  : '📂 Famílias removidas.', 'ok', 4000);
                App.recarregar();
              }).catch(App.falhou);
          });
        });
      });

      U.$$('.js-es-excluir', tela).forEach(function (b) {
        b.addEventListener('click', function () {
          var item = cadastro.filter(function (i) { return i.id === b.dataset.id; })[0];
          if (!item) return;
          var saldo = saldos[item.id] || 0;
          var nMov = movimentos.filter(function (m) { return m.estoque_id === item.id; }).length;
          var m = U.modal({
            titulo: '🗑️ Excluir ' + item.nome,
            html: '<p>Isto apaga a peça <b>' + U.esc(item.nome) + '</b> do estoque' +
              (nMov ? ' e os <b>' + nMov + ' movimentos</b> dela (o histórico some junto)' : '') +
              '. Saldo atual: <b>' + U.fmt(saldo) + ' ' + U.esc(item.unidade || 'UN') + '</b>. Não dá para desfazer.</p>' +
              (saldo !== 0 ? '<p class="mut peq" style="margin-top:8px">O saldo não volta para lugar nenhum — só some.</p>' : ''),
            pe: '<button class="btn btn--branco" data-x>Cancelar</button>' +
                '<button class="btn" data-ok style="background:var(--vermelho)">EXCLUIR</button>',
            travado: true
          });
          m.querySelector('[data-x]').addEventListener('click', m.fechar);
          m.querySelector('[data-ok]').addEventListener('click', function () {
            var bt = m.querySelector('[data-ok]');
            bt.disabled = true; bt.textContent = 'Excluindo...';
            Banco.apagarEstoqueItem(item.id).then(function () {
              m.fechar();
              U.aviso('🗑️ ' + item.nome + ' excluída do estoque.', 'ok', 5000);
              App.recarregar();
            }).catch(function (e) {
              bt.disabled = false; bt.textContent = 'EXCLUIR';
              App.falhou(e);
            });
          });
        });
      });

      U.$$('.js-es-mov', tela).forEach(function (b) {
        b.addEventListener('click', function () {
          var item = cadastro.filter(function (i) { return i.id === b.dataset.id; })[0];
          var meus = movimentos.filter(function (m) { return m.estoque_id === item.id; }).slice(0, 30);
          var mv = U.modal({
            titulo: '📜 Movimentos — ' + item.nome,
            html: meus.length
              ? meus.map(function (m) {
                  var q = Number(m.quantidade) || 0;
                  var sinal = m.tipo === 'saida' ? -Math.abs(q) : (m.tipo === 'ajuste' ? q : Math.abs(q));
                  return '<div style="border-bottom:1px solid var(--linha);padding:8px 0">' +
                    '<b style="color:' + (sinal < 0 ? 'var(--vermelho)' : 'var(--verde)') + '">' +
                      (sinal > 0 ? '+' : '') + U.fmt(sinal) + '</b> · ' + (Estoque.rotulo[m.tipo] || m.tipo) +
                    (m.evento_id ? ' · <b>' + U.esc(nomeEvento(m.evento_id)) + '</b>' : '') +
                    '<span class="peq mut" style="display:block">' + U.fmtDataHora(m.created_at) +
                      ' · ' + U.esc(App.nomeUsuario(m.usuario_id)) +
                      (m.observacao ? ' · ' + U.esc(m.observacao) : '') + '</span>' +
                  '</div>';
                }).join('')
              : '<p class="mut">Nenhum movimento ainda.</p>',
            pe: '<button class="btn btn--branco" data-x>Fechar</button>'
          });
          mv.querySelector('[data-x]').addEventListener('click', mv.fechar);
        });
      });
    })
    .catch(function (e) {
      tela.innerHTML = '<div class="aviso aviso--vermelho"><span class="aviso__ico">⚠</span><div>' +
        '<b>Não foi possível carregar o estoque.</b>' + U.esc(e.message) +
        '<br><span class="peq">Se for a primeira vez, rode o SQL novo no Supabase para criar as tabelas do estoque.</span></div></div>' +
        '<button class="btn btn--branco btn--bloco" onclick="App.voltar()">Voltar</button>';
    });
  }
}

/* ============================================================
   Tela de UM fornecedor: o que tem em mãos, onde está, vencimentos
   e os quatro lançamentos: chegada, envio, retorno e devolução.
   ============================================================ */
function TelaFornecedor(fornecedorId) {
  var tela = U.$('#tela');
  tela.innerHTML = U.carregando('Somando o material do fornecedor...');

  Promise.all([
    Banco.listarFornecedores(),
    Banco.listarMovTerceiros(),
    App.carregarBase(),
    Banco.listarEstoque().catch(function () { return []; })   /* nomenclatura oficial das peças */
  ])
    .then(function (r) {
      var catalogo = r[3] || [];
      var fornecedor = r[0].filter(function (f) { return f.id === fornecedorId; })[0];
      if (!fornecedor) { tela.innerHTML = '<div class="vazio"><h3>Fornecedor não encontrado</h3></div>'; return; }
      var movimentos = r[1].filter(function (m) { return m.fornecedor_id === fornecedorId; });
      var saldos = (Terceiros.saldos(movimentos)[fornecedorId]) || {};
      var avisos = Terceiros.vencimentos(movimentos, Terceiros.saldos(movimentos))
        .filter(function (a) { return a.fornecedor_id === fornecedorId; });

      App.topo(fornecedor.nome.toUpperCase(), 'Material terceirizado' + (fornecedor.contato ? ' · ' + fornecedor.contato : ''));

      function nomeEvento(id) {
        var ev = App.eventos.filter(function (e) { return e.id === id; })[0];
        return ev ? ev.nome : 'Evento apagado';
      }

      var chaves = Object.keys(saldos);
      var comSaldo = chaves.filter(function (ch) { return saldos[ch].emMaos > 0 || saldos[ch].emEventos !== 0; });

      var h = '';

      var semPrazo = Terceiros.semPrazo(movimentos, Terceiros.saldos(movimentos))
        .filter(function (m) { return m.fornecedor_id === fornecedorId; });
      if (semPrazo.length) {
        h += '<div class="aviso aviso--azul"><span class="aviso__ico">📅</span><div>' +
          '<b>Chegadas sem data de devolução:</b>' +
          semPrazo.map(function (m) {
            return '<br>• ' + U.fmt(m.quantidade) + ' ' + U.esc(m.material) +
              (m.data_entrega ? ' — entregue ' + U.fmtData(m.data_entrega) : '') +
              (Sessao.ehCoordenador()
                ? ' <button class="btn btn--peq js-def-prazo" data-mov="' + m.id + '" style="margin-left:6px">📅 DEFINIR DEVOLUÇÃO</button>'
                : '');
          }).join('') +
          (Sessao.ehCoordenador() ? '' : '<br><span class="peq">O coordenador define o prazo de devolução.</span>') +
        '</div></div>';
      }

      if (avisos.length) {
        h += '<div class="aviso aviso--amarelo"><span class="aviso__ico">⏰</span><div><b>Devoluções:</b>' +
          avisos.map(function (a) {
            var quando = a.dias < 0 ? '<b style="color:var(--vermelho)">VENCEU há ' + Math.abs(a.dias) + ' dia' + (Math.abs(a.dias) > 1 ? 's' : '') + '</b>'
              : a.dias === 0 ? '<b style="color:var(--vermelho)">vence HOJE</b>'
              : (a.marco ? '<b>⏰ faltam ' + a.dias + ' dia' + (a.dias > 1 ? 's' : '') + '</b>' : 'vence em ' + a.dias + ' dias');
            return '<br>• ' + U.esc(a.material) + ' — ' + quando + ' (' + U.fmtData(a.data) + ') · ' + U.fmt(a.saldo) + ' em mãos';
          }).join('') + '</div></div>';
      }

      /* lançamentos manuais: só CHEGADA e DEVOLVER.
         Envio para evento e retorno acontecem SOZINHOS pela conferência
         (o conferente escolhe o fornecedor no campo 🔗 do produto). */
      h += '<div class="btn-linha" style="margin-bottom:16px">' +
        '<button class="btn btn--verde" id="mv-chegada">📥 CHEGADA</button>' +
        '<button class="btn btn--branco" id="mv-devolucao">📤 DEVOLVER</button>' +
      '</div>' +
      '<p class="mut peq" style="margin:-6px 0 14px">🚚 O envio para evento e o ↩️ retorno entram sozinhos ' +
        'pelas conferências, quando o conferente marca o terceirizado e escolhe este fornecedor.</p>';

      /* saldos */
      h += '<div class="cartao"><div class="cartao__topo"><h3>Material em mãos</h3>' +
        '<span class="mut peq">' + comSaldo.length + '</span></div>';
      if (!comSaldo.length) {
        h += '<div class="cartao__corpo"><div class="vazio" style="padding:16px 0">' +
          '<p class="vazio__ico">📦</p><h3>Nada em mãos</h3>' +
          '<p class="peq">Toque em 📥 CHEGADA quando o material do fornecedor chegar.</p></div></div>';
      } else {
        h += '<div class="tabela-rolagem"><table class="tab"><thead><tr>' +
          '<th>Material</th><th class="num">Em mãos</th><th class="num">No galpão</th><th>Em eventos</th>' +
        '</tr></thead><tbody>' +
        comSaldo.map(function (ch) {
          var i = saldos[ch];
          var eventos = Object.keys(i.porEvento)
            .filter(function (ev) { return i.porEvento[ev] > 0; })
            .map(function (ev) { return U.esc(nomeEvento(ev)) + ' (<b>' + U.fmt(i.porEvento[ev]) + '</b>)'; })
            .join('<br>');
          return '<tr><td>' + U.esc(i.nome) + ' <span class="peq mut">' + U.esc(i.unidade) + '</span></td>' +
            '<td class="num"><b>' + U.fmt(i.emMaos) + '</b></td>' +
            '<td class="num">' + U.fmt(i.noGalpao) +
              (i.noGalpao < 0 ? ' <span class="peq" style="color:var(--vermelho)">⚠</span>' : '') + '</td>' +
            '<td>' + (eventos || '<span class="mut peq">—</span>') + '</td></tr>';
        }).join('') +
        '</tbody></table></div>';
      }
      h += '</div>';

      /* histórico */
      var recentes = movimentos.slice(0, 25);
      h += '<div class="cartao"><div class="cartao__topo"><h3>📜 Movimentos</h3>' +
        '<span class="mut peq">' + movimentos.length + '</span></div><div class="cartao__corpo">';
      if (!recentes.length) {
        h += '<p class="mut peq">Nenhum lançamento ainda.</p>';
      } else {
        h += recentes.map(function (m) {
          var soma = m.tipo === 'chegada' || m.tipo === 'retorno';
          return '<div style="border-bottom:1px solid var(--linha);padding:8px 0">' +
            '<b style="color:' + (m.tipo === 'devolucao' ? 'var(--vermelho)' : soma ? 'var(--verde)' : 'var(--laranja)') + '">' +
              (soma ? '+' : '−') + U.fmt(Math.abs(m.quantidade)) + '</b> · ' +
            U.esc(m.material) + ' · ' + (Terceiros.rotulo[m.tipo] || m.tipo) +
            (m.evento_id ? ' · <b>' + U.esc(nomeEvento(m.evento_id)) + '</b>' : '') +
            (m.data_devolucao ? ' · devolver até <b>' + U.fmtData(m.data_devolucao) + '</b>' : '') +
            '<span class="peq mut" style="display:block">' + U.fmtDataHora(m.created_at) + ' · ' +
              U.esc(App.nomeUsuario(m.usuario_id)) +
              (m.observacao ? ' · ' + U.esc(m.observacao) : '') + '</span>' +
          '</div>';
        }).join('');
      }
      h += '</div></div>';

      h += '<button class="btn btn--branco btn--bloco" onclick="App.voltar()">Voltar</button>';
      tela.innerHTML = h;

      /* ---------- modais de lançamento ---------- */
      function campoMaterial(chegada) {
        if (chegada) {
          /* Chegada usa a NOMENCLATURA DO ESTOQUE do coordenador, para o nome
             do material bater em todo o sistema. Junta: catálogo do estoque +
             materiais que este fornecedor já teve + opção de digitar um novo. */
          var vistos = {};
          var nomes = [];
          catalogo.forEach(function (i) {
            var ch = Terceiros.chave(i.nome);
            if (vistos[ch]) return;
            vistos[ch] = true;
            nomes.push({ nome: i.nome, unidade: i.unidade || 'UN', doCatalogo: true });
          });
          chaves.forEach(function (ch) {
            if (vistos[ch]) return;
            vistos[ch] = true;
            nomes.push({ nome: saldos[ch].nome, unidade: saldos[ch].unidade || 'UN', doCatalogo: false });
          });
          return '<label class="campo"><span class="campo__rot">Material ' +
              '<span class="peq mut">(nomes do estoque do coordenador)</span></span>' +
            '<select class="entrada" id="mv-material-sel">' +
              '<option value="">— Escolher o material —</option>' +
              nomes.map(function (n) {
                return '<option value="' + U.esc(n.nome) + '" data-un="' + U.esc(n.unidade) + '">' +
                  U.esc(n.nome) + (n.doCatalogo ? '' : ' (deste fornecedor)') + '</option>';
              }).join('') +
              '<option value="__outro">➕ Outro material (digitar o nome)</option>' +
            '</select></label>' +
            '<label class="campo" id="mv-material-outro-caixa" hidden>' +
              '<span class="campo__rot">Nome do novo material</span>' +
              '<input class="entrada" id="mv-material-outro" placeholder="Ex.: Piso 50x50 alugado"></label>';
        }
        var nomesForn = chaves.map(function (ch) { return saldos[ch].nome; });
        return '<label class="campo"><span class="campo__rot">Material</span>' +
          '<select class="entrada" id="mv-material">' +
            nomesForn.map(function (n) { return '<option value="' + U.esc(n) + '">' + U.esc(n) + '</option>'; }).join('') +
          '</select></label>';
      }

      function lancar(tipo) {
        var chegada = tipo === 'chegada';
        var precisaEvento = tipo === 'envio' || tipo === 'retorno';
        var eventosAtivos = App.eventos.filter(function (e) {
          return e.status !== 'Finalizado' && e.status !== 'Com divergência';
        });
        if (precisaEvento && !eventosAtivos.length) {
          return U.aviso('Nenhum evento em andamento para vincular.', 'erro', 5000);
        }
        if (!chegada && !chaves.length) {
          return U.aviso('Registre uma 📥 CHEGADA primeiro — ainda não há material deste fornecedor.', 'erro', 6000);
        }

        var m = U.modal({
          titulo: Terceiros.rotulo[tipo],
          html:
            campoMaterial(chegada) +
            '<div class="dupla">' +
              '<label class="campo"><span class="campo__rot">Quantidade</span>' +
                '<input class="entrada" id="mv-qtd" type="number" inputmode="numeric" min="0" placeholder="0"></label>' +
              (chegada
                ? '<label class="campo"><span class="campo__rot">Unidade</span>' +
                  '<select class="entrada" id="mv-unidade">' +
                    Checklist.LISTA_UNIDADES.map(function (u) { return '<option' + (u === 'UN' ? ' selected' : '') + '>' + u + '</option>'; }).join('') +
                  '</select></label>'
                : '') +
            '</div>' +
            (chegada
              ? '<label class="campo"><span class="campo__rot">Dia da entrega</span>' +
                '<input class="entrada" id="mv-entrega" type="date" value="' + U.hojeISO() + '"></label>' +
                (Sessao.ehCoordenador()
                  ? '<label class="campo"><span class="campo__rot">Devolver ao fornecedor até</span>' +
                    '<input class="entrada" id="mv-data" type="date"></label>'
                  : '<p class="mut peq" style="margin-bottom:12px">📅 A <b>data de devolução</b> é definida depois pelo coordenador — ' +
                    'ele recebe o aviso desta chegada.</p>')
              : '') +
            (precisaEvento
              ? '<label class="campo"><span class="campo__rot">' + (tipo === 'envio' ? 'Para qual evento?' : 'De qual evento voltou?') + '</span>' +
                '<select class="entrada" id="mv-evento">' +
                  eventosAtivos.map(function (e) { return '<option value="' + e.id + '">' + U.esc(e.nome) + '</option>'; }).join('') +
                '</select></label>'
              : '') +
            '<label class="campo"><span class="campo__rot">Observação (opcional)</span>' +
              '<input class="entrada" id="mv-obs" placeholder="Ex.: nota 1234, motorista Zé"></label>',
          pe: '<button class="btn btn--branco" data-x>Cancelar</button>' +
              '<button class="btn btn--verde" data-ok>LANÇAR</button>',
          travado: true
        });
        m.querySelector('[data-x]').addEventListener('click', m.fechar);

        /* chegada: escolher do catálogo preenche a unidade sozinho;
           "Outro material" abre o campo para digitar */
        var selMat = m.querySelector('#mv-material-sel');
        if (selMat) selMat.addEventListener('change', function () {
          var outroCaixa = m.querySelector('#mv-material-outro-caixa');
          var unSel = m.querySelector('#mv-unidade');
          if (selMat.value === '__outro') {
            outroCaixa.hidden = false;
            m.querySelector('#mv-material-outro').focus();
          } else {
            outroCaixa.hidden = true;
            var opcao = selMat.options[selMat.selectedIndex];
            if (unSel && opcao && opcao.dataset.un) unSel.value = opcao.dataset.un;
          }
        });

        m.querySelector('[data-ok]').addEventListener('click', function () {
          var campoMat = m.querySelector('#mv-material');
          var material;
          if (campoMat) {
            material = campoMat.value.trim().replace(/\s+/g, ' ');
          } else {
            var s2 = m.querySelector('#mv-material-sel');
            material = s2.value === '__outro'
              ? m.querySelector('#mv-material-outro').value.trim().replace(/\s+/g, ' ')
              : s2.value.trim();
            if (!material && s2.value !== '__outro') {
              return U.aviso('Escolha o material na lista (ou "Outro" para digitar).', 'erro', 5000);
            }
          }
          var qtd = U.num(m.querySelector('#mv-qtd').value);
          var obs = m.querySelector('#mv-obs').value.trim();
          if (material.length < 2) return U.aviso('Informe o material.', 'erro');
          if (!(qtd > 0)) return U.aviso('Informe a quantidade.', 'erro');

          var item = saldos[Terceiros.chave(material)];
          var unidade = chegada ? m.querySelector('#mv-unidade').value : (item ? item.unidade : 'UN');
          var dataDev = null, eventoId = null, dataEntrega = null;

          if (chegada) {
            dataEntrega = m.querySelector('#mv-entrega').value || U.hojeISO();
            var campoDev = m.querySelector('#mv-data');
            dataDev = campoDev ? (campoDev.value || null) : null;   /* coordenador pode já definir */
          } else {
            if (!item) return U.aviso('Este material não tem chegada registrada.', 'erro', 5000);
            if (tipo === 'envio' && qtd > item.noGalpao) {
              return U.aviso('Só há ' + U.fmt(item.noGalpao) + ' no galpão deste material.', 'erro', 6000);
            }
            if (tipo === 'devolucao' && qtd > item.noGalpao) {
              return U.aviso('Para devolver, o material precisa estar no galpão (tem ' + U.fmt(item.noGalpao) + '). Registre antes o ↩️ retorno do evento.', 'erro', 7000);
            }
          }
          if (precisaEvento) {
            eventoId = m.querySelector('#mv-evento').value;
            if (tipo === 'retorno') {
              var fora = item.porEvento[eventoId] || 0;
              if (qtd > fora) return U.aviso('Este evento tem só ' + U.fmt(fora) + ' deste material.', 'erro', 6000);
            }
          }

          var b = m.querySelector('[data-ok]');
          b.disabled = true; b.textContent = 'Lançando...';
          Banco.criarMovTerceiro({
            fornecedor_id: fornecedorId,
            material: material,
            unidade: unidade,
            tipo: tipo,
            quantidade: qtd,
            evento_id: eventoId,
            data_entrega: dataEntrega,
            data_devolucao: dataDev,
            observacao: obs || null,
            usuario_id: Sessao.atual.id
          }).then(function () {
            m.fechar();
            U.aviso('✓ Lançado: ' + Terceiros.rotulo[tipo] + ' · ' + U.fmt(qtd) + ' ' + material + '.', 'ok', 5000);
            App.recarregar();
          }).catch(function (e) {
            b.disabled = false; b.textContent = 'LANÇAR';
            App.falhou(e);
          });
        });
      }

      U.$$('.js-def-prazo', tela).forEach(function (b) {
        b.addEventListener('click', function () {
          var mov = semPrazo.filter(function (m) { return m.id === b.dataset.mov; })[0];
          if (!mov) return;
          var md = U.modal({
            titulo: '📅 Devolução — ' + mov.material,
            html: '<p class="mut peq" style="margin-bottom:12px">' + U.fmt(mov.quantidade) + ' ' + U.esc(mov.material) +
                (mov.data_entrega ? ' · entregue em ' + U.fmtData(mov.data_entrega) : '') +
                '. O sistema avisa faltando <b>5, 3 e 1 dia</b> da devolução.</p>' +
              '<label class="campo"><span class="campo__rot">Devolver ao fornecedor até</span>' +
                '<input class="entrada" id="prazo-data" type="date"></label>',
            pe: '<button class="btn btn--branco" data-x>Cancelar</button>' +
                '<button class="btn btn--verde" data-ok>SALVAR PRAZO</button>',
            travado: true
          });
          md.querySelector('[data-x]').addEventListener('click', md.fechar);
          md.querySelector('[data-ok]').addEventListener('click', function () {
            var data = md.querySelector('#prazo-data').value;
            if (!data) return U.aviso('Escolha a data de devolução.', 'erro');
            Banco.atualizarMovTerceiro(mov.id, { data_devolucao: data })
              .then(function () {
                md.fechar();
                U.aviso('✓ Devolução marcada para ' + U.fmtData(data) + '. Aviso em 5, 3 e 1 dia.', 'ok', 5000);
                App.recarregar();
              }).catch(App.falhou);
          });
        });
      });

      U.$('#mv-chegada').addEventListener('click', function () { lancar('chegada'); });
      U.$('#mv-devolucao').addEventListener('click', function () { lancar('devolucao'); });
    })
    .catch(function (e) {
      tela.innerHTML = '<div class="aviso aviso--vermelho"><span class="aviso__ico">⚠</span><div>' +
        '<b>Não foi possível carregar.</b>' + U.esc(e.message) + '</div></div>' +
        '<button class="btn btn--branco btn--bloco" onclick="App.voltar()">Voltar</button>';
    });
}

/* ============================================================
   Ferramentas do galpão: carrinho 4 rodas, escada, martelete,
   marreta... Quem pega para um evento registra a saída; quando
   volta, registra a volta. Todo mundo vê onde cada uma está.
   ============================================================ */
function TelaFerramentas() {
  App.topo('FERRAMENTAS', 'Carrinho, escada, martelete, marreta...');
  var tela = U.$('#tela');
  tela.innerHTML = U.carregando('Buscando as ferramentas...');
  var ehCoord = Sessao.ehCoordenador();

  Promise.all([Banco.listarFerramentas(), Banco.listarMovFerramentas(), App.carregarBase()])
    .then(function (r) {
      var ferramentas = r[0], movimentos = r[1];
      var saldos = Ferramentas.saldos(ferramentas, movimentos);
      var eventosAtivos = App.eventos.filter(function (e) {
        return e.status !== 'Finalizado' && e.status !== 'Com divergência';
      });

      function nomeEvento(id) {
        var ev = App.eventos.filter(function (e) { return e.id === id; })[0];
        return ev ? ev.nome : 'Evento apagado';
      }

      var h = '<div class="cartao"><div class="cartao__topo"><h3>➕ Cadastrar ferramenta</h3></div>' +
        '<div class="cartao__corpo">' +
          '<label class="campo"><span class="campo__rot">Nome</span>' +
            '<input id="fe-nome" class="entrada" placeholder="Ex.: Carrinho 4 rodas, Escada 6 degraus"></label>' +
          '<label class="campo"><span class="campo__rot">Quantidade no galpão</span>' +
            '<input id="fe-qtd" class="entrada" type="number" inputmode="numeric" placeholder="Ex.: 2"></label>' +
          '<button class="btn btn--laranja btn--bloco" id="btn-add-fe">CADASTRAR</button>' +
        '</div></div>';

      h += '<div class="busca-prod"><input type="search" id="busca-fe" ' +
        'placeholder="🔍 Buscar ferramenta..." autocomplete="off"></div>';

      h += '<h2 class="secao__tit">Ferramentas <span class="n">' + ferramentas.length + '</span></h2>';
      if (!ferramentas.length) {
        h += '<div class="vazio"><p class="vazio__ico">🧰</p><h3>Nenhuma ferramenta</h3>' +
          '<p>Cadastre acima: carrinho 4 rodas, escada, martelete, marreta...</p></div>';
      } else {
        h += ferramentas.map(function (f) {
          var s = saldos[f.id] || { galpao: 0, porEvento: {} };
          var fora = Object.keys(s.porEvento)
            .filter(function (ev) { return s.porEvento[ev] > 0; })
            .map(function (ev) { return U.esc(nomeEvento(ev)) + ' (<b>' + U.fmt(s.porEvento[ev]) + '</b>)'; });
          return '<div class="carga" data-nome="' + U.esc(f.nome.toLowerCase()) + '">' +
            '<div class="carga__cam"><span>🧰</span>' +
              '<span><b>' + U.esc(f.nome) + '</b>' +
                '<span class="peq mut" style="display:block">' +
                  'No galpão: <b style="color:' + (s.galpao < 0 ? 'var(--vermelho)' : 'var(--verde)') + '">' + U.fmt(s.galpao) + '</b>' +
                  (fora.length ? ' · Em evento: ' + fora.join(' · ') : '') +
                '</span></span>' +
              '<span style="margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">' +
                '<button class="btn btn--laranja btn--peq js-fe-saiu" data-id="' + f.id + '">🚚 Saiu</button>' +
                '<button class="btn btn--peq js-fe-voltou" data-id="' + f.id + '">↩️ Voltou</button>' +
                '<button class="btn btn--branco btn--peq js-fe-mov" data-id="' + f.id + '">Movimentos</button>' +
                (ehCoord ? '<button class="btn btn--branco btn--peq js-fe-ajuste" data-id="' + f.id + '">Ajustar</button>' : '') +
                (ehCoord ? '<button class="btn btn--branco btn--peq js-fe-excluir" data-id="' + f.id + '" style="color:var(--vermelho);border-color:var(--vermelho)">Excluir</button>' : '') +
              '</span>' +
            '</div>' +
          '</div>';
        }).join('');
      }

      h += '<button class="btn btn--branco btn--bloco" style="margin-top:14px" onclick="App.voltar()">Voltar</button>';
      tela.innerHTML = h;

      var busca = U.$('#busca-fe', tela);
      if (busca) busca.addEventListener('input', function () {
        var t = busca.value.trim().toLowerCase();
        U.$$('.carga[data-nome]', tela).forEach(function (cx) {
          cx.style.display = !t || (cx.dataset.nome || '').indexOf(t) >= 0 ? '' : 'none';
        });
      });

      U.$('#btn-add-fe').addEventListener('click', function () {
        var nome = U.$('#fe-nome').value.trim().replace(/\s+/g, ' ');
        var qtd = U.num(U.$('#fe-qtd').value);
        if (nome.length < 2) return U.aviso('Dê um nome para a ferramenta.', 'erro');
        var repetida = ferramentas.some(function (f) { return f.nome.trim().toUpperCase() === nome.toUpperCase(); });
        if (repetida) return U.aviso('Essa ferramenta já está cadastrada.', 'erro', 5000);
        var b = this;
        b.disabled = true; b.textContent = 'Cadastrando...';
        Banco.criarFerramenta({ nome: nome, ativo: true }).then(function (nova) {
          if (qtd > 0) {
            return Banco.criarMovFerramenta({
              ferramenta_id: nova.id, tipo: 'entrada', quantidade: qtd,
              usuario_id: Sessao.atual.id, observacao: 'Cadastro'
            });
          }
        }).then(function () {
          U.aviso('✓ ' + nome + ' cadastrada.', 'ok');
          App.recarregar();
        }).catch(function (e) { b.disabled = false; b.textContent = 'CADASTRAR'; App.falhou(e); });
      });

      function achar(id) { return ferramentas.filter(function (f) { return f.id === id; })[0]; }

      function lancarFe(f, tipo) {
        var s = saldos[f.id] || { galpao: 0, porEvento: {} };
        var saiu = tipo === 'saida';
        var eventosVoltar = Object.keys(s.porEvento).filter(function (ev) { return s.porEvento[ev] > 0; });
        if (saiu && !eventosAtivos.length) return U.aviso('Nenhum evento em andamento.', 'erro', 5000);
        if (saiu && s.galpao <= 0) return U.aviso('Não há ' + f.nome + ' no galpão (tem ' + U.fmt(s.galpao) + ').', 'erro', 6000);
        if (!saiu && !eventosVoltar.length) return U.aviso('Nenhuma ' + f.nome + ' está em evento.', 'erro', 5000);

        var m = U.modal({
          titulo: (saiu ? '🚚 Saiu — ' : '↩️ Voltou — ') + f.nome,
          html:
            '<label class="campo"><span class="campo__rot">' + (saiu ? 'Para qual evento?' : 'De qual evento?') + '</span>' +
              '<select class="entrada" id="fe-evento">' +
                (saiu
                  ? eventosAtivos.map(function (e) { return '<option value="' + e.id + '">' + U.esc(e.nome) + '</option>'; }).join('')
                  : eventosVoltar.map(function (ev) {
                      return '<option value="' + ev + '">' + U.esc(nomeEvento(ev)) + ' (' + U.fmt(s.porEvento[ev]) + ' lá)</option>';
                    }).join('')) +
              '</select></label>' +
            '<label class="campo"><span class="campo__rot">Quantidade</span>' +
              '<input class="entrada" id="fe-mov-qtd" type="number" inputmode="numeric" min="1" value="1"></label>' +
            '<label class="campo"><span class="campo__rot">Observação (opcional)</span>' +
              '<input class="entrada" id="fe-obs" placeholder="Ex.: levou com a equipe do Jailson"></label>',
          pe: '<button class="btn btn--branco" data-x>Cancelar</button>' +
              '<button class="btn btn--verde" data-ok>LANÇAR</button>',
          travado: true
        });
        m.querySelector('[data-x]').addEventListener('click', m.fechar);
        m.querySelector('[data-ok]').addEventListener('click', function () {
          var eventoId = m.querySelector('#fe-evento').value;
          var qtd = U.num(m.querySelector('#fe-mov-qtd').value);
          var obs = m.querySelector('#fe-obs').value.trim();
          if (!(qtd > 0)) return U.aviso('Informe a quantidade.', 'erro');
          if (saiu && qtd > s.galpao) return U.aviso('Só há ' + U.fmt(s.galpao) + ' no galpão.', 'erro', 5000);
          if (!saiu && qtd > (s.porEvento[eventoId] || 0)) {
            return U.aviso('Esse evento tem só ' + U.fmt(s.porEvento[eventoId] || 0) + '.', 'erro', 5000);
          }
          var b = m.querySelector('[data-ok]');
          b.disabled = true; b.textContent = 'Lançando...';
          Banco.criarMovFerramenta({
            ferramenta_id: f.id, tipo: tipo, quantidade: qtd,
            evento_id: eventoId, observacao: obs || null, usuario_id: Sessao.atual.id
          }).then(function () {
            m.fechar();
            U.aviso('✓ ' + f.nome + ': ' + (saiu ? 'saiu para ' : 'voltou de ') + nomeEvento(eventoId) + ' (' + U.fmt(qtd) + ').', 'ok', 5000);
            App.recarregar();
          }).catch(function (e) { b.disabled = false; b.textContent = 'LANÇAR'; App.falhou(e); });
        });
      }

      U.$$('.js-fe-saiu', tela).forEach(function (b) {
        b.addEventListener('click', function () { lancarFe(achar(b.dataset.id), 'saida'); });
      });
      U.$$('.js-fe-voltou', tela).forEach(function (b) {
        b.addEventListener('click', function () { lancarFe(achar(b.dataset.id), 'retorno'); });
      });

      U.$$('.js-fe-ajuste', tela).forEach(function (b) {
        b.addEventListener('click', function () {
          var f = achar(b.dataset.id);
          var s = saldos[f.id] || { galpao: 0 };
          var m = U.modal({
            titulo: '🛠️ Ajustar ' + f.nome,
            html: '<p class="mut peq" style="margin-bottom:10px">No galpão hoje: <b>' + U.fmt(s.galpao) + '</b>. ' +
                'Informe o ajuste: número positivo soma (comprou, achou), negativo desconta (quebrou, sumiu).</p>' +
              '<label class="campo"><span class="campo__rot">Ajuste (+ ou −)</span>' +
                '<input class="entrada" id="fa-qtd" type="number" inputmode="numeric" placeholder="Ex.: 2 ou -1"></label>' +
              '<label class="campo"><span class="campo__rot">Motivo (obrigatório)</span>' +
                '<input class="entrada" id="fa-motivo" placeholder="Ex.: comprou 2 novas, marreta quebrou"></label>',
            pe: '<button class="btn btn--branco" data-x>Cancelar</button>' +
                '<button class="btn btn--verde" data-ok>LANÇAR AJUSTE</button>'
          });
          m.querySelector('[data-x]').addEventListener('click', m.fechar);
          m.querySelector('[data-ok]').addEventListener('click', function () {
            var q = U.num(m.querySelector('#fa-qtd').value);
            var motivo = m.querySelector('#fa-motivo').value.trim();
            if (!q) return U.aviso('Informe a quantidade do ajuste.', 'erro');
            if (!motivo) return U.aviso('Escreva o motivo do ajuste.', 'erro');
            Banco.criarMovFerramenta({
              ferramenta_id: f.id, tipo: 'ajuste', quantidade: q,
              usuario_id: Sessao.atual.id, observacao: motivo
            }).then(function () {
              m.fechar();
              U.aviso('✓ ' + f.nome + ': ajuste de ' + (q > 0 ? '+' : '') + U.fmt(q) + '.', 'ok');
              App.recarregar();
            }).catch(App.falhou);
          });
        });
      });

      U.$$('.js-fe-mov', tela).forEach(function (b) {
        b.addEventListener('click', function () {
          var f = achar(b.dataset.id);
          var meus = movimentos.filter(function (m) { return m.ferramenta_id === f.id; }).slice(0, 30);
          var mv = U.modal({
            titulo: '📜 Movimentos — ' + f.nome,
            html: meus.length
              ? meus.map(function (m) {
                  var soma = m.tipo === 'entrada' || m.tipo === 'retorno' || (m.tipo === 'ajuste' && m.quantidade > 0);
                  return '<div style="border-bottom:1px solid var(--linha);padding:8px 0">' +
                    '<b style="color:' + (soma ? 'var(--verde)' : 'var(--laranja)') + '">' +
                      (soma ? '+' : '−') + U.fmt(Math.abs(m.quantidade)) + '</b> · ' +
                    (Ferramentas.rotulo[m.tipo] || m.tipo) +
                    (m.evento_id ? ' · <b>' + U.esc(nomeEvento(m.evento_id)) + '</b>' : '') +
                    '<span class="peq mut" style="display:block">' + U.fmtDataHora(m.created_at) + ' · ' +
                      U.esc(App.nomeUsuario(m.usuario_id)) +
                      (m.observacao ? ' · ' + U.esc(m.observacao) : '') + '</span>' +
                  '</div>';
                }).join('')
              : '<p class="mut">Nenhum movimento ainda.</p>',
            pe: '<button class="btn btn--branco" data-x>Fechar</button>'
          });
          mv.querySelector('[data-x]').addEventListener('click', mv.fechar);
        });
      });

      U.$$('.js-fe-excluir', tela).forEach(function (b) {
        b.addEventListener('click', function () {
          var f = achar(b.dataset.id);
          pedirSenhaCoordenador('Excluir ferramenta',
            'Apagar "' + f.nome + '" e todos os movimentos dela? Não dá para desfazer. Digite a senha do coordenador.')
            .then(function (ok) {
              if (!ok) return;
              Banco.apagarFerramenta(f.id)
                .then(function () { U.aviso('🗑️ ' + f.nome + ' excluída.', 'ok'); App.recarregar(); })
                .catch(App.falhou);
            });
        });
      });
    })
    .catch(function (e) {
      tela.innerHTML = '<div class="aviso aviso--vermelho"><span class="aviso__ico">⚠</span><div>' +
        '<b>Não foi possível carregar.</b>' + U.esc(e.message) +
        '<br><span class="peq">Se for a primeira vez, rode o SQL novo no Supabase.</span></div></div>' +
        '<button class="btn btn--branco btn--bloco" onclick="App.voltar()">Voltar</button>';
    });
}

/* ============================================================
   Material terceirizado — painel dos fornecedores
   Cada chegada alimenta o estoque DO FORNECEDOR, com a data em
   que precisa ser devolvido. Os envios mostram para onde foi.
   ============================================================ */
function TelaTerceiros() {
  App.topo('MATERIAL TERCEIRIZADO', 'Estoque por fornecedor');
  var tela = U.$('#tela');
  tela.innerHTML = U.carregando('Buscando os fornecedores...');
  var ehCoord = Sessao.ehCoordenador();

  Promise.all([Banco.listarFornecedores(), Banco.listarMovTerceiros(), App.carregarBase()])
    .then(function (r) {
      var fornecedores = r[0], movimentos = r[1];
      var saldos = Terceiros.saldos(movimentos);
      var avisos = Terceiros.vencimentos(movimentos, saldos);

      var h = '';

      /* cadastro: conferente e coordenador — quando o material chega,
         quem está no galpão registra na hora */
      h += '<div class="cartao"><div class="cartao__topo"><h3>➕ Cadastrar fornecedor</h3></div>' +
        '<div class="cartao__corpo">' +
          '<label class="campo"><span class="campo__rot">Nome do fornecedor</span>' +
            '<input id="fo-nome" class="entrada" placeholder="Ex.: Locadora Silva Estruturas"></label>' +
          '<label class="campo"><span class="campo__rot">Contato (telefone/pessoa — opcional)</span>' +
            '<input id="fo-contato" class="entrada" placeholder="Ex.: (21) 99999-0000 · João"></label>' +
          '<button class="btn btn--laranja btn--bloco" id="btn-add-forn">CADASTRAR E REGISTRAR CHEGADA</button>' +
          '<p class="mut peq" style="margin-top:8px">Depois do cadastro, a tela do fornecedor abre para você lançar ' +
            'a 📥 chegada com o material e o dia da entrega. A data de devolução é definida pelo coordenador.</p>' +
        '</div></div>';

      /* coordenador: chegadas esperando o prazo de devolução */
      if (ehCoord) {
        var pendentes = Terceiros.semPrazo(movimentos, saldos);
        if (pendentes.length) {
          var nomeF2 = function (id) {
            var f = fornecedores.filter(function (x) { return x.id === id; })[0];
            return f ? f.nome : 'Fornecedor';
          };
          h += '<div class="aviso aviso--azul"><span class="aviso__ico">📅</span><div>' +
            '<b>' + pendentes.length + ' chegada' + (pendentes.length > 1 ? 's' : '') + ' sem data de devolução.</b>' +
            'Abra o fornecedor e toque em 📅 DEFINIR DEVOLUÇÃO:' +
            pendentes.slice(0, 5).map(function (m) {
              return '<br>• ' + U.fmt(m.quantidade) + ' ' + U.esc(m.material) + ' — ' + U.esc(nomeF2(m.fornecedor_id)) +
                (m.data_entrega ? ' (entregue ' + U.fmtData(m.data_entrega) + ')' : '');
            }).join('') +
          '</div></div>';
        }
      }

      /* devoluções vencendo */
      if (avisos.length) {
        var nomeF = function (id) {
          var f = fornecedores.filter(function (x) { return x.id === id; })[0];
          return f ? f.nome : 'Fornecedor';
        };
        h += '<div class="aviso aviso--amarelo"><span class="aviso__ico">⏰</span><div>' +
          '<b>Devoluções para ficar de olho:</b>' +
          avisos.slice(0, 6).map(function (a) {
            var quando = a.dias < 0 ? '<b style="color:var(--vermelho)">venceu há ' + Math.abs(a.dias) + ' dia' + (Math.abs(a.dias) > 1 ? 's' : '') + '</b>'
              : a.dias === 0 ? '<b>vence HOJE</b>'
              : 'vence em ' + a.dias + ' dia' + (a.dias > 1 ? 's' : '');
            return '<br>• ' + U.esc(a.material) + ' (' + U.esc(nomeF(a.fornecedor_id)) + ') — ' + quando + ' · ' + U.fmt(a.saldo) + ' em mãos';
          }).join('') +
        '</div></div>';
      }

      h += '<h2 class="secao__tit">Fornecedores <span class="n">' + fornecedores.length + '</span></h2>';

      if (!fornecedores.length) {
        h += '<div class="vazio"><p class="vazio__ico">🔗</p><h3>Nenhum fornecedor ainda</h3>' +
          '<p>' + (ehCoord ? 'Cadastre acima o primeiro fornecedor de material terceirizado.'
                           : 'Peça ao coordenador para cadastrar os fornecedores.') + '</p></div>';
      } else {
        h += fornecedores.map(function (f) {
          var itens = saldos[f.id] || {};
          var chaves = Object.keys(itens).filter(function (ch) { return itens[ch].emMaos > 0 || itens[ch].emEventos !== 0; });
          var totalMaos = 0, totalEventos = 0;
          chaves.forEach(function (ch) { totalMaos += itens[ch].emMaos; totalEventos += Math.max(0, itens[ch].emEventos); });
          var comAviso = avisos.some(function (a) { return a.fornecedor_id === f.id; });
          return '<div class="carga">' +
            '<div class="carga__cam"><span>🔗</span>' +
              '<span><b>' + U.esc(f.nome) + '</b>' + (comAviso ? ' <span class="terc-tag" style="background:var(--vermelho-clr);border-color:#F5C6C6;color:var(--vermelho)">⏰ devolução</span>' : '') +
                '<span class="peq mut" style="display:block">' +
                  (chaves.length
                    ? chaves.length + ' materiais · Em mãos: <b>' + U.fmt(totalMaos) + '</b>' +
                      (totalEventos > 0 ? ' · Em eventos: <b style="color:var(--laranja)">' + U.fmt(totalEventos) + '</b>' : '')
                    : 'Sem material em mãos') +
                  (f.contato ? ' · ' + U.esc(f.contato) : '') +
                '</span></span>' +
              '<button class="btn btn--peq js-abrir-forn" data-id="' + f.id + '" style="margin-left:auto">ABRIR</button>' +
            '</div>' +
          '</div>';
        }).join('');
      }

      h += '<button class="btn btn--branco btn--bloco" style="margin-top:14px" onclick="App.voltar()">Voltar</button>';
      tela.innerHTML = h;

      var addForn = U.$('#btn-add-forn', tela);
      if (addForn) addForn.addEventListener('click', function () {
