        img.src = leitor.result;
      };
      leitor.onerror = function () { reject(new Error('Não consegui ler o arquivo.')); };
      leitor.readAsDataURL(arquivo);
    });
  }

  function blocoFoto() {
    return '<div class="foto-bloco' + (foto ? ' tem' : '') + '" id="bloco-foto">' +
      '<p style="font-weight:800;color:var(--azul)">📷 Foto do carregamento <span style="color:var(--vermelho)">(obrigatória)</span></p>' +
      '<p class="mut peq" style="margin:4px 0 10px">' + (foto
        ? 'Foto anexada. Sem ela não dá para finalizar — se tirar, anexe outra.'
        : 'Tire a foto do caminhão carregado. A conferência só finaliza com a foto.') + '</p>' +
      (foto ? '<img src="' + foto + '" alt="Foto do carregamento">' : '') +
      '<div class="btn-linha" style="margin-top:12px">' +
        '<button class="btn ' + (foto ? 'btn--branco' : 'btn--laranja') + '" id="btn-foto-camera">📷 ' +
          (foto ? 'Trocar pela câmera' : 'ABRIR A CÂMERA') + '</button>' +
        '<button class="btn btn--branco" id="btn-foto-galeria">🖼️ ' +
          (foto ? 'Trocar pela galeria' : 'ESCOLHER DO TELEFONE') + '</button>' +
        (foto ? '<button class="btn btn--branco" id="btn-foto-remover">Remover</button>' : '') +
      '</div>' +
      '<input type="file" id="campo-foto-camera" accept="image/*" capture="environment" hidden>' +
      '<input type="file" id="campo-foto-galeria" accept="image/*" hidden>' +
    '</div>';
  }

  /* ---------- tela travada (conferência finalizada) ---------- */
  function desenharTravada() {
    /* evento encerrado e conferência que nem chegou a existir: só o recado */
    if (!conferencia) {
      U.$('#tela').innerHTML =
        '<div class="trava"><b>🏁 Evento encerrado.</b> ' +
        'Esta conferência não foi feita antes do encerramento e agora o evento é só visualização.</div>' +
        '<button class="btn btn--branco btn--bloco" onclick="App.voltar()">Voltar</button>';
      return;
    }

    var h = '<div class="trava"><b>' +
      (finalizada()
        ? '🔒 Conferência finalizada' + (conferencia.status === 'Com divergência' ? ' com divergência' : '')
        : '🏁 Evento encerrado — conferência em modo visualização') + '.</b> ' +
      'Os números não podem mais ser alterados. Só o coordenador consegue liberar a edição, com a senha.<br>' +
      '<span class="peq">Finalizada por ' + U.esc(App.nomeUsuario(conferencia.conferente_id)) + ' · ' +
      U.fmtDataHora(conferencia.finalizada_em || conferencia.updated_at || conferencia.created_at) + '</span>' +
      ((conferencia.desbloqueios || []).length
        ? '<br><span class="peq">🔓 Desbloqueada ' + conferencia.desbloqueios.length + '× — última vez com ' +
          U.esc(App.nomeUsuario(conferencia.desbloqueios[conferencia.desbloqueios.length - 1].por)) + ' logado, em ' +
          U.fmtDataHora(conferencia.desbloqueios[conferencia.desbloqueios.length - 1].em) + '</span>'
        : '') + '</div>';

    h += '<div class="carga__cam" style="border:2px solid var(--linha);border-radius:var(--r);margin-bottom:14px;background:var(--branco)">' +
      '<span>🚛</span><b>' + U.esc(nomeCaminhao(pacote.caminhoes, carregamento.caminhao_id)) + '</b></div>';

    /* agora, mesmo no retorno às cegas, a comparação é revelada */
    if (cega) {
      /* retorno: mostra o que chegou NESTE caminhão; a comparação geral é do evento */
      var registrados = linhas.filter(function (l) { return l.retorno !== null; });
      h += '<div class="cartao"><div class="cartao__topo"><h3>O que chegou neste caminhão</h3>' + selo(conferencia.status) + '</div>' +
        '<div class="tabela-rolagem"><table class="tab"><thead><tr>' +
          '<th>Produto</th><th style="width:56px">Un.</th>' +
          '<th class="num">Registrado</th><th class="num">Danif.</th>' +
        '</tr></thead><tbody>' +
        registrados.map(function (l) {
          var conta = Calculo.detalhe(l, tipo);
          var dq = l.dano ? l.dano.qtd : 0;
          return '<tr><td>' + U.esc(l.nome) + tagTerc(l.produto) +
            (conta ? '<br><span class="peq" style="color:var(--txt-3)">📦 ' + U.esc(conta) + '</span>' : '') + '</td>' +
            '<td>' + U.esc(l.unidade) + '</td>' +
            '<td class="num">' + U.fmt(l.retorno) +
              (l.tercRetorno ? '<br><span class="terc-tag">🔗 ' + U.fmt(l.tercRetorno) + ' terc.</span>' : '') + '</td>' +
            '<td class="num" style="color:#8a5a00;font-weight:800">' + (dq ? '🟠 ' + U.fmt(dq) : '—') + '</td></tr>';
        }).join('') +
        '</tbody></table></div>' +
        '<div class="cartao__corpo"><p class="mut peq">' +
          (registrados.length < linhas.length
            ? 'Os produtos que não aparecem aqui não vieram neste caminhão. '
            : '') +
          'A comparação de <b>tudo que voltou × tudo que saiu</b> fica na barra de retorno, na tela do evento.</p></div></div>';
    } else {
      /* saída finalizada: hora de imprimir a nota fiscal que o coordenador anexou */
      var notasEv = (pacote.evento && pacote.evento.notas_fiscais) || [];
      h += notasEv.length
        ? '<div class="cartao"><div class="cartao__corpo">' +
            '<h3 style="font-size:17px;color:var(--azul)">🧾 Nota fiscal do evento</h3>' +
            '<p class="mut peq" style="margin-top:4px">Carregamento finalizado — abra a nota em outra aba e imprima para seguir com o caminhão.</p>' +
            botoesNotaFiscal(pacote.evento, 'IMPRIMIR NOTA FISCAL') +
          '</div></div>'
        : '<div class="aviso aviso--azul"><span class="aviso__ico">🧾</span><div>' +
          '<b>Nota fiscal ainda não anexada.</b>' +
          'Peça ao coordenador para anexar na tela do evento — o botão de imprimir aparece aqui.</div></div>';

      h += '<div class="cartao"><div class="cartao__topo"><h3>Resultado</h3>' + selo(conferencia.status) + '</div>' +
        '<div class="tabela-rolagem"><table class="tab"><thead><tr>' +
          '<th>Produto</th><th style="width:56px">Un.</th><th class="num">' + U.esc(info.base) + '</th>' +
          '<th class="num">Conferido</th><th class="num">Diferença</th>' +
        '</tr></thead><tbody>' +
        linhas.map(function (l) {
          var base = Calculo.base(l, tipo);
          var c = Calculo.contado(l, tipo);
          var dif = c === null ? null : c - base;
          var conta = Calculo.detalhe(l, tipo);
          return '<tr><td>' + U.esc(l.nome) + tagTerc(l.produto) +
            (conta ? '<br><span class="peq" style="color:var(--txt-3)">📦 ' + U.esc(conta) + '</span>' : '') + '</td>' +
            '<td>' + U.esc(l.unidade) + '</td>' +
            '<td class="num">' + U.fmt(base) + '</td>' +
            '<td class="num">' + (c === null ? '—' : U.fmt(c)) +
              (l.tercSaida ? '<br><span class="terc-tag">🔗 ' + U.fmt(l.tercSaida) + ' terc.</span>' : '') + '</td>' +
            '<td class="num ' + classeDif(dif) + '">' + textoDif(dif) + '</td></tr>';
        }).join('') +
        '</tbody></table></div></div>';
    }

    /* fotos e descrições dos itens danificados */
    if (cega) {
      var comDano = linhas.filter(function (l) { return l.dano && l.dano.qtd > 0; });
      if (comDano.length) {
        h += '<div class="cartao"><div class="cartao__topo"><h3>🟠 Itens danificados</h3></div><div class="cartao__corpo">' +
          comDano.map(function (l) {
            return '<div class="dano" style="margin-top:10px">' +
              '<p class="dano__rot">' + U.esc(l.nome) + ' — ' + U.fmt(l.dano.qtd) + ' danificado' + (l.dano.qtd > 1 ? 's' : '') + '</p>' +
              '<p style="margin:4px 0 8px">' + U.esc(l.dano.descricao || 'Sem descrição') + '</p>' +
              (l.dano.foto ? '<img src="' + l.dano.foto + '" alt="Foto do dano" style="width:100%;max-height:220px;object-fit:cover;border-radius:10px">' : '') +
            '</div>';
          }).join('') +
        '</div></div>';
      }
    }

    if (foto) {
      h += '<div class="foto-bloco tem"><p style="font-weight:800;color:var(--azul)">📷 Foto do carregamento</p>' +
        '<img src="' + foto + '" alt="Foto do carregamento"></div>';
    }

    h += '<button class="btn btn--laranja btn--bloco btn--gg" id="btn-desbloquear">🔓 DESBLOQUEAR (SENHA DO COORDENADOR)</button>' +
      '<button class="btn btn--branco btn--bloco" style="margin-top:10px" onclick="App.voltar()">Voltar para o evento</button>';

    tela.innerHTML = h;

    ligarBotoesNotaFiscal(U.$('#tela'));

    U.$('#btn-desbloquear').addEventListener('click', function () {
      pedirSenhaCoordenador('Desbloquear conferência',
        'Esta conferência já foi finalizada. Digite a senha do coordenador para liberar a edição.')
        .then(function (ok) {
          if (!ok) return;
          desbloqueada = true;
          /* fica registrado quem estava logado e quando o desbloqueio aconteceu */
          var registro = (conferencia.desbloqueios || []).concat([{
            por: Sessao.atual.id, em: new Date().toISOString()
          }]);
          Banco.atualizarConferencia(conferencia.id, { desbloqueios: registro })
            .then(function (c) { if (c) conferencia = c; })
            .catch(function () { /* sem internet: o desbloqueio vale, o registro vai no próximo salvar */ });
          U.aviso('🔓 Edição liberada pelo coordenador. Ao finalizar de novo, ela trava outra vez.', 'ok', 6000);
          desenhar();
        });
    });
  }

  /* ---------- tela de contagem ---------- */
  function desenhar() {
    if (travada()) return desenharTravada();

    var h = '';

    /* barra de porcentagem do retorno (até finalizar) */
    if (cega) {
      h += '<div class="progresso-fixa" id="prog-topo"></div>';
    }

    var explicacao = cega
      ? '<span class="cega-tag">ÀS CEGAS</span> Conte o que chegou <b>neste caminhão</b>, sem olhar o que saiu. ' +
        '<b>Não precisa voltar tudo de uma vez:</b> o que não veio neste caminhão pode ficar em branco — ' +
        'outros retornos podem ser registrados depois. A comparação geral fica na tela do evento.'
      : 'Conte o que está sendo carregado no caminhão. A diferença é calculada sozinha: <b>Conferido − Previsto</b>';

    h += '<div class="aviso aviso--azul"><span class="aviso__ico">ℹ</span><div>' + explicacao + '</div></div>';

    h += '<div class="carga__cam" style="border:2px solid var(--linha);border-radius:var(--r);margin-bottom:14px;background:var(--branco)">' +
      '<span>🚛</span><b>' + U.esc(nomeCaminhao(pacote.caminhoes, carregamento.caminhao_id)) + '</b>' +
      '<span class="mut peq" style="margin-left:auto">Carregamento ' + carregamento.numero + '</span></div>';

    if (conferencia && !finalizada()) {
      h += '<div class="aviso aviso--amarelo"><span class="aviso__ico">•</span><div>' +
        '<b>Situação: ' + U.esc(conferencia.status) + '</b>' +
        'Contado por ' + U.esc(App.nomeUsuario(conferencia.conferente_id)) + ' · ' +
        U.fmtDataHora(conferencia.updated_at || conferencia.created_at) +
        (conferencia.conferente_id !== Sessao.atual.id
          ? '<br><b>Ao salvar, esta conferência passa a constar no seu nome.</b>'
          : '') + '</div></div>';
    }
    if (finalizada() && desbloqueada) {
      h += '<div class="aviso aviso--amarelo"><span class="aviso__ico">🔓</span><div>' +
        '<b>Edição liberada pelo coordenador.</b> Ao finalizar de novo, a conferência trava outra vez.</div></div>';
    }

    if (!linhas.length) {
      h += '<div class="vazio"><h3>Sem produtos</h3><p>Confirme o checklist antes de conferir.</p></div>';
      tela.innerHTML = h;
      return;
    }

    /* famílias presentes neste checklist (material pode estar em várias) */
    function famsDaLinha(l) { return familiasPorChave[Estoque.chave(l.nome)] || []; }
    var familiasAqui = [];
    var temSemFamilia = false;
    linhas.forEach(function (l) {
      var fams = famsDaLinha(l);
      if (!fams.length) { temSemFamilia = true; return; }
      fams.forEach(function (f) { if (familiasAqui.indexOf(f) < 0) familiasAqui.push(f); });
    });
    familiasAqui.sort();
    var temFamilias = familiasAqui.length > 0;
    if (filtroFamilia && filtroFamilia !== '__sem' && familiasAqui.indexOf(filtroFamilia) < 0) filtroFamilia = '';

    if (linhas.length > 8 || temFamilias) {
      h += '<div class="busca-prod">' +
        (linhas.length > 8
          ? '<input type="search" id="busca-prod" placeholder="🔍 Buscar produto pelo nome..." autocomplete="off">'
          : '') +
        (temFamilias
          ? '<div class="btn-linha" style="margin-top:8px">' +
              '<button class="btn ' + (filtroFamilia === '' ? '' : 'btn--branco') + ' btn--peq js-chip-fam" data-fam="">📂 Todas</button>' +
              familiasAqui.map(function (f) {
                return '<button class="btn ' + (filtroFamilia === f ? '' : 'btn--branco') + ' btn--peq js-chip-fam" data-fam="' + U.esc(f) + '">' + U.esc(f) + '</button>';
              }).join('') +
              (temSemFamilia
                ? '<button class="btn ' + (filtroFamilia === '__sem' ? '' : 'btn--branco') + ' btn--peq js-chip-fam" data-fam="__sem">Sem família</button>'
                : '') +
            '</div>'
          : '') +
      '</div>';
    }

    var listaDesenho = linhas.filter(function (l) {
      if (!filtroFamilia) return true;
      var fams = famsDaLinha(l);
      if (filtroFamilia === '__sem') return fams.length === 0;
      return fams.indexOf(filtroFamilia) >= 0;
    });
    if (filtroFamilia) {
      h += '<h2 class="secao__tit" style="margin-top:14px">📂 ' +
        (filtroFamilia === '__sem' ? 'Sem família' : U.esc(filtroFamilia)) +
        ' <span class="n">' + listaDesenho.length + '</span></h2>';
    }

    h += listaDesenho.map(function (l) { return cardProduto(l); }).join('');

    function cardProduto(l) {
      var id = l.produto.id;
      var base = Calculo.base(l, tipo);
      return '<div class="prod" data-id="' + id + '" data-nome="' + U.esc(l.nome.toLowerCase()) + '">' +
        '<p class="prod__nome">' + U.esc(l.nome) + tagTerc(l.produto) + '</p>' +
        (cega
          ? '<p class="prod__prev mut">Conte o que voltou (' + U.esc(l.unidade) + '). ' +
            'Separe o que voltou <b>em bom estado</b> do que voltou <b>danificado</b>.</p>' +
            '<p class="dano__rot" style="color:var(--verde)">🟢 BOM (voltou inteiro)</p>'
          : '<p class="prod__prev">' + U.esc(info.base) + ': <b>' + U.fmt(base) + ' ' + U.esc(l.unidade) + '</b></p>') +
        '<div class="contador">' +
          '<button class="contador__btn js-menos" data-id="' + id + '" aria-label="Diminuir">−</button>' +
          '<input class="contador__campo js-campo" data-id="' + id + '" type="number" inputmode="numeric" ' +
            'min="0" placeholder="0" value="' + U.esc(contagem[id]) + '" aria-label="Quantidade conferida de ' + U.esc(l.nome) + '">' +
          '<button class="contador__btn js-mais" data-id="' + id + '" aria-label="Aumentar">+</button>' +
        '</div>' +
        '<div class="atalhos">' +
          (cega ? '' : '<button class="atalho js-igual" data-id="' + id + '" data-v="' + base + '">Bateu certo (' + U.fmt(base) + ')</button>') +
          '<button class="atalho js-zero" data-id="' + id + '">Não veio nada (0)</button>' +
        '</div>' +
        (cega ? blocoDano(l) : '') +
        blocoTerc(l) +
        '<p class="prod__res"></p>' +
        blocoEmbalagem(l, base) +
      '</div>';
    }

    h += '<button class="btn btn--branco btn--bloco" id="btn-add-terc" style="border-style:dashed">' +
      '➕ ADICIONAR MATERIAL TERCEIRIZADO <span class="terc-tag">🔗 não mexe no estoque</span></button>';

    h += '<div class="cartao" id="resumo-caixa"><div class="cartao__corpo"></div></div>';

    h += blocoFoto();

    h += '<div class="barra-fixa">' +
      '<button class="btn btn--laranja btn--bloco btn--gg" id="btn-salvar">SALVAR CONFERÊNCIA</button>' +
      '<button class="btn btn--verde btn--bloco" id="btn-finalizar" style="margin-top:10px">FINALIZAR ' +
        (cega ? 'RETORNO' : 'CONFERÊNCIA') + '</button>' +
      '</div>';

    tela.innerHTML = h;

    var busca = U.$('#busca-prod', tela);
    if (busca) busca.addEventListener('input', function () {
      var t = busca.value.trim().toLowerCase();
      U.$$('.prod', tela).forEach(function (cx) {
        cx.style.display = !t || (cx.dataset.nome || '').indexOf(t) >= 0 ? '' : 'none';
      });
    });

    U.$$('.js-chip-fam', tela).forEach(function (chip) {
      chip.addEventListener('click', function () {
        filtroFamilia = chip.dataset.fam;
        desenhar();   /* a contagem fica guardada nas variáveis: nada se perde */
      });
    });

    U.$$('.js-campo', tela).forEach(function (el) {
      el.addEventListener('input', function () { contagem[el.dataset.id] = el.value; pintar(el.dataset.id); });
    });
    U.$$('.js-mais', tela).forEach(function (el) {
      el.addEventListener('click', function () { passo(el.dataset.id, 1); });
    });
    U.$$('.js-menos', tela).forEach(function (el) {
      el.addEventListener('click', function () { passo(el.dataset.id, -1); });
    });
    U.$$('.js-igual', tela).forEach(function (el) {
      el.addEventListener('click', function () { definir(el.dataset.id, U.num(el.dataset.v)); });
    });
    U.$$('.js-zero', tela).forEach(function (el) {
      el.addEventListener('click', function () { definir(el.dataset.id, 0); });
    });

    U.$$('.js-terc-forn', tela).forEach(function (el) {
      el.addEventListener('change', function () {
        tercSel[el.dataset.id] = el.value;
        guardarRascunho();
        pintarTerc(el.dataset.id);
      });
    });

    /* terceirizado por item */
    U.$$('.js-terc-qtd', tela).forEach(function (el) {
      el.addEventListener('input', function () {
        terc[el.dataset.id] = el.value;
        pintarTerc(el.dataset.id);
        pintar(el.dataset.id);   /* atualiza resumo e guarda rascunho */
      });
    });

    /* danificados (retorno) */
    U.$$('.js-dano-qtd', tela).forEach(function (el) {
      el.addEventListener('input', function () {
        danoDe(el.dataset.id).qtd = el.value;
        pintarDano(el.dataset.id);
        pintar(el.dataset.id);   /* pintar() já guarda o rascunho */
      });
    });
    U.$$('.js-dano-desc', tela).forEach(function (el) {
      el.addEventListener('input', function () {
        danoDe(el.dataset.id).desc = el.value;
        guardarRascunho();
        var d = danoDe(el.dataset.id);
        var st = U.$('.js-dano-status[data-id="' + el.dataset.id + '"]', tela);
        if (st && (d.desc || '').trim() && d.foto) {
          st.style.color = 'var(--verde)';
          st.textContent = '🟢 Dano registrado: ' + U.fmt(U.num(d.qtd)) + ' com descrição e foto.';
        } else if (st) {
          el.classList.toggle('falta', !(d.desc || '').trim());
        }
      });
    });
    U.$$('.js-dano-foto', tela).forEach(function (el) {
      el.addEventListener('click', function () {
        var arq = U.$('.js-dano-arquivo[data-id="' + el.dataset.id + '"]', tela);
        if (arq) arq.click();
      });
    });
    U.$$('.js-dano-galeria', tela).forEach(function (el) {
      el.addEventListener('click', function () {
        var arq = U.$('.js-dano-arquivo-gal[data-id="' + el.dataset.id + '"]', tela);
        if (arq) arq.click();
      });
    });
    U.$$('.js-dano-arquivo, .js-dano-arquivo-gal', tela).forEach(function (el) {
      el.addEventListener('change', function () {
        var arquivo = el.files && el.files[0];
        if (!arquivo) return;
        lerFoto(arquivo).then(function (b64) {
          danoDe(el.dataset.id).foto = b64;
          el.value = '';
          pintarDano(el.dataset.id);
          guardarRascunho();
          U.aviso('📷 Foto do dano anexada.', 'ok');
        }).catch(function (e) { U.aviso(e.message, 'erro'); });
      });
    });

    U.$$('.js-emb-abrir', tela).forEach(function (el) {
      el.addEventListener('click', function () {
        U.$('.emb[data-id="' + el.dataset.id + '"]', tela).classList.toggle('is-aberta');
      });
    });
    [['js-emb-por', 'por'], ['js-emb-qtd', 'qtd'], ['js-emb-soltas', 'soltas']].forEach(function (par) {
      U.$$('.' + par[0], tela).forEach(function (el) {
        el.addEventListener('input', function () {
          embalagem[el.dataset.id][par[1]] = el.value;
          mexeuEmbalagem(el.dataset.id);
        });
      });
    });
    U.$$('.js-emb-obs', tela).forEach(function (el) {
      el.addEventListener('input', function () { embalagem[el.dataset.id].obs = el.value; });
    });

    /* foto obrigatória: câmera OU galeria do telefone */
    function ligarEntradaFoto(idBotao, idCampo) {
      var campo = U.$(idCampo, tela);
      var botao = U.$(idBotao, tela);
      if (botao && campo) botao.addEventListener('click', function () { campo.click(); });
      if (campo) campo.addEventListener('change', function () {
        var arq = campo.files && campo.files[0];
        if (!arq) return;
        campo.value = '';
        U.aviso('Preparando a foto...', 'info', 1800);
        lerFoto(arq).then(function (b64) {
          foto = b64;
          guardarRascunho();
          U.aviso('✓ Foto anexada. Não esqueça de salvar ou finalizar.', 'ok');
          desenhar();
        }).catch(function (e) { App.falhou(e); });
      });
    }
    ligarEntradaFoto('#btn-foto-camera', '#campo-foto-camera');
    ligarEntradaFoto('#btn-foto-galeria', '#campo-foto-galeria');
    var btnFotoRem = U.$('#btn-foto-remover', tela);
    if (btnFotoRem) btnFotoRem.addEventListener('click', function () { foto = null; guardarRascunho(); desenhar(); });

    var addTerc = U.$('#btn-add-terc', tela);
    if (addTerc) addTerc.addEventListener('click', function () {
      var m = U.modal({
        titulo: '🔗 Material terceirizado',
        html: '<p class="mut peq" style="margin-bottom:12px">Material alugado ou de fornecedor que chegou para este evento. ' +
            'Ele entra na conferência (saída, retorno, foto, danificado) e nos relatórios, ' +
            'mas <b>não mexe no estoque do galpão</b>.</p>' +
          '<label class="campo"><span class="campo__rot">Nome do material</span>' +
            '<input class="entrada" id="terc-nome" placeholder="Ex.: Piso alugado 50x50"></label>' +
          '<div class="dupla">' +
            '<label class="campo"><span class="campo__rot">Unidade</span>' +
              '<select class="entrada" id="terc-unidade">' +
                Checklist.LISTA_UNIDADES.map(function (u) {
                  return '<option value="' + u + '"' + (u === 'UN' ? ' selected' : '') + '>' + u + '</option>';
                }).join('') +
              '</select></label>' +
            (cega ? '' :
            '<label class="campo"><span class="campo__rot">Quantidade combinada</span>' +
              '<input class="entrada" id="terc-qtd" type="number" inputmode="numeric" min="0" placeholder="Ex.: 50"></label>') +
          '</div>',
        pe: '<button class="btn btn--branco" data-x>Cancelar</button>' +
            '<button class="btn btn--laranja" data-ok>ADICIONAR</button>',
        travado: true
      });
      m.querySelector('[data-x]').addEventListener('click', m.fechar);
      m.querySelector('[data-ok]').addEventListener('click', function () {
        var nome = m.querySelector('#terc-nome').value.trim().replace(/\s+/g, ' ');
        var unidade = (m.querySelector('#terc-unidade') || {}).value || 'UN';
        var qtdCampo = m.querySelector('#terc-qtd');
        var prevista = qtdCampo ? U.num(qtdCampo.value) : 0;
        if (nome.length < 2) return U.aviso('Dê um nome para o material.', 'erro');
        if (!cega && !(prevista > 0)) return U.aviso('Informe a quantidade combinada com o fornecedor.', 'erro');
        var jaExiste = linhas.some(function (l) { return l.nome.trim().toUpperCase() === nome.toUpperCase(); });
        if (jaExiste) return U.aviso('Já existe um produto com esse nome neste evento.', 'erro', 5000);

        var b = m.querySelector('[data-ok]');
        b.disabled = true; b.textContent = 'Adicionando...';
        Banco.criarProduto(eventoId, { nome: nome, quantidade_prevista: prevista, unidade: unidade })
          .then(function (novo) {
            m.fechar();
            /* entra na tela na hora, sem perder o que já foi contado */
            pacote.produtos.push(novo);
            linhas = Calculo.montarCarregamento(pacote.produtos, pacote.conferencias, pacote.itens, carregamentoId);
            contagem[novo.id] = '';
            embalagem[novo.id] = { por: '', qtd: '', soltas: '', obs: '' };
            dano[novo.id] = { qtd: '', desc: '', foto: null };
            U.aviso('✓ ' + nome + ' adicionado à conferência (não mexe no estoque).', 'ok', 5000);
            desenhar();
            var cx = U.$('.prod[data-id="' + novo.id + '"]', tela);
            if (cx) cx.scrollIntoView({ behavior: 'smooth', block: 'center' });
          })
          .catch(function (e) {
            b.disabled = false; b.textContent = 'ADICIONAR';
            App.falhou(e);
          });
      });
    });

    U.$('#btn-salvar').addEventListener('click', function () {
      salvarComBotao().then(function () {
        U.aviso('✓ Conferência salva com sucesso.', 'ok', 4000);
        recarregarDados();
      }).catch(function (e) {
        if (e.message === 'vazio') return;
        if (!navigator.onLine) {
          U.aviso('📴 Sem internet. Sua contagem está guardada neste aparelho — toque em SALVAR quando a conexão voltar.', 'erro', 8000);
          return;
        }
        App.falhou(e);
      });
    });
    U.$('#btn-finalizar').addEventListener('click', function () { finalizar(); });

    linhas.forEach(function (l) { pintar(l.produto.id); pintarEmbalagem(l.produto.id); });
    pintarResumo();
  }

  /* Depois de salvar, busca de novo (sem perder a tela). */
  function recarregarDados() {
    App.carregarEvento(eventoId).then(function (p) {
      pacote = p;
      carregamento = (p.carregamentos || []).filter(function (c) { return c.id === carregamentoId; })[0] || carregamento;
      conferencia = Calculo.confDe(p.conferencias, carregamentoId, tipo) || conferencia;
      desenhar();
    }).catch(function () { desenhar(); });
  }

  /* Calculadora de pallet/caixa. No retorno às cegas ela não mostra
     o número esperado — só ajuda a somar a contagem. */
  function blocoEmbalagem(linha, base) {
    var id = linha.produto.id;
    var e = embalagem[id] || { por: '', qtd: '', soltas: '', obs: '' };
    var aberta = !!(e.por || e.qtd || e.soltas || e.obs);

    return '<div class="emb' + (aberta ? ' is-aberta' : '') + '" data-id="' + id + '">' +
      '<button type="button" class="emb__abrir js-emb-abrir" data-id="' + id + '">' +
        '<span>📦</span><span>Vem em pallet ou caixa? Faça a conta aqui</span>' +
        '<span class="seta">▾</span>' +
      '</button>' +
      '<div class="emb__corpo">' +
        '<div class="emb__dica js-emb-dica" data-id="' + id + '"></div>' +
        '<label class="emb__campo" style="margin-bottom:10px">' +
          '<span>Cada pallet ou caixa tem quantas ' + U.esc(linha.unidade) + '?</span>' +
          '<input class="js-emb-por" data-id="' + id + '" type="number" inputmode="numeric" min="0" ' +
            'placeholder="ex.: 70" value="' + U.esc(e.por) + '">' +
        '</label>' +
        '<div class="emb__linha">' +
          '<label class="emb__campo"><span>Pallets/caixas fechados</span>' +
            '<input class="js-emb-qtd" data-id="' + id + '" type="number" inputmode="numeric" min="0" ' +
              'placeholder="0" value="' + U.esc(e.qtd) + '"></label>' +
          '<label class="emb__campo"><span>' + U.esc(linha.unidade) + ' avulsas</span>' +
            '<input class="js-emb-soltas" data-id="' + id + '" type="number" inputmode="numeric" min="0" ' +
              'placeholder="0" value="' + U.esc(e.soltas) + '"></label>' +
        '</div>' +
        '<div class="emb__total js-emb-total" data-id="' + id + '"></div>' +
        '<input class="emb__obs js-emb-obs" data-id="' + id + '" placeholder="Observação (ex.: pallet aberto, caixa amassada)" ' +
          'value="' + U.esc(e.obs) + '">' +
      '</div>' +
    '</div>';
  }

  /* ---------- terceirizado por item: do total contado, quantos são de fora ----------
     O seletor puxa o material lançado nas 📥 chegadas do módulo 🔗:
     na saída sai do galpão do fornecedor; no retorno volta para ele. */
  function opcoesTerc() {
    var ops = [];
    fornecedoresT.forEach(function (f) {
      var itens = saldosT[f.id] || {};
      Object.keys(itens).forEach(function (ch) {
        var i = itens[ch];
        var disp = cega ? (i.porEvento[eventoId] || 0) : i.noGalpao;
        if (disp > 0) {
          ops.push({
            valor: f.id + '|' + ch,
            rotulo: f.nome + ' — ' + i.nome + ' (' + U.fmt(disp) + (cega ? ' neste evento' : ' no galpão') + ')',
            disp: disp, unidade: i.unidade, material: i.nome, fornecedor_id: f.id
          });
        }
      });
    });
    return ops;
  }

  function opcaoDe(valor) {
    if (!valor || valor === 'sem') return null;
    var partes = valor.split('|');
    var itens = saldosT[partes[0]] || {};
    var i = itens[partes[1]];
    if (!i) return null;
    var f = fornecedoresT.filter(function (x) { return x.id === partes[0]; })[0];
    return {
      fornecedor_id: partes[0], material: i.nome, unidade: i.unidade,
      fornecedor: f ? f.nome : '?',
      disp: cega ? (i.porEvento[eventoId] || 0) : i.noGalpao
    };
  }

  function seletorFornecedor(id) {
    var ops = opcoesTerc();
    var atual = tercSel[id] || '';
    /* mantém a escolha antiga visível mesmo se o saldo zerou */
    if (atual && atual !== 'sem' && !ops.some(function (o) { return o.valor === atual; })) {
      var op = opcaoDe(atual);
      if (op) ops.push({ valor: atual, rotulo: op.fornecedor + ' — ' + op.material + ' (0 disponível)', disp: 0 });
    }
    return '<select class="entrada js-terc-forn" data-id="' + id + '" style="margin-top:10px;font-size:15px">' +
      '<option value=""' + (atual === '' ? ' selected' : '') + '>— De qual fornecedor? (escolher) —</option>' +
      ops.map(function (o) {
        return '<option value="' + U.esc(o.valor) + '"' + (atual === o.valor ? ' selected' : '') + '>' + U.esc(o.rotulo) + '</option>';
      }).join('') +
      '<option value="sem"' + (atual === 'sem' ? ' selected' : '') + '>Não foi lançado no módulo 🔗 (seguir sem vínculo)</option>' +
    '</select>';
  }

  function blocoTerc(l) {
    var id = l.produto.id;
    /* produto inteiro terceirizado: sem campo de quantidade, mas COM fornecedor */
    if (l.produto && l.produto.terceirizado) {
      return '<div class="terc" data-id="' + id + '">' +
        '<div class="terc__linha">' +
          '<span class="terc__rot">🔗 Material 100% terceirizado — não mexe no estoque do galpão</span>' +
        '</div>' +
        seletorFornecedor(id) +
        '<p class="terc__info js-terc-info" data-id="' + id + '"></p>' +
      '</div>';
    }
    var v = terc[id] === undefined ? '' : terc[id];
    var tem = U.num(v) > 0;
    return '<div class="terc" data-id="' + id + '">' +
      '<div class="terc__linha">' +
        '<span class="terc__rot">🔗 Terceirizados do fornecedor (SOMAM no total)</span>' +
        '<input class="terc__campo js-terc-qtd" data-id="' + id + '" type="number" inputmode="numeric" ' +
          'min="0" placeholder="0" value="' + U.esc(v) + '" aria-label="Quantidade terceirizada de ' + U.esc(l.nome) + '">' +
      '</div>' +
      '<div class="js-terc-forn-caixa" data-id="' + id + '"' + (tem ? '' : ' hidden') + '>' + seletorFornecedor(id) + '</div>' +
      '<p class="terc__info js-terc-info" data-id="' + id + '"></p>' +
    '</div>';
  }

  function pintarTerc(id) {
    var caixa = U.$('.terc[data-id="' + id + '"]', tela);
    if (!caixa) return;
    var linha = linhas.filter(function (l) { return l.produto.id === id; })[0];
    var flag100 = !!(linha && linha.produto && linha.produto.terceirizado);
    var info = U.$('.js-terc-info', caixa);
    var t = tercQtd(id);
    var total = valorTotal(id);

    var fornCaixa = U.$('.js-terc-forn-caixa', caixa);
    if (fornCaixa) fornCaixa.hidden = !(U.num(terc[id]) > 0);

    if (!t) { if (info) info.textContent = ''; return; }

    var op = opcaoDe(tercSel[id]);
    var proprios = valor(id);
    if (tercSel[id] === 'sem') {
      info.style.color = 'var(--laranja)';
      info.textContent = '🔗 ' + U.fmt(t) + ' terceirizado' + (t > 1 ? 's' : '') + ' sem vínculo com fornecedor (não vai abater do estoque de terceiros).';
    } else if (op) {
      var estoura = t > op.disp;
      info.style.color = estoura ? 'var(--vermelho)' : 'var(--azul)';
      info.textContent = (estoura
        ? '🔴 ' + op.fornecedor + ' tem só ' + U.fmt(op.disp) + ' de ' + op.material + (cega ? ' neste evento' : ' no galpão') + '.'
        : '🔗 ' + U.fmt(t) + ' de ' + op.fornecedor + ' (' + op.material + ')' +
          (cega ? ' voltando para o galpão do fornecedor' : ' saindo do galpão do fornecedor') +
          (proprios !== null && proprios > 0 && !flag100 ? ' · +' + U.fmt(proprios) + ' do nosso estoque' : ''));
    } else {
      info.style.color = 'var(--laranja)';
      info.textContent = '🔗 ' + U.fmt(t) + ' terceirizado' + (t > 1 ? 's' : '') + ' — escolha de qual fornecedor ' + (cega ? 'voltou' : 'saiu') + '.';
    }
  }

  /* ---------- danificados (só no retorno às cegas) ---------- */
  function blocoDano(l) {
    var id = l.produto.id;
    var d = danoDe(id);
    var tem = U.num(d.qtd) > 0;
    return '<div class="dano" data-id="' + id + '">' +
      '<p class="dano__rot">🟠 DANIFICADO (voltou com avaria)</p>' +
      '<input class="dano__campo js-dano-qtd" data-id="' + id + '" type="number" inputmode="numeric" ' +
        'min="0" placeholder="0" value="' + U.esc(d.qtd) + '" aria-label="Quantidade danificada de ' + U.esc(l.nome) + '">' +
      '<div class="dano__extra js-dano-extra" data-id="' + id + '"' + (tem ? '' : ' hidden') + '>' +
        '<p class="peq" style="font-weight:800;color:#8a5a00;margin-bottom:6px">Descreva o dano <span style="color:var(--vermelho)">(obrigatório)</span></p>' +
        '<textarea class="dano__desc js-dano-desc" data-id="' + id + '" ' +
          'placeholder="Ex.: 2 travessas empenadas, quina quebrada...">' + U.esc(d.desc) + '</textarea>' +
        '<div class="js-dano-foto-caixa" data-id="' + id + '">' +
          (d.foto ? '<img src="' + d.foto + '" alt="Foto do dano">' : '') + '</div>' +
        '<div class="btn-linha" style="margin-top:8px">' +
          '<button class="btn ' + (d.foto ? 'btn--branco' : 'btn--laranja') + ' btn--peq js-dano-foto" data-id="' + id + '">📷 ' +
            (d.foto ? 'Câmera' : 'CÂMERA') + '</button>' +
          '<button class="btn btn--branco btn--peq js-dano-galeria" data-id="' + id + '">🖼️ ' +
            (d.foto ? 'Galeria' : 'DO TELEFONE') + '</button>' +
        '</div>' +
        '<p class="dano__status js-dano-status" data-id="' + id + '"></p>' +
        '<input type="file" class="js-dano-arquivo" data-id="' + id + '" accept="image/*" capture="environment" hidden>' +
        '<input type="file" class="js-dano-arquivo-gal" data-id="' + id + '" accept="image/*" hidden>' +
      '</div>' +
    '</div>';
  }

  function pintarDano(id) {
    var caixa = U.$('.dano[data-id="' + id + '"]', tela);
    if (!caixa) return;
    var d = danoDe(id);
    var q = U.num(d.qtd);
    var extra = U.$('.js-dano-extra', caixa);
    extra.hidden = !(q > 0);

    var fotoCaixa = U.$('.js-dano-foto-caixa', caixa);
    fotoCaixa.innerHTML = d.foto ? '<img src="' + d.foto + '" alt="Foto do dano">' : '';
    var botao = U.$('.js-dano-foto', caixa);
    if (botao) {
      botao.className = 'btn ' + (d.foto ? 'btn--branco' : 'btn--laranja') + ' btn--peq js-dano-foto';
      botao.dataset.id = id;
    }

    var st = U.$('.js-dano-status', caixa);
    var campoDesc = U.$('.js-dano-desc', caixa);
    if (q > 0) {
      var faltaDesc = !(d.desc || '').trim();
      var faltaFoto = !d.foto;
      campoDesc.classList.toggle('falta', faltaDesc);
      if (faltaDesc || faltaFoto) {
        st.style.color = 'var(--vermelho)';
        st.textContent = '🔴 Para finalizar: ' +
          (faltaDesc ? 'descreva o dano' : '') +
          (faltaDesc && faltaFoto ? ' e ' : '') +
          (faltaFoto ? 'anexe a foto do dano' : '') + '.';
      } else {
        st.style.color = 'var(--verde)';
        st.textContent = '🟢 Dano registrado: ' + U.fmt(q) + ' com descrição e foto.';
      }
    } else {
      campoDesc.classList.remove('falta');
      st.textContent = '';
    }
  }

  function pintarEmbalagem(id) {
    var caixa = U.$('.emb[data-id="' + id + '"]', tela);
    if (!caixa) return;
    var linha = linhas.filter(function (l) { return l.produto.id === id; })[0];
    var base = Calculo.base(linha, tipo);
    var e = embalagem[id] || {};
    var por = U.num(e.por);
    var qtd = U.num(e.qtd);
    var soltas = U.num(e.soltas);

    var dica = U.$('.js-emb-dica', caixa);
    var total = U.$('.js-emb-total', caixa);

    if (!por) {
      dica.innerHTML = 'Informe quantas ' + U.esc(linha.unidade) +
        ' vêm em cada pallet ou caixa. O sistema soma o total para você.';
      total.textContent = '';
      return;
    }

    if (cega) {
      /* às cegas: nada de mostrar o esperado */
      dica.innerHTML = 'Pallet/caixa de <b>' + U.fmt(por) + '</b> ' + U.esc(linha.unidade) +
        '. Preencha fechados e avulsas que o total vai direto para o contador.';
    } else {
      var fechados = Math.floor(base / por);
      var resto = base - fechados * por;
      var texto = '<b>' + U.esc(info.base) + ': ' + U.fmt(base) + ' ' + U.esc(linha.unidade) + '</b><br>' +
        'Com pallet de ' + U.fmt(por) + ': ' +
        (fechados ? '<b>' + U.fmt(fechados) + '</b> fechado' + (fechados > 1 ? 's' : '') : 'nenhum fechado') +
        (resto ? ' + <b>' + U.fmt(resto) + '</b> avulsas' : ' certinho');
      if (resto) {
        texto += '<br>Se abrir mais um pallet, sobram <b>' + U.fmt(por - resto) + '</b> ' + U.esc(linha.unidade) + '.';
      }
      dica.innerHTML = texto;
    }

    if (!qtd && !soltas) { total.textContent = ''; return; }
    var soma = qtd * por + soltas;
    total.innerHTML = 'Total contado: ' + U.fmt(soma) + ' ' + U.esc(linha.unidade) +
      '  (' + U.fmt(qtd) + ' × ' + U.fmt(por) + (soltas ? ' + ' + U.fmt(soltas) : '') + ')';
  }

  function mexeuEmbalagem(id) {
    var e = embalagem[id];
    var por = U.num(e.por);
    if (por && (e.qtd !== '' || e.soltas !== '')) {
      definir(id, U.num(e.qtd) * por + U.num(e.soltas));
    }
    pintarEmbalagem(id);
  }

  function passo(id, delta) {
    var atual = valor(id);
    var novo = Math.max(0, (atual === null ? 0 : atual) + delta);
    definir(id, novo);
  }

  function definir(id, v) {
    contagem[id] = String(v);
    var campo = U.$('.js-campo[data-id="' + id + '"]', tela);
    if (campo) campo.value = String(v);
    pintar(id);
  }

  /* Atualiza as cores e o texto de uma linha só. Na conferência às
     cegas não existe certo/errado na tela: só "contado" ou "pendente". */
  function pintar(id) {
    var caixa = U.$('.prod[data-id="' + id + '"]', tela);
    if (!caixa) return;
    var linha = linhas.filter(function (l) { return l.produto.id === id; })[0];
    var base = Calculo.base(linha, tipo);
    var v = valor(id);
    var campo = U.$('.js-campo', caixa);
    var res = U.$('.prod__res', caixa);

    caixa.classList.remove('ok', 'dif', 'pend');
    campo.classList.remove('ok', 'dif');

    if (v === null) {
      caixa.classList.add('pend');
      res.className = 'prod__res pend';
      res.textContent = '🟡 Ainda não conferido';
    } else if (cega) {
      caixa.classList.add('ok'); campo.classList.add('ok');
      res.className = 'prod__res ok';
      var dq = danoQtd(id);
      var tqc = ehFlag100(id) ? 0 : U.num(terc[id]);
      var partes = [];
      if (v > 0 || (!dq && !tqc)) partes.push('<b>' + U.fmt(v) + '</b>' + (dq || tqc ? ' em bom estado' : ''));
      if (dq > 0) partes.push('<b>' + U.fmt(dq) + '</b> danificado' + (dq > 1 ? 's' : ''));
      if (tqc > 0) partes.push('<b>' + U.fmt(tqc) + '</b> terceirizado' + (tqc > 1 ? 's' : ''));
      res.innerHTML = (dq || tqc)
        ? '🔵 Registrado: ' + partes.join(' + ') + ' = <b>' + U.fmt(valorTotal(id)) + ' ' + U.esc(linha.unidade) + '</b>'
        : '🔵 Registrado: <b>' + U.fmt(v) + ' ' + U.esc(linha.unidade) + '</b>';
    } else {
      var total = valorTotal(id);
      var tqui = ehFlag100(id) ? 0 : U.num(terc[id]);
      var soma = tqui > 0 ? U.fmt(v) + ' do nosso estoque + ' + U.fmt(tqui) + ' terceirizado' + (tqui > 1 ? 's' : '') + ' = <b>' + U.fmt(total) + '</b> · ' : '';
      var dif = total - base;
      if (dif === 0) {
        caixa.classList.add('ok'); campo.classList.add('ok');
        res.className = 'prod__res ok';
        res.innerHTML = '🟢 ' + soma + 'Confere com o ' + info.base.toLowerCase() + '.';
      } else {
        caixa.classList.add('dif'); campo.classList.add('dif');
        res.className = 'prod__res ' + (dif < 0 ? 'dif' : 'mais');
        res.innerHTML = '🔴 ' + soma + (dif < 0 ? 'Faltam ' : 'Sobrando ') + '<b>' + U.fmt(Math.abs(dif)) + '</b>' +
          ' · Divergência: <b>' + (dif > 0 ? '+' : '') + U.fmt(dif) + '</b>';
      }
    }
    var tq = tercQtd(id);
    if (v !== null && tq > 0 && !ehFlag100(id) && cega) {
      res.innerHTML += ' <span class="terc-tag">🔗 ' + U.fmt(tq) + ' terc.</span>';
    }
    pintarTerc(id);
    pintarResumo();
    guardarRascunho();
  }

  function pintarResumo() {
    var r = resumoAtual();

    /* barra de porcentagem do retorno */
    var prog = U.$('#prog-topo', tela);
    if (prog) {
      var feitos = r.produtos - r.pendentes;
      var pct = r.produtos ? Math.round(feitos / r.produtos * 100) : 0;
      prog.innerHTML =
        '<div class="progresso"><div class="progresso__fill" style="width:' + pct + '%"></div></div>' +
        '<div class="progresso__rot"><span>Registrar retorno · ' + feitos + ' de ' + r.produtos + ' produtos</span>' +
        '<span>' + pct + '%</span></div>';
    }

    var caixa = U.$('#resumo-caixa .cartao__corpo', tela);
    if (!caixa) return;
    caixa.innerHTML =
      '<h3 style="font-size:18px;color:var(--azul);margin-bottom:10px">Resumo</h3>' +
      '<dl class="evento__dl">' +
        '<dt>Produtos</dt><dd>' + r.produtos + '</dd>' +
        (cega ? '' : '<dt>' + U.esc(info.base) + '</dt><dd>' + U.fmt(r.base) + '</dd>') +
        '<dt>Conferido</dt><dd>' + U.fmt(r.contado) + '</dd>' +
        (cega ? '' : '<dt>Divergências</dt><dd>' + r.divergencias + '</dd>') +
        (r.terceirizados ? '<dt>Terceirizados</dt><dd>🔗 ' + U.fmt(r.terceirizados) + ' (fora do estoque)</dd>' : '') +
        (cega && r.danificados ? '<dt>Danificados</dt><dd>🟠 ' + U.fmt(r.danificados) + '</dd>' : '') +
        (r.pendentes
          ? (cega
              ? '<dt>Em branco</dt><dd>' + r.pendentes + ' produtos (não vieram neste caminhão)</dd>'
              : '<dt>Pendentes</dt><dd>🟡 ' + r.pendentes + ' produtos sem contagem</dd>')
          : '') +
        '<dt>Foto</dt><dd>' + (foto ? '🟢 anexada' : '🔴 falta anexar (obrigatória)') + '</dd>' +
      '</dl>';
  }

  /* ---------- gravar no Supabase ---------- */
  function salvar(finalizando) {
    var itens = [];
    linhas.forEach(function (l) {
      var v = valor(l.produto.id);
      if (v === null) return;
      var e = embalagem[l.produto.id] || {};
      var d = danoDe(l.produto.id);
      var dq = danoQtd(l.produto.id);
      var tq2 = tercQtd(l.produto.id);
      itens.push({
        produto_id: l.produto.id,
        quantidade: valorTotal(l.produto.id),   /* nosso + danificado + terceirizado */
        por_embalagem: e.por,
        embalagens: e.qtd,
        avulsas: e.soltas,
        observacao: e.obs,
        qtd_danificada: dq,
        qtd_terceirizada: tq2,
        dano_descricao: dq > 0 ? (d.desc || '').trim() : null,
        dano_foto_base64: dq > 0 ? d.foto : null
      });
    });

    if (!itens.length) {
      U.aviso('Conte pelo menos um produto antes de salvar.', 'erro');
      return Promise.reject(new Error('vazio'));
    }

    var situacao;
    if (!finalizando) situacao = 'Salvo';
    else if (cega) situacao = 'Finalizado';   /* retorno parcial: a comparação é do EVENTO */
    else situacao = Calculo.situacaoFinal(linhasComContagem(), tipo);

    var passo1 = conferencia
      ? Promise.resolve(conferencia)
      : Banco.criarConferencia({
          evento_id: eventoId,
          carregamento_id: carregamentoId,
          conferente_id: Sessao.atual.id,
          tipo: tipo,
          status: 'Em andamento'
        });

    return passo1.then(function (c) {
      conferencia = c;

      /* Fotos: tenta subir para o Storage (bucket "fotos") e guardar só a URL.
         Sem internet ou sem bucket, segue em base64 mesmo — nada se perde. */
      var envios = [];
      if (foto && Fotos.ehDataUrl(foto)) {
        envios.push(Banco.subirFoto('eventos/' + eventoId + '/' + c.id + '/carregamento.jpg', foto)
          .then(function (url) { if (url) foto = url; }));
      }
      itens.forEach(function (i, idx) {
        if (i.dano_foto_base64 && Fotos.ehDataUrl(i.dano_foto_base64)) {
          envios.push(Banco.subirFoto('eventos/' + eventoId + '/' + c.id + '/dano-' + i.produto_id + '.jpg', i.dano_foto_base64)
            .then(function (url) {
              if (url) {
                itens[idx].dano_foto_base64 = url;
                if (dano[i.produto_id]) dano[i.produto_id].foto = url;
              }
            }));
        }
      });
      return Promise.all(envios).then(function () { return c; });
    }).then(function (c) {
      return Banco.salvarItens(c.id, itens);
    }).then(function () {
      var campos = {
        status: situacao,
        conferente_id: Sessao.atual.id,
        foto_base64: foto || null
      };
      if (finalizando) campos.finalizada_em = new Date().toISOString();
      return Banco.atualizarConferencia(conferencia.id, campos);
    }).then(function (c) {
      conferencia = c || conferencia;

      /* o carregamento acompanha a sua conferência */
      var statusCarga;
      if (tipo === 'saida') {
        statusCarga = finalizando ? 'Saída finalizada' : 'Saída em andamento';
      } else {
        statusCarga = finalizando ? 'Retorno finalizado' : 'Retorno em andamento';
      }
      return Banco.atualizarCarregamento(carregamentoId, { status: statusCarga });
    }).then(function () {
      /* o evento fica "Em andamento" até o coordenador encerrar na tela do evento */
      if (pacote.evento && pacote.evento.status === 'Planejado') {
        return Banco.atualizarEvento(eventoId, { status: 'Em andamento' });
      }
    }).then(function () {
      /* ---- estoque: saída finalizada desconta, retorno finalizado devolve ----
         Antes de lançar, apaga os movimentos antigos desta conferência:
         desbloquear e finalizar de novo corrige o estoque em vez de duplicar. */
      if (!finalizando) return;
      return Banco.apagarMovimentosConferencia(conferencia.id).then(function () {
        return Banco.listarEstoque();
      }).then(function (cadastro) {
        var porChave = {};
        cadastro.forEach(function (i) { porChave[Estoque.chave(i.nome)] = i; });

        var nomePorProduto = {};
        linhas.forEach(function (l) {
          nomePorProduto[l.produto.id] = {
            nome: l.nome, unidade: l.unidade,
            terceirizado: !!(l.produto && l.produto.terceirizado)
          };
        });

        /* O estoque só movimenta produtos que o coordenador CADASTROU
           (a escolha é feita no anexo do checklist). Produto fora do
           estoque não gera movimento — nem cria cadastro sozinho. */
        return Promise.resolve().then(function () {
          var movimentos = [];
          itens.forEach(function (i) {
            if (!(Number(i.quantidade) > 0)) return;   /* contagem zero não mexe no estoque */
            var info = nomePorProduto[i.produto_id];
            if (info && info.terceirizado) return;     /* material 100% de fora: estoque não vê */
            /* linha mista: só a parte PRÓPRIA mexe no estoque */
            var propria = Number(i.quantidade) - (Number(i.qtd_terceirizada) || 0);
            if (!(propria > 0)) return;
            var alvo = info && porChave[Estoque.chave(info.nome)];
            if (!alvo) return;
            movimentos.push({
              estoque_id: alvo.id,
              evento_id: eventoId,
              conferencia_id: conferencia.id,
              tipo: tipo,                       /* 'saida' desconta · 'retorno' devolve */
              quantidade: propria,
              usuario_id: Sessao.atual.id
            });
          });
          return Banco.criarMovimentos(movimentos);
        });
      }).catch(function () {
        U.aviso('⚠ A conferência foi finalizada, mas o estoque não atualizou (rode o SQL novo no Supabase).', 'erro', 7000);
      });
    }).then(function () {
      /* ---- estoque DO FORNECEDOR: o terceirizado sai (saída) e volta (retorno) ----
         Apaga os lançamentos antigos desta conferência antes: re-finalizar corrige. */
      if (!finalizando) return;
      return Banco.apagarMovTerceirosConferencia(conferencia.id).then(function () {
        var lancamentos = [];
        linhas.forEach(function (l) {
          var id2 = l.produto.id;
          var tq = Math.min(tercQtd(id2), valorTotal(id2) === null ? 0 : valorTotal(id2));
          if (!(tq > 0)) return;
          var op = opcaoDe(tercSel[id2]);
          if (!op) return;   /* "sem vínculo" ou não lançado: só a etiqueta na conferência */
          lancamentos.push({
            fornecedor_id: op.fornecedor_id,
            material: op.material,
            unidade: op.unidade || 'UN',
            tipo: tipo === 'saida' ? 'envio' : 'retorno',
            quantidade: tq,
            evento_id: eventoId,
            conferencia_id: conferencia.id,
            produto_id: id2,
            observacao: 'Conferência de ' + (tipo === 'saida' ? 'saída' : 'retorno') + ' · ' + (l.nome || ''),
            usuario_id: Sessao.atual.id
          });
        });
        return Promise.all(lancamentos.map(function (mv) { return Banco.criarMovTerceiro(mv); }));
      }).catch(function () {
        U.aviso('⚠ Conferência finalizada, mas o estoque do fornecedor não atualizou (rode o SQL novo).', 'erro', 7000);
      });
    }).then(function () {
      /* chegou ao servidor: o rascunho do aparelho já cumpriu o papel */
      Rascunho.apagar(carregamentoId, tipo);
    });
  }

  function linhasComContagem() {
    return linhas.map(function (l) {
      var copia = Object.assign({}, l);
      var v = valor(l.produto.id);
      if (tipo === 'saida') {
        var totalS = valorTotal(l.produto.id);
        copia.saida = totalS;
        copia.enviado = totalS === null ? 0 : totalS;
        copia.difSaida = totalS === null ? null : totalS - copia.prevista;
      } else {
        var total = valorTotal(l.produto.id);
        copia.retorno = total;
        copia.difRetorno = total === null ? null : total - copia.esperadoRetorno;
      }
      return copia;
    });
  }

  function botaoOcupado(sel, texto, original, fn) {
    var b = U.$(sel, tela);
    if (!b) return fn();
    b.disabled = true; b.textContent = texto;
    return fn().then(function (r) {
      b.disabled = false; b.textContent = original;
      return r;
    }).catch(function (e) {
      b.disabled = false; b.textContent = original;
      throw e;
    });
  }

  function salvarComBotao() {
    return botaoOcupado('#btn-salvar', 'Salvando...', 'SALVAR CONFERÊNCIA', function () { return salvar(false); });
  }

  function finalizar() {
    var r = resumoAtual();
    if (!cega && r.pendentes) {
      U.aviso('Faltam ' + r.pendentes + ' produtos sem contagem. Preencha todos para finalizar.', 'erro', 5000);
      return;
    }
    if (cega && r.produtos - r.pendentes === 0) {
      U.aviso('Registre pelo menos um produto que chegou neste caminhão.', 'erro', 5000);
      return;
    }
    /* terceirizado precisa dizer de qual fornecedor saiu (ou marcar "sem vínculo") */
    var semForn = linhas.filter(function (l) {
      var id2 = l.produto.id;
      if (!(tercQtd(id2) > 0)) return false;
      var sel = tercSel[id2];
      if (sel === 'sem') return false;
      var op = opcaoDe(sel);
      if (!op) return true;                       /* não escolheu */
      return tercQtd(id2) > op.disp;              /* escolheu mas o fornecedor não tem tudo isso */
    })[0];
    if (semForn) {
      var sel2 = tercSel[semForn.produto.id];
      U.aviso(sel2 && opcaoDe(sel2)
        ? '🔗 ' + semForn.nome + ': o fornecedor escolhido não tem essa quantidade ' + (cega ? 'neste evento' : 'no galpão') + '.'
        : '🔗 ' + semForn.nome + ': escolha de qual fornecedor ' + (cega ? 'voltou' : 'saiu') + ' o terceirizado (ou marque "sem vínculo").', 'erro', 7000);
      pintarTerc(semForn.produto.id);
      var cxF = U.$('.prod[data-id="' + semForn.produto.id + '"]', tela);
      if (cxF) cxF.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
    if (!foto) {
      U.aviso('📷 A foto do carregamento é obrigatória. Tire a foto antes de finalizar.', 'erro', 6000);
      var bloco = U.$('#bloco-foto', tela);
      if (bloco) bloco.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
    if (cega) {
      var incompleto = linhas.filter(function (l) { return danoIncompleto(l.produto.id); })[0];
      if (incompleto) {
        U.aviso('🟠 ' + incompleto.nome + ': item danificado precisa de DESCRIÇÃO e FOTO do dano para finalizar.', 'erro', 6000);
        pintarDano(incompleto.produto.id);
        var cx = U.$('.prod[data-id="' + incompleto.produto.id + '"]', tela);
        if (cx) cx.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
    }

    var texto = cega
      ? 'Produtos registrados: ' + (r.produtos - r.pendentes) + ' de ' + r.produtos +
        '\nTotal que chegou neste caminhão: ' + U.fmt(r.contado) +
        (r.danificados ? '\nDanificados: ' + U.fmt(r.danificados) + ' (com foto e descrição)' : '') +
        (r.pendentes ? '\nEm branco (não vieram neste caminhão): ' + r.pendentes : '') +
        '\nFoto do carregamento: anexada ✓'
      : 'Produtos: ' + r.produtos +
        '\nConferido: ' + U.fmt(r.contado) +
        '\n' + info.base + ': ' + U.fmt(r.base) + '\nDivergências: ' + r.divergencias +
        '\nFoto do carregamento: anexada ✓';

    /* Saída com nota fiscal anexada: imprimir a nota é OBRIGATÓRIO para
       finalizar. Sem nota anexada, finaliza normal. */
    var notasFin = (!cega && pacote.evento && pacote.evento.notas_fiscais) ? pacote.evento.notas_fiscais : [];
    var notaAberta = notasFin.length === 0;   /* sem nota: já liberado */

    var m = U.modal({
      titulo: 'Finalizar ' + (cega ? 'retorno' : 'conferência'),
      html: '<pre style="font-family:inherit;font-size:16px;white-space:pre-wrap;margin:0 0 14px">' + U.esc(texto) + '</pre>' +
        (cega
          ? '<p class="mut peq" style="margin-bottom:10px">O retorno é às cegas e pode ser parcial: se chegar mais mercadoria em outro caminhão, registre um novo retorno na tela do evento.</p>'
          : '') +
        (notasFin.length
          ? '<div class="aviso aviso--azul" style="margin-bottom:12px"><span class="aviso__ico">🧾</span><div>' +
            '<b>Imprima a nota fiscal para finalizar.</b>' +
            'Toque no botão: a nota abre em outra aba, imprima e volte aqui.' +
            '<div class="btn-linha" style="margin-top:10px">' +
            notasFin.map(function (n, i) {
              return '<button class="btn btn--laranja js-nf-fin" data-url="' + U.esc(n.url) + '">🧾 IMPRIMIR NOTA' +
                (notasFin.length > 1 ? ' ' + (i + 1) : ' FISCAL') + '</button>';
            }).join('') +
            '</div></div></div>'
          : '') +
        '<p><b>Deseja finalizar?</b></p>' +
        '<p class="mut peq" style="margin-top:6px">Depois de finalizada, a conferência <b>trava</b>: só o coordenador consegue alterar, com a senha.</p>',
      pe: '<button class="btn btn--branco" data-x>Cancelar</button>' +
          '<button class="btn btn--verde" data-ok' + (notaAberta ? '' : ' disabled') + '>' +
            (notaAberta ? 'FINALIZAR' : '🧾 IMPRIMA A NOTA PRIMEIRO') + '</button>',
      travado: true
    });
    m.querySelector('[data-x]').addEventListener('click', function () { m.fechar(); });

    /* abrir a nota libera o FINALIZAR */
    U.$$('.js-nf-fin', m).forEach(function (bNf) {
      bNf.addEventListener('click', function () {
        window.open(bNf.dataset.url, '_blank');
        bNf.textContent = '✓ Nota aberta — imprima e finalize';
        bNf.className = 'btn js-nf-fin';
        if (!notaAberta) {
          notaAberta = true;
          var ok = m.querySelector('[data-ok]');
          ok.disabled = false;
          ok.textContent = 'FINALIZAR';
        }
      });
    });
    m.querySelector('[data-ok]').addEventListener('click', function () {
      if (!notaAberta) return U.aviso('🧾 Abra e imprima a nota fiscal antes de finalizar.', 'erro', 5000);
      var b = m.querySelector('[data-ok]');
      b.disabled = true; b.textContent = 'Salvando...';
      salvar(true).then(function () {
        m.fechar();
        desbloqueada = false;
        U.aviso('✓ ' + (cega ? 'Retorno finalizado.' : 'Conferência finalizada.') + ' Agora ela está travada.', 'ok', 5000);
        recarregarDados();
      }).catch(function (e) {
        b.disabled = false; b.textContent = 'FINALIZAR';
        if (e.message !== 'vazio') App.falhou(e);
      });
    });
  }
}
/* ============================================================
   js/pdf.js — relatórios em A4
   Usa jsPDF. Se a biblioteca não tiver carregado (sem internet),
   cai no plano B: abre uma folha pronta para imprimir ou salvar
   como PDF pelo próprio celular.
   ============================================================ */
const Relatorio = {

  temJsPDF: function () {
    return typeof window.jspdf !== 'undefined' && !!window.jspdf.jsPDF;
  },

  /* ---------- PDF de uma conferência de um carregamento ---------- */
  conferencia: function (pacote, carregamentoId, tipo) {
    var cg = (pacote.carregamentos || []).filter(function (c) { return c.id === carregamentoId; })[0];
    var dados = Relatorio._dados(pacote, cg, tipo);
    if (!dados) return U.aviso('Esta conferência ainda não foi feita.', 'erro');
    if (!Relatorio.temJsPDF()) return Relatorio._folha([dados], pacote);

    U.aviso('Montando o PDF...', 'info', 2000);
    Relatorio._resolverFotos([dados]).then(function () {
      var doc = Relatorio._novo();
      var y = Relatorio._cabecalho(doc, pacote, 'RELATÓRIO DE CONFERÊNCIA', dados);
      y = Relatorio._tabela(doc, dados, y);
      y = Relatorio._resumo(doc, dados, y);
      y = Relatorio._foto(doc, dados, y);
      Relatorio._assinaturas(doc, y);
      Relatorio._salvar(doc, pacote.evento.nome + ' - Carreg ' + cg.numero + ' - ' + Calculo.TIPOS[tipo].curto);
    });
  },

  /* Fotos podem estar no Storage (URL): o jsPDF precisa delas em base64.
     Baixa todas antes de montar o PDF; a que falhar sai do relatório. */
  _fotosB64: {},
  _resolverFotos: function (blocos) {
    var srcs = [];
    blocos.forEach(function (b) {
      if (b.conferencia && b.conferencia.foto_base64) srcs.push(b.conferencia.foto_base64);
      b.linhas.forEach(function (l) {
        if (l.dano && l.dano.qtd > 0 && l.dano.foto) srcs.push(l.dano.foto);
      });
    });
    Relatorio._fotosB64 = {};
    return Promise.all(srcs.map(function (s) {
      return Fotos.paraBase64(s).then(function (b64) { if (b64) Relatorio._fotosB64[s] = b64; });
    }));
  },
  _b64: function (src) {
    if (!src) return null;
    if (Fotos.ehDataUrl(src)) return src;
    return Relatorio._fotosB64[src] || null;
  },

  /* ---------- PDF completo (todos os carregamentos) ---------- */
  completo: function (pacote) {
    var blocos = [];
    (pacote.carregamentos || []).forEach(function (cg) {
      var tipos = cg.sentido === 'retorno' ? ['retorno'] : ['saida', 'retorno'];
      tipos.forEach(function (t) {
        var d = Relatorio._dados(pacote, cg, t);
        if (d) blocos.push(d);
      });
    });

    if (!blocos.length) return U.aviso('Nenhuma conferência foi feita ainda.', 'erro');
    if (!Relatorio.temJsPDF()) return Relatorio._folha(blocos, pacote);

    U.aviso('Montando o PDF completo...', 'info', 2500);
    Relatorio._resolverFotos(blocos).then(function () { Relatorio._completoDoc(blocos, pacote); });
  },

  _completoDoc: function (blocos, pacote) {
    var doc = Relatorio._novo();
    var y = Relatorio._cabecalho(doc, pacote, 'RELATÓRIO COMPLETO DO EVENTO', null);

    blocos.forEach(function (b, i) {
      if (i > 0 && y > 200) { doc.addPage(); y = 20; }
      doc.setFontSize(13); doc.setFont('helvetica', 'bold');
      doc.text('CARREGAMENTO ' + b.carregamento.numero + ' — ' + Calculo.TIPOS[b.tipo].rotulo.toUpperCase(), 15, y);
      y += 6;
      doc.setFontSize(9); doc.setFont('helvetica', 'normal');
      doc.text('Caminhão: ' + b.caminhao + '   ·   Conferente: ' + b.conferente +
        '   ·   Situação: ' + b.conferencia.status +
        '   ·   ' + U.fmtDataHora(b.conferencia.finalizada_em || b.conferencia.updated_at || b.conferencia.created_at), 15, y);
      y += 4;
      y = Relatorio._tabela(doc, b, y);
      y = Relatorio._resumo(doc, b, y);
      y += 6;
    });

    /* fechamento do evento */
    if (y > 200) { doc.addPage(); y = 20; }
    var fim = Relatorio._fechamento(pacote);
    doc.setFontSize(13); doc.setFont('helvetica', 'bold');
    doc.text('RESUMO FINAL', 15, y); y += 7;
    doc.setFontSize(10); doc.setFont('helvetica', 'normal');
    var saidasN = (pacote.carregamentos || []).filter(function (c) { return (c.sentido || 'saida') === 'saida'; }).length;
    var retornosN = (pacote.carregamentos || []).filter(function (c) { return c.sentido === 'retorno'; }).length;
    var pct = fim.saiu ? Math.min(100, Math.round(fim.retorno / fim.saiu * 100)) : 0;
    [['Carregamentos de saída', saidasN],
     ['Retornos registrados (caminhões)', retornosN],
     ['Total previsto no checklist', fim.previsto],
     ['Total conferido na saída', fim.saiu],
     ['Total retornado (todos os caminhões)', U.fmt(fim.retorno) + '  (' + pct + '%)'],
     ['Falta voltar', fim.falta],
     ['Danificados no retorno', fim.danificados],
     ['Divergências registradas', fim.divergencias]
    ].forEach(function (l) {
      doc.text(l[0] + ': ' + (typeof l[1] === 'string' ? l[1] : U.fmt(l[1])), 15, y); y += 5.5;
    });

    Relatorio._assinaturas(doc, y + 4);
    Relatorio._salvar(doc, pacote.evento.nome + ' - Relatorio completo');
  },

  /* ---------- montagem dos dados ---------- */
  _dados: function (pacote, cg, tipo) {
    if (!cg) return null;
    var c = Calculo.confDe(pacote.conferencias, cg.id, tipo);
    if (!c) return null;
    var linhas = Calculo.montarCarregamento(pacote.produtos, pacote.conferencias, pacote.itens, cg.id);
    return {
      tipo: tipo,
      carregamento: cg,
      caminhao: nomeCaminhao(pacote.caminhoes, cg.caminhao_id),
      conferencia: c,
      conferente: App.nomeUsuario(c.conferente_id),
      linhas: linhas,
      resumo: Calculo.resumo(linhas, tipo)
    };
  },

  _fechamento: function (pacote) {
    var linhas = Calculo.montarEvento(pacote.produtos, pacote.carregamentos, pacote.conferencias, pacote.itens);
    var f = { previsto: 0, saiu: 0, retorno: 0, divergencias: 0, danificados: 0 };
    linhas.forEach(function (l) {
      f.previsto += l.prevista;
      f.saiu += l.saida || 0;
      f.retorno += l.retorno || 0;
      f.danificados += l.danificado || 0;
      if (l.difSaida) f.divergencias++;
      if (l.difRetorno) f.divergencias++;
    });
    f.falta = Math.max(0, f.saiu - f.retorno);
    return f;
  },

  /* ---------- peças do PDF ---------- */
  _novo: function () {
    return new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' });
  },

  _cabecalho: function (doc, pacote, titulo, dados) {
    var ev = pacote.evento;
    doc.setFillColor(11, 79, 158);
    doc.rect(0, 0, 210, 26, 'F');
    doc.setTextColor(255, 255, 255);
    doc.setFontSize(15); doc.setFont('helvetica', 'bold');
    doc.text(titulo, 15, 12);
    doc.setFontSize(9); doc.setFont('helvetica', 'normal');
    doc.text('Central de Conferência — Gestão de Mercadorias para Eventos', 15, 19);

    doc.setTextColor(20, 30, 40);
    var y = 36;
    doc.setFontSize(10);
    var campos = [
      ['Evento', ev.nome],
      ['Cliente', ev.cliente || '—'],
      ['Local', ev.local || '—'],
      ['Data do evento', U.fmtData(ev.data)]
    ];
    if (dados) {
      campos.push(['Carregamento', 'Carregamento ' + dados.carregamento.numero]);
      campos.push(['Caminhão', dados.caminhao]);
      campos.push(['Conferência', Calculo.TIPOS[dados.tipo].rotulo + (dados.tipo === 'retorno' ? ' (às cegas)' : '')]);
      campos.push(['Conferente', dados.conferente]);
      campos.push(['Situação', dados.conferencia.status]);
      campos.push(['Data/hora', U.fmtDataHora(dados.conferencia.finalizada_em || dados.conferencia.updated_at || dados.conferencia.created_at)]);
    } else {
      campos.push(['Conferente', App.nomeUsuario(ev.conferente_id)]);
    }
    campos.forEach(function (c) {
      doc.setFont('helvetica', 'bold'); doc.text(c[0] + ':', 15, y);
      doc.setFont('helvetica', 'normal'); doc.text(String(c[1]), 55, y);
      y += 5.5;
    });
    return y + 4;
  },

  _tabela: function (doc, dados, y) {
    var tipo = dados.tipo;
    var retorno = tipo === 'retorno';
    var cabecalho = retorno
      ? ['Produto', 'Un.', 'Registrado', 'Danificado']
      : ['Produto', 'Un.', Calculo.TIPOS[tipo].base, 'Conferido', 'Divergência'];

    var linhasUteis = retorno
      ? dados.linhas.filter(function (l) { return l.retorno !== null; })
      : dados.linhas;

    var corpo = linhasUteis.map(function (l) {
      var conta = Calculo.detalhe(l, tipo);
      var tq = tipo === 'retorno' ? l.tercRetorno : l.tercSaida;
      var nome = l.nome + (l.produto && l.produto.terceirizado ? ' [TERCEIRIZADO]' : '') +
        (tq && !(l.produto && l.produto.terceirizado) ? '\n[' + U.fmt(tq) + ' terceirizados]' : '') +
        (conta ? '\n(' + conta + ')' : '');
      if (retorno) {
        if (l.dano && l.dano.qtd > 0 && l.dano.descricao) nome += '\nDano: ' + l.dano.descricao;
        var dq = l.dano ? l.dano.qtd : 0;
        return [nome, l.unidade, U.fmt(l.retorno), dq ? U.fmt(dq) : '—'];
      }
      var base = Calculo.base(l, tipo);
      var cont = Calculo.contado(l, tipo);
      var dif = Calculo.divergencia(l, tipo);
      return [nome, l.unidade, U.fmt(base), cont === null ? '—' : U.fmt(cont), textoDif(dif)];
    });

    if (doc.autoTable) {
      doc.autoTable({
        startY: y,
        head: [cabecalho],
        body: corpo,
        theme: 'grid',
        styles: { fontSize: 9, cellPadding: 2.4 },
        headStyles: { fillColor: [11, 79, 158], textColor: 255, fontStyle: 'bold' },
        columnStyles: { 1: { halign: 'center', cellWidth: 16 }, 2: { halign: 'right' }, 3: { halign: 'right' }, 4: { halign: 'right' } },
        margin: { left: 15, right: 15 }
      });
      return doc.lastAutoTable.finalY + 8;
    }

    doc.setFontSize(9);
    corpo.forEach(function (l) {
      doc.text(l[0].slice(0, 40), 15, y);
      doc.text(String(l[1]), 118, y, { align: 'center' });
      doc.text(String(l[2]), 140, y, { align: 'right' });
      doc.text(String(l[3]), 165, y, { align: 'right' });
      doc.text(String(l[4]), 190, y, { align: 'right' });
      y += 5;
      if (y > 275) { doc.addPage(); y = 20; }
    });
    return y + 6;
  },

  _resumo: function (doc, dados, y) {
    var r = dados.resumo;
    if (y > 250) { doc.addPage(); y = 20; }
    doc.setFontSize(10); doc.setFont('helvetica', 'bold');
    doc.text('RESUMO', 15, y); y += 6;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
    var itensResumo;
    if (dados.tipo === 'retorno') {
      var registrados = dados.linhas.filter(function (l) { return l.retorno !== null; });
      var total = 0, dan = 0;
      registrados.forEach(function (l) { total += l.retorno; dan += (l.dano ? l.dano.qtd : 0); });
      itensResumo = [
        ['Produtos registrados neste caminhão', registrados.length],
        ['Total que chegou neste caminhão', total],
        ['Danificados (com foto e descrição)', dan]
      ];
    } else {
      itensResumo = [
        ['Total de produtos', r.produtos],
        ['Total ' + Calculo.TIPOS[dados.tipo].base.toLowerCase(), r.previsto],
        ['Total conferido', r.conferido],
        ['Total de divergências', r.divergencias]
      ];
    }
    itensResumo.forEach(function (l) { doc.text(l[0] + ': ' + U.fmt(l[1]), 15, y); y += 5.5; });
    return y + 2;
  },

  /* Foto do carregamento dentro do PDF. */
  _foto: function (doc, dados, y) {
    var b64 = Relatorio._b64(dados.conferencia && dados.conferencia.foto_base64);
    if (b64) {
      if (y > 190) { doc.addPage(); y = 20; }
      doc.setFontSize(10); doc.setFont('helvetica', 'bold');
      doc.text('FOTO DO CARREGAMENTO', 15, y); y += 4;
      try {
        doc.addImage(b64, 'JPEG', 15, y, 90, 65);
        y += 70;
      } catch (e) { /* se a imagem falhar, o PDF sai sem ela */ }
    }

    /* fotos dos itens danificados (retorno) */
    if (dados.tipo === 'retorno') {
      dados.linhas.forEach(function (l) {
        if (!l.dano || !(l.dano.qtd > 0)) return;
        if (y > 185) { doc.addPage(); y = 20; }
        doc.setFontSize(10); doc.setFont('helvetica', 'bold');
        doc.text('DANIFICADO: ' + l.nome.slice(0, 50) + ' (' + U.fmt(l.dano.qtd) + ')', 15, y); y += 5;
        if (l.dano.descricao) {
          doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
          var quebrado = doc.splitTextToSize(l.dano.descricao, 175);
          doc.text(quebrado, 15, y);
          y += quebrado.length * 4 + 2;
        }
        var fotoDano = Relatorio._b64(l.dano.foto);
        if (fotoDano) {
          if (y > 205) { doc.addPage(); y = 20; }
          try { doc.addImage(fotoDano, 'JPEG', 15, y, 90, 65); y += 70; } catch (e) { }
        }
        y += 3;
      });
    }
    return y;
  },

  _assinaturas: function (doc, y) {
    if (y > 245) { doc.addPage(); y = 40; }
    y = Math.max(y + 18, 240);
    doc.setDrawColor(60);
    doc.line(20, y, 95, y);
    doc.line(115, y, 190, y);
    doc.setFontSize(9);
    doc.text('Conferente', 57, y + 5, { align: 'center' });
    doc.text('Responsável', 152, y + 5, { align: 'center' });
  },

  _salvar: function (doc, nome) {
    var limpo = String(nome).replace(/[^\wÀ-ÿ \-]/g, '').trim() || 'relatorio';
    doc.save(limpo + '.pdf');
    U.aviso('✓ PDF gerado. Procure na pasta de downloads do aparelho.', 'ok', 5000);
  },

  /* ---------- plano B: folha para imprimir / salvar como PDF ---------- */
  _folha: function (blocos, pacote) {
    var ev = pacote.evento;
    var caixa = U.$('#impressao');
    var h = '<div class="folha"><div class="folha__barra">' +
      '<button class="btn btn--branco btn--peq" id="folha-fechar">Fechar</button>' +
      '<button class="btn btn--peq" id="folha-imprimir">Imprimir / Salvar em PDF</button></div>' +
      '<h1>RELATÓRIO DE CONFERÊNCIA</h1>' +
      '<p>Central de Conferência — Gestão de Mercadorias para Eventos</p>' +
      '<table style="margin-top:16px"><tbody>' +
        '<tr><th style="width:170px">Evento</th><td>' + U.esc(ev.nome) + '</td></tr>' +
        '<tr><th>Cliente</th><td>' + U.esc(ev.cliente || '—') + '</td></tr>' +
        '<tr><th>Local</th><td>' + U.esc(ev.local || '—') + '</td></tr>' +
        '<tr><th>Data do evento</th><td>' + U.fmtData(ev.data) + '</td></tr>' +
      '</tbody></table>';

    blocos.forEach(function (b) {
      var tipo = b.tipo;
      h += '<h2>Carregamento ' + b.carregamento.numero + ' — ' + U.esc(Calculo.TIPOS[tipo].rotulo) + '</h2>' +
        '<p style="font-size:12px">Caminhão: <b>' + U.esc(b.caminhao) + '</b> · Conferente: <b>' + U.esc(b.conferente) +
        '</b> · Situação: <b>' + U.esc(b.conferencia.status) + '</b> · ' +
        U.fmtDataHora(b.conferencia.finalizada_em || b.conferencia.updated_at || b.conferencia.created_at) + '</p>' +
        (tipo === 'retorno'
          ? '<table><thead><tr><th>Produto</th><th>Un.</th><th>Registrado</th><th>Danificado</th></tr></thead><tbody>' +
            b.linhas.filter(function (l) { return l.retorno !== null; }).map(function (l) {
              var conta = Calculo.detalhe(l, tipo);
              var nome = U.esc(l.nome) + (conta ? '<br><span style="font-size:10px;color:#555">(' + U.esc(conta) + ')</span>' : '');
              if (l.dano && l.dano.qtd > 0 && l.dano.descricao) {
                nome += '<br><span style="font-size:10px;color:#a35c00">Dano: ' + U.esc(l.dano.descricao) + '</span>';
              }
              var dq = l.dano ? l.dano.qtd : 0;
              return '<tr><td>' + nome + '</td><td>' + U.esc(l.unidade) + '</td><td>' + U.fmt(l.retorno) + '</td><td>' +
                (dq ? U.fmt(dq) : '—') + '</td></tr>';
            }).join('') + '</tbody></table>'
          : '<table><thead><tr>' +
            '<th>Produto</th><th>Un.</th><th>' + U.esc(Calculo.TIPOS[tipo].base) + '</th><th>Conferido</th><th>Divergência</th>' +
            '</tr></thead><tbody>' +
            b.linhas.map(function (l) {
              var base = Calculo.base(l, tipo);
              var cont = Calculo.contado(l, tipo);
              var conta = Calculo.detalhe(l, tipo);
              var nome = U.esc(l.nome) + (conta ? '<br><span style="font-size:10px;color:#555">(' + U.esc(conta) + ')</span>' : '');
              return '<tr><td>' + nome + '</td><td>' + U.esc(l.unidade) + '</td><td>' + U.fmt(base) + '</td><td>' +
                (cont === null ? '—' : U.fmt(cont)) + '</td><td>' + textoDif(Calculo.divergencia(l, tipo)) + '</td></tr>';
            }).join('') + '</tbody></table>') +
        (tipo === 'retorno'
          ? ''
          : '<p style="font-size:12px;margin-top:8px">Produtos: <b>' + b.resumo.produtos + '</b> · Total ' +
            U.esc(Calculo.TIPOS[tipo].base.toLowerCase()) + ': <b>' + U.fmt(b.resumo.previsto) + '</b> · Conferido: <b>' +
            U.fmt(b.resumo.conferido) + '</b> · Divergências: <b>' + b.resumo.divergencias + '</b></p>') +
        (b.conferencia.foto_base64
          ? '<p style="font-size:12px;margin-top:8px"><b>Foto do carregamento:</b></p>' +
            '<img src="' + b.conferencia.foto_base64 + '" style="max-width:340px;border:1px solid #999;border-radius:6px">'
          : '');

      if (tipo === 'retorno') {
        b.linhas.forEach(function (l) {
          if (!l.dano || !(l.dano.qtd > 0)) return;
          h += '<p style="font-size:12px;margin-top:8px"><b>Danificado — ' + U.esc(l.nome) + ' (' + U.fmt(l.dano.qtd) + '):</b> ' +
            U.esc(l.dano.descricao || '') + '</p>' +
            (l.dano.foto
              ? '<img src="' + l.dano.foto + '" style="max-width:340px;border:1px solid #999;border-radius:6px">'
              : '');
        });
      }
    });

    h += '<div class="assinaturas"><div>Conferente</div><div>Responsável</div></div></div>';

    caixa.innerHTML = h;
    caixa.hidden = false;
    U.$('#folha-fechar').addEventListener('click', function () { caixa.hidden = true; caixa.innerHTML = ''; });
    U.$('#folha-imprimir').addEventListener('click', function () { window.print(); });
    U.aviso('A biblioteca de PDF não carregou. Use "Imprimir / Salvar em PDF".', 'info', 6000);
  }
};

/* ============================================================
   Início do sistema
   ============================================================ */
(function () {
  'use strict';

  /* Se algo quebrar, a pessoa precisa VER o motivo — e não ficar
     clicando em botões que não respondem. */
  window.addEventListener('error', function (ev) {
    if (document.getElementById('erro-fatal')) return;
    var caixa = document.createElement('div');
    caixa.id = 'erro-fatal';
    caixa.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:999;background:#C62828;color:#fff;' +
      'padding:14px 16px;font-size:14px;line-height:1.5';
    caixa.innerHTML = '<b>O sistema encontrou um erro e parou.</b><br>' +
      'Isso costuma acontecer quando o arquivo foi editado e alguma aspa ou ponto e vírgula ficou faltando. ' +
      'Baixe o index.html original, refaça a Etapa 5 com calma e publique de novo.' +
      '<br><span style="opacity:.85;font-size:12px">Detalhe técnico: ' +
      String(ev.message || '').replace(/</g, '&lt;') + '</span>';
    document.body.appendChild(caixa);
  });

  function mostrarApp(mostrar) {
    U.$('#tela-inicio').hidden = mostrar;
    U.$('#app').hidden = !mostrar;
  }

  /* ------------------------------------------------------------
     Tela de diagnóstico: aparece quando algo impede o sistema de
     funcionar. Em vez de deixar os botões mudos, explica o que
     está faltando e deixa configurar ali mesmo.
     ------------------------------------------------------------ */
  function telaConfiguracao(mensagem) {
    var libOk = (typeof supabase !== 'undefined' && !!supabase.createClient);
    var arquivoOk = !!(textoConfig(window.SUPABASE_URL) && textoConfig(window.SUPABASE_ANON_KEY));
    var aparelhoOk = !!configDoAparelho();

    function linha(ok, texto) {
      return '<li style="margin-bottom:8px">' + (ok ? '🟢' : '🔴') + ' ' + texto + '</li>';
    }

    document.body.innerHTML =
      '<div class="config">' +
        '<h1 style="color:var(--azul);font-size:26px;margin-bottom:10px">Falta um passo para o sistema funcionar</h1>' +
        '<div class="aviso aviso--amarelo"><span class="aviso__ico">⚠</span><div>' + U.esc(mensagem) + '</div></div>' +

        '<h2 style="font-size:18px;margin:22px 0 8px">O que o sistema encontrou</h2>' +
        '<ul style="list-style:none;padding:0">' +
          linha(libOk, libOk
            ? 'Biblioteca do Supabase carregada.'
            : 'A biblioteca do Supabase <b>não carregou</b> — normalmente é falta de internet no momento em que a página abriu.') +
          linha(arquivoOk, arquivoOk
            ? 'URL e chave preenchidas no arquivo.'
            : 'A URL e a chave <b>não foram encontradas no arquivo</b>.') +
          linha(aparelhoOk, aparelhoOk
            ? 'Existe configuração guardada neste aparelho.'
            : 'Nenhuma configuração guardada neste aparelho.') +
        '</ul>' +

        '<h2 style="font-size:18px;margin:22px 0 8px">Resolver agora, por aqui</h2>' +
        '<p class="peq mut" style="margin-bottom:14px">Cole os dados do seu projeto e toque em conectar. ' +
        'Fica guardado neste aparelho e você já pode usar o sistema. ' +
        '(O ideal, depois, é colocar esses mesmos dados no arquivo — assim vale para todos os celulares de uma vez.)</p>' +

        '<label class="campo"><span class="campo__rot">Project URL</span>' +
          '<input class="entrada" id="cfg-url" placeholder="https://abcdefghijk.supabase.co" ' +
          'value="' + U.esc((configDoAparelho() || {}).url || '') + '"></label>' +
        '<label class="campo"><span class="campo__rot">Chave anon public</span>' +
          '<textarea class="entrada" id="cfg-chave" style="min-height:90px;font-size:13px" ' +
          'placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6...">' + U.esc((configDoAparelho() || {}).chave || '') + '</textarea></label>' +
        '<div id="cfg-erro"></div>' +
        '<button class="btn btn--laranja btn--bloco btn--gg" id="cfg-salvar">CONECTAR</button>' +

        '<h2 style="font-size:18px;margin:26px 0 8px">Resolver no arquivo (recomendado)</h2>' +
        '<p class="peq" style="margin-bottom:10px">Abra o <b>index.html</b> no Bloco de Notas, procure por ' +
        '<b>SUPABASE_URL</b> (Ctrl+L) e deixe as duas linhas assim:</p>' +
