        '<pre>window.SUPABASE_URL      = "https://seuprojeto.supabase.co";\nwindow.SUPABASE_ANON_KEY = "sua-chave-anon-public";</pre>' +
        '<ol style="margin-top:16px">' +
          '<li>Os dados ficam em <b>Project Settings › API</b>, no painel do Supabase.</li>' +
          '<li>Troque só o que está <b>entre as aspas</b>.</li>' +
          '<li>Salve com <b>Ctrl+S</b> (não use "Salvar como", para não virar index.html.txt).</li>' +
          '<li>Publique a pasta de novo no Netlify.</li>' +
        '</ol>' +
      '</div>';

    var botao = U.$('#cfg-salvar');
    if (!botao) return;
    botao.addEventListener('click', function () {
      var erro = U.$('#cfg-erro');
      var url = U.$('#cfg-url').value.trim().replace(/\/+$/, '');
      var chave = U.$('#cfg-chave').value.trim();

      function reclamar(txt) {
        erro.innerHTML = '<div class="aviso aviso--vermelho"><span class="aviso__ico">⚠</span><div>' + U.esc(txt) + '</div></div>';
      }
      if (!/^https?:\/\//.test(url)) return reclamar('A URL precisa começar com https:// e terminar em .supabase.co');
      if (chave.length < 30) return reclamar('A chave parece incompleta. Copie a chave "anon public" inteira.');
      if (!libOk) return reclamar('A biblioteca do Supabase não carregou. Confira a internet e recarregue a página antes de conectar.');

      botao.disabled = true;
      botao.textContent = 'Testando...';

      /* testa de verdade antes de guardar */
      var teste = supabase.createClient(url, chave, { global: { fetch: fetchLimpo } });
      teste.from('usuarios').select('id').then(function (r) {
        if (r.error) {
          botao.disabled = false;
          botao.textContent = 'CONECTAR';
          return reclamar(Banco.explicar(r.error));
        }
        guardarConfigNoAparelho(url, chave);
        location.reload();
      });
    });
  }

  function irParaCasa() {
    if (Sessao.ehCoordenador()) App.raiz(TelaPainel);
    else App.raiz(TelaEscolhaArea);   /* Eventos ou Material Terceirizado */
  }

  /* ---------- tela inicial ---------- */
  function ligarInicio() {
    U.$('#btn-coordenador').addEventListener('click', function () {
      var m = U.modal({
        titulo: 'Acesso do coordenador',
        html: '<label class="campo"><span class="campo__rot">Digite a senha</span>' +
          '<input class="entrada" id="senha-coord" type="password" inputmode="numeric" ' +
          'placeholder="••••••" autocomplete="current-password" style="text-align:center;font-size:24px;letter-spacing:6px"></label>' +
          '<p id="senha-erro" class="aviso aviso--vermelho" hidden></p>',
        pe: '<button class="btn btn--branco" data-x>Cancelar</button><button class="btn" data-ok>ENTRAR</button>'
      });
      var campo = U.$('#senha-coord', m);
      campo.focus();

      function tentar() {
        if (campo.value.trim() !== SENHA_COORDENADOR) {
          var erro = U.$('#senha-erro', m);
          erro.textContent = 'Senha incorreta. Tente de novo.';
          erro.hidden = false;
          campo.value = '';
          campo.focus();
          return;
        }
        var coord = App.usuarios.filter(function (u) { return u.tipo === 'coordenador'; })[0];
        if (!coord) return U.aviso('O usuário coordenador não está cadastrado no Supabase. Rode o SQL de instalação.', 'erro', 7000);
        Sessao.entrar(coord);
        m.fechar();
        mostrarApp(true);
        irParaCasa();
      }

      m.querySelector('[data-x]').addEventListener('click', function () { m.fechar(); });
      m.querySelector('[data-ok]').addEventListener('click', tentar);
      campo.addEventListener('keydown', function (e) { if (e.key === 'Enter') tentar(); });
    });

    U.$('#btn-conferente').addEventListener('click', function () {
      /* Busca a lista na hora: se a internet falhou na abertura do app,
         a lista estaria vazia e os conferentes cadastrados não apareceriam. */
      Banco.listarUsuarios()
        .then(function (us) { App.usuarios = us; abrirEscolhaConferente(null); })
        .catch(function (e) { abrirEscolhaConferente(Banco.explicar(e)); });
    });

    function abrirEscolhaConferente(falhaRede) {
      var lista = App.conferentes();
      var m = U.modal({
        titulo: 'Quem está conferindo?',
        html: '<div class="escolha">' + lista.map(function (c) {
            return '<button class="escolha__item js-quem" data-id="' + c.id + '">' +
              '<span class="escolha__ini">' + U.esc(U.iniciais(c.nome)) + '</span>' +
              '<span><span class="escolha__nome">' + U.esc(c.nome) + '</span>' +
              '<span class="escolha__papel">Conferente</span></span></button>';
          }).join('') +
          '<button class="escolha__item" id="js-outro" style="border-style:dashed">' +
            '<span class="escolha__ini" style="background:var(--laranja)">+</span>' +
            '<span><span class="escolha__nome">Outro conferente</span>' +
            '<span class="escolha__papel">Não está na lista — colocar meu nome</span></span></button>' +
          '</div>' +
          (lista.length
            ? ''
            : (falhaRede
                ? '<p class="aviso aviso--vermelho" style="margin-top:10px">Não consegui buscar a lista de conferentes: ' +
                  U.esc(falhaRede) + '<br>Confira a internet e toque em CONFERENTE de novo.</p>'
                : '<p class="mut peq" style="margin-top:10px">Nenhum conferente cadastrado ainda. ' +
                  'Toque em <b>Outro conferente</b> e coloque seu nome para começar.</p>'))
      });

      function entrarComo(u) {
        Sessao.entrar(u);
        m.fechar();
        mostrarApp(true);
        irParaCasa();
      }

      U.$$('.js-quem', m).forEach(function (b) {
        b.addEventListener('click', function () {
          entrarComo(lista.filter(function (x) { return x.id === b.dataset.id; })[0]);
        });
      });

      /* Conferente que não está na lista: o nome é obrigatório para conferir,
         porque toda contagem fica assinada por quem contou. */
      U.$('#js-outro', m).addEventListener('click', function () {
        m.fechar();
        var m2 = U.modal({
          titulo: 'Qual é o seu nome?',
          html: '<p class="mut peq" style="margin-bottom:12px">Toda conferência fica registrada com o nome de quem contou, ' +
              'então é obrigatório se identificar para conferir. Escreva seu nome completo.</p>' +
            '<label class="campo"><span class="campo__rot">Seu nome</span>' +
              '<input class="entrada" id="nome-novo" placeholder="Ex.: João da Silva" autocomplete="name" ' +
              'style="text-transform:capitalize"></label>' +
            '<p id="nome-erro" class="aviso aviso--vermelho" hidden></p>',
          pe: '<button class="btn btn--branco" data-x>Voltar</button>' +
              '<button class="btn btn--verde" data-ok>ENTRAR E CONFERIR</button>',
          travado: true
        });
        var campo = U.$('#nome-novo', m2);
        campo.focus();

        function erro(texto) {
          var e = U.$('#nome-erro', m2);
          e.textContent = texto; e.hidden = false;
          campo.focus();
        }

        function confirmar() {
          var nome = campo.value.trim().replace(/\s+/g, ' ');
          if (nome.length < 3) return erro('Escreva seu nome com pelo menos 3 letras.');
          if (nome.indexOf(' ') < 0) return erro('Escreva nome e sobrenome, para não confundir com outro colega.');
          /* arruma as maiúsculas: "fabiano araujo" vira "Fabiano Araujo" */
          nome = nome.split(' ').map(function (p) {
            return p.length > 2 || nome.split(' ').indexOf(p) === 0
              ? p.charAt(0).toUpperCase() + p.slice(1).toLowerCase()
              : p.toLowerCase();   /* "de", "da", "do" ficam minúsculos */
          }).join(' ');

          /* mesmo nome de alguém já cadastrado: entra como a pessoa existente */
          var igual = App.usuarios.filter(function (u) {
            return u.nome.trim().toUpperCase() === nome.toUpperCase();
          })[0];
          if (igual) { m2.fechar(); return entrarComo(igual); }

          var botao = m2.querySelector('[data-ok]');
          botao.disabled = true; botao.textContent = 'Entrando...';
          Banco.criarUsuario({ nome: nome, tipo: 'conferente', ativo: true, avulso: true })
            .then(function (novo) {
              return App.carregarBase().then(function () { return novo; });
            })
            .then(function (novo) {
              m2.fechar();
              U.aviso('✓ Bem-vindo, ' + nome + '! Suas conferências ficam no seu nome.', 'ok', 5000);
              entrarComo(novo);
            })
            .catch(function (e) {
              botao.disabled = false; botao.textContent = 'ENTRAR E CONFERIR';
              erro(e.message);
            });
        }

        m2.querySelector('[data-x]').addEventListener('click', function () {
          m2.fechar();
          abrirEscolhaConferente(null);
        });
        m2.querySelector('[data-ok]').addEventListener('click', confirmar);
        campo.addEventListener('keydown', function (e) { if (e.key === 'Enter') confirmar(); });
      });
    }

    U.$('#topo-voltar').addEventListener('click', function () { App.voltar(); });

    U.$('#topo-sair').addEventListener('click', function () {
      U.confirmar('Sair', 'Deseja sair e voltar para a tela inicial?', 'Sair').then(function (ok) {
        if (!ok) return;
        Sessao.sair();
        App.pilha = [];
        mostrarApp(false);
      });
    });
  }

  /* ---------- partida ---------- */
  function iniciar() {
    try {
      if (!Banco.iniciar()) {
        telaConfiguracao('A URL e a chave do Supabase ainda não foram preenchidas.');
        return;
      }
    } catch (e) {
      telaConfiguracao(e.message);
      return;
    }

    ligarInicio();
    Tempo.iniciar();   /* mudanças de outros aparelhos aparecem sozinhas */

    /* O aplicativo SEMPRE abre na tela inicial, para a pessoa escolher
       se está entrando como coordenador ou como conferente. Sem isso,
       um celular emprestado abriria no perfil de quem usou por último. */
    Sessao.sair();

    /* Busca os usuários já na abertura: a tela inicial precisa deles. */
    Banco.listarUsuarios().then(function (us) {
      App.usuarios = us;
    }).catch(function (e) {
      U.aviso(Banco.explicar(e), 'erro', 8000);
      var rodape = U.$('#rodape-versao');
      if (rodape) rodape.textContent = 'Sem conexão com o banco de dados. Verifique a internet e recarregue.';
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar);
  else iniciar();
})();

</script>
</body>
</html>
