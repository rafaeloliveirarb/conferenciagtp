<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B4F9E">
<title>Central de Conferência — Gestão de Mercadorias para Eventos</title>

<!-- Bibliotecas externas (precisam de internet na primeira vez) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
/* ============================================================
   CENTRAL DE CONFERÊNCIA — V1
   Azul (estrutura) + Laranja (ações) sobre fundo claro.
   Feito para celular primeiro: botões grandes, texto legível.
   ============================================================ */

:root{
  --azul:#0B4F9E;
  --azul-esc:#083B77;
  --azul-clr:#E8F0FA;
  --azul-mid:#1565C0;
  --laranja:#F57C00;
  --laranja-esc:#D96A00;
  --laranja-clr:#FFF2E3;

  --fundo:#F4F6FA;
  --branco:#FFFFFF;
  --linha:#DCE3ED;
  --txt:#17202B;
  --txt-2:#5A6B7D;
  --txt-3:#8695A6;

  --verde:#1B8A4B;
  --verde-clr:#E7F6EC;
  --amarelo:#C77700;
  --amarelo-clr:#FFF6E0;
  --vermelho:#C62828;
  --vermelho-clr:#FDECEC;

  --r:12px;
  --r-lg:16px;
  --sombra:0 1px 3px rgba(16,32,48,.08), 0 8px 24px -14px rgba(16,32,48,.25);
  --fonte:"Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--fundo);color:var(--txt);
  font-family:var(--fonte);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
}
h1,h2,h3,h4{margin:0;line-height:1.2}
p{margin:0}
button{font:inherit;color:inherit}
[hidden]{display:none !important}
:focus-visible{outline:3px solid var(--laranja);outline-offset:2px;border-radius:6px}

.oculto{display:none !important}
.centro{text-align:center}
.dir{text-align:right}
.mut{color:var(--txt-2)}
.peq{font-size:14px}
.mono{font-variant-numeric:tabular-nums}

/* ---------- Botões ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 20px;border:2px solid transparent;border-radius:var(--r);
  background:var(--azul);color:#fff;font-weight:700;cursor:pointer;
  text-decoration:none;min-height:52px;transition:filter .15s ease, transform .06s ease;
}
.btn:active{transform:translateY(1px)}
.btn:hover{filter:brightness(1.08)}
.btn--laranja{background:var(--laranja)}
.btn--branco{background:var(--branco);color:var(--azul);border-color:var(--linha)}
.btn--branco:hover{border-color:var(--azul)}
.btn--verde{background:var(--verde)}
.btn--vermelho{background:var(--vermelho)}
.btn--bloco{width:100%}
.btn--gg{padding:22px;font-size:19px;border-radius:14px;min-height:72px}
.btn--peq{padding:9px 14px;min-height:42px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.btn-linha{display:flex;gap:10px;flex-wrap:wrap}
.btn-linha .btn{flex:1;min-width:150px}

/* ---------- Campos ---------- */
.campo{display:block;margin-bottom:16px}
.campo__rot{display:block;font-size:14px;font-weight:700;color:var(--txt-2);margin-bottom:6px}
.entrada{
  width:100%;padding:14px;border:2px solid var(--linha);border-radius:var(--r);
  background:var(--branco);font:inherit;color:var(--txt);min-height:52px;
}
select.entrada{appearance:none;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='%235A6B7D' stroke-width='2.5'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 14px center;padding-right:44px}
textarea.entrada{min-height:90px;resize:vertical}
.entrada:focus{border-color:var(--azul);outline:none}
.entrada::placeholder{color:var(--txt-3)}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media (max-width:600px){.dupla{grid-template-columns:1fr}}

/* ---------- Cabeçalho ---------- */
.topo{
  background:var(--azul);color:#fff;padding:14px 16px;
  display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:40;
  padding-top:max(14px, env(safe-area-inset-top));
  box-shadow:0 2px 10px rgba(11,79,158,.25);
}
.topo__voltar{
  width:44px;height:44px;flex:none;border:0;background:rgba(255,255,255,.14);color:#fff;
  border-radius:10px;cursor:pointer;font-size:22px;line-height:1;display:grid;place-items:center;
}
.topo__voltar:hover{background:rgba(255,255,255,.24)}
.topo__txt{flex:1;min-width:0}
.topo__txt h1{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo__txt p{font-size:13px;color:rgba(255,255,255,.75);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo__sair{
  border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:10px;
  padding:9px 14px;cursor:pointer;font-size:14px;font-weight:600;flex:none;
}
.topo__sair:hover{background:rgba(255,255,255,.24)}

.tela{max-width:920px;margin:0 auto;padding:18px 16px 90px}

/* ---------- Tela inicial ---------- */
.inicio{
  min-height:100dvh;display:flex;flex-direction:column;justify-content:center;
  padding:28px 20px;max-width:520px;margin:0 auto;
}
.inicio__marca{
  width:76px;height:76px;border-radius:20px;background:var(--azul);color:#fff;
  display:grid;place-items:center;margin:0 auto 20px;box-shadow:var(--sombra);
}
.inicio h1{
  font-size:clamp(28px,7vw,38px);text-align:center;color:var(--azul);
  letter-spacing:-.5px;margin-bottom:6px;
}
.inicio__sub{text-align:center;color:var(--txt-2);margin-bottom:34px;font-size:17px}
.inicio .btn{margin-bottom:14px}
.inicio__rodape{margin-top:24px;text-align:center;font-size:13px;color:var(--txt-3)}

/* ---------- Cartões ---------- */
.cartao{
  background:var(--branco);border:1px solid var(--linha);border-radius:var(--r-lg);
  box-shadow:var(--sombra);margin-bottom:16px;overflow:hidden;
}
.cartao__topo{padding:16px 18px;border-bottom:1px solid var(--linha);display:flex;align-items:center;gap:12px}
.cartao__topo h3{font-size:19px;flex:1;min-width:0}
.cartao__corpo{padding:18px}
.secao{margin-bottom:26px}
.secao__tit{font-size:20px;color:var(--azul);margin-bottom:12px;display:flex;align-items:center;gap:10px}
.secao__tit .n{font-size:14px;color:var(--txt-3);font-weight:400}

/* ---------- Indicadores do painel ---------- */
.indicadores{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:22px}
@media (min-width:700px){.indicadores{grid-template-columns:repeat(4,1fr)}}
.ind{
  background:var(--branco);border:1px solid var(--linha);border-radius:var(--r);
  padding:16px;text-align:left;border-top:4px solid var(--azul);
}
.ind--laranja{border-top-color:var(--laranja)}
.ind--verde{border-top-color:var(--verde)}
.ind--vermelho{border-top-color:var(--vermelho)}
.ind__num{font-size:34px;font-weight:800;line-height:1;color:var(--azul)}
.ind--laranja .ind__num{color:var(--laranja)}
.ind--verde .ind__num{color:var(--verde)}
.ind--vermelho .ind__num{color:var(--vermelho)}
.ind__rot{font-size:13px;color:var(--txt-2);font-weight:600;margin-top:6px}

/* ---------- Situações ---------- */
.sit{
  max-width:100%;display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;
  font-size:13px;font-weight:700;white-space:nowrap;
}
.sit::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.sit--aguardando{background:var(--azul-clr);color:var(--azul)}
.sit--andamento{background:var(--amarelo-clr);color:var(--amarelo)}
.sit--salvo{background:var(--azul-clr);color:var(--azul-mid)}
.sit--finalizado{background:var(--verde-clr);color:var(--verde)}
.sit--divergencia{background:var(--vermelho-clr);color:var(--vermelho)}

/* ---------- Evento na lista ---------- */
.evento{
  background:var(--branco);border:1px solid var(--linha);border-radius:var(--r-lg);
  box-shadow:var(--sombra);margin-bottom:14px;padding:18px;
}
.evento__topo{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 12px;align-items:flex-start;margin-bottom:10px}
.evento__nome{flex:1 1 180px;min-width:0;font-size:21px;font-weight:800;color:var(--azul);line-height:1.2}
.evento__dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px;margin-bottom:14px}
.evento__dl dt{color:var(--txt-3);font-size:13px;font-weight:600}
.evento__dl dd{margin:0;font-weight:600}

/* ---------- Tabelas ---------- */
.tabela-rolagem{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tab{width:100%;border-collapse:collapse}
.tab th{
  text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.5px;
  color:var(--txt-2);padding:10px 12px;background:#F7F9FC;border-bottom:2px solid var(--linha);white-space:nowrap;
}
.tab td{padding:12px;border-bottom:1px solid var(--linha);font-size:15px}
.tab tr:last-child td{border-bottom:0}
.tab td.num,.tab th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tab tfoot td{font-weight:800;background:#F7F9FC;border-top:2px solid var(--linha)}
.dif-ok{color:var(--verde);font-weight:700}
.dif-menos{color:var(--vermelho);font-weight:800}
.dif-mais{color:var(--amarelo);font-weight:800}

/* Tabela de edição do checklist: no celular cada produto vira um bloco,
   com o nome ocupando a linha inteira. Sem isso o campo do nome fica
   estreito demais para ler "Montante 2,70". */
@media (max-width:620px){
  .tab--edit thead{display:none}
  .tab--edit tr{
    display:grid;grid-template-columns:1fr 104px 46px;gap:8px;align-items:center;
    padding:12px;border-bottom:1px solid var(--linha);
  }
  .tab--edit td{border:0;padding:0}
  .tab--edit td:first-child{grid-column:1 / -1}
  .tab--edit td:first-child::before{
    content:"Produto";display:block;font-size:11px;font-weight:700;color:var(--txt-3);
    text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;
  }
}

/* ---------- Contador de conferência ---------- */
.prod{
  background:var(--branco);border:1px solid var(--linha);border-left:6px solid var(--linha);
  border-radius:var(--r);padding:16px;margin-bottom:14px;
}
.prod.ok{border-left-color:var(--verde)}
.prod.dif{border-left-color:var(--vermelho)}
.prod.pend{border-left-color:var(--amarelo)}
.prod__nome{font-size:19px;font-weight:800;line-height:1.2;margin-bottom:4px}
.prod__prev{font-size:14px;color:var(--txt-2);margin-bottom:12px}
.prod__prev b{color:var(--txt);font-size:16px}
.contador{display:grid;grid-template-columns:64px 1fr 64px;gap:10px;align-items:center}
.contador__btn{
  height:62px;border:2px solid var(--linha);background:var(--branco);border-radius:12px;
  font-size:30px;font-weight:700;color:var(--azul);cursor:pointer;display:grid;place-items:center;
  user-select:none;
}
.contador__btn:hover{border-color:var(--azul);background:var(--azul-clr)}
.contador__btn:active{background:var(--azul);color:#fff}
.contador__campo{
  height:62px;text-align:center;font-size:26px;font-weight:800;width:100%;
  border:2px solid var(--linha);border-radius:12px;background:#FBFCFE;color:var(--txt);
  font-variant-numeric:tabular-nums;
}
.contador__campo:focus{outline:none;border-color:var(--azul);background:#fff}
.contador__campo.ok{border-color:var(--verde);background:var(--verde-clr)}
.contador__campo.dif{border-color:var(--vermelho);background:var(--vermelho-clr)}
.prod__res{margin-top:10px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.prod__res.ok{color:var(--verde)}
.prod__res.dif{color:var(--vermelho)}
.prod__res.mais{color:var(--amarelo)}
.prod__res.pend{color:var(--txt-3)}
.atalhos{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.atalho{
  border:1px solid var(--linha);background:var(--branco);border-radius:99px;
  padding:7px 13px;font-size:13px;font-weight:600;color:var(--txt-2);cursor:pointer;
}
.atalho:hover{border-color:var(--azul);color:var(--azul)}

/* ---------- Calculadora de pallet / caixa ---------- */
.emb{margin-top:12px;border-top:1px dashed var(--linha);padding-top:10px}
.emb__abrir{
  display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;cursor:pointer;
  color:var(--azul);font-weight:700;font-size:14px;padding:4px 0;text-align:left;
}
.emb__abrir .seta{margin-left:auto;transition:transform .15s ease}
.emb.is-aberta .emb__abrir .seta{transform:rotate(180deg)}
.emb__corpo{display:none;padding-top:10px}
.emb.is-aberta .emb__corpo{display:block}
.emb__linha{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.emb__campo{display:block}
.emb__campo span{
  display:block;font-size:12px;font-weight:700;color:var(--txt-2);margin-bottom:4px;
  text-transform:uppercase;letter-spacing:.3px;
}
.emb__campo input{
  width:100%;padding:11px;border:2px solid var(--linha);border-radius:10px;
  font:inherit;text-align:center;font-weight:700;min-height:48px;background:var(--branco);
}
.emb__campo input:focus{outline:none;border-color:var(--azul)}
.emb__dica{
  background:var(--azul-clr);border-radius:10px;padding:10px 12px;font-size:14px;
  color:var(--azul-esc);margin-bottom:10px;line-height:1.45;
}
.emb__dica b{font-weight:800}
.emb__total{
  margin-top:10px;background:var(--laranja-clr);border:1px solid #FFD9AE;border-radius:10px;
  padding:10px 12px;font-size:15px;font-weight:700;color:#8A4B00;text-align:center;
}
.emb__obs{width:100%;margin-top:10px;padding:11px;border:2px solid var(--linha);border-radius:10px;font:inherit;min-height:48px}
.emb__obs:focus{outline:none;border-color:var(--azul)}
.emb__marca{
  display:inline-block;background:var(--azul-clr);color:var(--azul);font-size:12px;font-weight:700;
  padding:3px 9px;border-radius:99px;margin-top:8px;
}

/* ---------- Barra fixa inferior ---------- */
.barra-fixa{
  position:sticky;bottom:0;background:linear-gradient(to top,var(--fundo) 66%,rgba(244,246,250,0));
  padding:16px 0 8px;margin-top:8px;
}
.barra-fixa .btn{box-shadow:0 6px 20px -8px rgba(245,124,0,.7)}

/* ---------- Avisos ---------- */
.aviso{
  display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:var(--r);
  font-size:15px;margin-bottom:14px;border:1px solid;line-height:1.45;
}
.aviso b{display:block}
.aviso__ico{font-size:20px;line-height:1;flex:none}
.aviso--azul{background:var(--azul-clr);border-color:#C5D9F1;color:var(--azul-esc)}
.aviso--verde{background:var(--verde-clr);border-color:#BFE5CD;color:#0F5C31}
.aviso--amarelo{background:var(--amarelo-clr);border-color:#F5DFA8;color:#8A5400}
.aviso--vermelho{background:var(--vermelho-clr);border-color:#F5C6C6;color:#992121}

.vazio{text-align:center;padding:44px 20px;color:var(--txt-2)}
.vazio__ico{font-size:44px;margin-bottom:12px}
.vazio h3{font-size:20px;color:var(--txt);margin-bottom:6px}

/* ---------- Lista de escolha ---------- */
.escolha{display:flex;flex-direction:column;gap:12px}
.escolha__item{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;
  background:var(--branco);border:2px solid var(--linha);border-radius:var(--r);padding:18px;
  min-height:72px;
}
.escolha__item:hover{border-color:var(--azul);background:var(--azul-clr)}
.escolha__ini{
  width:46px;height:46px;flex:none;border-radius:50%;background:var(--azul);color:#fff;
  display:grid;place-items:center;font-weight:800;font-size:17px;
}
.escolha__nome{display:block;font-size:18px;font-weight:700}
.escolha__papel{display:block;font-size:14px;color:var(--txt-2)}

/* ---------- Etapas da conferência ---------- */
.etapas{display:grid;gap:12px}
.etapa{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;
  background:var(--branco);border:2px solid var(--linha);border-radius:var(--r);padding:16px;
}
.etapa:hover:not(:disabled){border-color:var(--laranja)}
.etapa:disabled{opacity:.55;cursor:not-allowed}
.etapa__n{
  width:44px;height:44px;flex:none;border-radius:12px;background:var(--azul-clr);color:var(--azul);
  display:grid;place-items:center;font-weight:800;font-size:19px;
}
.etapa__c{flex:1;min-width:0}
.etapa__t{display:block;font-size:18px;font-weight:800;line-height:1.25}
.etapa__d{display:block;font-size:14px;color:var(--txt-2);margin-top:2px}
.etapa__seta{font-size:22px;color:var(--txt-3);flex:none}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:640px){.modal{align-items:center}}
.modal__fundo{position:absolute;inset:0;background:rgba(16,32,48,.55)}
.modal__caixa{
  position:relative;background:var(--branco);width:min(560px,100%);max-height:92dvh;overflow:auto;
  border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.3);
}
@media (min-width:640px){.modal__caixa{border-radius:var(--r-lg)}}
.modal__topo{padding:18px;border-bottom:1px solid var(--linha);position:sticky;top:0;background:var(--branco);z-index:2}
.modal__topo h3{font-size:20px;color:var(--azul)}
.modal__corpo{padding:18px}
.modal__pe{padding:16px 18px;border-top:1px solid var(--linha);display:flex;gap:10px;position:sticky;bottom:0;background:var(--branco)}
.modal__pe .btn{flex:1}

/* ---------- Mensagens flutuantes ---------- */
.avisos{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:200;width:min(460px,94vw);display:flex;flex-direction:column;gap:10px}
.flash{
  background:var(--txt);color:#fff;padding:14px 16px;border-radius:12px;font-size:15px;
  box-shadow:0 10px 30px rgba(0,0,0,.3);display:flex;gap:10px;align-items:flex-start;
  animation:sobe .18s ease;
}
@keyframes sobe{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.flash--ok{border-left:5px solid #4ADE80}
.flash--erro{border-left:5px solid #F87171}
.flash--info{border-left:5px solid #60A5FA}

/* ---------- Carregando ---------- */
.carregando{display:flex;align-items:center;justify-content:center;gap:12px;padding:40px;color:var(--txt-2)}
.giro{
  width:26px;height:26px;border:3px solid var(--linha);border-top-color:var(--azul);
  border-radius:50%;animation:girar .8s linear infinite;
}
@keyframes girar{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* ---------- Configuração pendente ---------- */
.config{max-width:640px;margin:0 auto;padding:30px 20px}
.config pre{
  background:#0F2233;color:#8FE3A8;padding:16px;border-radius:12px;overflow:auto;
  font-size:13px;line-height:1.6;font-family:ui-monospace,Menlo,Consolas,monospace;
}
.config ol{padding-left:22px;line-height:1.8}

/* ---------- Carregamentos ---------- */
.carga{background:var(--branco);border:2px solid var(--linha);border-radius:var(--r-lg);margin-bottom:16px;overflow:hidden}
.carga__topo{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;background:var(--azul-clr)}
.carga__tit{font-size:17px;font-weight:800;color:var(--azul)}
.carga__cam{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--linha);font-size:15px;flex-wrap:wrap}
.carga__cam b{color:var(--azul)}

<script>
/* ============================================================
   Leitura da configuração
   ------------------------------------------------------------
   Os valores ficam no bloco de configuração logo acima, separado do
   resto do código de propósito: se alguém errar a edição, o
   aplicativo continua funcionando e mostra a tela de ajuda,

   aparelho.

function textoConfig(valor) {
  return (typeof valor === 'string') ? valor.trim() : '';
}

var CONFIG_LOCAL = 'central_conferencia_config';

function configDoAparelho() {
  try { return JSON.parse(localStorage.getItem(CONFIG_LOCAL)) || null; }
  catch (e) { return null; }
}

function guardarConfigNoAparelho(url, chave) {
  try { localStorage.setItem(CONFIG_LOCAL, JSON.stringify({ url: url, chave: chave })); return true; }
  catch (e) { return false; }
}

var SUPABASE_URL = textoConfig(window.SUPABASE_URL);
var SUPABASE_ANON_KEY = textoConfig(window.SUPABASE_ANON_KEY);
var SENHA_COORDENADOR = textoConfig(window.SENHA_COORDENADOR) || '415263';

/* Se o arquivo não estiver preenchido, usa o que foi digitado no aparelho. */
(function () {
  if (SUPABASE_URL && SUPABASE_ANON_KEY) return;
  var local = configDoAparelho();
  if (local && local.url && local.chave) {
    SUPABASE_URL = local.url;
    SUPABASE_ANON_KEY = local.chave;
  }
})();

/* ============================================================
   js/utils.js — funções de apoio usadas no sistema inteiro
   ============================================================ */
const U = {
  $: function (s, ctx) { return (ctx || document).querySelector(s); },
  $$: function (s, ctx) { return Array.prototype.slice.call((ctx || document).querySelectorAll(s)); },

  /* Evita que texto digitado quebre o HTML da tela. */
  esc: function (v) {
    return String(v === null || v === undefined ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  },

  num: function (v) {
    var n = Number(String(v === null || v === undefined ? '' : v).replace(',', '.'));
    return isNaN(n) ? 0 : n;
  },

  /* Mostra número inteiro quando não há casas decimais. */
  fmt: function (v) {
    var n = U.num(v);
    return Number.isInteger(n) ? String(n) : n.toFixed(2).replace('.', ',');
  },

  fmtData: function (iso) {
    if (!iso) return '—';
    var p = String(iso).slice(0, 10).split('-');
    if (p.length !== 3) return String(iso);
    return p[2] + '/' + p[1] + '/' + p[0];
  },

  fmtDataHora: function (iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso);
    return d.toLocaleDateString('pt-BR') + ' às ' +
      String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  },

  hojeISO: function () {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  },

  iniciais: function (nome) {
    var p = String(nome || '').trim().split(/\s+/);
    return ((p[0] || '')[0] || '') + ((p[1] || '')[0] || '');
  },

  /* Mensagem rápida no rodapé da tela. */
  aviso: function (texto, tipo, ms) {
    /* a bolinha do aviso já traz o símbolo: evita "✓ ✓" na tela */
    texto = String(texto || '').replace(/^[✓⚠ℹ]\s*/, '');
    var caixa = document.createElement('div');
    caixa.className = 'flash flash--' + (tipo || 'info');
    caixa.innerHTML = '<span>' + (tipo === 'ok' ? '✓' : tipo === 'erro' ? '⚠' : 'ℹ') + '</span><span>' + U.esc(texto) + '</span>';
    U.$('#avisos').appendChild(caixa);
    setTimeout(function () { caixa.remove(); }, ms || 3800);
  },

  /* Janela sobreposta. Devolve o elemento com .fechar(). */
  modal: function (op) {
    var el = document.createElement('div');
    el.className = 'modal';
    el.innerHTML =
      '<div class="modal__fundo"></div>' +
      '<div class="modal__caixa" role="dialog" aria-modal="true">' +
        '<div class="modal__topo"><h3>' + U.esc(op.titulo) + '</h3></div>' +
        '<div class="modal__corpo">' + (op.html || '') + '</div>' +
        (op.pe ? '<div class="modal__pe">' + op.pe + '</div>' : '') +
      '</div>';
    U.$('#modais').appendChild(el);
    el.fechar = function () { el.remove(); };
    el.querySelector('.modal__fundo').addEventListener('click', function () {
      if (!op.travado) el.fechar();
    });
    return el;
  },

  /* Pergunta de sim ou não. Devolve uma promessa com true/false. */
  confirmar: function (titulo, texto, rotuloSim, classe) {
    return new Promise(function (resolve) {
      var m = U.modal({
        titulo: titulo,
        html: '<p>' + U.esc(texto) + '</p>',
        pe: '<button class="btn btn--branco" data-nao>Cancelar</button>' +
            '<button class="btn ' + (classe || 'btn--laranja') + '" data-sim>' + U.esc(rotuloSim || 'Confirmar') + '</button>',
        travado: true
      });
      m.querySelector('[data-nao]').addEventListener('click', function () { m.fechar(); resolve(false); });
      m.querySelector('[data-sim]').addEventListener('click', function () { m.fechar(); resolve(true); });
    });
  },

  carregando: function (texto) {
    return '<div class="carregando"><span class="giro"></span><span>' + U.esc(texto || 'Carregando...') + '</span></div>';
  },

  /* Marca visual das situações (item 33 do projeto). */
  bolinha: function (dif, pendente) {
    if (pendente) return '🟡';
    return U.num(dif) === 0 ? '🟢' : '🔴';
  }
};

/* ============================================================
   js/supabase.js — toda conversa com o banco passa por aqui
   ============================================================ */
/* A barra da Vercel (e algumas extensões) tenta clonar os cabeçalhos das
   chamadas e quebra com "Headers object could not be cloned". Este fetch
   converte os cabeçalhos para um objeto simples antes de enviar — clonável,
   então a chamada passa mesmo com a barra ligada. */
function fetchLimpo(recurso, opcoes) {
  opcoes = opcoes || {};
  try {
    if (opcoes.headers && typeof Headers !== 'undefined' && opcoes.headers instanceof Headers) {
      var simples = {};
      opcoes.headers.forEach(function (v, k) { simples[k] = v; });
      opcoes = Object.assign({}, opcoes, { headers: simples });
    }
  } catch (e) { /* qualquer coisa estranha: segue com o que veio */ }
  return fetch(recurso, opcoes);
}

const Banco = {
  cliente: null,
  configurado: false,

  iniciar: function () {
    this.configurado = !!(SUPABASE_URL && SUPABASE_ANON_KEY);
    if (!this.configurado) return false;
    if (typeof supabase === 'undefined' || !supabase.createClient) {
      throw new Error('A biblioteca do Supabase não carregou. Verifique sua conexão com a internet e recarregue a página.');
    }
    this.cliente = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      global: { fetch: fetchLimpo }
    });
    return true;
  },

  /* Traduz o erro técnico do Supabase em algo que dá para entender. */
  explicar: function (erro) {
    var m = (erro && (erro.message || erro.msg)) || 'Erro desconhecido';
    if (/DataCloneError|could not be cloned|postMessage/i.test(m)) {
      return 'Uma extensão ou barra do navegador (ex.: Vercel Toolbar) interferiu na conexão. ' +
        'Desative-a ou teste numa janela anônima — nos celulares da equipe isso não acontece.';
    }
    if (/Failed to fetch|NetworkError|network/i.test(m)) {
      return 'Não foi possível falar com o servidor. Verifique sua conexão com a internet e tente novamente.';
    }
    if (/relation .* does not exist|schema cache|Could not find the table/i.test(m)) {
      return 'As tabelas ainda não existem no Supabase. Rode o comando SQL da instalação (arquivo banco.sql) e tente de novo.';
    }
    if (/JWT|apikey|Invalid API key/i.test(m)) {
      return 'A chave do Supabase foi recusada. Confira se você copiou a chave "anon public" correta.';
    }
    if (/row-level security|violates row-level/i.test(m)) {
      return 'O Supabase bloqueou a operação (regra de segurança). Rode a parte de permissões do arquivo banco.sql.';
    }
    return m;
  },

  /* Todas as funções abaixo devolvem promessas e estouram erro tratável. */
  _erro: function (erro) { throw new Error(Banco.explicar(erro)); },

  listarUsuarios: function () {
    return this.cliente.from('usuarios').select('*').eq('ativo', true).order('nome')
      .then(function (r) { if (r.error) Banco._erro(r.error); return r.data || []; });
  },

  /* Conferente novo se cadastra na hora de entrar (papel sempre 'conferente'). */
  criarUsuario: function (u) {
    return this.cliente.from('usuarios').insert(u).select()
      .then(function (r) { if (r.error) Banco._erro(r.error); return (r.data || [])[0]; });
  },

  listarEventos: function () {
    return this.cliente.from('eventos').select('*').order('created_at', { ascending: false })
      .then(function (r) { if (r.error) Banco._erro(r.error); return r.data || []; });
  },

  criarEvento: function (ev) {
    return this.cliente.from('eventos').insert(ev).select()
      .then(function (r) { if (r.error) Banco._erro(r.error); return (r.data || [])[0]; });
  },

  /* Exclui o evento inteiro. A cascata do banco apaga junto:
     checklist, carregamentos, conferências, itens e fotos. */
  apagarEvento: function (id) {
    return this.cliente.from('eventos').delete().eq('id', id)
      .then(function (r) { if (r.error) Banco._erro(r.error); return true; });
  },

  atualizarEvento: function (id, campos) {
    campos.updated_at = new Date().toISOString();
    return this.cliente.from('eventos').update(campos).eq('id', id).select()
      .then(function (r) { if (r.error) Banco._erro(r.error); return (r.data || [])[0]; });
  },

  listarProdutos: function (eventoId) {
    return this.cliente.from('produtos').select('*').eq('evento_id', eventoId).order('created_at')
      .then(function (r) { if (r.error) Banco._erro(r.error); return r.data || []; });
  },

  /* Adiciona UM produto ao checklist (usado para material terceirizado
     que aparece na hora do carregamento). */
  criarProduto: function (eventoId, p) {
    return this.cliente.from('produtos').insert({
      evento_id: eventoId,
      nome: p.nome,
      quantidade_prevista: U.num(p.quantidade_prevista),
      unidade: p.unidade || 'UN',
      terceirizado: true
    }).select().then(function (r) { if (r.error) Banco._erro(r.error); return (r.data || [])[0]; });
  },

  /* Exclui o checklist inteiro do evento. As contagens lançadas
     nesses produtos também são apagadas (cascata do banco). */
  apagarProdutos: function (eventoId) {
    return this.cliente.from('produtos').delete().eq('evento_id', eventoId)
      .then(function (r) { if (r.error) Banco._erro(r.error); return true; });
  },

  salvarProdutos: function (eventoId, lista) {
    var self = this;
    /* O checklist é reescrito por inteiro: apaga o antigo e grava o novo. */
    return this.cliente.from('produtos').delete().eq('evento_id', eventoId)
      .then(function (r) {
        if (r.error) Banco._erro(r.error);
        if (!lista.length) return [];
        var linhas = lista.map(function (p) {
          return {
            evento_id: eventoId,
            nome: p.nome,
            quantidade_prevista: U.num(p.quantidade_prevista),
            unidade: p.unidade || 'UN',
            terceirizado: !!p.terceirizado
          };
        });
        return self.cliente.from('produtos').insert(linhas).select()
          .then(function (r2) { if (r2.error) Banco._erro(r2.error); return r2.data || []; });
      });
  },

  /* Quais eventos já têm checklist lançado (para mostrar na lista). */
  eventosComChecklist: function () {
    return this.cliente.from('produtos').select('evento_id')
      .then(function (r) {
        if (r.error) Banco._erro(r.error);
        var mapa = {};
        (r.data || []).forEach(function (p) {
          mapa[p.evento_id] = (mapa[p.evento_id] || 0) + 1;
        });
        return mapa;
      });
  },

  listarConferencias: function (eventoId) {
    var q = this.cliente.from('conferencias').select('*');
    if (eventoId) q = q.eq('evento_id', eventoId);
    return q.order('created_at').then(function (r) {
      if (r.error) Banco._erro(r.error);
      return r.data || [];
    });
  },

  criarConferencia: function (c) {
    return this.cliente.from('conferencias').insert(c).select()
      .then(function (r) { if (r.error) Banco._erro(r.error); return (r.data || [])[0]; });
  },

  atualizarConferencia: function (id, campos) {
    campos.updated_at = new Date().toISOString();
    return this.cliente.from('conferencias').update(campos).eq('id', id).select()
      .then(function (r) { if (r.error) Banco._erro(r.error); return (r.data || [])[0]; });
  },

  listarItens: function (conferenciaId) {
    return this.cliente.from('itens_conferencia').select('*').eq('conferencia_id', conferenciaId)
      .then(function (r) { if (r.error) Banco._erro(r.error); return r.data || []; });
  },

  /* Regrava os itens da conferência (apaga e insere de novo). */
  salvarItens: function (conferenciaId, itens) {
    var self = this;
    return this.cliente.from('itens_conferencia').delete().eq('conferencia_id', conferenciaId)
      .then(function (r) {
        if (r.error) Banco._erro(r.error);
        if (!itens.length) return [];
        var linhas = itens.map(function (i) {
          return {

          };
        });
        return self.cliente.from('itens_conferencia').insert(linhas).select()

  /* ---------- arquivos no Storage (nota fiscal em PDF/imagem) ---------- */
  subirArquivo: function (caminho, arquivo) {
    var self = this;
    return self.cliente.storage.from('fotos')
      .upload(caminho, arquivo, { upsert: true, contentType: arquivo.type || 'application/octet-stream' })
      .then(function (r) {
        if (r.error) throw new Error('Não deu para enviar o arquivo: ' + r.error.message);
        var pub = self.cliente.storage.from('fotos').getPublicUrl(caminho);
        var url = pub && pub.data ? pub.data.publicUrl : null;
        if (!url) throw new Error('O arquivo subiu mas a URL não veio. Tente de novo.');
        return url;
      });
  },

  /* ---------- fotos no Storage (bucket "fotos") ---------- */
  /* Sobe uma foto (data:image/jpeg;base64,...) e devolve a URL pública.
     Se falhar (sem internet, bucket não criado), devolve null e o app
     guarda a foto em base64 mesmo — nada se perde. */
  subirFoto: function (caminho, dataUrl) {
    var self = this;
    return new Promise(function (resolve) {
      try {
        var partes = dataUrl.split(',');
        var bin = atob(partes[1]);
        var bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        var blob = new Blob([bytes], { type: 'image/jpeg' });
        self.cliente.storage.from('fotos').upload(caminho, blob, { upsert: true, contentType: 'image/jpeg' })
          .then(function (r) {
            if (r.error) return resolve(null);
            var pub = self.cliente.storage.from('fotos').getPublicUrl(caminho);
            resolve(pub && pub.data ? pub.data.publicUrl : null);
          })
          .catch(function () { resolve(null); });
      } catch (e) { resolve(null); }
    });
  },

  /* ---------- carregamentos ---------- */
  listarCarregamentos: function (eventoId) {
    var q = this.cliente.from('carregamentos').select('*');
    if (eventoId) q = q.eq('evento_id', eventoId);

const Sessao = {

  carregar: function () {
    try { this.atual = JSON.parse(localStorage.getItem(this.CHAVE)) || null; }

  sair: function () {

  ehCoordenador: function () { return !!this.atual && this.atual.tipo === 'coordenador'; },
  ehConferente: function () { return !!this.atual && this.atual.tipo === 'conferente'; }
};
/* ============================================================
   js/checklist.js — leitura do checklist enviado pelo usuário
   Aceita XML, PDF e imagem. A imagem serve como consulta:
   a digitação é manual (leitura automática de foto fica para a V2).
   ============================================================ */
const Checklist = {

  /* ---------- Unidades ----------
     O mesmo material pode vir em unidade, caixa ou pallet, e o
     checklist escreve isso colado no número ("5cx", "87un").
     Aqui cada apelido vira uma sigla só. */
  UNIDADES: {
    UN: ['un', 'und', 'unid', 'unidade', 'unidades', 'pc', 'pç', 'pcs', 'peca', 'peça', 'pecas', 'peças'],
    CX: ['cx', 'cxs', 'caixa', 'caixas'],
    PALLET: ['pallet', 'pallets', 'palete', 'paletes', 'plt', 'pl'],
    KIT: ['kit', 'kits'],
    CJ: ['cj', 'cjs', 'conj', 'conjunto', 'conjuntos'],
    M: ['m', 'mt', 'mts', 'metro', 'metros'],
    RL: ['rl', 'rolo', 'rolos'],
    PCT: ['pct', 'pacote', 'pacotes'],
    PAR: ['par', 'pares'],
    SC: ['sc', 'saco', 'sacos']
  },

  /* Devolve a sigla da unidade, ou null se a palavra não for uma unidade. */
  unidadeDe: function (texto) {
    var t = String(texto || '').toLowerCase().replace(/[.\s]/g, '');
    if (!t) return null;
    var achou = null;
    Object.keys(Checklist.UNIDADES).forEach(function (sigla) {
      if (achou) return;
      if (Checklist.UNIDADES[sigla].indexOf(t) >= 0) achou = sigla;
    });
    return achou;
  },

  LISTA_UNIDADES: ['UN', 'CX', 'PALLET', 'KIT', 'CJ', 'M', 'RL', 'PCT', 'PAR', 'SC'],

  /* ---------- 1. Uma linha → produto ----------
     Precisa aguentar nome com medida ("Montante 2,70"), com código
     ("Z500 - 96") e com a unidade colada ("5cx", "87un"). */
  lerLinha: function (linhaBruta) {
    var linha = String(linhaBruta || '').replace(/\s+/g, ' ').trim();
    if (linha.length < 2) return null;
    if (/^[\d\s.,\/:-]+$/.test(linha)) return null;                  /* só números ou datas */
    if (/^(total|subtotal|soma|somatório|geral)\b/i.test(linha)) return null;
    if (/^\s*(nome do evento|evento|cliente|contratante|empresa|razao social|razão social|local|endereco|endereço|pavilhao|pavilhão|espaco|espaço|data|data do evento|responsavel|responsável|conferente|coordenador|os|ordem de servico|ordem de serviço|obs|observacao|observação|telefone|contato|cnpj|cpf|emissao|emissão|nota fiscal|nf|nfe)\s*[:\-–—]/i.test(linha)) return null;
    if (/^(quantidade|qtd|qtde|quant)\b/i.test(linha) && !/\d\s*$/.test(linha)) return null;

    var nome = null, qtd = null, unidade = null, m;

    /* "5 x Cadeira"  /  "5x Cadeira" */
    if ((m = linha.match(/^(\d+(?:[.,]\d+)?)\s*[xX]\s+(.{2,})$/))) {
      qtd = m[1]; nome = m[2];
    }
    /* "Cadeira — 100 cx"  /  "Cadeira: 100"  /  "Cadeira ..... 100un" */
    else if ((m = linha.match(/^(.{2,}?)\s*(?:[—–\-:]|\.{2,})\s*(\d+(?:[.,]\d+)?)\s*([A-Za-zÀ-ÿ.]{1,10})?$/))) {
      nome = m[1]; qtd = m[2]; unidade = m[3];
    }
    /* "Montante 2,70 5cx"  /  "Abas 98 224"  /  "Extensão 11" */
    else if ((m = linha.match(/^(.*[A-Za-zÀ-ÿ].*?)\s+(\d+(?:[.,]\d+)?)\s*([A-Za-zÀ-ÿ.]{1,10})?$/))) {
      nome = m[1]; qtd = m[2]; unidade = m[3];
    }
    if (!nome || qtd === null) return null;

    /* Se sobrou palavra depois do número e ela não é unidade conhecida,
       a linha não é "produto + quantidade" — melhor descartar do que inventar. */
    var sigla = 'UN';
    if (unidade) {
      sigla = Checklist.unidadeDe(unidade);
      if (!sigla) return null;
    }

    nome = nome.replace(/[\s.\-—–:]+$/, '').trim();
    if (nome.length < 2 || !/[A-Za-zÀ-ÿ]/.test(nome)) return null;

    var n = Number(String(qtd).replace(',', '.'));
    if (!isFinite(n) || n <= 0) return null;

    return { nome: nome, quantidade_prevista: n, unidade: sigla };
  },

  /* A linha é só uma quantidade? ("22", "5cx", "87un") */
  soQuantidade: function (linha) {
    var t = String(linha || '').trim();
    var m = t.match(/^(\d+(?:[.,]\d+)?)\s*([A-Za-zÀ-ÿ.]{1,10})?$/);
    if (!m) return false;
    return !m[2] || !!Checklist.unidadeDe(m[2]);
  },

  /* ---------- 2. Texto inteiro → lista de produtos ----------
     Em tabela de PDF o nome costuma quebrar em duas linhas
     ("Emenda de" / "montante 22"). Antes de ler, essas linhas
     são costuradas de volta. */
  deTexto: function (texto) {
    var cruas = String(texto || '').split(/\r?\n/)
      .map(function (l) { return l.replace(/\s+/g, ' ').trim(); })
      .filter(function (l) { return l.length > 0; });

    var achados = [];

    for (var i = 0; i < cruas.length; i++) {
      var linha = cruas[i];
      var lido = Checklist.lerLinha(linha);

      /* não deu: talvez o nome tenha quebrado e o resto esteja na linha seguinte */
      if (!lido && i + 1 < cruas.length) {
        var proxima = cruas[i + 1];
        var juntar = false;

        if (Checklist.soQuantidade(proxima)) {
          juntar = true;                                   /* "Extensão" + "11" */
        } else {
          var lidoProx = Checklist.lerLinha(proxima);
          /* "Emenda de" + "montante 22" — continuação começa em minúscula */
          if (lidoProx && /^[a-zà-ÿ]/.test(lidoProx.nome)) juntar = true;
        }

        if (juntar) {
          lido = Checklist.lerLinha(linha + ' ' + proxima);
          if (lido) i++;   /* consumiu as duas linhas */
        }
      }

      if (lido) achados.push(lido);
    }

    return Checklist.juntarIguais(achados);
  },

  /* Soma quantidades de produtos com o mesmo nome e a mesma unidade. */
  /* Lê vários arquivos de uma vez e junta os produtos de todos.
     Arquivo com problema não derruba os outros: entra na lista de falhas. */
  lerVarios: function (arquivos) {
    var lista = Array.prototype.slice.call(arquivos || []);
    return Promise.all(lista.map(function (arq) {
      return Checklist.lerArquivo(arq)
        .then(function (res) { return { arquivo: arq.name, res: res }; })
        .catch(function (e) { return { arquivo: arq.name, erro: e.message }; });
    })).then(function (resultados) {
      var juntos = { produtos: [], sugestao: null, imagem: null, falhas: [], lidos: 0 };
      resultados.forEach(function (r) {
        if (r.erro) { juntos.falhas.push(r.arquivo + ': ' + r.erro); return; }
        juntos.lidos++;
        var res = r.res || {};
        if (res.produtos && res.produtos.length) juntos.produtos = juntos.produtos.concat(res.produtos);
        if (!juntos.sugestao && res.sugestao && (res.sugestao.evento || res.sugestao.cliente)) juntos.sugestao = res.sugestao;
        if (!juntos.imagem && res.imagem) juntos.imagem = res.imagem;
        if (res.recado && !res.produtos) juntos.falhas.push(r.arquivo + ': ' + res.recado);
      });
      juntos.produtos = Checklist.juntarIguais(juntos.produtos);
      return juntos;
    });
  },

  juntarIguais: function (lista) {
    var mapa = {};
    var ordem = [];
    lista.forEach(function (p) {
      var unidade = p.unidade || 'UN';
      var chave = p.nome.toLowerCase() + '|' + unidade;
      if (!mapa[chave]) {
        mapa[chave] = { nome: p.nome, quantidade_prevista: 0, unidade: unidade };
        ordem.push(chave);
      }
      mapa[chave].quantidade_prevista += Number(p.quantidade_prevista) || 0;
    });
    return ordem.map(function (k) { return mapa[k]; });
  },

  /* ---------- 3. XML ---------- */
  deXML: function (texto) {
    var doc = new DOMParser().parseFromString(texto, 'application/xml');
    if (doc.querySelector('parsererror')) throw new Error('Este arquivo XML está com o conteúdo danificado.');

    var achados = [];

    /* Nota fiscal eletrônica (NF-e) */
    var dets = doc.getElementsByTagName('det');
    for (var i = 0; i < dets.length; i++) {
      var nome = Checklist._texto(dets[i], ['xProd', 'descricao', 'nome']);
      var qtd = Checklist._texto(dets[i], ['qCom', 'qTrib', 'quantidade', 'qtd']);
      var un = Checklist._texto(dets[i], ['uCom', 'uTrib', 'unidade']);
      if (nome && qtd) {
        achados.push({
          nome: nome,
          quantidade_prevista: U.num(qtd),
          unidade: (un && Checklist.unidadeDe(un)) || 'UN'
        });
      }
    }

    /* Formato livre: elemento com nome + quantidade dentro */
    if (!achados.length) {
      var todos = doc.getElementsByTagName('*');
      for (var j = 0; j < todos.length; j++) {
        var el = todos[j];
        if (!el.children || el.children.length < 2) continue;
        var n2 = null, q2 = null, u2 = null;
        for (var k = 0; k < el.children.length; k++) {
          var f = el.children[k];
          var tag = f.tagName.toLowerCase();
          var val = (f.textContent || '').trim();
          if (!val) continue;
          if (n2 === null && /(nome|produto|descri|item|material|equipamento)/.test(tag)) n2 = val;
          if (q2 === null && /(qtd|qtde|quant|qcom|volume)/.test(tag)) q2 = val;
          if (u2 === null && /(unidade|ucom|medida)/.test(tag)) u2 = val;
        }
        if (n2 && q2 && U.num(q2) > 0) {
          achados.push({ nome: n2, quantidade_prevista: U.num(q2), unidade: (u2 && Checklist.unidadeDe(u2)) || 'UN' });
        }
      }
    }

    if (!achados.length) throw new Error('Não encontrei produtos neste XML. Você pode digitar a lista manualmente.');
    return Checklist.juntarIguais(achados);
  },

  _texto: function (pai, tags) {
    for (var i = 0; i < tags.length; i++) {
      var els = pai.getElementsByTagName(tags[i]);
      if (els.length && els[0].textContent.trim()) return els[0].textContent.trim();
    }
    return null;
  },

  /* ---------- 4. PDF ---------- */
  dePDF: function (arquivo) {
    if (typeof pdfjsLib === 'undefined') {
      return Promise.reject(new Error('A biblioteca de leitura de PDF não carregou. Verifique a internet ou digite a lista manualmente.'));
    }
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    return arquivo.arrayBuffer().then(function (buffer) {
      return pdfjsLib.getDocument({ data: buffer }).promise;
    }).then(function (pdf) {
      var paginas = [];
      for (var p = 1; p <= pdf.numPages; p++) paginas.push(p);

      return paginas.reduce(function (cadeia, numero) {
        return cadeia.then(function (acumulado) {
          return pdf.getPage(numero)
            .then(function (pag) { return pag.getTextContent(); })
            .then(function (conteudo) {
              return acumulado + '\n' + Checklist._linhasDoPDF(conteudo);
            });
        });
      }, Promise.resolve(''));
    }).then(function (texto) {
      var lista = Checklist.deTexto(texto);
      if (!lista.length) {
        throw new Error('Não consegui identificar produtos neste PDF. Ele pode ser uma imagem digitalizada, sem texto de verdade.');
      }
      return { produtos: lista, texto: texto };
    });
  },

  /* Junta os pedaços do PDF que estão na mesma altura.
     Em tabela, a coluna da quantidade quase nunca sai na altura exata
     do nome — costuma cair um ou dois pontos abaixo. Sem essa folga,
     "Montante 2,70" e "5cx" viram duas linhas e o produto se perde. */
  TOLERANCIA_LINHA: 4,

  _linhasDoPDF: function (conteudo) {
    var pedacos = [];
    (conteudo.items || []).forEach(function (item) {
      if (!item.str || !item.str.trim()) return;
      pedacos.push({ y: item.transform[5], x: item.transform[4], txt: item.str });
    });
    if (!pedacos.length) return '';

    pedacos.sort(function (a, b) { return b.y - a.y; });   /* de cima para baixo */

    var grupos = [];
    var atual = [pedacos[0]];
    for (var i = 1; i < pedacos.length; i++) {
      if (Math.abs(pedacos[i].y - atual[0].y) <= Checklist.TOLERANCIA_LINHA) atual.push(pedacos[i]);
      else { grupos.push(atual); atual = [pedacos[i]]; }
    }
    grupos.push(atual);

    return grupos.map(function (g) {
      return g.sort(function (a, b) { return a.x - b.x; })
        .map(function (p) { return p.txt; }).join(' ').replace(/\s+/g, ' ').trim();
    }).join('\n');
  },

  /* ---------- Sugestões tiradas do próprio arquivo ---------- */

  /* Procura, dentro do texto do checklist, linhas como
     "Evento: Festival XYZ", "Cliente: Empresa ABC", "Local: Rio Bonito".
     É de onde vem o nome do evento quando o arquivo traz essa informação. */
  dadosDoTexto: function (texto) {
    var achado = { evento: '', cliente: '', local: '', data: '' };
    var linhas = String(texto || '').split(/\r?\n/);

    var regras = [
      { campo: 'evento', re: /^\s*(nome\s+do\s+)?evento\s*[:\-–—]\s*(.+)$/i },
      { campo: 'cliente', re: /^\s*(cliente|contratante|empresa|razao social|razão social)\s*[:\-–—]\s*(.+)$/i },
      { campo: 'local', re: /^\s*(local|endereco|endereço|pavilhao|pavilhão|espaco|espaço)\s*[:\-–—]\s*(.+)$/i },
      { campo: 'data', re: /^\s*(data|data do evento)\s*[:\-–—]\s*(.+)$/i }
    ];

    linhas.forEach(function (linha) {
      regras.forEach(function (r) {
        if (achado[r.campo]) return;
        var m = linha.match(r.re);
        if (!m) return;
        var valor = m[2].replace(/\s+/g, ' ').trim();
        if (valor.length > 1 && valor.length < 120) achado[r.campo] = valor;
      });
    });

    /* data em dd/mm/aaaa vira o formato que o campo de data entende */
    if (achado.data) {
      var d = achado.data.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
      if (d) {
        var ano = d[3].length === 2 ? '20' + d[3] : d[3];
        achado.data = ano + '-' + d[2].padStart(2, '0') + '-' + d[1].padStart(2, '0');
      } else {
        achado.data = '';
      }
    }
    return achado;
  },

  /* Junta o que veio de dentro do arquivo com o que veio do nome dele.
     O conteúdo tem prioridade; o nome do arquivo é o plano B. */
  juntarSugestoes: function (doTexto, nomeArquivo) {
    var s = { evento: '', cliente: '', local: '', data: '' };
    Object.keys(s).forEach(function (k) { s[k] = (doTexto && doTexto[k]) || ''; });
    if (!s.evento) s.evento = Checklist.nomeSugerido(nomeArquivo);
    return s;
  },


  /* "checklist-feira-do-empreendedor.pdf"  ->  "Feira do empreendedor" */
  nomeSugerido: function (nomeArquivo) {
    var base = String(nomeArquivo || '').replace(/\.[^.]+$/, '');
    base = base.replace(/[_\-]+/g, ' ').replace(/\s+/g, ' ').trim();
    base = base.replace(/^(checklist|check list|lista|relacao|relação|romaneio|os|ordem de servico|ordem de serviço)\s*(de|do|da|para)?\s*/i, '').trim();
    if (base.length < 3) return '';
    return base.charAt(0).toUpperCase() + base.slice(1);
  },

  /* Em nota fiscal, o destinatário costuma ser o cliente do evento. */
  clienteDoXML: function (texto) {
    try {
      var doc = new DOMParser().parseFromString(texto, 'application/xml');
      var dest = doc.getElementsByTagName('dest')[0];
      if (!dest) return '';
      var nome = dest.getElementsByTagName('xNome')[0];
      return nome ? nome.textContent.trim() : '';
    } catch (e) { return ''; }
  },

  /* ---------- Excel (.xlsx / .xls) ---------- */
  deExcel: function (arquivo) {
    if (typeof XLSX === 'undefined') {
      return Promise.reject(new Error('A leitura de Excel precisa de internet na primeira abertura da página. Recarregue conectado e tente de novo.'));
    }
    return arquivo.arrayBuffer().then(function (buf) {
      var pasta = XLSX.read(buf, { type: 'array' });
      var achados = [];

      pasta.SheetNames.forEach(function (nomeAba) {
        var linhas = XLSX.utils.sheet_to_json(pasta.Sheets[nomeAba], { header: 1, raw: true, defval: '' });
        if (!linhas.length) return;

        /* procura a linha de cabeçalho: uma coluna de nome + uma de quantidade */
        var iNome = -1, iQtd = -1, iUn = -1, comeco = 0;
        for (var r = 0; r < Math.min(linhas.length, 12); r++) {
          var cab = (linhas[r] || []).map(function (c) { return String(c).toLowerCase().trim(); });
          var n = -1, q = -1, u = -1;
          cab.forEach(function (c, idx) {
            if (n < 0 && /(produto|descri|nome|item|material|equipamento|pe[çc]a)/.test(c)) n = idx;
            if (q < 0 && /(qtd|qtde|quant)/.test(c)) q = idx;
            if (u < 0 && /(unid|medida|^un\.?$)/.test(c)) u = idx;
          });
          if (n >= 0 && q >= 0) { iNome = n; iQtd = q; iUn = u; comeco = r + 1; break; }
        }
        /* sem cabeçalho: assume 1ª coluna = nome, 2ª = quantidade */
        if (iNome < 0) { iNome = 0; iQtd = 1; comeco = 0; }

        for (var r2 = comeco; r2 < linhas.length; r2++) {
          var cel = linhas[r2] || [];
          var nome = String(cel[iNome] === undefined ? '' : cel[iNome]).replace(/\s+/g, ' ').trim();
          var qtd = U.num(cel[iQtd]);
          if (!nome || nome.length < 2) continue;
          if (/^(total|soma|subtotal|itens?)\b/i.test(nome)) continue;
          if (!(qtd > 0)) continue;
          var un = iUn >= 0 ? Checklist.unidadeDe(String(cel[iUn] || '')) : null;
          achados.push({ nome: nome, quantidade_prevista: qtd, unidade: un || 'UN' });
        }
      });

      if (!achados.length) {
        throw new Error('Não encontrei itens na planilha. Ela precisa de uma coluna com o nome e outra com a quantidade.');
      }
      return Checklist.juntarIguais(achados);
    });
  },

  /* ---------- 4. Porta de entrada: recebe o arquivo e decide ---------- */
  lerArquivo: function (arquivo) {
    var nome = (arquivo.name || '').toLowerCase();
    var sugestao = { evento: Checklist.nomeSugerido(arquivo.name), cliente: '' };

    if (/\.xml$/.test(nome)) {
      return arquivo.text().then(function (t) {
        sugestao = Checklist.juntarSugestoes(Checklist.dadosDoTexto(t), arquivo.name);
        if (!sugestao.cliente) sugestao.cliente = Checklist.clienteDoXML(t);
        return { produtos: Checklist.deXML(t), sugestao: sugestao };
      });
    }
    if (/\.pdf$/.test(nome)) {
      return Checklist.dePDF(arquivo).then(function (r) {
        return {
          produtos: r.produtos,
          sugestao: Checklist.juntarSugestoes(Checklist.dadosDoTexto(r.texto), arquivo.name)
        };
      });
    }
    if (/\.(jpe?g|png)$/.test(nome)) {
      return new Promise(function (resolve, reject) {
        var leitor = new FileReader();
        leitor.onload = function () {
          resolve({
            produtos: [],
            sugestao: sugestao,
            imagem: leitor.result,
            recado: 'A leitura automática de foto entra na próxima versão. A imagem fica aqui do lado para você digitar a lista olhando para ela.'
          });
        };
        leitor.onerror = function () { reject(new Error('Não consegui abrir esta imagem.')); };
        leitor.readAsDataURL(arquivo);
      });
    }
    if (/\.(txt|csv)$/.test(nome)) {
      return arquivo.text().then(function (t) {
        return {
          produtos: Checklist.deTexto(t),
          sugestao: Checklist.juntarSugestoes(Checklist.dadosDoTexto(t), arquivo.name)
        };
      });
    }
    if (/\.(xlsx|xlsm|xls)$/.test(nome)) {
      return Checklist.deExcel(arquivo).then(function (produtos) {
        return { produtos: produtos, sugestao: sugestao };
      });
    }
    return Promise.reject(new Error('Formato não aceito. Use PDF, Excel (XLSX), XML, JPG, PNG, TXT ou CSV.'));
  }
};

/* ============================================================
   js/calculo.js — as contas da conferência ficam todas aqui
   ============================================================
   O evento é dividido em CARREGAMENTOS (Carregamento 1, 2, 3...).
   Cada carregamento tem um caminhão e duas conferências:

   SAÍDA     Divergência = Conferido − Previsto (checklist)
   RETORNO   Feito ÀS CEGAS: o conferente não vê o que saiu.
             Esperado   = o que saiu NESTE carregamento
             Divergência = Conferido − Enviado (revelada só no final)

   Os totais do evento somam todos os carregamentos.
   ============================================================ */
const Calculo = {

  TIPOS: {
    saida:   { rotulo: 'Conferência de Saída',   base: 'Previsto', curto: 'Saída' },
    retorno: { rotulo: 'Conferência de Retorno', base: 'Enviado',  curto: 'Retorno' },
    /* compatibilidade com registros antigos */
    sobra:   { rotulo: 'Conferência de Sobras',  base: 'Enviado',  curto: 'Sobras' }
  },

  confDe: function (conferencias, carregamentoId, tipo) {
    return (conferencias || []).filter(function (c) {
      return c.carregamento_id === carregamentoId && c.tipo === tipo;
    })[0] || null;
  },

  /* Linhas de UM carregamento: saída x retorno, produto a produto. */
  montarCarregamento: function (produtos, conferencias, itens, carregamentoId) {
    var cS = Calculo.confDe(conferencias, carregamentoId, 'saida');
    var cR = Calculo.confDe(conferencias, carregamentoId, 'retorno');

    function mapa(c) {
      var m = {};
      if (!c) return m;
      (itens || []).forEach(function (i) {
        if (i.conferencia_id === c.id) m[i.produto_id] = i;
      });
      return m;
    }
    function det(i) {
      return i ? {
        por_embalagem: i.por_embalagem, embalagens: i.embalagens,
        avulsas: i.avulsas, observacao: i.observacao,
        qtd_terceirizada: U.num(i.qtd_terceirizada) || 0
      } : null;
    }

    var mS = mapa(cS), mR = mapa(cR);

    return (produtos || []).map(function (p) {
      var iS = mS[p.id], iR = mR[p.id];
      var prevista = U.num(p.quantidade_prevista);
      var saida = iS ? U.num(iS.quantidade) : null;
      var retorno = iR ? U.num(iR.quantidade) : null;
      var enviado = saida === null ? 0 : saida;
      return {
        produto: p,
        nome: p.nome,
        unidade: p.unidade || 'UN',
        prevista: prevista,
        saida: saida,
        retorno: retorno,
        enviado: enviado,
        esperadoRetorno: enviado,
        difSaida: saida === null ? null : saida - prevista,
        difRetorno: retorno === null ? null : retorno - enviado,
        dano: iR ? {
          qtd: U.num(iR.qtd_danificada) || 0,
          descricao: iR.dano_descricao || '',
          foto: iR.dano_foto_base64 || null
        } : null,
        tercSaida: iS ? U.num(iS.qtd_terceirizada) || 0 : 0,
        tercRetorno: iR ? U.num(iR.qtd_terceirizada) || 0 : 0,
        detalhes: { saida: det(iS), retorno: det(iR) }
      };
    });
  },

  /* Totais do evento: soma a saída e o retorno de TODOS os carregamentos. */
  montarEvento: function (produtos, carregamentos, conferencias, itens) {
    var porCarga = (carregamentos || []).map(function (cg) {
      return Calculo.montarCarregamento(produtos, conferencias, itens, cg.id);
    });

    return (produtos || []).map(function (p, idx) {
      var prevista = U.num(p.quantidade_prevista);
      var saida = null, retorno = null;
      var danificado = 0;
      porCarga.forEach(function (ls) {
        var l = ls[idx];
        if (!l) return;
        if (l.saida !== null) saida = (saida || 0) + l.saida;
        if (l.retorno !== null) retorno = (retorno || 0) + l.retorno;
        if (l.dano) danificado += l.dano.qtd;
      });
      var enviado = saida === null ? 0 : saida;
      return {
        produto: p, nome: p.nome, unidade: p.unidade || 'UN',
        prevista: prevista,
        saida: saida, retorno: retorno, enviado: enviado, danificado: danificado,
        difSaida: saida === null ? null : saida - prevista,
        difRetorno: retorno === null ? null : retorno - enviado
      };
    });
  },

  /* Totais gerais do evento, para a barra de retorno:
     enviado = tudo que saiu · retornado = tudo que já voltou (em qualquer caminhão) */
  totaisEvento: function (produtos, carregamentos, conferencias, itens) {
    var linhas = Calculo.montarEvento(produtos, carregamentos, conferencias, itens);
    var t = { previsto: 0, enviado: 0, retornado: 0, falta: 0, pct: 0 };
    linhas.forEach(function (l) {
      t.previsto += l.prevista;
      t.enviado += l.saida || 0;
      t.retornado += l.retorno || 0;
    });
    t.falta = Math.max(0, t.enviado - t.retornado);
    t.pct = t.enviado ? Math.min(100, Math.round(t.retornado / t.enviado * 100)) : 0;
    return t;
  },

  base: function (linha, tipo) {
    if (tipo === 'saida') return linha.prevista;
    return linha.esperadoRetorno;
  },

  contado: function (linha, tipo) {
    if (tipo === 'saida') return linha.saida;
    return linha.retorno;
  },

  divergencia: function (linha, tipo) {
    if (tipo === 'saida') return linha.difSaida;
    return linha.difRetorno;
  },

  /* Como a conta foi feita (pallet/caixa), em texto. */
  detalhe: function (linha, tipo) {
    var d = (linha.detalhes || {})[tipo];
    if (!d) return '';
    var por = U.num(d.por_embalagem), emb = U.num(d.embalagens), avu = U.num(d.avulsas);
    if (!por || (!emb && !avu)) return d.observacao || '';
    var partes = [];
    if (emb) partes.push(U.fmt(emb) + ' × ' + U.fmt(por));
    if (avu) partes.push(U.fmt(avu) + ' avulsas');
    var txt = partes.join(' + ');
    return d.observacao ? txt + ' — ' + d.observacao : txt;
  },

  resumo: function (linhas, tipo) {
    var r = { produtos: linhas.length, previsto: 0, conferido: 0, divergencias: 0, pendentes: 0 };
    linhas.forEach(function (l) {
      var b = Calculo.base(l, tipo);
      var c = Calculo.contado(l, tipo);
      r.previsto += b;
      if (c === null) { r.pendentes++; return; }
      r.conferido += c;
      if (c - b !== 0) r.divergencias++;
    });
    return r;
  },

  /* Situação que a conferência assume ao ser finalizada. */
  situacaoFinal: function (linhas, tipo) {
    var r = Calculo.resumo(linhas, tipo);
    return r.divergencias > 0 ? 'Com divergência' : 'Finalizado';
  }
};
/* ============================================================
   js/app.js/* ============================================================
   js/app.js — estado, navegação e telas
   ============================================================ */
const App = {
  usuarios: [],
  eventos: [],
  conferencias: [],     /* de todos os eventos, para os números do painel */
  checklists: {},       /* quais eventos já têm checklist */
  pilha: [],            /* histórico de telas, para o botão voltar */

  /* ---------- navegação ---------- */
  abrir: function (fn, arg) {
    this.pilha.push({ fn: fn, arg: arg });
    this.desenhar();
  },
  trocar: function (fn, arg) {
    this.pilha[this.pilha.length - 1] = { fn: fn, arg: arg };
    this.desenhar();
  },
  raiz: function (fn, arg) {
    this.pilha = [{ fn: fn, arg: arg }];
    this.desenhar();
  },
  voltar: function () {
    if (this.pilha.length <= 1) return;
    this.pilha.pop();
    this.desenhar();
  },
  desenhar: function () {
    var t = this.pilha[this.pilha.length - 1];
    if (!t) return;
    U.$('#topo-voltar').hidden = this.pilha.length <= 1;
    window.scrollTo(0, 0);
    t.fn(t.arg);
  },
  /* Redesenha a tela atual (depois de salvar algo, por exemplo). */
  recarregar: function () { this.desenhar(); },

  topo: function (titulo, sub) {
    U.$('#topo-titulo').textContent = titulo;
    U.$('#topo-sub').textContent = sub || '';
  },

  /* ---------- carregamento de dados ---------- */
  carregarBase: function () {
    return Promise.all([
      Banco.listarUsuarios(),
      Banco.listarEventos(),
      Banco.listarConferencias(null),
      Banco.eventosComChecklist()
    ]).then(function (r) {
      App.usuarios = r[0];
      App.eventos = r[1];
      App.conferencias = r[2];
      App.checklists = r[3];      /* evento_id -> quantidade de produtos */
      return true;
    });
  },

  temChecklist: function (eventoId) {
    return !!(App.checklists && App.checklists[eventoId]);
  },

  qtdChecklist: function (eventoId) {
    return (App.checklists && App.checklists[eventoId]) || 0;
  },

  carregarEvento: function (eventoId) {
    var pacote = { evento: null, produtos: [], conferencias: [], itens: [], carregamentos: [], caminhoes: [] };
    /* Busca o evento no banco (e não na memória): assim o coordenador
       enxerga na hora quando um conferente assume o evento. */
    return Banco.listarEventos().then(function (eventos) {
      App.eventos = eventos;
      pacote.evento = eventos.filter(function (e) { return e.id === eventoId; })[0] || null;
      return Promise.all([
        Banco.listarProdutos(eventoId),
        Banco.listarConferencias(eventoId),
        Banco.listarCarregamentos(eventoId),
        Banco.listarCaminhoes()
      ]);
    }).then(function (r) {
      pacote.produtos = r[0];
      pacote.conferencias = r[1];
      pacote.carregamentos = r[2];
      pacote.caminhoes = r[3];
      var ids = pacote.conferencias.map(function (c) { return c.id; });
      return Banco.itensDeVarias(ids);
    }).then(function (itens) {
      pacote.itens = itens;
      return pacote;
    });
  },

  nomeUsuario: function (id) {
    var u = App.usuarios.filter(function (x) { return x.id === id; })[0];
    return u ? u.nome : 'Não designado';
  },

  conferentes: function () {
    /* avulsos (entraram pelo "Outro conferente") não aparecem na lista:
       o nome deles vale nas conferências, mas o cadastro fixo é só da equipe */
    return App.usuarios.filter(function (u) { return u.tipo === 'conferente' && !u.avulso; });
  },

  /* Mostra o erro na tela sem apagar o que a pessoa estava fazendo. */
  falhou: function (erro) {
    console.error(erro);
    U.aviso(erro && erro.message ? erro.message : 'Não foi possível concluir a operação.', 'erro', 6000);
  }
};

/* Caixinha de unidade (UN, CX, PALLET...) usada nas tabelas de checklist. */
function seletorUnidade(valor, indice, classe) {
  var atual = valor || 'UN';
  var opcoes = Checklist.LISTA_UNIDADES.slice();
  if (opcoes.indexOf(atual) < 0) opcoes.unshift(atual);
  return '<select class="entrada ' + classe + '" data-i="' + indice + '" style="min-height:44px;padding:9px 26px 9px 8px">' +
    opcoes.map(function (u) {
      return '<option value="' + U.esc(u) + '"' + (u === atual ? ' selected' : '') + '>' + U.esc(u) + '</option>';
    }).join('') + '</select>';
}
function selo(situacao) {
  var mapa = {
    'Aguardando conferência': 'aguardando',
    'Em andamento': 'andamento',
    'Salvo': 'salvo',
    'Finalizado': 'finalizado',
    'Com divergência': 'divergencia',
    'Saída pendente': 'aguardando',
    'Saída em andamento': 'andamento',
    'Saída finalizada': 'salvo',
    'Retorno pendente': 'aguardando',
    'Retorno em andamento': 'andamento',
    'Retorno finalizado': 'finalizado',
    'Concluído': 'finalizado',
    'Concluído com divergência': 'divergencia'
  };
  return '<span class="sit sit--' + (mapa[situacao] || 'aguardando') + '">' + U.esc(situacao) + '</span>';
}

/* Nome amigável do caminhão (tipo + modelo + placa). */
/* ---------- Tempo real: o que salvam em outro aparelho aparece aqui ---------- */
var Tempo = {
  ligado: false,
  _timer: null,
  _avisoContagem: false,   /* na contagem, avisa uma vez em vez de recarregar */

  iniciar: function () {
    if (Tempo.ligado || !Banco.cliente || !Banco.cliente.channel) return;
    try {
      var canal = Banco.cliente.channel('tempo-real-app');
      ['eventos', 'produtos', 'conferencias', 'itens_conferencia',
       'carregamentos', 'caminhoes', 'estoque', 'movimentos_estoque',
       'fornecedores', 'movimentos_terceiros',
       'ferramentas', 'movimentos_ferramentas'].forEach(function (tabela) {
        canal.on('postgres_changes', { event: '*', schema: 'public', table: tabela }, Tempo._mudou);
      });
      canal.subscribe();
      Tempo.ligado = true;
    } catch (e) { /* sem realtime habilitado no projeto: o app segue no manual */ }
  },

  _mudou: function () {
    /* várias mudanças chegam juntas (salvar grava itens + conferência + carregamento):
       espera meio segundo e recarrega uma vez só */
    clearTimeout(Tempo._timer);
    Tempo._timer = setTimeout(Tempo._aplicar, 600);
  },

  _aplicar: function () {
    if (!Sessao.atual) return;                 /* ninguém logado: nada a fazer */
    var atual = App.pilha[App.pilha.length - 1];
    if (!atual) return;

    /* no meio da contagem, recarregar apagaria o que a pessoa está digitando —
       então só avisa (uma vez por tela) e deixa ela decidir quando sair */
    if (atual.fn === TelaConferencia) {
      if (!Tempo._avisoContagem) {
        Tempo._avisoContagem = true;
        U.aviso('🔄 Este evento mudou em outro aparelho. Sua contagem daqui continua valendo — salve normal.', 'info', 6000);
      }
      return;
    }
    Tempo._avisoContagem = false;

    /* modal aberto (escolhendo caminhão, digitando senha): não puxa o tapete */
    if (U.$('#modais') && U.$('#modais').children.length) return;

    App.recarregar();
  }
};

/* ---------- Estoque: saldo calculado pelos movimentos ---------- */
var Estoque = {
  /* nome vira uma chave única: sem espaço sobrando, sem maiúscula/minúscula */
  chave: function (nome) {
    return String(nome || '').trim().replace(/\s+/g, ' ').toUpperCase();
  },
  /* um material pode pertencer a VÁRIAS famílias */
  familiasDe: function (item) {
    if (!item) return [];
    if (Array.isArray(item.familias) && item.familias.length) return item.familias;
    if (item.familia) return [item.familia];
    return [];
  },
  /* o saldo é a soma dos movimentos: nada de número solto que desanda.
     saida desconta · retorno/entrada somam · ajuste vale o sinal que tiver */
  saldos: function (itens, movimentos) {
    var s = {};
    (itens || []).forEach(function (i) { s[i.id] = 0; });
    (movimentos || []).forEach(function (m) {
      if (!(m.estoque_id in s)) s[m.estoque_id] = 0;
      var q = Number(m.quantidade) || 0;
      s[m.estoque_id] += m.tipo === 'saida' ? -Math.abs(q) : (m.tipo === 'ajuste' ? q : Math.abs(q));
    });
    return s;
  },
  rotulo: { entrada: '📥 Entrada', saida: '🚚 Saída p/ evento', retorno: '↩️ Retorno de evento', ajuste: '🛠️ Ajuste' }
};

/* ---------- Ferramentas: saldo e onde cada uma está ---------- */
var Ferramentas = {
  /* entrada/retorno somam · saida desconta · ajuste vale o sinal */
  saldos: function (itens, movimentos) {
    var s = {};
    (itens || []).forEach(function (i) { s[i.id] = { galpao: 0, porEvento: {} }; });
    (movimentos || []).forEach(function (m) {
      if (!s[m.ferramenta_id]) s[m.ferramenta_id] = { galpao: 0, porEvento: {} };
      var alvo = s[m.ferramenta_id];
      var q = Math.abs(Number(m.quantidade) || 0);
      if (m.tipo === 'entrada') alvo.galpao += q;
      if (m.tipo === 'ajuste') alvo.galpao += Number(m.quantidade) || 0;
      if (m.tipo === 'saida') {
        alvo.galpao -= q;
        if (m.evento_id) alvo.porEvento[m.evento_id] = (alvo.porEvento[m.evento_id] || 0) + q;
      }
      if (m.tipo === 'retorno') {
        alvo.galpao += q;
        if (m.evento_id) alvo.porEvento[m.evento_id] = (alvo.porEvento[m.evento_id] || 0) - q;
      }
    });
    return s;
  },
  rotulo: { entrada: '📥 Entrada', saida: '🚚 Saiu para evento', retorno: '↩️ Voltou de evento', ajuste: '🛠️ Ajuste' }
};

/* ---------- Terceiros: material de fornecedor, controlado à parte ----------
   chegada  soma no que está EM MÃOS (com data de devolução ao fornecedor)
   envio    tira do galpão e marca EM QUAL EVENTO está
   retorno  volta do evento para o galpão
   devolucao devolve ao fornecedor (sai de tudo) */
var Terceiros = {
  chave: function (nome) {
    return String(nome || '').trim().replace(/\s+/g, ' ').toUpperCase();
  },

  /* saldos[fornecedor_id][chaveMaterial] =
       { nome, unidade, emMaos, emEventos, noGalpao, porEvento: {eventoId: qtd} } */
  saldos: function (movimentos) {
    var s = {};
    (movimentos || []).forEach(function (m) {
      var f = m.fornecedor_id;
      var ch = Terceiros.chave(m.material);
      if (!s[f]) s[f] = {};
      if (!s[f][ch]) s[f][ch] = { nome: m.material, unidade: m.unidade || 'UN', emMaos: 0, emEventos: 0, noGalpao: 0, porEvento: {} };
      var item = s[f][ch];
      var q = Math.abs(Number(m.quantidade) || 0);
      if (m.tipo === 'chegada') item.emMaos += q;
      if (m.tipo === 'devolucao') item.emMaos -= q;
      if (m.tipo === 'envio') {
        item.emEventos += q;
        if (m.evento_id) item.porEvento[m.evento_id] = (item.porEvento[m.evento_id] || 0) + q;
      }
      if (m.tipo === 'retorno') {
        item.emEventos -= q;
        if (m.evento_id) item.porEvento[m.evento_id] = (item.porEvento[m.evento_id] || 0) - q;
      }
    });
    Object.keys(s).forEach(function (f) {
      Object.keys(s[f]).forEach(function (ch) {
        var i = s[f][ch];
        i.noGalpao = i.emMaos - i.emEventos;
      });
    });
    return s;
  },

  /* Alertas de devolução: avisa faltando 5, 3 e 1 dia (e no dia, e vencido).
     Só enquanto ainda houver material em mãos. */
  vencimentos: function (movimentos, saldos) {
    var hoje = U.hojeISO();
    var avisos = [];
    (movimentos || []).forEach(function (m) {
      if (m.tipo !== 'chegada' || !m.data_devolucao) return;
      var item = (saldos[m.fornecedor_id] || {})[Terceiros.chave(m.material)];
      if (!item || item.emMaos <= 0) return;   /* já devolveu tudo */
      var dias = Math.floor((new Date(m.data_devolucao) - new Date(hoje)) / 86400000);
      if (dias <= 5) {
        avisos.push({
          fornecedor_id: m.fornecedor_id, material: m.material,
          data: m.data_devolucao, dias: dias, saldo: item.emMaos,
          marco: dias === 5 || dias === 3 || dias === 1   /* os lembretes pedidos */
        });
      }
    });
    avisos.sort(function (a, b) { return a.dias - b.dias; });
    return avisos;
  },

  /* chegadas registradas pelo conferente que ainda estão SEM data de devolução:
     o coordenador precisa definir o prazo */
  semPrazo: function (movimentos, saldos) {
    return (movimentos || []).filter(function (m) {
      if (m.tipo !== 'chegada' || m.data_devolucao) return false;
      var item = (saldos[m.fornecedor_id] || {})[Terceiros.chave(m.material)];
      return item && item.emMaos > 0;
    });
  },

  rotulo: { chegada: '📥 Chegada do fornecedor', envio: '🚚 Enviado para evento', retorno: '↩️ Voltou do evento', devolucao: '📤 Devolvido ao fornecedor' }
};

/* ---------- Fotos: converter URL do Storage em base64 (o PDF precisa) ---------- */
var Fotos = {
  ehDataUrl: function (s) { return typeof s === 'string' && s.indexOf('data:') === 0; },
  paraBase64: function (src) {
    if (!src) return Promise.resolve(null);
    if (Fotos.ehDataUrl(src)) return Promise.resolve(src);
    return fetch(src)
      .then(function (r) { return r.blob(); })
      .then(function (blob) {
        return new Promise(function (resolve) {
          var leitor = new FileReader();
          leitor.onload = function () { resolve(leitor.result); };
          leitor.onerror = function () { resolve(null); };
          leitor.readAsDataURL(blob);
        });
      })
      .catch(function () { return null; });
  }
};

/* ---------- Rascunho: contagem guardada no aparelho (modo offline) ---------- */
var Rascunho = {
  _chave: function (carregamentoId, tipo) { return 'rascunho:' + carregamentoId + ':' + tipo; },
  guardar: function (carregamentoId, tipo, dados) {
    dados.em = new Date().toISOString();
    try {
      localStorage.setItem(Rascunho._chave(carregamentoId, tipo), JSON.stringify(dados));
    } catch (e) {
      /* estourou o espaço (fotos grandes): guarda pelo menos os números */
      try {
        var leve = JSON.parse(JSON.stringify(dados));
        leve.foto = null;
        Object.keys(leve.dano || {}).forEach(function (k) { leve.dano[k].foto = null; });
        leve.semFotos = true;
        localStorage.setItem(Rascunho._chave(carregamentoId, tipo), JSON.stringify(leve));
      } catch (e2) { /* sem espaço nenhum: paciência */ }
    }
  },
  ler: function (carregamentoId, tipo) {
    try {
      var s = localStorage.getItem(Rascunho._chave(carregamentoId, tipo));
      return s ? JSON.parse(s) : null;
    } catch (e) { return null; }
  },
  apagar: function (carregamentoId, tipo) {
    try { localStorage.removeItem(Rascunho._chave(carregamentoId, tipo)); } catch (e) { }
  },
  pendentes: function () {
    var n = 0;
    try {
      for (var i = 0; i < localStorage.length; i++) {
        if ((localStorage.key(i) || '').indexOf('rascunho:') === 0) n++;
      }
    } catch (e) { }
    return n;
  }
};

/* ---------- Monitor de conexão ---------- */
(function () {
  function pintarConexao() {
    var a = document.getElementById('aviso-offline');
    if (a) a.hidden = navigator.onLine;
    if (navigator.onLine === false) return;
  }
  window.addEventListener('online', function () {
    pintarConexao();
    if (Rascunho.pendentes() > 0) {
      U.aviso('🌐 Internet de volta! Há contagem guardada neste aparelho — abra a conferência e toque em SALVAR.', 'ok', 8000);
    } else {
      U.aviso('🌐 Internet de volta.', 'ok', 3000);
    }
  });
  window.addEventListener('offline', pintarConexao);
  document.addEventListener('DOMContentLoaded', pintarConexao);
})();

  return '<div class="btn-linha" style="margin-top:10px">' +
    notas.map(function (n, i) {
      return '<button class="btn btn--branco js-abrir-nf" data-url="' + U.esc(n.url) + '">' +

    }).join('') + '</div>';
}

  U.$$('.js-abrir-nf', raiz).forEach(function (b) {
    b.addEventListener('click', function (e) {
      e.stopPropagation();
      window.open(b.dataset.url, '_blank');
    });

}

function tagTerc(produto) {
  return (produto && produto.terceirizado) ? ' <span class="terc-tag">🔗 TERCEIRIZADO</span>' : '';
}

function nomeCaminhao(caminhoes, id) {
  var c = (caminhoes || []).filter(function (x) { return x.id === id; })[0];
  if (!c) return 'Caminhão não informado';
