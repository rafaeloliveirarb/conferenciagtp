        var nome = U.$('#fo-nome').value.trim().replace(/\s+/g, ' ');
        var contato = U.$('#fo-contato').value.trim();
        if (nome.length < 2) return U.aviso('Dê um nome para o fornecedor.', 'erro');
        var repetido = fornecedores.some(function (f) { return Terceiros.chave(f.nome) === Terceiros.chave(nome); });
        if (repetido) return U.aviso('Esse fornecedor já está cadastrado.', 'erro', 5000);
        var b = this;
        b.disabled = true; b.textContent = 'Cadastrando...';
        Banco.criarFornecedor({ nome: nome, contato: contato || null, ativo: true })
          .then(function (novo) {
            U.aviso('✓ ' + nome + ' cadastrado. Agora lance a 📥 CHEGADA.', 'ok', 5000);
            App.abrir(TelaFornecedor, novo.id);
          })
          .catch(function (e) { b.disabled = false; b.textContent = 'CADASTRAR E REGISTRAR CHEGADA'; App.falhou(e); });
      });

      U.$$('.js-abrir-forn', tela).forEach(function (b) {
        b.addEventListener('click', function () { App.abrir(TelaFornecedor, b.dataset.id); });
      });
    })
    .catch(function (e) {
      tela.innerHTML = '<div class="aviso aviso--vermelho"><span class="aviso__ico">⚠</span><div>' +
        '<b>Não foi possível carregar.</b>' + U.esc(e.message) +
        '<br><span class="peq">Se for a primeira vez, rode o SQL novo no Supabase.</span></div></div>' +
        '<button class="btn btn--branco btn--bloco" onclick="App.voltar()">Voltar</button>';
    });
}

/* ============================================================
   Frota: o coordenador cadastra e desativa caminhões pelo app,
   sem precisar mexer no SQL.
   ============================================================ */
function TelaFrota() {
  App.topo('FROTA', 'Caminhões do carregamento');
  var tela = U.$('#tela');
  tela.innerHTML = U.carregando('Buscando a frota...');

  if (!Sessao.ehCoordenador()) {
    tela.innerHTML = '<div class="aviso aviso--amarelo"><span class="aviso__ico">🔒</span><div>' +
      '<b>Só o coordenador mexe na frota.</b></div></div>' +
      '<button class="btn btn--branco btn--bloco" onclick="App.voltar()">Voltar</button>';
    return;
  }

  Banco.listarCaminhoes().then(function (frota) {
    var h = '<div class="cartao"><div class="cartao__topo"><h3>➕ Cadastrar caminhão</h3></div>' +
      '<div class="cartao__corpo">' +
        '<label class="campo"><span class="campo__rot">Tipo</span>' +
          '<select id="cam-tipo" class="entrada">' +
            ['TOCO', 'TRUCK', 'CARRETA', 'BAÚ', 'F-4000', 'VAN', 'OUTRO'].map(function (t) {
              return '<option value="' + t + '">' + t + '</option>';
            }).join('') +
          '</select></label>' +
        '<label class="campo"><span class="campo__rot">Modelo (opcional)</span>' +
          '<input id="cam-modelo" class="entrada" placeholder="Ex.: VW 15-180, MB 1719"></label>' +
        '<label class="campo"><span class="campo__rot">Placa</span>' +
          '<input id="cam-placa" class="entrada" placeholder="Ex.: ABC 1D23" style="text-transform:uppercase"></label>' +
        '<button class="btn btn--laranja btn--bloco" id="btn-add-cam" style="margin-top:8px">CADASTRAR</button>' +
      '</div></div>';

    h += '<h2 class="secao__tit">Caminhões <span class="n">' + frota.length + '</span></h2>';
    if (!frota.length) {
      h += '<div class="vazio"><p class="vazio__ico">🚛</p><h3>Nenhum caminhão</h3>' +
        '<p>Cadastre acima ou rode o SQL da frota no Supabase.</p></div>';
    } else {
      h += frota.map(function (c) {
        var inativo = c.ativo === false;
        return '<div class="carga" style="' + (inativo ? 'opacity:.55' : '') + '">' +
          '<div class="carga__cam"><span>🚛</span>' +
            '<span><b>' + U.esc(c.tipo) + (c.modelo ? ' — ' + U.esc(c.modelo) : '') + '</b>' +
            '<span class="peq mut" style="display:block">Placa ' + U.esc(c.placa) +
              (inativo ? ' · <b style="color:var(--vermelho)">DESATIVADO</b>' : '') + '</span></span>' +
            '<button class="btn btn--branco btn--peq js-cam-toggle" data-id="' + c.id + '" data-ativo="' + (inativo ? '0' : '1') + '" style="margin-left:auto">' +
              (inativo ? 'Reativar' : 'Desativar') + '</button>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    h += '<p class="mut peq" style="margin-top:14px">Caminhão desativado não aparece na escolha dos carregamentos, ' +
      'mas os registros antigos dele continuam nos relatórios.</p>' +
      '<button class="btn btn--branco btn--bloco" style="margin-top:10px" onclick="App.voltar()">Voltar</button>';

    tela.innerHTML = h;

    U.$('#btn-add-cam').addEventListener('click', function () {
      var tipo = U.$('#cam-tipo').value;
      var modelo = U.$('#cam-modelo').value.trim();
      var placa = U.$('#cam-placa').value.trim().toUpperCase();
      if (!placa) return U.aviso('Informe a placa do caminhão.', 'erro');
      var botao = this;
      botao.disabled = true; botao.textContent = 'Cadastrando...';
      Banco.criarCaminhao({ tipo: tipo, modelo: modelo || null, placa: placa, ativo: true })
        .then(function () {
          U.aviso('✓ Caminhão ' + placa + ' cadastrado.', 'ok');
          App.recarregar();
        })
        .catch(function (e) {
          botao.disabled = false; botao.textContent = 'CADASTRAR';
          if ((e.message || '').indexOf('duplicate') >= 0 || (e.message || '').indexOf('unique') >= 0) {
            U.aviso('Já existe um caminhão com a placa ' + placa + '.', 'erro', 5000);
          } else App.falhou(e);
        });
    });

    U.$$('.js-cam-toggle', tela).forEach(function (b) {
      b.addEventListener('click', function () {
        var ativar = b.dataset.ativo === '0';
        Banco.atualizarCaminhao(b.dataset.id, { ativo: ativar })
          .then(function () { U.aviso(ativar ? '✓ Caminhão reativado.' : '✓ Caminhão desativado.', 'ok'); App.recarregar(); })
          .catch(App.falhou);
      });
    });
  }).catch(function (e) {
    tela.innerHTML = '<div class="aviso aviso--vermelho"><span class="aviso__ico">⚠</span><div>' +
      '<b>Não foi possível carregar a frota.</b>' + U.esc(e.message) + '</div></div>';
  });
}

/* Criar evento é do coordenador. O conferente recebe o evento pronto:
   ou designado a ele, ou em aberto para assumir. */
function TelaNovoEvento() {
  var tela = U.$('#tela');

  if (!Sessao.ehCoordenador()) {
    App.topo('NOVO EVENTO', '');
    tela.innerHTML = '<div class="aviso aviso--amarelo"><span class="aviso__ico">🔒</span><div>' +
      '<b>Só o coordenador cria eventos.</b>' +
      'Você confere os eventos designados a você e os que estiverem em aberto.</div></div>' +
      '<button class="btn btn--bloco" onclick="App.voltar()">Voltar</button>';
    return;
  }

  App.topo('NOVO EVENTO', 'Anexe o checklist — o evento é criado junto');

  var podeEditar = true;   /* aqui só entra coordenador */
  var produtos = [];
  var imagemApoio = null;
  var dados = { nome: '', cliente: '', local: '', data: U.hojeISO(), conferente_id: '' };

  desenhar();

  function desenhar() {
    var h = '';

    /* --- 1. o checklist é a porta de entrada --- */
    h += '<div class="cartao"><div class="cartao__corpo">' +
      '<p style="font-size:17px;font-weight:700;color:var(--azul);margin-bottom:4px">1. Jogue o checklist aqui</p>' +
      '<p class="mut peq" style="margin-bottom:14px">' + (podeEditar
        ? 'PDF, XML, foto ou lista copiada. O sistema lê os produtos e já monta o evento. Se preferir, dá para digitar na mão.'
        : 'PDF, XML ou TXT. O sistema lê os produtos do arquivo e monta o evento. O nome do evento vem do próprio checklist.') + '</p>' +
      '<input type="file" id="ne-arquivo" accept="' + (podeEditar ? '.pdf,.xml,.xlsx,.xls,.jpg,.jpeg,.png,.txt,.csv' : '.pdf,.xml,.xlsx,.xls,.txt,.csv') + '" multiple hidden>' +
      '<div class="btn-linha">' +
        '<button class="btn btn--laranja" id="ne-enviar">📎 ANEXAR ARQUIVO</button>' +
        (podeEditar ? '<button class="btn btn--branco" id="ne-colar">📝 COLAR LISTA</button>' : '') +
      '</div>' +
      '</div></div>';

    if (imagemApoio) {
      h += '<div class="cartao"><div class="cartao__topo"><h3>Imagem anexada</h3>' +
        '<button class="btn btn--peq btn--branco" id="ne-tira-img">Remover</button></div>' +
        '<div class="cartao__corpo"><img src="' + imagemApoio + '" alt="Checklist anexado" ' +
        'style="width:100%;border-radius:10px;border:1px solid var(--linha)"></div></div>';
    }

    /* --- 2. produtos encontrados --- */
    h += '<div class="cartao"><div class="cartao__topo"><h3>2. Produtos</h3>' +
      '<span class="mut peq">' + produtos.length + '</span></div>';

    if (!produtos.length) {
      h += '<div class="cartao__corpo"><div class="vazio" style="padding:20px 0">' +
        '<p class="vazio__ico">📦</p><h3>Nada lido ainda</h3>' +
        '<p class="peq">' + (podeEditar
          ? 'Anexe o checklist acima ou adicione os produtos um a um.'
          : 'Anexe o arquivo do checklist acima.') + '</p></div></div>';
    } else if (!podeEditar) {
      /* Conferente vê a lista como ela veio: não pode mexer no previsto. */
      h += '<div class="tabela-rolagem"><table class="tab"><thead><tr>' +
        '<th>Produto</th><th class="num" style="width:90px">Previsto</th><th style="width:70px">Un.</th>' +
        '</tr></thead><tbody>' +
        produtos.map(function (p) {
          return '<tr><td>' + U.esc(p.nome) + '</td>' +
            '<td class="num">' + U.fmt(p.quantidade_prevista) + '</td>' +
            '<td>' + U.esc(p.unidade || 'UN') + '</td></tr>';
        }).join('') +
        '</tbody></table></div>';
    } else {
      h += '<div class="tabela-rolagem"><table class="tab tab--edit"><thead><tr>' +
        '<th>Produto</th><th class="num">Qtd.</th><th>Unidade</th><th></th>' +
        '</tr></thead><tbody>' +
        produtos.map(function (p, i) {
          return '<tr>' +
            '<td><input class="entrada js-nome" data-i="' + i + '" value="' + U.esc(p.nome) + '" style="min-height:44px;padding:9px">' +
              '<label class="peq" style="display:flex;gap:7px;align-items:center;margin-top:6px;cursor:pointer;color:var(--txt-2)">' +
                '<input type="checkbox" class="js-terc" data-i="' + i + '" style="width:18px;height:18px"' + (p.terceirizado ? ' checked' : '') + '>' +
                '🔗 Terceirizado (não mexe no estoque)</label></td>' +
            '<td><input class="entrada js-qtd" data-i="' + i + '" type="number" inputmode="decimal" min="0" ' +
              'value="' + U.esc(p.quantidade_prevista) + '" style="min-height:44px;padding:9px;text-align:right"></td>' +
            '<td>' + seletorUnidade(p.unidade, i, 'js-un') + '</td>' +
            '<td><button class="btn btn--peq btn--branco js-remover" data-i="' + i + '" aria-label="Excluir">✕</button></td>' +
            '</tr>';
        }).join('') +
        '</tbody></table></div>';
    }
    if (podeEditar) {
      h += '<div class="cartao__corpo"><button class="btn btn--branco btn--bloco" id="ne-add">+ ADICIONAR PRODUTO</button></div>';
    } else if (produtos.length) {
      h += '<div class="cartao__corpo"><p class="mut peq">A lista vem do arquivo e não pode ser alterada por você — ' +
        'é o que garante que a contagem seja comparada com o checklist original. ' +
        'Se algo veio errado, anexe outro arquivo ou fale com o coordenador.</p>' +
        '<button class="btn btn--branco btn--bloco" id="ne-limpar" style="margin-top:10px">Descartar e anexar outro</button></div>';
    }
    h += '</div>';

    /* --- 3. dados do evento, já preenchidos quando dá --- */
    h += '<div class="cartao"><div class="cartao__topo"><h3>3. Dados do evento</h3></div>' +
      '<div class="cartao__corpo">' +
        '<label class="campo"><span class="campo__rot">Nome do evento *</span>' +
          '<input class="entrada js-d" data-k="nome" value="' + U.esc(dados.nome) + '" placeholder="Festival XYZ"></label>' +
        '<div class="dupla">' +
          '<label class="campo"><span class="campo__rot">Cliente</span>' +
            '<input class="entrada js-d" data-k="cliente" value="' + U.esc(dados.cliente) + '" placeholder="Empresa ABC"></label>' +
          '<label class="campo"><span class="campo__rot">Local</span>' +
            '<input class="entrada js-d" data-k="local" value="' + U.esc(dados.local) + '" placeholder="Rio Bonito"></label>' +
        '</div>' +
        '<div class="dupla">' +
          '<label class="campo"><span class="campo__rot">Data</span>' +
            '<input class="entrada js-d" data-k="data" type="date" value="' + U.esc(dados.data) + '"></label>' +
          '<label class="campo"><span class="campo__rot">Conferente</span>' +
            '<select class="entrada js-d" data-k="conferente_id">' +
              '<option value="">Deixar em aberto</option>' +
              App.conferentes().map(function (c) {
                return '<option value="' + c.id + '"' + (dados.conferente_id === c.id ? ' selected' : '') + '>' + U.esc(c.nome) + '</option>';
              }).join('') +
            '</select></label>' +
        '</div>' +
        '<p class="mut peq">Só o nome é obrigatório. Deixando o conferente <b>em aberto</b>, ' +
        'os três veem o evento e o primeiro que precisar assume.</p>' +
      '</div></div>';

    h += '<div class="barra-fixa"><button class="btn btn--laranja btn--bloco btn--gg" id="ne-criar">CRIAR EVENTO</button></div>';

    tela.innerHTML = h;
    ligar();
  }

  function ligar() {
    U.$('#ne-enviar').addEventListener('click', function () { U.$('#ne-arquivo').click(); });

    U.$('#ne-arquivo').addEventListener('change', function () {
      var arquivos = this.files;
      if (!arquivos || !arquivos.length) return;
      var quantos = arquivos.length;
      var espera = U.modal({
        titulo: 'Lendo ' + (quantos > 1 ? quantos + ' arquivos' : 'o checklist'),
        html: U.carregando('Isso leva alguns segundos...'), travado: true
      });

      Checklist.lerVarios(arquivos).then(function (res) {
        espera.fechar();
        if (res.imagem) imagemApoio = res.imagem;

        /* os arquivos também sugerem o nome do evento e o cliente */
        if (res.sugestao) {
          if (!dados.nome && res.sugestao.evento) dados.nome = res.sugestao.evento;
          if (!dados.cliente && res.sugestao.cliente) dados.cliente = res.sugestao.cliente;
          if (!dados.local && res.sugestao.local) dados.local = res.sugestao.local;
          if (res.sugestao.data) dados.data = res.sugestao.data;
        }

        if (res.produtos.length) {
          produtos = Checklist.juntarIguais(produtos.concat(res.produtos));
          U.aviso('✓ ' + res.produtos.length + ' produtos lidos de ' + res.lidos + ' arquivo' + (res.lidos > 1 ? 's' : '') + '. Confira antes de criar.', 'ok', 5000);
        }
        if (res.falhas.length) {
          U.aviso('⚠ ' + res.falhas.join(' · '), 'erro', 8000);
        }
        desenhar();
      });
      this.value = '';
    });

    var btnColar = U.$('#ne-colar');
    if (btnColar) btnColar.addEventListener('click', function () {
      var m = U.modal({
        titulo: 'Colar lista',
        html: '<p class="mut peq" style="margin-bottom:10px">Um produto por linha. O sistema entende:<br>' +
          '<b>Cadeira — 100</b> · <b>Mesa: 20</b> · <b>5 x Tenda 10x10</b></p>' +
          '<textarea class="entrada" id="ne-texto" style="min-height:180px" placeholder="Cadeira — 100&#10;Mesa — 20&#10;Tenda 10x10 — 5"></textarea>',
        pe: '<button class="btn btn--branco" data-x>Cancelar</button><button class="btn btn--laranja" data-ok>Ler lista</button>'
      });
      m.querySelector('[data-x]').addEventListener('click', function () { m.fechar(); });
      m.querySelector('[data-ok]').addEventListener('click', function () {
        var achados = Checklist.deTexto(U.$('#ne-texto', m).value);
        if (!achados.length) return U.aviso('Não entendi nenhuma linha. Use "Produto — quantidade".', 'erro', 5000);
        produtos = Checklist.juntarIguais(produtos.concat(achados));
        m.fechar();
        U.aviso('✓ ' + achados.length + ' produtos adicionados.', 'ok');
        desenhar();
      });
    });

    var btnAdd = U.$('#ne-add');
    if (btnAdd) btnAdd.addEventListener('click', function () {
      produtos.push({ nome: '', quantidade_prevista: 0, unidade: 'UN' });
      desenhar();
      var campos = U.$$('.js-nome', tela);
      if (campos.length) campos[campos.length - 1].focus();
    });

    var btnLimpar = U.$('#ne-limpar');
    if (btnLimpar) btnLimpar.addEventListener('click', function () {
      produtos = [];
      imagemApoio = null;
      desenhar();
    });

    U.$$('.js-nome', tela).forEach(function (el) {
      el.addEventListener('input', function () { produtos[Number(el.dataset.i)].nome = el.value; });
    });
    U.$$('.js-qtd', tela).forEach(function (el) {
      el.addEventListener('input', function () { produtos[Number(el.dataset.i)].quantidade_prevista = U.num(el.value); });
    });
    U.$$('.js-un', tela).forEach(function (el) {
      el.addEventListener('change', function () { produtos[Number(el.dataset.i)].unidade = el.value; });
    });
    U.$$('.js-terc', tela).forEach(function (el) {
      el.addEventListener('change', function () { produtos[Number(el.dataset.i)].terceirizado = el.checked; });
    });
    U.$$('.js-remover', tela).forEach(function (el) {
      el.addEventListener('click', function () { produtos.splice(Number(el.dataset.i), 1); desenhar(); });
    });
    U.$$('.js-d', tela).forEach(function (el) {
      el.addEventListener('input', function () { dados[el.dataset.k] = el.value; });
      el.addEventListener('change', function () { dados[el.dataset.k] = el.value; });
    });
    var tiraImg = U.$('#ne-tira-img');
    if (tiraImg) tiraImg.addEventListener('click', function () { imagemApoio = null; desenhar(); });

    U.$('#ne-criar').addEventListener('click', criar);
  }

  function criar() {
    var botao = U.$('#ne-criar');

    if (!dados.nome.trim()) {
      U.aviso('Dê um nome ao evento.', 'erro');
      var campo = U.$('.js-d[data-k="nome"]', tela);
      if (campo) campo.focus();
      return;
    }

    var limpos = produtos
      .map(function (p) {
        return {
          nome: String(p.nome || '').trim(),
          quantidade_prevista: U.num(p.quantidade_prevista),
          unidade: p.unidade || 'UN',
          terceirizado: !!p.terceirizado
        };
      })
      .filter(function (p) { return p.nome.length > 0; });

    var semQtd = limpos.filter(function (p) { return p.quantidade_prevista <= 0; });
    if (semQtd.length) return U.aviso('Falta a quantidade de: ' + semQtd[0].nome, 'erro', 5000);

    botao.disabled = true;
    botao.textContent = 'Criando...';

    var novoEvento;
    Banco.criarEvento({
      nome: dados.nome.trim(),
      cliente: dados.cliente.trim(),
      local: dados.local.trim(),
      data: dados.data || U.hojeISO(),
      conferente_id: dados.conferente_id || null,
      status: 'Aguardando conferência'
    }).then(function (criado) {
      novoEvento = criado;
      return limpos.length ? Banco.salvarProdutos(criado.id, limpos) : true;
    }).then(function () {
      return App.carregarBase();
    }).then(function () {
      U.aviso(limpos.length
        ? '✓ Evento criado com ' + limpos.length + ' produtos no checklist.'
        : '✓ Evento criado. Anexe o checklist quando quiser.', 'ok', 5000);
      oferecerCadastroEstoque(limpos, function () {
        App.trocar(TelaEvento, novoEvento.id);
      });
    }).catch(function (e) {
      botao.disabled = false;
      botao.textContent = 'CRIAR EVENTO';
      App.falhou(e);
    });
  }
}

/* ============================================================
   js/conferente.js — lista de eventos do conferente
   ============================================================ */
function TelaMeusEventos() {
  App.topo('EVENTOS', Sessao.atual ? Sessao.atual.nome : '');
  var tela = U.$('#tela');
  tela.innerHTML = U.carregando('Buscando os eventos...');

  Promise.all([App.carregarBase(), Banco.listarCarregamentos()]).then(function (rr) {
    var todosCarregamentos = rr[1] || [];
    var meus = App.eventos.filter(function (e) { return e.conferente_id === Sessao.atual.id; });
    var outros = App.eventos.filter(function (e) { return e.conferente_id !== Sessao.atual.id; });

    /* Em que fase o evento está?
       SAÍDA: ainda não tem carregamento, ou existe saída não finalizada.
       RETORNO: todas as saídas abertas foram finalizadas — agora é receber de volta. */
    function faseDoEvento(ev) {
      var cgs = todosCarregamentos.filter(function (c) { return c.evento_id === ev.id && c.sentido !== 'retorno'; });
      if (!cgs.length) return 'saida';
      var pendente = cgs.some(function (cg) {
        return !App.conferencias.some(function (c) {
          return c.carregamento_id === cg.id && c.tipo === 'saida' && c.finalizada_em;
        });
      });
      return pendente ? 'saida' : 'retorno';
    }

    function cartao(ev) {
      var confs = App.conferencias.filter(function (c) { return c.evento_id === ev.id; });
      var temLista = App.temChecklist(ev.id);
      var jaComecou = confs.length > 0;

      /* quem já fez cada etapa — pode ser gente diferente em cada uma */
      var quemFez = confs.map(function (c) {
        return U.esc(Calculo.TIPOS[c.tipo] ? Calculo.TIPOS[c.tipo].curto : c.tipo) +
          ': ' + U.esc(App.nomeUsuario(c.conferente_id));
      }).join('<br>');

      var acao = !temLista
        ? '<button class="btn btn--laranja btn--bloco js-anexar" data-id="' + ev.id + '">📎 ANEXAR CHECKLIST</button>'
        : '<button class="btn btn--laranja btn--bloco js-abrir" data-id="' + ev.id + '">' +
          (jaComecou ? 'CONTINUAR CONFERÊNCIA' : 'INICIAR CONFERÊNCIA') + '</button>';

      return '<div class="evento">' +
        '<div class="evento__topo">' +
          '<p class="evento__nome">' + U.esc(ev.nome) + '</p>' + selo(ev.status) +
        '</div>' +
        '<dl class="evento__dl">' +
          '<dt>Cliente</dt><dd>' + U.esc(ev.cliente || '—') + '</dd>' +
          '<dt>Local</dt><dd>' + U.esc(ev.local || '—') + '</dd>' +
          '<dt>Data</dt><dd>' + U.fmtData(ev.data) + '</dd>' +
          '<dt>Designado</dt><dd>' + (ev.conferente_id
            ? U.esc(App.nomeUsuario(ev.conferente_id))
            : '<span style="color:var(--txt-3)">ninguém — livre para conferir</span>') + '</dd>' +
          '<dt>Checklist</dt><dd>' + (temLista
            ? U.fmt(App.qtdChecklist(ev.id)) + ' produtos'
            : '<span style="color:var(--laranja);font-weight:700">ainda não anexado</span>') + '</dd>' +
          (quemFez ? '<dt>Conferido por</dt><dd>' + quemFez + '</dd>' : '') +
        '</dl>' +
        (temLista
          ? '<button class="btn btn--branco btn--bloco js-ver" data-id="' + ev.id + '" style="margin-bottom:10px">Ver o evento</button>'
          : '') +
        acao +
      '</div>';
    }

    /* evento encerrado pelo coordenador vai para a aba de finalizados */
    function terminou(ev) { return ev.status === 'Finalizado' || ev.status === 'Com divergência'; }
    var terminados = App.eventos.filter(terminou);
    var ativos = App.eventos.filter(function (ev) { return !terminou(ev); });
    var emSaida = ativos.filter(function (ev) { return faseDoEvento(ev) === 'saida'; });
    var emRetorno = ativos.filter(function (ev) { return faseDoEvento(ev) === 'retorno'; });

    /* cartão do evento finalizado: só consulta, sem botão de conferir */
    function cartaoFinalizado(ev) {
      var confs = App.conferencias.filter(function (c) { return c.evento_id === ev.id; });
      var quemFez = confs.map(function (c) {
        return U.esc(Calculo.TIPOS[c.tipo] ? Calculo.TIPOS[c.tipo].curto : c.tipo) +
          ': ' + U.esc(App.nomeUsuario(c.conferente_id));
      }).join('<br>');
      return '<div class="evento">' +
        '<div class="evento__topo">' +
          '<p class="evento__nome">' + U.esc(ev.nome) + '</p>' + selo(ev.status) +
        '</div>' +
        '<dl class="evento__dl">' +
          '<dt>Cliente</dt><dd>' + U.esc(ev.cliente || '—') + '</dd>' +
          '<dt>Data</dt><dd>' + U.fmtData(ev.data) + '</dd>' +
          (quemFez ? '<dt>Conferido por</dt><dd>' + quemFez + '</dd>' : '') +
        '</dl>' +
        '<button class="btn btn--branco btn--bloco js-ver" data-id="' + ev.id + '">Ver o evento</button>' +
      '</div>';
    }

    var h = '<div class="btn-linha" style="margin-bottom:14px">' +
      '<button class="btn btn--branco btn--bloco" id="btn-atualizar">🔄 ATUALIZAR</button></div>' +
      '<div class="abas">' +
        '<button class="aba is-ativa" data-aba="saida">🚚 Saída<span class="n">' + emSaida.length + '</span></button>' +
        '<button class="aba" data-aba="retorno">↩️ Retorno<span class="n">' + emRetorno.length + '</span></button>' +
        '<button class="aba" data-aba="terminados">🏁 Finalizados<span class="n">' + terminados.length + '</span></button>' +
      '</div>' +
      '<div id="lista-eventos"></div>';

    tela.innerHTML = h;

    function desenharLista(aba) {
      var caixa = U.$('#lista-eventos', tela);
      var hh = '';
      if (aba === 'terminados') {
        hh = terminados.length
          ? terminados.map(cartaoFinalizado).join('')
          : '<div class="vazio"><p class="vazio__ico">🏁</p><h3>Nenhum evento finalizado</h3>' +
            '<p>Quando o coordenador encerrar um evento, ele aparece aqui para consulta.</p></div>';
      } else {
        var lista = aba === 'retorno' ? emRetorno : emSaida;
        if (!lista.length) {
          hh = aba === 'retorno'
            ? '<div class="vazio"><p class="vazio__ico">↩️</p><h3>Nenhum evento aguardando retorno</h3>' +
              '<p>Quando a saída de um evento for finalizada, ele passa para cá até a mercadoria voltar.</p></div>'
            : '<div class="vazio"><p class="vazio__ico">🚚</p><h3>Nenhuma saída pendente</h3>' +
              '<p>Assim que o coordenador criar um evento, ele aparece aqui para a conferência de saída.</p>' +
              '<p style="margin-top:10px">Toque em <b>🔄 ATUALIZAR</b> para conferir de novo.</p></div>';
        } else {
          var meusDaAba = lista.filter(function (ev) { return ev.conferente_id === Sessao.atual.id; });
          var outrosDaAba = lista.filter(function (ev) { return ev.conferente_id !== Sessao.atual.id; });
          if (meusDaAba.length) {
            hh += '<h2 class="secao__tit">Designados para você <span class="n">' + meusDaAba.length + '</span></h2>' +
              meusDaAba.map(cartao).join('');
          }
          if (outrosDaAba.length) {
            hh += '<h2 class="secao__tit"' + (meusDaAba.length ? ' style="margin-top:26px"' : '') + '>' +
              'Outros eventos <span class="n">' + outrosDaAba.length + '</span></h2>' +
              (aba === 'saida'
                ? '<div class="aviso aviso--azul"><span class="aviso__ico">ℹ</span><div>' +
                  'Você também pode conferir estes. Cada conferência guarda o nome de quem contou, ' +
                  'então dá para dividir: um faz a saída, outro registra os retornos.</div></div>'
                : '') +
              outrosDaAba.map(cartao).join('');
          }
        }
      }
      caixa.innerHTML = hh;
      ligarBotoes(caixa);
    }

    U.$$('.aba', tela).forEach(function (b) {
      b.addEventListener('click', function () {
        U.$$('.aba', tela).forEach(function (x) { x.classList.remove('is-ativa'); });
        b.classList.add('is-ativa');
        desenharLista(b.dataset.aba);
      });
    });

    function ligarBotoes(caixa) {
      U.$$('.js-abrir, .js-ver', caixa).forEach(function (b) {
        b.addEventListener('click', function () { App.abrir(TelaEvento, b.dataset.id); });
      });
      U.$$('.js-anexar', caixa).forEach(function (b) {
        b.addEventListener('click', function () { App.abrir(TelaChecklist, b.dataset.id); });
      });
    }

    desenharLista('saida');

    U.$('#btn-atualizar').addEventListener('click', function () {
      U.aviso('Atualizando...', 'info', 1200);
      App.recarregar();
    });
  }).catch(function (e) {
    tela.innerHTML = '<div class="aviso aviso--vermelho"><span class="aviso__ico">⚠</span><div>' +
      '<b>Não foi possível carregar os eventos.</b>' + U.esc(e.message) + '</div></div>' +
      '<button class="btn btn--bloco" onclick="App.recarregar()">Tentar de novo</button>';
  });
}

/* ============================================================
   Tela do evento — serve para o coordenador e para o conferente
   ============================================================ */
function TelaEvento(eventoId) {
  var tela = U.$('#tela');
  tela.innerHTML = U.carregando('Abrindo o evento...');

  App.carregarEvento(eventoId).then(function (p) {
    if (!p.evento) { tela.innerHTML = '<div class="vazio"><h3>Evento não encontrado</h3></div>'; return; }
    var ev = p.evento;
    App.topo(ev.nome, ev.cliente + ' · ' + U.fmtData(ev.data));

    var linhas = Calculo.montarEvento(p.produtos, p.carregamentos, p.conferencias, p.itens);
    var temSaida = linhas.some(function (l) { return l.saida !== null; });
    var temRetorno = linhas.some(function (l) { return l.retorno !== null; });
    var ehCoord = Sessao.ehCoordenador();
    var totalProd = p.produtos.length;

    var h = '';

    /* --- dados do evento --- */
    h += '<div class="cartao"><div class="cartao__topo"><h3>Dados do evento</h3>' + selo(ev.status) + '</div>' +
      '<div class="cartao__corpo"><dl class="evento__dl">' +
        '<dt>Evento</dt><dd>' + U.esc(ev.nome) + '</dd>' +
        '<dt>Cliente</dt><dd>' + U.esc(ev.cliente || '—') + '</dd>' +
        '<dt>Local</dt><dd>' + U.esc(ev.local || '—') + '</dd>' +
        '<dt>Data</dt><dd>' + U.fmtData(ev.data) + '</dd>' +
        '<dt>Conferente</dt><dd>' + (ev.conferente_id
          ? U.esc(App.nomeUsuario(ev.conferente_id))
          : '<span style="color:var(--amarelo);font-weight:700">Não designado</span>') + '</dd>' +
      '</dl>' +
      (ehCoord
        ? '<button class="btn btn--branco btn--bloco js-designar" style="margin-top:6px">' +
          (ev.conferente_id ? 'Trocar conferente' : 'DESIGNAR CONFERENTE') + '</button>'
        : '') +
      '</div></div>';

    /* --- nota fiscal (o coordenador anexa; todos podem abrir/imprimir) --- */
    var notasNF = ev.notas_fiscais || [];
    h += '<div class="cartao"><div class="cartao__topo"><h3>🧾 Nota fiscal</h3>' +
      '<span class="mut peq">' + (notasNF.length || 'nenhuma') + '</span></div>' +
      '<div class="cartao__corpo">' +
      (notasNF.length
        ? notasNF.map(function (n, i) {
            return '<div style="display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--linha);padding:8px 0">' +
              '<span style="flex:1">🧾 ' + U.esc(n.nome || ('Nota fiscal ' + (i + 1))) +
                '<span class="peq mut" style="display:block">' + (n.em ? U.fmtDataHora(n.em) : '') + '</span></span>' +
              '<button class="btn btn--peq js-abrir-nf" data-url="' + U.esc(n.url) + '">Abrir</button>' +
              (ehCoord ? '<button class="btn btn--branco btn--peq js-remover-nf" data-i="' + i + '" style="color:var(--vermelho);border-color:var(--vermelho)">Remover</button>' : '') +
            '</div>';
          }).join('')
        : '<p class="mut peq">' + (ehCoord
            ? 'Anexe a nota fiscal (PDF ou foto). O conferente vai poder imprimir ao finalizar o carregamento.'
            : 'O coordenador ainda não anexou a nota fiscal deste evento.') + '</p>') +
      (ehCoord
        ? '<button class="btn btn--branco btn--bloco" id="btn-anexar-nf" style="margin-top:10px">📎 ANEXAR NOTA FISCAL</button>' +
          '<input type="file" id="campo-nf" accept=".pdf,.jpg,.jpeg,.png" multiple hidden>'
        : '') +
      '</div></div>';

    /* --- checklist --- */
    if (!p.produtos.length) {
      h += '<div class="aviso aviso--amarelo"><span class="aviso__ico">📋</span><div>' +
        '<b>Este evento ainda não tem checklist.</b>' +
        (ehCoord
          ? 'Anexe o arquivo (PDF, XML ou foto) ou digite os produtos. O conferente também pode fazer isso.'
          : 'Anexe o arquivo que você recebeu ou digite os produtos para poder conferir.') +
        '</div></div>' +
        '<button class="btn btn--laranja btn--bloco btn--gg js-checklist">ANEXAR CHECKLIST</button>';
    } else {
      h += '<div class="cartao"><div class="cartao__topo"><h3>Produtos do checklist</h3>' +
        '<span class="mut peq">' + p.produtos.length + ' itens</span></div>' +
        '<div class="tabela-rolagem"><table class="tab"><thead><tr>' +
          '<th>Produto</th><th style="width:60px">Un.</th><th class="num">Previsto</th>' +
          (temSaida ? '<th class="num">Saída (total)</th><th class="num">Diferença</th>' : '') +
          (temRetorno ? '<th class="num">Retorno (total)</th><th class="num">Diferença</th>' : '') +
        '</tr></thead><tbody>' +
        linhas.map(function (l) {
          return '<tr><td>' + U.esc(l.nome) + tagTerc(l.produto) + '</td>' +
            '<td>' + U.esc(l.unidade) + '</td>' +
            '<td class="num">' + U.fmt(l.prevista) + '</td>' +
            (temSaida ? '<td class="num">' + (l.saida === null ? '—' : U.fmt(l.saida)) + '</td>' +
              '<td class="num ' + classeDif(l.difSaida) + '">' + textoDif(l.difSaida) + '</td>' : '') +
            (temRetorno ? '<td class="num">' + (l.retorno === null ? '—' : U.fmt(l.retorno)) + '</td>' +
              '<td class="num ' + classeDif(l.difRetorno) + '">' + textoDif(l.difRetorno) + '</td>' : '') +
            '</tr>';
        }).join('') +
        '</tbody></table></div>' +
        '<div class="cartao__corpo"><p class="mut peq">Os totais de saída e retorno somam <b>todos os carregamentos</b> do evento.</p>' +
        (ehCoord
          ? (ev.status === 'Finalizado' || ev.status === 'Com divergência'
              ? ''
              : '<button class="btn btn--branco btn--bloco js-checklist" style="margin-top:8px">Editar checklist</button>' +
                '<button class="btn btn--branco btn--bloco" id="btn-excluir-checklist" ' +
                  'style="margin-top:8px;color:var(--vermelho);border-color:var(--vermelho)">🗑️ EXCLUIR CHECKLIST</button>')
          : '<p class="mut peq" style="margin-top:8px">O checklist é o que o coordenador lançou. ' +
            'Se algum produto estiver errado, avise ele — assim a contagem sempre é comparada com a lista original.</p>') +
        '</div>' +
      '</div>';

      /* --- barra de retorno do EVENTO --- */
      var tot = Calculo.totaisEvento(p.produtos, p.carregamentos, p.conferencias, p.itens);
      if (tot.enviado > 0) {
        h += '<div class="cartao"><div class="cartao__corpo">' +
          '<h3 style="font-size:17px;color:var(--azul);margin-bottom:8px">↩️ Retorno do evento</h3>' +
          '<div class="progresso"><div class="progresso__fill" style="width:' + tot.pct + '%"></div></div>' +
          '<div class="progresso__rot"><span>Voltaram <b>' + U.fmt(tot.retornado) + '</b> de <b>' + U.fmt(tot.enviado) + '</b> itens enviados</span>' +
          '<span>' + tot.pct + '%</span></div>' +
          (tot.falta > 0
            ? '<p class="peq" style="color:var(--laranja);font-weight:700;margin-top:6px">Faltam voltar ' + U.fmt(tot.falta) + ' itens. O retorno pode chegar em vários caminhões.</p>'
            : (tot.retornado > 0 ? '<p class="peq" style="color:var(--verde);font-weight:700;margin-top:6px">🟢 Tudo que saiu já voltou.</p>' : '')) +
        '</div></div>';
      }

      var eventoFechado = ev.status === 'Finalizado' || ev.status === 'Com divergência';
      if (eventoFechado) {
        h += '<div class="trava"><b>🏁 Evento encerrado' +
          (ev.status === 'Com divergência' ? ' com divergência' : '') + '.</b> ' +
          'Agora é só visualização: dá para abrir as conferências, ver as fotos e baixar os relatórios, ' +
          'mas não dá para criar carregamento nem registrar retorno.</div>';
      }

      var saidas = p.carregamentos.filter(function (c) { return (c.sentido || 'saida') === 'saida'; });
      var retornos = p.carregamentos.filter(function (c) { return c.sentido === 'retorno'; });
      var algumaSaidaFinal = saidas.some(function (cg) {
        var c = Calculo.confDe(p.conferencias, cg.id, 'saida');
        return !!c && (c.status === 'Finalizado' || c.status === 'Com divergência');
      });

      /* --- carregamentos de SAÍDA --- */
      h += '<h2 class="secao__tit">Carregamentos de saída <span class="n">' + saidas.length + '</span></h2>';

      if (!saidas.length) {
        h += '<div class="aviso aviso--azul"><span class="aviso__ico">🚚</span><div>' +
          '<b>Nenhum carregamento de saída ainda.</b>' +
          'Toque em NOVO CARREGAMENTO, escolha o caminhão e comece a conferência de saída.</div></div>';
      }

      saidas.forEach(function (cg) {
        var cS = Calculo.confDe(p.conferencias, cg.id, 'saida');
        var linhasCg = Calculo.montarCarregamento(p.produtos, p.conferencias, p.itens, cg.id);
        var contS = linhasCg.filter(function (l) { return l.saida !== null; }).length;
        var saidaFinal = !!cS && (cS.status === 'Finalizado' || cS.status === 'Com divergência');
        var descS = cS
          ? cS.status + ' · ' + App.nomeUsuario(cS.conferente_id) + (cS.foto_base64 ? ' · 📷 foto ok' : '')
          : 'Ainda não iniciada (' + contS + '/' + totalProd + ' produtos)';

        h += '<div class="carga">' +
          '<div class="carga__topo"><span class="carga__tit">🚚 SAÍDA — CARREG. ' + cg.numero + '</span>' + selo(cg.status) + '</div>' +
          '<div class="carga__cam"><span>🚛</span><span><b>' + U.esc(nomeCaminhao(p.caminhoes, cg.caminhao_id)) + '</b></span>' +
            (!saidaFinal && !eventoFechado ? '<button class="btn btn--branco btn--peq js-trocar-cam" data-cg="' + cg.id + '" style="margin-left:auto">Trocar caminhão</button>' : '') +
          '</div>' +
          '<div class="carga__corpo">' +
            '<button class="etapa js-conf" data-cg="' + cg.id + '" data-tipo="saida">' +
              '<span class="etapa__n">🚚</span>' +
              '<span class="etapa__c"><span class="etapa__t">Conferência de Saída' + (saidaFinal ? ' 🔒' : '') + '</span>' +
              '<span class="etapa__d">' + U.esc(descS) + '</span></span>' +
              '<span class="etapa__seta">›</span></button>' +
          '</div>' +
        '</div>';
      });

      if (!eventoFechado) {
        h += '<button class="btn btn--laranja btn--bloco btn--gg" id="btn-novo-carreg" style="margin-top:4px">➕ NOVO CARREGAMENTO (SAÍDA)</button>';
      }

      /* --- carregamentos de RETORNO (vários caminhões, às cegas) --- */
      h += '<h2 class="secao__tit" style="margin-top:26px">Retornos <span class="n">' + retornos.length + '</span></h2>';

      if (!algumaSaidaFinal && !eventoFechado) {
        h += '<div class="aviso aviso--azul"><span class="aviso__ico">↩️</span><div>' +
          '<b>O retorno abre depois da primeira saída finalizada.</b>' +
          'Quando a mercadoria voltar, toque em REGISTRAR RETORNO e escolha o caminhão que chegou. ' +
          'Pode registrar vários retornos, um para cada caminhão.</div></div>';
      } else if (!retornos.length && !eventoFechado) {
        h += '<div class="aviso aviso--azul"><span class="aviso__ico">↩️</span><div>' +
          '<b>Nenhum retorno registrado ainda.</b>' +
          'O retorno pode chegar em vários caminhões: registre um retorno para cada caminhão que chegar. ' +
          'A contagem é às cegas e não precisa voltar tudo de uma vez.</div></div>';
      }

      retornos.forEach(function (cg) {
        var cR = Calculo.confDe(p.conferencias, cg.id, 'retorno');
        var linhasCg = Calculo.montarCarregamento(p.produtos, p.conferencias, p.itens, cg.id);
        var contR = linhasCg.filter(function (l) { return l.retorno !== null; }).length;
        var retornoFinal = !!cR && (cR.status === 'Finalizado' || cR.status === 'Com divergência');
        var descR = cR
          ? (retornoFinal
              ? cR.status + ' · ' + App.nomeUsuario(cR.conferente_id) + (cR.foto_base64 ? ' · 📷 foto ok' : '')
              : 'Em andamento · ' + contR + ' produtos registrados')
          : 'Conferência às cegas · ainda não iniciada';

        h += '<div class="carga">' +
          '<div class="carga__topo"><span class="carga__tit">↩️ RETORNO — CARREG. ' + cg.numero + '</span>' + selo(cg.status) + '</div>' +
          '<div class="carga__cam"><span>🚛</span><span><b>' + U.esc(nomeCaminhao(p.caminhoes, cg.caminhao_id)) + '</b></span>' +
            (!retornoFinal && !eventoFechado ? '<button class="btn btn--branco btn--peq js-trocar-cam" data-cg="' + cg.id + '" style="margin-left:auto">Trocar caminhão</button>' : '') +
          '</div>' +
          '<div class="carga__corpo">' +
            '<button class="etapa js-conf" data-cg="' + cg.id + '" data-tipo="retorno">' +
              '<span class="etapa__n">↩️</span>' +
              '<span class="etapa__c"><span class="etapa__t">Registrar Retorno <span class="cega-tag">ÀS CEGAS</span>' + (retornoFinal ? ' 🔒' : '') + '</span>' +
              '<span class="etapa__d">' + U.esc(descR) + '</span></span>' +
              '<span class="etapa__seta">›</span></button>' +
          '</div>' +
        '</div>';
      });

      if (algumaSaidaFinal && !eventoFechado) {
        h += '<button class="btn btn--verde btn--bloco btn--gg" id="btn-novo-retorno" style="margin-top:4px">↩️ REGISTRAR RETORNO (escolher caminhão)</button>';
      }

      /* --- relatórios (coordenador): tudo dentro do evento --- */
      if (ehCoord && p.conferencias.length) {
        h += '<h2 class="secao__tit" style="margin-top:26px">Relatórios do evento</h2><div class="btn-linha">';
        saidas.forEach(function (cg) {
          if (Calculo.confDe(p.conferencias, cg.id, 'saida')) {
            h += '<button class="btn btn--branco js-pdf" data-cg="' + cg.id + '" data-tipo="saida">📄 Saída — Carreg. ' + cg.numero + '</button>';
          }
        });
        retornos.forEach(function (cg) {
          if (Calculo.confDe(p.conferencias, cg.id, 'retorno')) {
            h += '<button class="btn btn--branco js-pdf" data-cg="' + cg.id + '" data-tipo="retorno">📄 Retorno — Carreg. ' + cg.numero + '</button>';
          }
        });
        h += '<button class="btn js-pdf-completo">📑 RELATÓRIO COMPLETO DO EVENTO</button></div>';

        /* encerrar evento: só o coordenador, com senha */
        if (ev.status !== 'Finalizado' && ev.status !== 'Com divergência') {
          h += '<button class="btn btn--azul btn--bloco" id="btn-encerrar" style="margin-top:14px">🏁 ENCERRAR EVENTO</button>';
        }
      }
    }

    if (ehCoord) {
      h += '<div class="btn-linha" style="margin-top:26px">' +
        '<button class="btn btn--branco" id="btn-atualizar">🔄 ATUALIZAR DADOS</button></div>' +
        '<button class="btn btn--branco btn--bloco" id="btn-excluir-evento" ' +
          'style="margin-top:22px;color:var(--vermelho);border-color:var(--vermelho)">🗑️ EXCLUIR EVENTO</button>';
    }

    tela.innerHTML = h;

    /* ---------- escolher caminhão (novo carregamento / trocar) ---------- */
    function escolherCaminhao(titulo) {
      return new Promise(function (resolve) {
        var ativos = p.caminhoes.filter(function (c) { return c.ativo !== false; });
        if (!ativos.length) {
          U.aviso('Nenhum caminhão ativo. Cadastre na FROTA, no painel do coordenador.', 'erro', 7000);
          return resolve(null);
        }
        var m = U.modal({
          titulo: titulo,
          html: '<div class="escolha">' + ativos.map(function (c) {
            return '<button class="escolha__item js-cam" data-id="' + c.id + '">' +
              '<span class="escolha__ini" style="background:var(--laranja)">🚚</span>' +
              '<span><span class="escolha__nome">' + U.esc(c.tipo) + (c.modelo ? ' — ' + U.esc(c.modelo) : '') + '</span>' +
              '<span class="escolha__papel">Placa ' + U.esc(c.placa) + '</span></span></button>';
          }).join('') + '</div>'
        });
        m.querySelector('.modal__fundo').addEventListener('click', function () { resolve(null); });
        U.$$('.js-cam', m).forEach(function (b) {
          b.addEventListener('click', function () { m.fechar(); resolve(b.dataset.id); });
        });
      });
    }

    function criarCarga(sentido, camId) {
      var numero = p.carregamentos.reduce(function (mx, c) { return Math.max(mx, c.numero || 0); }, 0) + 1;
      return Banco.criarCarregamento({
        evento_id: eventoId,
        numero: numero,
        caminhao_id: camId,
        sentido: sentido,
        status: sentido === 'retorno' ? 'Retorno pendente' : 'Saída pendente'
      }).then(function () {
        U.aviso('✓ ' + (sentido === 'retorno' ? 'Retorno' : 'Carregamento') + ' ' + numero + ' criado.', 'ok');
        App.recarregar();
      });
    }

    var novoCarreg = U.$('#btn-novo-carreg', tela);
    if (novoCarreg) novoCarreg.addEventListener('click', function () {
      escolherCaminhao('Qual caminhão vai fazer este carregamento?').then(function (camId) {
        if (!camId) return;
        criarCarga('saida', camId).catch(App.falhou);
      });
    });

    var novoRetorno = U.$('#btn-novo-retorno', tela);
    if (novoRetorno) novoRetorno.addEventListener('click', function () {
      escolherCaminhao('Qual caminhão chegou com o retorno?').then(function (camId) {
        if (!camId) return;
        criarCarga('retorno', camId).catch(App.falhou);
      });
    });

    /* nota fiscal: anexar (coordenador), abrir e remover */
    ligarBotoesNotaFiscal(tela);
    var campoNF = U.$('#campo-nf', tela);
    var btnNF = U.$('#btn-anexar-nf', tela);
    if (btnNF) btnNF.addEventListener('click', function () { campoNF.click(); });
    if (campoNF) campoNF.addEventListener('change', function () {
      var arquivos = Array.prototype.slice.call(campoNF.files || []);
      campoNF.value = '';
      if (!arquivos.length) return;
      U.aviso('Enviando ' + (arquivos.length > 1 ? arquivos.length + ' notas' : 'a nota') + '...', 'info', 3000);
      var lista = (ev.notas_fiscais || []).slice();
      Promise.all(arquivos.map(function (arq) {
        var limpo = arq.name.replace(/[^a-zA-Z0-9._-]/g, '_').slice(0, 60);
        var caminho = 'eventos/' + eventoId + '/nf-' + Date.now() + '-' + limpo;
        return Banco.subirArquivo(caminho, arq).then(function (url) {
          lista.push({ url: url, nome: arq.name, em: new Date().toISOString() });
        });
      })).then(function () {
        return Banco.atualizarEvento(eventoId, { notas_fiscais: lista });
      }).then(function () {
        return App.carregarBase();
      }).then(function () {
        U.aviso('✓ Nota fiscal anexada. O conferente já consegue imprimir.', 'ok', 5000);
        App.recarregar();
      }).catch(function (e) {
        U.aviso('Não deu para anexar: ' + e.message + ' (precisa de internet e do bucket "fotos" no Supabase).', 'erro', 8000);
      });
    });
    U.$$('.js-remover-nf', tela).forEach(function (b) {
      b.addEventListener('click', function () {
        var i = Number(b.dataset.i);
        var lista = (ev.notas_fiscais || []).slice();
        var nome = (lista[i] && lista[i].nome) || 'esta nota';
        pedirSenhaCoordenador('Remover nota fiscal',
          'Remover "' + nome + '" do evento? O arquivo sai da lista (quem tiver o link antigo ainda abre). Digite a senha do coordenador.')
          .then(function (ok) {
            if (!ok) return;
            lista.splice(i, 1);
            Banco.atualizarEvento(eventoId, { notas_fiscais: lista })
              .then(function () { return App.carregarBase(); })
              .then(function () { U.aviso('✓ Nota removida.', 'ok'); App.recarregar(); })
              .catch(App.falhou);
          });
      });
    });

    var excluirEv = U.$('#btn-excluir-evento', tela);
    if (excluirEv) excluirEv.addEventListener('click', function () {
      var nCg = p.carregamentos.length, nCf = p.conferencias.length;
      pedirSenhaCoordenador('Excluir evento',
        'Isto apaga o evento "' + ev.nome + '" INTEIRO: checklist (' + p.produtos.length + ' produtos)' +
        (nCg ? ', ' + nCg + ' carregamento' + (nCg > 1 ? 's' : '') : '') +
        (nCf ? ', ' + nCf + ' conferência' + (nCf > 1 ? 's' : '') + ' com fotos' : '') +
        '. Não dá para desfazer. Digite a senha do coordenador para confirmar.')
        .then(function (ok) {
          if (!ok) return;
          Banco.apagarEvento(eventoId)
            .then(function () { return App.carregarBase(); })
            .then(function () {
              U.aviso('🗑️ Evento "' + ev.nome + '" excluído.', 'ok', 5000);
              App.raiz(Sessao.ehCoordenador() ? TelaPainel : TelaMeusEventos);
            })
            .catch(App.falhou);
        });
    });

    var excluirCk = U.$('#btn-excluir-checklist', tela);
    if (excluirCk) excluirCk.addEventListener('click', function () {
      var temContagem = p.conferencias.length > 0;
      pedirSenhaCoordenador('Excluir checklist',
        'Isto apaga TODOS os ' + p.produtos.length + ' produtos do checklist deste evento' +
        (temContagem ? ' e também as quantidades já lançadas nas conferências (as conferências ficam vazias)' : '') +
        '. Não dá para desfazer. Digite a senha do coordenador para confirmar.')
        .then(function (ok) {
          if (!ok) return;
          Banco.apagarProdutos(eventoId)
            .then(function () { return App.carregarBase(); })
            .then(function () {
              U.aviso('🗑️ Checklist excluído. Anexe um novo para voltar a conferir.', 'ok', 6000);
              App.recarregar();
            })
            .catch(App.falhou);
        });
    });

    var encerrar = U.$('#btn-encerrar', tela);
    if (encerrar) encerrar.addEventListener('click', function () {
      var t = Calculo.totaisEvento(p.produtos, p.carregamentos, p.conferencias, p.itens);
      var temDiv = linhas.some(function (l) { return (l.difSaida || 0) !== 0 || (l.difRetorno || 0) !== 0; });
      var statusFinal = temDiv ? 'Com divergência' : 'Finalizado';
      pedirSenhaCoordenador('Encerrar evento',
        'Voltaram ' + U.fmt(t.retornado) + ' de ' + U.fmt(t.enviado) + ' itens enviados (' + t.pct + '%).' +
        (t.falta > 0 ? ' Ainda faltam ' + U.fmt(t.falta) + ' itens.' : '') +
        ' O evento será marcado como "' + statusFinal + '". Digite a senha do coordenador para confirmar.')
        .then(function (ok) {
          if (!ok) return;
          Banco.atualizarEvento(eventoId, { status: statusFinal })
            .then(function () { return App.carregarBase(); })
            .then(function () { U.aviso('🏁 Evento encerrado: ' + statusFinal + '.', 'ok', 5000); App.recarregar(); })
            .catch(App.falhou);
        });
    });

    U.$$('.js-trocar-cam', tela).forEach(function (b) {
      b.addEventListener('click', function () {
        escolherCaminhao('Trocar o caminhão deste carregamento').then(function (camId) {
          if (!camId) return;
          Banco.atualizarCarregamento(b.dataset.cg, { caminhao_id: camId })
            .then(function () { U.aviso('✓ Caminhão atualizado.', 'ok'); App.recarregar(); })
            .catch(App.falhou);
        });
      });
    });

    U.$$('.js-checklist', tela).forEach(function (b) {
      b.addEventListener('click', function () { App.abrir(TelaChecklist, eventoId); });
    });
    U.$$('.js-conf', tela).forEach(function (b) {
      b.addEventListener('click', function () {
        if (b.disabled) return;
        App.abrir(TelaConferencia, { eventoId: eventoId, carregamentoId: b.dataset.cg, tipo: b.dataset.tipo });
      });
    });
    U.$$('.js-pdf', tela).forEach(function (b) {
      b.addEventListener('click', function () { Relatorio.conferencia(p, b.dataset.cg, b.dataset.tipo); });
    });
    var completo = U.$('.js-pdf-completo', tela);
    if (completo) completo.addEventListener('click', function () { Relatorio.completo(p); });
    var designar = U.$('.js-designar', tela);
    if (designar) designar.addEventListener('click', function () {
      var m = U.modal({
        titulo: 'Quem faz esta conferência?',
        html: '<div class="escolha">' +
          App.conferentes().map(function (c) {
            return '<button class="escolha__item js-quem" data-id="' + c.id + '">' +
              '<span class="escolha__ini">' + U.esc(U.iniciais(c.nome)) + '</span>' +
              '<span><span class="escolha__nome">' + U.esc(c.nome) + '</span>' +
              '<span class="escolha__papel">' + (c.id === ev.conferente_id ? 'Responsável hoje' : 'Conferente') + '</span></span></button>';
          }).join('') +
          '<button class="escolha__item js-quem" data-id="">' +
            '<span class="escolha__ini" style="background:var(--laranja)">?</span>' +
            '<span><span class="escolha__nome">Deixar em aberto</span>' +
            '<span class="escolha__papel">Qualquer conferente pode assumir</span></span></button>' +
        '</div>'
      });
      U.$$('.js-quem', m).forEach(function (b) {
        b.addEventListener('click', function () {
          Banco.atualizarEvento(eventoId, { conferente_id: b.dataset.id || null })
            .then(function () { return App.carregarBase(); })
            .then(function () {
              m.fechar();
              U.aviso(b.dataset.id ? '✓ Conferente designado.' : '✓ Evento liberado para qualquer conferente.', 'ok');
              App.recarregar();
            })
            .catch(function (e) { m.fechar(); App.falhou(e); });
        });
      });
    });

    var atualizar = U.$('#btn-atualizar', tela);
    if (atualizar) atualizar.addEventListener('click', function () {
      U.aviso('Buscando os dados mais recentes...', 'info', 1500);
      App.recarregar();
    });
  }).catch(function (e) {
    tela.innerHTML = '<div class="aviso aviso--vermelho"><span class="aviso__ico">⚠</span><div>' +
      '<b>Não foi possível abrir o evento.</b>' + U.esc(e.message) + '</div></div>' +
      '<button class="btn btn--bloco" onclick="App.recarregar()">Tentar de novo</button>';
  });
}

/* ============================================================
   Tela do checklist — enviar arquivo ou digitar
   ============================================================ */
function TelaChecklist(eventoId) {
  var podeEditar = Sessao.ehCoordenador();
  App.topo('PRODUTOS DO CHECKLIST', podeEditar ? 'Envie o arquivo ou digite a lista' : 'Anexe o arquivo do checklist');
  var tela = U.$('#tela');
  var produtos = [];
  var imagemApoio = null;

  tela.innerHTML = U.carregando('Abrindo o checklist...');

  Banco.listarProdutos(eventoId).then(function (existentes) {
    /* O conferente pode anexar quando não existe checklist, mas não pode
       alterar um checklist que já foi lançado. */
    if (!podeEditar && existentes.length) {
      tela.innerHTML = '<div class="aviso aviso--amarelo"><span class="aviso__ico">🔒</span><div>' +
        '<b>Este checklist já foi lançado.</b>' +
        'Só o coordenador pode alterar a lista de produtos. Se algo estiver errado, fale com ele.</div></div>' +
        '<button class="btn btn--bloco" onclick="App.voltar()">Voltar para o evento</button>';
      return;
    }
    produtos = existentes.map(function (p) {
      return { nome: p.nome, quantidade_prevista: U.num(p.quantidade_prevista), unidade: p.unidade || 'UN', terceirizado: !!p.terceirizado };
    });
    desenhar();
  }).catch(function (e) { App.falhou(e); desenhar(); });

  function desenhar() {
    var h = '' +
      '<div class="cartao"><div class="cartao__corpo">' +
        '<p class="mut peq" style="margin-bottom:12px">' + (podeEditar
          ? 'Aceita PDF, XML, JPG, PNG, TXT e CSV. Se a leitura automática não funcionar, digite os produtos na mão — o sistema funciona do mesmo jeito.'
          : 'Aceita PDF, XML, TXT e CSV. A lista vem do arquivo: você anexa e confere, mas não altera as quantidades previstas.') + '</p>' +
        '<input type="file" id="ck-arquivo" accept="' + (podeEditar ? '.pdf,.xml,.xlsx,.xls,.jpg,.jpeg,.png,.txt,.csv' : '.pdf,.xml,.xlsx,.xls,.txt,.csv') + '" multiple hidden>' +
        '<div class="btn-linha">' +
          '<button class="btn btn--laranja" id="ck-enviar">📎 ANEXAR ARQUIVO</button>' +
          (podeEditar ? '<button class="btn btn--branco" id="ck-colar">📝 COLAR LISTA</button>' : '') +
        '</div>' +
      '</div></div>';

    if (imagemApoio) {
      h += '<div class="cartao"><div class="cartao__topo"><h3>Imagem enviada</h3>' +
        '<button class="btn btn--peq btn--branco" id="ck-tira-img">Remover</button></div>' +
        '<div class="cartao__corpo"><img src="' + imagemApoio + '" alt="Checklist enviado" ' +
        'style="width:100%;border-radius:10px;border:1px solid var(--linha)"></div></div>';
    }

    h += '<div class="cartao"><div class="cartao__topo"><h3>Produtos</h3>' +
      '<span class="mut peq">' + produtos.length + '</span></div>';

    if (!produtos.length) {
      h += '<div class="cartao__corpo"><div class="vazio" style="padding:24px 0">' +
        '<p class="vazio__ico">📦</p><h3>Nenhum produto ainda</h3>' +
        '<p>Envie um arquivo, cole a lista ou adicione um por um.</p></div></div>';
    } else if (!podeEditar) {
      h += '<div class="tabela-rolagem"><table class="tab"><thead><tr>' +
        '<th>Produto</th><th class="num" style="width:90px">Previsto</th><th style="width:70px">Un.</th>' +
        '</tr></thead><tbody>' +
        produtos.map(function (p) {
          return '<tr><td>' + U.esc(p.nome) + tagTerc(p) + '</td><td class="num">' + U.fmt(p.quantidade_prevista) + '</td>' +
            '<td>' + U.esc(p.unidade || 'UN') + '</td></tr>';
        }).join('') +
        '</tbody></table></div>';
    } else {
      h += '<div class="tabela-rolagem"><table class="tab tab--edit"><thead><tr>' +
        '<th>Produto</th><th class="num">Qtd.</th><th>Unidade</th><th></th>' +
        '</tr></thead><tbody>' +
        produtos.map(function (p, i) {
          return '<tr>' +
            '<td><input class="entrada js-nome" data-i="' + i + '" value="' + U.esc(p.nome) + '" style="min-height:44px;padding:9px">' +
              '<label class="peq" style="display:flex;gap:7px;align-items:center;margin-top:6px;cursor:pointer;color:var(--txt-2)">' +
                '<input type="checkbox" class="js-terc" data-i="' + i + '" style="width:18px;height:18px"' + (p.terceirizado ? ' checked' : '') + '>' +
                '🔗 Terceirizado (não mexe no estoque)</label></td>' +
            '<td><input class="entrada js-qtd num" data-i="' + i + '" type="number" inputmode="decimal" min="0" ' +
              'value="' + U.esc(p.quantidade_prevista) + '" style="min-height:44px;padding:9px;text-align:right"></td>' +
            '<td>' + seletorUnidade(p.unidade, i, 'js-un') + '</td>' +
            '<td><button class="btn btn--peq btn--branco js-remover" data-i="' + i + '" aria-label="Excluir">✕</button></td>' +
            '</tr>';
        }).join('') +
        '</tbody></table></div>';
    }

    h += (podeEditar
      ? '<div class="cartao__corpo"><button class="btn btn--branco btn--bloco" id="ck-add">+ ADICIONAR PRODUTO</button></div>'
      : (produtos.length
          ? '<div class="cartao__corpo"><p class="mut peq">A lista vem do arquivo e não pode ser alterada por você.</p>' +
            '<button class="btn btn--branco btn--bloco" id="ck-limpar" style="margin-top:10px">Descartar e anexar outro</button></div>'
          : '')) + '</div>';

    h += '<div class="barra-fixa"><button class="btn btn--laranja btn--bloco btn--gg" id="ck-confirmar">CONFIRMAR CHECKLIST</button></div>';

    tela.innerHTML = h;

    /* --- ligações --- */
    U.$('#ck-enviar').addEventListener('click', function () { U.$('#ck-arquivo').click(); });
    U.$('#ck-arquivo').addEventListener('change', function () {
      var arquivos = this.files;
      if (!arquivos || !arquivos.length) return;
      var quantos = arquivos.length;
      var aviso = U.modal({
        titulo: 'Lendo ' + (quantos > 1 ? quantos + ' arquivos' : 'o arquivo'),
        html: U.carregando('Isso leva alguns segundos...'), travado: true
      });
      Checklist.lerVarios(arquivos).then(function (res) {
        aviso.fechar();
        if (res.imagem) { imagemApoio = res.imagem; }
        if (res.produtos.length) {
          produtos = Checklist.juntarIguais(produtos.concat(res.produtos));
          U.aviso('✓ ' + res.produtos.length + ' produtos encontrados em ' + res.lidos + ' arquivo' + (res.lidos > 1 ? 's' : '') + '. Confira antes de confirmar.', 'ok', 5000);
        }
        if (res.falhas.length) {
          U.aviso('⚠ ' + res.falhas.join(' · '), 'erro', 8000);
        }
        desenhar();
      });
      this.value = '';
    });

    var ckColar = U.$('#ck-colar');
    if (ckColar) ckColar.addEventListener('click', function () {
      var m = U.modal({
        titulo: 'Colar lista',
        html: '<p class="mut peq" style="margin-bottom:10px">Um produto por linha. Exemplos que o sistema entende:<br>' +
          '<b>Cadeira — 100</b> · <b>Mesa: 20</b> · <b>5 x Tenda 10x10</b></p>' +
          '<textarea class="entrada" id="ck-texto" style="min-height:180px" placeholder="Cadeira — 100&#10;Mesa — 20&#10;Tenda 10x10 — 5"></textarea>',
        pe: '<button class="btn btn--branco" data-x>Cancelar</button><button class="btn btn--laranja" data-ok>Ler lista</button>'
      });
      m.querySelector('[data-x]').addEventListener('click', function () { m.fechar(); });
      m.querySelector('[data-ok]').addEventListener('click', function () {
        var achados = Checklist.deTexto(U.$('#ck-texto', m).value);
        if (!achados.length) return U.aviso('Não consegui entender nenhuma linha. Use o formato "Produto — quantidade".', 'erro', 5000);
        produtos = Checklist.juntarIguais(produtos.concat(achados));
        m.fechar();
        U.aviso('✓ ' + achados.length + ' produtos adicionados.', 'ok');
        desenhar();
      });
    });

    var ckLimpar = U.$('#ck-limpar');
    if (ckLimpar) ckLimpar.addEventListener('click', function () { produtos = []; imagemApoio = null; desenhar(); });

    var ckAdd = U.$('#ck-add');
    if (ckAdd) ckAdd.addEventListener('click', function () {
      produtos.push({ nome: '', quantidade_prevista: 0, unidade: 'UN' });
      desenhar();
      var campos = U.$$('.js-nome', tela);
      if (campos.length) campos[campos.length - 1].focus();
    });

    U.$$('.js-nome', tela).forEach(function (el) {
      el.addEventListener('input', function () { produtos[Number(el.dataset.i)].nome = el.value; });
    });
    U.$$('.js-qtd', tela).forEach(function (el) {
      el.addEventListener('input', function () { produtos[Number(el.dataset.i)].quantidade_prevista = U.num(el.value); });
    });
    U.$$('.js-un', tela).forEach(function (el) {
      el.addEventListener('change', function () { produtos[Number(el.dataset.i)].unidade = el.value; });
    });
    U.$$('.js-terc', tela).forEach(function (el) {
      el.addEventListener('change', function () { produtos[Number(el.dataset.i)].terceirizado = el.checked; });
    });
    U.$$('.js-remover', tela).forEach(function (el) {
      el.addEventListener('click', function () {
        produtos.splice(Number(el.dataset.i), 1);
        desenhar();
      });
    });
    var tiraImg = U.$('#ck-tira-img');
    if (tiraImg) tiraImg.addEventListener('click', function () { imagemApoio = null; desenhar(); });

    U.$('#ck-confirmar').addEventListener('click', function () {
      var limpos = produtos
        .map(function (p) {
          return {
            nome: String(p.nome || '').trim(),
            quantidade_prevista: U.num(p.quantidade_prevista),
            unidade: p.unidade || 'UN',
            terceirizado: !!p.terceirizado
          };
        })
        .filter(function (p) { return p.nome.length > 0; });

      if (!limpos.length) return U.aviso('Adicione pelo menos um produto.', 'erro');
      var semQtd = limpos.filter(function (p) { return p.quantidade_prevista <= 0; });
      if (semQtd.length) return U.aviso('Preencha a quantidade de: ' + semQtd[0].nome, 'erro', 5000);

      var botao = this;
      botao.disabled = true;
      botao.textContent = 'Salvando...';
      Banco.salvarProdutos(eventoId, limpos).then(function () {
        U.aviso('✓ Checklist confirmado com ' + limpos.length + ' produtos.', 'ok');
        oferecerCadastroEstoque(limpos, function () { App.voltar(); });
      }).catch(function (e) {
        botao.disabled = false;
        botao.textContent = 'CONFIRMAR CHECKLIST';
        App.falhou(e);
      });
    });
  }
}

/* Depois de salvar um checklist: pergunta se cadastra no estoque os
   produtos que ainda não existem lá — todos, alguns (desmarcando) ou nenhum.
   Sempre chama aoTerminar() no fim, escolha o que for. */
function oferecerCadastroEstoque(produtosChecklist, aoTerminar) {
  Banco.listarEstoque()
    .then(function (cadastro) {
      var porChave = {};
      cadastro.forEach(function (i) { porChave[Estoque.chave(i.nome)] = true; });
      var vistos = {};
      var faltantes = (produtosChecklist || []).filter(function (p) {
        if (p.terceirizado) return false;                 /* terceirizado não entra no estoque */
        var ch = Estoque.chave(p.nome);
        if (!ch || porChave[ch] || vistos[ch]) return false;
        vistos[ch] = true;
        return true;
      });
      if (!faltantes.length) return aoTerminar();

      var familiasEx = [];
      cadastro.forEach(function (i) {
        Estoque.familiasDe(i).forEach(function (f) {
          if (familiasEx.indexOf(f) < 0) familiasEx.push(f);
        });
      });
      familiasEx.sort();

      var m = U.modal({
        titulo: '📦 Cadastrar no estoque?',
        html: '<p class="mut peq" style="margin-bottom:12px">' + faltantes.length +
            ' produto' + (faltantes.length > 1 ? 's' : '') + ' do checklist ainda não ' +
            (faltantes.length > 1 ? 'estão' : 'está') + ' no estoque do galpão. ' +
            'Marque o que quiser cadastrar e, se já souber, informe <b>quanto tem no galpão</b> ' +
            '(em branco ou 0 = cadastra zerado para ajustar depois):</p>' +
          '<div style="max-height:45vh;overflow:auto;border:1px solid var(--linha);border-radius:10px;padding:8px 12px">' +
            faltantes.map(function (p, i) {
              return '<div style="border-bottom:1px solid var(--linha);padding:8px 0">' +
                '<div style="display:flex;gap:10px;align-items:center">' +
                  '<input type="checkbox" class="js-cad-es" data-i="' + i + '" checked style="width:20px;height:20px;flex:none;cursor:pointer">' +
                  '<span style="flex:1">' + U.esc(p.nome) + ' <span class="peq mut">' + U.esc(p.unidade || 'UN') + '</span></span>' +
                  '<input type="number" class="entrada js-cad-qtd" data-i="' + i + '" inputmode="numeric" min="0" ' +
                    'placeholder="Qtd" style="width:92px;min-height:44px;padding:8px;text-align:center;flex:none">' +
                '</div>' +
                '<input class="entrada js-cad-fam" data-i="' + i + '" list="cad-familias" ' +
                  'placeholder="📂 Famílias (pode várias, por vírgula)" ' +
                  'style="margin-top:6px;min-height:42px;padding:8px;font-size:14px">' +
              '</div>';
            }).join('') +
          '</div>' +
          '<datalist id="cad-familias">' +
            familiasEx.map(function (f) { return '<option value="' + U.esc(f) + '">'; }).join('') +
          '</datalist>',
        pe: '<button class="btn btn--branco" data-nada>NÃO CADASTRAR NADA</button>' +
            '<button class="btn btn--verde" data-ok>CADASTRAR MARCADOS</button>',
        travado: true
      });

      m.querySelector('[data-nada]').addEventListener('click', function () {
        m.fechar();
        U.aviso('Ok — nenhum produto novo entrou no estoque. Você pode cadastrar depois no 📦 ESTOQUE.', 'info', 5000);
        aoTerminar();
      });
      m.querySelector('[data-ok]').addEventListener('click', function () {
        var escolhidos = [];
        m.querySelectorAll('.js-cad-es').forEach(function (cx) {
          if (!cx.checked) return;
          var i = Number(cx.dataset.i);
          var campoQtd = m.querySelector('.js-cad-qtd[data-i="' + i + '"]');
          var campoFam = m.querySelector('.js-cad-fam[data-i="' + i + '"]');
          var fams = (campoFam ? campoFam.value : '').split(',')
            .map(function (f) { return f.trim().replace(/\s+/g, ' '); })
            .filter(function (f) { return f.length > 0; });
          escolhidos.push({
            p: faltantes[i],
            qtd: campoQtd ? U.num(campoQtd.value) : 0,
            familias: fams
          });
        });
        if (!escolhidos.length) {
          m.fechar();
          U.aviso('Nenhum marcado — nada entrou no estoque.', 'info', 4000);
          return aoTerminar();
        }
        var b = m.querySelector('[data-ok]');
        b.disabled = true; b.textContent = 'Cadastrando...';
        var comSaldo = 0;
        Promise.all(escolhidos.map(function (e) {
          return Banco.criarEstoque({
            nome: String(e.p.nome).trim().replace(/\s+/g, ' '),
            unidade: e.p.unidade || 'UN',
            familias: e.familias || [],
            familia: (e.familias && e.familias[0]) || null,
            ativo: true
          }).then(function (novo) {
            /* já ajusta o saldo com a quantidade informada */
            if (novo && e.qtd > 0) {
              comSaldo++;
              return Banco.criarMovimentos([{
                estoque_id: novo.id, tipo: 'entrada', quantidade: e.qtd,
                usuario_id: Sessao.atual.id, observacao: 'Cadastro pelo checklist'
              }]);
            }
          }).catch(function () { });   /* nome repetido em corrida: segue */
        })).then(function () {
          m.fechar();
          U.aviso('✓ ' + escolhidos.length + ' produto' + (escolhidos.length > 1 ? 's' : '') +
            ' cadastrado' + (escolhidos.length > 1 ? 's' : '') +
            (comSaldo ? ' — ' + comSaldo + ' já com o saldo lançado' : ' (saldo 0)') + '.', 'ok', 6000);
          aoTerminar();
        }).catch(function () { m.fechar(); aoTerminar(); });
      });
    })
    .catch(function () { aoTerminar(); });   /* tabela do estoque ausente: segue normal */
}

/* ============================================================
   js/conferencia.js — a contagem em si
   ------------------------------------------------------------
   • Cada conferência pertence a UM carregamento (com caminhão).
   • O RETORNO é feito ÀS CEGAS: o conferente não vê o que saiu.
     Uma barra de porcentagem mostra o andamento até finalizar.
   • Para FINALIZAR é obrigatório anexar a FOTO do carregamento.
   • Depois de finalizada, a conferência trava. Só o coordenador
     destrava, digitando a senha.
   ============================================================ */
function TelaConferencia(arg) {
  var eventoId = arg.eventoId, carregamentoId = arg.carregamentoId, tipo = arg.tipo;
  var info = Calculo.TIPOS[tipo];
  var cega = tipo === 'retorno';           /* conferência às cegas */
  var tela = U.$('#tela');
  tela.innerHTML = U.carregando('Preparando a conferência...');

  var pacote = null, carregamento = null, conferencia = null, linhas = [];
  var contagem = {};    /* produto_id -> valor digitado (string) */
  var embalagem = {};   /* produto_id -> como a conta foi feita (pallet/caixa) */
  var dano = {};        /* produto_id -> { qtd, desc, foto } (só no retorno) */
  var terc = {};        /* produto_id -> quantos do total contado são terceirizados */
  var tercSel = {};     /* produto_id -> 'fornecedorId|chaveMaterial' (de onde sai o terceirizado) */
  var fornecedoresT = [];
  var saldosT = {};     /* saldos de terceiros por fornecedor (módulo 🔗) */
  var familiasPorChave = {};  /* nome normalizado -> [famílias] (vem do estoque) */
  var filtroFamilia = '';     /* chip escolhido ('' = todas) */
  var foto = null;      /* base64 da foto obrigatória do carregamento */
  var desbloqueada = false;  /* o coordenador liberou a edição com a senha */

  Promise.all([
    App.carregarEvento(eventoId),
    Banco.listarFornecedores().catch(function () { return []; }),
    Banco.listarMovTerceiros().catch(function () { return []; }),
    Banco.listarEstoque().catch(function () { return []; })
  ]).then(function (tudo) {
    var p = tudo[0];
    fornecedoresT = tudo[1];
    var movsT = tudo[2];
    saldosT = Terceiros.saldos(movsT);
    (tudo[3] || []).forEach(function (i) {
      var fams = Estoque.familiasDe(i);
      if (fams.length) familiasPorChave[Estoque.chave(i.nome)] = fams;
    });

    pacote = p;
    carregamento = (p.carregamentos || []).filter(function (c) { return c.id === carregamentoId; })[0] || null;
    if (!carregamento) throw new Error('Carregamento não encontrado. Volte e abra o evento de novo.');
    App.topo(info.rotulo.toUpperCase(), 'Carregamento ' + carregamento.numero + (p.evento ? ' · ' + p.evento.nome : ''));

    linhas = Calculo.montarCarregamento(p.produtos, p.conferencias, p.itens, carregamentoId);
    conferencia = Calculo.confDe(p.conferencias, carregamentoId, tipo);
    foto = conferencia ? (conferencia.foto_base64 || null) : null;

    /* de qual fornecedor saiu o terceirizado (gravado na finalização anterior) */
    if (conferencia) {
      movsT.forEach(function (mv) {
        if (mv.conferencia_id === conferencia.id && mv.produto_id) {
          tercSel[mv.produto_id] = mv.fornecedor_id + '|' + Terceiros.chave(mv.material);
        }
      });
    }

    /* preenche o que já estava salvo */
    linhas.forEach(function (l) {
      var v = Calculo.contado(l, tipo);
      contagem[l.produto.id] = (v === null || v === undefined) ? '' : String(v);

      var d = (l.detalhes && l.detalhes[tipo]) || {};
      embalagem[l.produto.id] = {
        por: d.por_embalagem === null || d.por_embalagem === undefined ? '' : String(d.por_embalagem),
        qtd: d.embalagens === null || d.embalagens === undefined ? '' : String(d.embalagens),
        soltas: d.avulsas === null || d.avulsas === undefined ? '' : String(d.avulsas),
        obs: d.observacao || ''
      };

      var dd = l.dano || {};
      dano[l.produto.id] = {
        qtd: dd.qtd ? String(dd.qtd) : '',
        desc: dd.descricao || '',
        foto: dd.foto || null
      };

      var tq = (d.qtd_terceirizada || 0);
      terc[l.produto.id] = tq ? String(tq) : '';
    });

    /* Rascunho guardado no aparelho (modo offline): mais novo que o servidor? */
    var ras = Rascunho.ler(carregamentoId, tipo);
    var baseData = conferencia ? (conferencia.updated_at || conferencia.created_at) : null;
    if (ras && !travada() && (!baseData || ras.em > baseData)) {
      var m = U.modal({
        titulo: '📱 Contagem guardada neste aparelho',
        html: '<p>Encontrei uma contagem de <b>' + U.fmtDataHora(ras.em) + '</b> que ainda não foi enviada' +
          (ras.semFotos ? ' (as fotos não couberam no aparelho e precisam ser tiradas de novo)' : '') + '.</p>' +
          '<p style="margin-top:8px">Quer recuperar essa contagem?</p>',
        pe: '<button class="btn btn--branco" data-x>Descartar</button>' +
            '<button class="btn btn--verde" data-ok>RECUPERAR</button>',
        travado: true
      });
      m.querySelector('[data-x]').addEventListener('click', function () {
        Rascunho.apagar(carregamentoId, tipo);
        m.fechar(); desenhar();
      });
      m.querySelector('[data-ok]').addEventListener('click', function () {
        if (ras.contagem) contagem = ras.contagem;
        if (ras.embalagem) embalagem = ras.embalagem;
        if (ras.dano) dano = ras.dano;
        if (ras.terc) terc = ras.terc;
        if (ras.tercSel) tercSel = ras.tercSel;
        if (ras.foto) foto = ras.foto;
        m.fechar();
        U.aviso('✓ Contagem recuperada. Toque em SALVAR para enviar ao sistema.', 'ok', 6000);
        desenhar();
      });
      return;
    }
    desenhar();
  }).catch(function (e) {
    tela.innerHTML = '<div class="aviso aviso--vermelho"><span class="aviso__ico">⚠</span><div>' +
      '<b>Não foi possível abrir a conferência.</b>' + U.esc(e.message) + '</div></div>';
  });

  function valor(id) {
    var v = contagem[id];
    return (v === '' || v === undefined || v === null) ? null : U.num(v);
  }

  var rascunhoTimer = null;
  function guardarRascunho() {
    if (travada()) return;
    clearTimeout(rascunhoTimer);
    rascunhoTimer = setTimeout(function () {
      Rascunho.guardar(carregamentoId, tipo, {
        contagem: contagem, embalagem: embalagem, dano: dano, terc: terc, tercSel: tercSel, foto: foto
      });
    }, 400);
  }

  function danoDe(id) {
    if (!dano[id]) dano[id] = { qtd: '', desc: '', foto: null };
    return dano[id];
  }
  function danoQtd(id) { return cega ? U.num(danoDe(id).qtd) : 0; }
  /* total que vale para a comparação: nosso material + danificado + terceirizado (que SOMA) */
  function valorTotal(id) {
    var v = valor(id);
    if (v === null) return null;
    return v + danoQtd(id) + (ehFlag100(id) ? 0 : U.num(terc[id]));
  }
  function ehFlag100(id) {
    var linha = linhas.filter(function (l) { return l.produto.id === id; })[0];
    return !!(linha && linha.produto && linha.produto.terceirizado);
  }
  /* Terceirizado SOMA na contagem: contador = material do NOSSO estoque,
     campo 🔗 = o que veio do fornecedor. Total conferido = nosso + terceirizado.
     Ex.: previsto 4, nosso 1 + 3 terceirizados = 4, sem divergência. */
  function tercQtd(id) {
    if (ehFlag100(id)) {
      /* produto 100% terceirizado: o próprio contador é todo de fornecedor */
      var v = valor(id);
      return v === null ? 0 : v + danoQtd(id);
    }
    return U.num((terc[id] === undefined ? '' : terc[id]));
  }

  function danoIncompleto(id) {
    var d = danoDe(id);
    return danoQtd(id) > 0 && (!(d.desc || '').trim() || !d.foto);
  }

  function finalizada() {
    return !!conferencia && (conferencia.status === 'Finalizado' || conferencia.status === 'Com divergência');
  }
  function eventoFechado() {
    var ev = pacote && pacote.evento;
    return !!ev && (ev.status === 'Finalizado' || ev.status === 'Com divergência');
  }
  /* Evento encerrado pelo coordenador: tudo vira só visualização
     (mesmo conferência salva no meio). A senha do coordenador ainda destrava. */
  function travada() { return (finalizada() || eventoFechado()) && !desbloqueada; }

  function resumoAtual() {
    var r = { produtos: linhas.length, base: 0, contado: 0, divergencias: 0, pendentes: 0, danificados: 0, terceirizados: 0 };
    linhas.forEach(function (l) {
      var b = Calculo.base(l, tipo);
      var c = valorTotal(l.produto.id);
      r.base += b;
      r.danificados += danoQtd(l.produto.id);
      if (c === null) { r.pendentes++; return; }
      r.contado += c;
      r.terceirizados += tercQtd(l.produto.id);
      if (c - b !== 0) r.divergencias++;
    });
    return r;
  }

  /* ---------- foto do carregamento ---------- */
  function lerFoto(arquivo) {
    return new Promise(function (resolve, reject) {
      var leitor = new FileReader();
      leitor.onload = function () {
        var img = new Image();
        img.onload = function () {
          var max = 1280;
          var esc = Math.min(1, max / Math.max(img.width, img.height));
          var cv = document.createElement('canvas');
          cv.width = Math.max(1, Math.round(img.width * esc));
          cv.height = Math.max(1, Math.round(img.height * esc));
          cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
          resolve(cv.toDataURL('image/jpeg', 0.72));
        };
        img.onerror = function () { reject(new Error('Não consegui abrir esta foto.')); };
