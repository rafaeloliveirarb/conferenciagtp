<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Operações do Galpão · Grupo Tendas Plenart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --fundo:#141C33; --cartao:#1C2747; --cartao2:#212E52; --linha:#2C3A63;
    --txt:#F2F5FC; --mut:#93A0C4; --laranja:#F5A04A; --laranja2:#F07C00;
    --verde:#35C77B; --verde-esc:#1E4D3C; --azul:#5B8DEF; --vermelho:#FF5A4E;
    --amarelo:#FFC24B; --roxo:#B08AF5;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  /* ---------- tela cheia ---------- */
  .convite{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;background:rgba(10,15,30,.82);cursor:pointer;text-align:center;transition:opacity .4s}
  .convite b{font-size:44px;font-weight:900;letter-spacing:.5px}
  .convite span{font-size:22px;color:var(--mut)}
  .convite i{font-style:normal;font-size:90px;line-height:1}
  .convite[hidden]{display:none}
  .bt-cheia{position:fixed;z-index:40;right:18px;bottom:72px;background:var(--cartao2);color:var(--txt);
    border:2px solid var(--laranja2);border-radius:12px;padding:10px 16px;font:900 16px Nunito,system-ui,sans-serif;
    cursor:pointer;opacity:.9}
  .bt-cheia[hidden]{display:none}
  body.semmouse, body.semmouse *{cursor:none!important}
  body{margin:0;background:var(--fundo);color:var(--txt);overflow:hidden;
    font:600 17px/1.4 Nunito,"Segoe UI",system-ui,sans-serif}

  /* ---------- topo ---------- */
  .topo{display:flex;justify-content:space-between;align-items:center;gap:16px;
    padding:14px 28px 12px;border-bottom:5px solid var(--laranja2)}
  .topo h1{margin:0;font-size:34px;font-weight:900;letter-spacing:.5px}
  .topo h1 small{display:block;font-size:15px;font-weight:700;color:var(--mut);letter-spacing:.4px;text-transform:lowercase}
  .topo .dir{display:flex;align-items:center;gap:22px}
  .bolas{display:flex;gap:7px}
  .bolas i{width:11px;height:11px;border-radius:50%;background:var(--linha);transition:background .3s}
  .bolas i.on{background:var(--laranja)}
  .relogio{font-size:56px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
  .atua{font-size:12.5px;color:var(--mut);text-align:right;margin-top:2px}

  /* ---------- painel ---------- */
  .painel{position:absolute;inset:112px 0 58px;padding:16px 28px;display:grid;gap:16px;
    grid-template-columns:repeat(4,1fr);transition:opacity .35s}
  .painel.trocando{opacity:0}
  .painel.semfita{bottom:0}
  .col{display:flex;flex-direction:column;min-width:0;overflow:hidden}
  .col h2{margin:0 0 10px;font-size:21px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;
    display:flex;align-items:center;gap:10px;flex:none}
  .col h2 .n{margin-left:auto;background:var(--linha);border-radius:999px;padding:2px 14px;font-size:16px}
  .col.folga h2{color:var(--azul)} .col.carga h2{color:var(--verde)}
  .col.descarga h2{color:var(--laranja)} .col.tarefa h2{color:var(--amarelo)}
  .rolo{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:10px}

  .dia{font-size:15px;font-weight:900;letter-spacing:1px;color:var(--mut);text-transform:uppercase;margin:6px 2px 0}
  .dia.hoje{color:var(--laranja)}

  .card{background:var(--cartao);border:1px solid var(--linha);border-left:6px solid var(--azul);
    border-radius:14px;padding:12px 14px;flex:none}
  .col.folga .card{border-left-color:var(--azul)}
  .col.carga .card{border-left-color:var(--verde)}
  .col.descarga .card{border-left-color:var(--laranja)}
  .col.tarefa .card{border-left-color:var(--amarelo)}
  .card.ruim{border-left-color:var(--vermelho)!important;background:#2A2340}
  .card.feita{opacity:.5}
  .card b.tit{display:block;font-size:19px;font-weight:900;line-height:1.2;overflow-wrap:anywhere}
  .card.feita b.tit{text-decoration:line-through}
  .card .sub{color:var(--mut);font-size:14.5px;margin-top:2px}
  .card .hora{color:var(--laranja);font-weight:900}
  .chip{display:inline-block;background:#101830;border:1px solid var(--linha);border-radius:9px;
    padding:2px 10px;font-size:13.5px;font-weight:800;margin:5px 6px 0 0;white-space:nowrap}
  .chip.ok{border-color:var(--verde);color:var(--verde)}
  .chip.pend{border-color:var(--laranja);color:var(--laranja)}
  .chip.ruim{border-color:var(--vermelho);color:var(--vermelho)}
  .chip.st-FOLGA{border-color:var(--azul);color:var(--azul)}
  .chip.st-OUTRO{border-color:var(--vermelho);color:var(--vermelho)}
  .equipe{margin-top:6px;font-size:14.5px;color:#C9D6F2}
  .equipe b{color:var(--txt)}
  .equipe.sem{color:var(--vermelho);font-weight:900}
  .vazio{color:var(--mut);font-weight:700;padding:14px 4px;font-size:16px}

  /* ---------- tela sozinha ---------- */
  .painel.solo{grid-template-columns:1fr}
  .painel.solo .col{display:none}
  .painel.solo .col.on{display:flex}
  .painel.solo .col.on h2{font-size:34px;justify-content:center;margin-bottom:14px}
  .painel.solo .col.on h2 .n{margin-left:14px;font-size:22px}
  .painel.solo .col.on .rolo{display:block;column-count:3;column-gap:16px;column-fill:auto;overflow:hidden}
  .painel.solo .col.on .rolo>*{break-inside:avoid;margin-bottom:12px;width:100%}
  .painel.solo .col.on .card b.tit{font-size:23px}
  .painel.solo .col.on .card .sub{font-size:16px}
  .painel.solo .col.on .chip{font-size:15.5px}
  .painel.solo .col.on .equipe{font-size:16.5px}
  .painel.solo .col.on .dia{font-size:18px}

  /* ---------- letreiro de avisos ---------- */
  .fita{position:absolute;left:0;right:0;bottom:0;height:58px;background:#A63A2B;
    display:flex;align-items:center;overflow:hidden}
  .fita[hidden]{display:none}
  .fita .rolinho{display:inline-block;white-space:nowrap;font-size:21px;font-weight:900;
    padding-left:100%;animation:passa linear infinite}
  @keyframes passa{to{transform:translateX(-100%)}}
  .erro{position:absolute;top:118px;left:28px;right:28px;background:rgba(255,90,78,.15);
    border:1px solid var(--vermelho);border-radius:12px;padding:10px 16px;color:#FFB4AE;font-weight:800;z-index:5}
</style>
</head>
<body>
<div class="convite" id="convite" hidden>
  <i>⛶</i>
  <b>TOQUE NA TELA OU APERTE QUALQUER TECLA</b>
  <span>para abrir em tela cheia</span>
</div>
<button class="bt-cheia" id="bt-cheia" hidden>⛶ TELA CHEIA</button>

<div class="topo">
  <h1>OPERAÇÕES DO GALPÃO<small id="data-longa"></small></h1>
  <div class="dir">
    <div class="bolas" id="bolas"><i></i><i></i><i></i><i></i><i></i></div>
    <div>
      <div class="relogio" id="hora">--:--</div>
      <div class="atua" id="atualizado"></div>
    </div>
  </div>
</div>

<div class="erro" id="erro" hidden></div>
<div class="painel" id="painel">
  <div class="col folga" data-col="0"><h2>🛌 Folga <span class="n" id="n-folga">–</span></h2><div class="rolo" id="c-folga"><div class="vazio">Carregando…</div></div></div>
  <div class="col carga" data-col="1"><h2>🚚 Carregamento <span class="n" id="n-carga">–</span></h2><div class="rolo" id="c-carga"></div></div>
  <div class="col descarga" data-col="2"><h2>↩️ Descarregamento <span class="n" id="n-descarga">–</span></h2><div class="rolo" id="c-descarga"></div></div>
  <div class="col tarefa" data-col="3"><h2>📝 Tarefas <span class="n" id="n-tarefa">–</span></h2><div class="rolo" id="c-tarefa"></div></div>
</div>
<div class="fita" id="fita" hidden><span class="rolinho" id="fita-texto"></span></div>

<script>
(function () {
  "use strict";
  var SUPABASE_URL = "https://cllylcuhpmwnyebmlelf.supabase.co";
  var SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsbHlsY3VocG13bnllYm1sZWxmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3OTA0MTMsImV4cCI6MjEwMzM2NjQxM30.fNnvg23PqzSCgwHzcMw5XdHwYAA6PF3kdffDA9yW4-E";
  function fetchLimpo(recurso, opcoes) {
    opcoes = opcoes || {};
    try {
      if (opcoes.headers && typeof Headers !== "undefined" && opcoes.headers instanceof Headers) {
        var simples = {}; opcoes.headers.forEach(function (v, k) { simples[k] = v; });
        var copia = {}; Object.keys(opcoes).forEach(function (k) { copia[k] = opcoes[k]; });
        copia.headers = simples; opcoes = copia;
      }
    } catch (e) { }
    return fetch(recurso, opcoes);
  }
  var cli = supabase.createClient(SUPABASE_URL, SUPABASE_ANON, { global: { fetch: fetchLimpo } });

  /* tempos do rodízio: 10 s cada tela, depois as 4 juntas por 1 min */
  var TEMPO_SOLO = (window.TV_TEMPOS && window.TV_TEMPOS.solo) || 10000;
  var TEMPO_GRADE = (window.TV_TEMPOS && window.TV_TEMPOS.grade) || 60000;
  var DIAS_FRENTE = 4;   /* hoje + 4 dias */

  function $(id) { return document.getElementById(id); }
  function esc(t) {
    return String(t === null || t === undefined ? "" : t)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function hojeISO(mais) {
    var d = new Date(Date.now() + (mais || 0) * 86400000);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function fmtData(iso) {
    var p = String(iso || "").slice(0, 10).split("-");
    return p.length === 3 ? p[2] + "/" + p[1] : "";
  }
  var DIAS = ["DOM", "SEG", "TER", "QUA", "QUI", "SEX", "SÁB"];
  function rotDia(iso, i) {
    if (i === 0) return "HOJE";
    if (i === 1) return "AMANHÃ";
    return DIAS[new Date(iso + "T12:00:00").getDay()] + " " + fmtData(iso);
  }

  /* relógio e data por extenso */
  function relogio() {
    var d = new Date();
    $("hora").textContent = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
    $("data-longa").textContent = d.toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" });
  }
  relogio(); setInterval(relogio, 5000);

  function lista(q) { return q.then(function (r) { if (r.error) throw r.error; return r.data || []; }); }

  /* ---------------- dados ---------------- */
  var D = null;
  function carregar() {
    Promise.all([
      lista(cli.from("eventos").select("id,nome,cliente,local,data,data_desmontagem,data_desmontagem_fim,status")),
      lista(cli.from("carregamentos").select("id,evento_id,numero,nome,sentido,caminhao_id,cavalo_id")),
      lista(cli.from("conferencias").select("id,evento_id,carregamento_id,tipo,finalizada_em")),
      lista(cli.from("caminhoes").select("id,tipo,placa")),
      lista(cli.from("patio_colaboradores").select("id,nome,ativo")).catch(function () { return []; }),
      lista(cli.from("patio_presenca").select("data,colaborador_id,status")
        .gte("data", hojeISO(0)).lte("data", hojeISO(DIAS_FRENTE))).catch(function () { return []; }),
      lista(cli.from("patio_demanda").select("*")).catch(function () { return []; }),
      lista(cli.from("patio_tarefas").select("id,data,titulo,obs,colaboradores,urgente,feita")
        .gte("data", hojeISO(-30)).lte("data", hojeISO(DIAS_FRENTE))).catch(function () { return []; })
    ]).then(function (rr) {
      D = { eventos: rr[0], cgs: rr[1], confs: rr[2], cams: rr[3], colabs: rr[4], pres: rr[5], dems: rr[6], tarefas: rr[7] };
      desenhar();
      $("erro").hidden = true;
      $("atualizado").textContent = "atualizado às " + new Date().toLocaleTimeString("pt-BR").slice(0, 5);
    }).catch(function (e) {
      console.error(e);
      $("erro").hidden = false;
      $("erro").textContent = "Sem conexão com o banco agora — mostrando a última tela. Tentando de novo em 1 minuto.";
    });
  }

  /* ---------------- desenho ---------------- */
  function desenhar() {
    if (!D) return;
    var hoje = hojeISO(0);
    var nomeColab = {};
    D.colabs.forEach(function (c) { nomeColab[c.id] = c.nome; });
    var evPorId = {};
    D.eventos.forEach(function (e) { evPorId[e.id] = e; });
    function aberto(e) { return e.status !== "Finalizado" && e.status !== "Com divergência"; }
    function nomeCam(cg) {
      var c = D.cams.filter(function (x) { return x.id === cg.caminhao_id; })[0];
      return c ? (c.tipo || "CAMINHÃO") + " " + (c.placa || "") : "caminhão a definir";
    }
    function fimDesm(e) { return String(e.data_desmontagem_fim || e.data_desmontagem || "").slice(0, 10); }
    function demDe(evId, tipo) {
      return D.dems.filter(function (x) { return x.evento_id === evId && x.tipo === tipo; })[0] || null;
    }
    function dataDem(e, tipo) {
      var d = demDe(e.id, tipo);
      if (d && d.data) return String(d.data).slice(0, 10);
      return tipo === "descarregamento" ? fimDesm(e) : String(e.data || "").slice(0, 10);
    }
    /* ⏩ antecipado / ⏪ adiado na Demanda do Pátio */
    function chipMudou(e, tipo) {
      var d = demDe(e.id, tipo);
      var orig = tipo === "descarregamento" ? fimDesm(e) : String(e.data || "").slice(0, 10);
      if (!d || !d.data || !orig) return "";
      var novo = String(d.data).slice(0, 10);
      if (novo === orig) return "";
      return novo < orig ? '<span class="chip pend">⏩ ANTECIPADO · era ' + fmtData(orig) + "</span>"
                         : '<span class="chip">⏪ ADIADO · era ' + fmtData(orig) + "</span>";
    }
    /* ✋ manuais (sem evento) */
    function manuais(dia, tipo) {
      return D.dems.filter(function (x) { return x.evento_id === "MANUAL" && x.tipo === tipo && String(x.data || "").slice(0, 10) === dia; });
    }
    function cardManual(x, tipo, n) {
      var eq = (x.colaboradores || []).map(function (id) { return nomeColab[id]; }).filter(Boolean);
      if (!x.feito && !eq.length && n <= 1) avisos.push((n === 0 ? "HOJE" : "AMANHÃ") + ": " + tipo + " " + (x.titulo || "manual") + " SEM EQUIPE");
      return '<div class="card' + (x.feito ? " feita" : !eq.length ? " ruim" : "") + '">' +
        '<b class="tit">' + (x.feito ? "✓ " : "") + esc(x.titulo || "(sem nome)") + "</b>" +
        ((x.local || x.caminhao) ? '<div class="sub">' + [x.local, x.caminhao].filter(Boolean).map(esc).join(" · ") + "</div>" : "") +
        '<span class="chip">✋ MANUAL</span>' + (x.feito ? '<span class="chip ok">✓ FEITO</span>' : "") +
        linhaEquipe(eq) +
        (x.obs ? '<div class="sub">📝 ' + esc(x.obs) + "</div>" : "") + "</div>";
    }
    function equipeDe(evId, tipo) {
      var d = demDe(evId, tipo);
      return ((d && d.colaboradores) || []).map(function (id) { return nomeColab[id]; }).filter(Boolean);
    }
    function linhaEquipe(nomes) {
      return nomes.length
        ? '<div class="equipe">👷 <b>' + nomes.map(esc).join("</b> · <b>") + "</b></div>"
        : '<div class="equipe sem">👷 SEM EQUIPE ESCOLHIDA</div>';
    }
    var avisos = [];

    /* ---- 🛌 FOLGA: hoje + próximos dias ---- */
    var hFolga = "", totFolgaHoje = 0;
    for (var i = 0; i <= DIAS_FRENTE; i++) {
      var dd = hojeISO(i);
      var fora = D.pres.filter(function (p) {
        return String(p.data).slice(0, 10) === dd && nomeColab[p.colaborador_id] &&
          ["FOLGA", "FÉRIAS", "EXTERNO", "ATESTADO", "FALTA"].indexOf(p.status) >= 0;
      }).map(function (p) { return { nome: nomeColab[p.colaborador_id], st: p.status }; })
        .sort(function (a, b) { return a.nome.localeCompare(b.nome); });
      if (i === 0) totFolgaHoje = fora.length;
      hFolga += '<div class="dia' + (i === 0 ? " hoje" : "") + '">' + rotDia(dd, i) + "</div>" +
        '<div class="card">' + (fora.length ? fora.map(function (p) {
          return '<span class="chip ' + (p.st === "FOLGA" ? "st-FOLGA" : "st-OUTRO") + '">' + esc(p.nome) +
            (p.st !== "FOLGA" ? " · " + p.st : "") + "</span>";
        }).join("") : '<span class="sub">ninguém de folga</span>') + "</div>";
    }
    if (!D.pres.length) hFolga = '<div class="vazio">Escala do pátio ainda não marcada.<br>Central → 🏗️ DEMANDA DO PÁTIO.</div>';
    $("c-folga").innerHTML = hFolga;
    $("n-folga").textContent = totFolgaHoje + " hoje";

    /* ---- 🚚 CARREGAMENTO: hoje + próximos dias ---- */
    var hCarga = "", totCarga = 0;
    for (var j = 0; j <= DIAS_FRENTE; j++) {
      var dj = hojeISO(j);
      var evs = D.eventos.filter(function (e) { return aberto(e) && dataDem(e, "carregamento") === dj; });
      var mnC = manuais(dj, "carregamento");
      if (!evs.length && !mnC.length) continue;
      hCarga += '<div class="dia' + (j === 0 ? " hoje" : "") + '">' + rotDia(dj, j) + "</div>";
      evs.forEach(function (e) {
        totCarga++;
        var cgsE = D.cgs.filter(function (c) { return c.evento_id === e.id && c.sentido !== "retorno"; });
        var eq = equipeDe(e.id, "carregamento");
        var dem = demDe(e.id, "carregamento");
        if (!eq.length && j <= 1) avisos.push((j === 0 ? "HOJE" : "AMANHÃ") + ": carregamento " + e.nome + " SEM EQUIPE");
        hCarga += '<div class="card' + (!eq.length ? " ruim" : "") + '">' +
          '<b class="tit">' + esc(e.nome) + "</b>" +
          '<div class="sub">' + [e.cliente, e.local].filter(Boolean).map(esc).join(" · ") + "</div>" +
          (cgsE.length ? cgsE.map(function (cg) {
            var saiu = D.confs.some(function (c) { return c.carregamento_id === cg.id && c.tipo === "saida" && c.finalizada_em; });
            return '<span class="chip ' + (saiu ? "ok" : "pend") + '">' + (saiu ? "✓ " : "") + esc(nomeCam(cg)) + (saiu ? " SAIU" : "") + "</span>";
          }).join("") : '<span class="chip ruim">SEM CAMINHÃO</span>') +
          chipMudou(e, "carregamento") +
          linhaEquipe(eq) +
          (dem && dem.obs ? '<div class="sub">📝 ' + esc(dem.obs) + "</div>" : "") +
        "</div>";
      });
      mnC.forEach(function (x) { totCarga++; hCarga += cardManual(x, "carregamento", j); });
    }
    $("c-carga").innerHTML = hCarga || '<div class="vazio">Nenhum carregamento nos próximos dias.</div>';
    $("n-carga").textContent = totCarga;

    /* ---- ↩️ DESCARREGAMENTO: atrasados + hoje + próximos ---- */
    var hDesc = "", totDesc = 0;
    var atrasados = D.eventos.filter(function (e) {
      return aberto(e) && e.data_desmontagem && fimDesm(e) < hoje && !(dataDem(e, "descarregamento") >= hoje);
    });
    if (atrasados.length) {
      hDesc += '<div class="dia hoje">⏰ ATRASADOS</div>';
      atrasados.forEach(function (e) {
        totDesc++;
        var dias = Math.max(1, Math.floor((Date.now() - new Date(fimDesm(e) + "T12:00:00").getTime()) / 86400000));
        avisos.push("⏰ " + e.nome + " há " + dias + " dia(s) sem voltar");
        hDesc += '<div class="card ruim"><b class="tit">' + esc(e.nome) + "</b>" +
          '<div class="sub">desmontagem terminou ' + fmtData(fimDesm(e)) + "</div>" +
          '<span class="chip ruim">HÁ ' + dias + " DIA(S) SEM VOLTAR</span>" +
          linhaEquipe(equipeDe(e.id, "descarregamento")) + "</div>";
      });
    }
    for (var k = 0; k <= DIAS_FRENTE; k++) {
      var dk = hojeISO(k);
      var evsD = D.eventos.filter(function (e) {
        return aberto(e) && dataDem(e, "descarregamento") && dataDem(e, "descarregamento") === dk;
      });
      var mnD = manuais(dk, "descarregamento");
      if (!evsD.length && !mnD.length) continue;
      hDesc += '<div class="dia' + (k === 0 ? " hoje" : "") + '">' + rotDia(dk, k) + "</div>";
      evsD.forEach(function (e) {
        totDesc++;
        var eq = equipeDe(e.id, "descarregamento");
        if (!eq.length && k <= 1) avisos.push((k === 0 ? "HOJE" : "AMANHÃ") + ": descarregamento " + e.nome + " SEM EQUIPE");
        hDesc += '<div class="card' + (!eq.length ? " ruim" : "") + '"><b class="tit">' + esc(e.nome) + "</b>" +
          '<div class="sub">' + [e.cliente, e.local].filter(Boolean).map(esc).join(" · ") +
            (e.data_desmontagem ? (e.cliente || e.local ? " · " : "") + "desmontagem " + fmtData(e.data_desmontagem) +
              (fimDesm(e) !== String(e.data_desmontagem).slice(0, 10) ? " a " + fmtData(fimDesm(e)) : "") : "") + "</div>" +
          chipMudou(e, "descarregamento") +
          linhaEquipe(eq) + "</div>";
      });
      mnD.forEach(function (x) { totDesc++; hDesc += cardManual(x, "descarregamento", k); });
    }
    $("c-descarga").innerHTML = hDesc || '<div class="vazio">Nenhum descarregamento nos próximos dias.</div>';
    $("n-descarga").textContent = totDesc;

    /* ---- 📝 TAREFAS: atrasadas + hoje + próximos ---- */
    var hTar = "", feitasHoje = 0, totHoje = 0;
    var tAtras = D.tarefas.filter(function (t) { return !t.feita && String(t.data).slice(0, 10) < hoje; })
      .sort(function (a, b) { return String(a.data).localeCompare(String(b.data)); });
    function cardTarefa(t, atrasada) {
      var quem = (t.colaboradores || []).map(function (id) { return nomeColab[id]; }).filter(Boolean);
      return '<div class="card' + (t.feita ? " feita" : (t.urgente || atrasada) ? " ruim" : "") + '">' +
        '<b class="tit">' + (t.feita ? "✓ " : t.urgente ? "🔴 " : "") + esc(t.titulo) + "</b>" +
        (atrasada ? '<span class="chip ruim">ATRASADA · era para ' + fmtData(t.data) + "</span>" : "") +
        (t.obs ? '<div class="sub">' + esc(t.obs) + "</div>" : "") +
        linhaEquipe(quem) + "</div>";
    }
    if (tAtras.length) {
      hTar += '<div class="dia hoje">⏰ ATRASADAS</div>' + tAtras.map(function (t) { return cardTarefa(t, true); }).join("");
      avisos.push("📝 " + tAtras.length + " tarefa(s) atrasada(s): " + tAtras.slice(0, 3).map(function (t) { return t.titulo; }).join(", "));
    }
    for (var m = 0; m <= DIAS_FRENTE; m++) {
      var dm = hojeISO(m);
      var tf = D.tarefas.filter(function (t) { return String(t.data).slice(0, 10) === dm; })
        .sort(function (a, b) { return (a.feita ? 1 : 0) - (b.feita ? 1 : 0) || (b.urgente ? 1 : 0) - (a.urgente ? 1 : 0); });
      if (m === 0) { totHoje = tf.length; feitasHoje = tf.filter(function (t) { return t.feita; }).length; }
      if (!tf.length) continue;
      hTar += '<div class="dia' + (m === 0 ? " hoje" : "") + '">' + rotDia(dm, m) + "</div>" +
        tf.map(function (t) { return cardTarefa(t, false); }).join("");
    }
    $("c-tarefa").innerHTML = hTar || '<div class="vazio">Nenhuma tarefa passada para a equipe.</div>';
    $("n-tarefa").textContent = totHoje ? feitasHoje + "/" + totHoje + " hoje" : (tAtras.length ? tAtras.length + " atrasada(s)" : "0");

    /* ---- gente em dois lugares no mesmo dia ---- */
    for (var q = 0; q <= DIAS_FRENTE; q++) {
      var dq = hojeISO(q), onde = {};
      D.dems.forEach(function (dm2) {
        var e2 = evPorId[dm2.evento_id];
        if (!e2 || !aberto(e2)) return;
        if (dataDem(e2, dm2.tipo) !== dq) return;
        (dm2.colaboradores || []).forEach(function (id) { (onde[id] = onde[id] || []).push(e2.nome); });
      });
      D.dems.forEach(function (x) {
        if (x.evento_id !== "MANUAL" || x.feito || String(x.data || "").slice(0, 10) !== dq) return;
        (x.colaboradores || []).forEach(function (id) { (onde[id] = onde[id] || []).push(x.titulo); });
      });
      D.tarefas.forEach(function (t) {
        if (t.feita || String(t.data).slice(0, 10) !== dq) return;
        (t.colaboradores || []).forEach(function (id) { (onde[id] = onde[id] || []).push(t.titulo); });
      });
      Object.keys(onde).forEach(function (id) {
        if (onde[id].length > 1 && nomeColab[id]) {
          avisos.push("⚠ " + rotDia(dq, q) + ": " + nomeColab[id] + " em " + onde[id].length + " lugares");
        }
      });
    }

    /* ---- letreiro ---- */
    var fita = $("fita");
    if (avisos.length) {
      fita.hidden = false;
      document.getElementById("painel").classList.remove("semfita");
      var texto = avisos.join("   •   ");
      $("fita-texto").textContent = "⚠ " + texto + "   •   ⚠ " + texto;
      $("fita-texto").style.animationDuration = Math.max(18, texto.length / 5) + "s";
    } else {
      fita.hidden = true;
      document.getElementById("painel").classList.add("semfita");
    }
  }

  /* ---------------- rodízio das telas ---------------- */
  var painel = $("painel");
  var etapa = 0;   /* 0..3 = uma coluna por vez · 4 = as quatro juntas */
  function aplicar() {
    var cols = painel.querySelectorAll(".col");
    if (etapa < 4) {
      painel.classList.add("solo");
      cols.forEach ? cols.forEach(marca) : Array.prototype.forEach.call(cols, marca);
    } else {
      painel.classList.remove("solo");
      Array.prototype.forEach.call(cols, function (c) { c.classList.remove("on"); });
    }
    function marca(c) { c.classList.toggle("on", Number(c.dataset.col) === etapa); }
    var bolas = $("bolas").children;
    for (var i = 0; i < bolas.length; i++) bolas[i].classList.toggle("on", i === etapa);
  }
  function proxima() {
    painel.classList.add("trocando");
    setTimeout(function () {
      etapa = (etapa + 1) % 5;
      aplicar();
      painel.classList.remove("trocando");
      agenda();
    }, 350);
  }
  var timer = null;
  function agenda() {
    clearTimeout(timer);
    timer = setTimeout(proxima, etapa === 4 ? TEMPO_GRADE : TEMPO_SOLO);
  }
  window.__tvProxima = proxima;   /* para teste */
  aplicar(); agenda();

  carregar();
  setInterval(carregar, 60000);

  /* ---------- ⛶ tela cheia ----------
     O navegador só deixa entrar em tela cheia depois de um toque/tecla.
     Então: aviso grande ao abrir; o 1º toque, clique, tecla ou botão do
     controle já coloca em tela cheia. Se sair (ESC), volta o botão. */
  var raiz = document.documentElement;
  var pedir = raiz.requestFullscreen || raiz.webkitRequestFullscreen || raiz.mozRequestFullScreen || raiz.msRequestFullscreen;
  var convite = $("convite"), btCheia = $("bt-cheia");
  function emCheia() {
    if (document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement) return true;
    /* F11 / modo quiosque: a janela já ocupa a tela toda */
    return window.innerHeight >= screen.height - 2 && window.innerWidth >= screen.width - 2;
  }
  function atualizarCheia() {
    var cheia = !pedir || emCheia();
    if (cheia) { convite.hidden = true; btCheia.hidden = true; }
    else if (convite.hidden) btCheia.hidden = false;
  }
  function entrar() {
    if (!pedir || emCheia()) { convite.hidden = true; atualizarCheia(); return; }
    try {
      var p = pedir.call(raiz, { navigationUI: "hide" });
      if (p && p.catch) p.catch(function () {});
    } catch (e) {}
    convite.hidden = true;
    setTimeout(atualizarCheia, 600);
  }
  var dentroDaCentral = false;
  try { dentroDaCentral = window.self !== window.top; } catch (e) { dentroDaCentral = true; }
  if (dentroDaCentral) pedir = null;   /* aberta pelo botão 📺 da Central: ela já cuida da tela cheia */
  if (pedir && !emCheia()) {
    convite.hidden = false;
    /* depois de 20 s o aviso grande vira só um botão no canto */
    setTimeout(function () { if (!convite.hidden) { convite.hidden = true; atualizarCheia(); } }, 20000);
  }
  ["click", "touchend", "keydown"].forEach(function (ev) {
    document.addEventListener(ev, function () { if (!emCheia()) entrar(); }, true);
  });
  ["fullscreenchange", "webkitfullscreenchange", "mozfullscreenchange", "MSFullscreenChange"].forEach(function (ev) {
    document.addEventListener(ev, atualizarCheia);
  });
  window.addEventListener("resize", atualizarCheia);

  /* não deixa a tela apagar sozinha */
  var trava = null;
  function manterAcesa() {
    try {
      if (navigator.wakeLock && document.visibilityState === "visible" && !trava)
        navigator.wakeLock.request("screen").then(function (w) {
          trava = w; w.addEventListener("release", function () { trava = null; });
        }).catch(function () {});
    } catch (e) {}
  }
  manterAcesa();
  document.addEventListener("visibilitychange", manterAcesa);
  setInterval(manterAcesa, 60000);

  /* esconde o ponteiro do mouse parado (3 s) */
  var tMouse = null;
  document.addEventListener("mousemove", function () {
    document.body.classList.remove("semmouse");
    clearTimeout(tMouse);
    tMouse = setTimeout(function () { document.body.classList.add("semmouse"); }, 3000);
  });
  document.body.classList.add("semmouse");
})();
</script>
</body>
</html>
